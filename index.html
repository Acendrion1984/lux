CHAPTERS.push({id:'v7',num:'V7',title:'Justier- und Vergleichskörper',sub:'Justieren, Testfehler herstellen und passende Körper für Leitfähigkeit, Riss- und Bohrungsprüfung wählen.',min:45,html:`
<h2>7.1 Justierung</h2>
<p>Vor jeder Prüfung, bei Parameteränderungen und in zeitlichen Abständen (z. B. alle 4 h oder bei Schichtwechsel) ist das Prüfsystem zu justieren bzw. die Justierung zu kontrollieren: <b>Sensoreinstellung/Abgleich</b> und <b>Empfindlichkeit</b>.</p>
<div class="def"><b>Justieren</b> heißt, ein Messgerät so einzustellen oder abzugleichen, dass Messabweichungen möglichst klein werden oder Fehlergrenzen nicht überschritten werden. Es erfordert einen <b>Eingriff</b>, der das Gerät (meist bleibend) verändert.</div>
<p>Je nach Norm gibt es verschiedene Namen: Vergleichskörper (Empfindlichkeit), Kalibrierkörper (Gerätebewertung), Kontroll-, Bezugs-, Referenzkörper. Ein <b>Justierkörper</b> hat bestimmte Abmessungen und bekannte physikalische Eigenschaften.</p>
<h2>7.2 Herstellung der Testfehler</h2>
<p>Eingeführt sind <b>Nuten</b> (bevorzugt – Signalform ähnelt Rissen) und <b>Bohrungen</b>; an der Oberfläche oder darunter (2. Lage). Geometrie und Fehlerlage müssen zur Prüfung passen (Tastsensor ↔ Durchlaufsensor); Abmessungen nach der kritischen Fehlergröße.</p>
<table><tr><th>Verfahren</th><th>Möglichkeiten und Grenzen</th></tr><tr><td>Mechanisch (Sägen/Fräsen)</td><td>Kreissäge min. 0,2 mm, Diamantscheibe min. 0,1 mm; Nutgrund hängt vom Scheibendurchmesser ab; keine Nuten in engen Hohlräumen; schwer zerspanbare Werkstoffe (Ni-Basis) schwierig. Bohrungen &lt; 1 mm: Spezialmaschinen, Tiefe bis 7–10 × Ø.</td></tr><tr><td>Elektrochemisch</td><td>Bohrungen bis ca. 0,25 mm, auch tiefer als 7–10 × Ø; <b>keine</b> Nuten/Schlitze (hohle Elektroden).</td></tr><tr><td>Funkenerosiv</td><td>Nutbreiten 20–50 µm, an der BAM 15 µm; Metallfolien (Ta, Stahl, Cu &gt; 10 µm) als Elektrode; beliebige Stelle (Zugänglichkeit). <b>Drahterodieren:</b> Breiten &lt; 100 µm über längere Strecken.</td></tr></table>
<div data-sim="slot"></div>
<h2>7.3 Anwendungsbereiche</h2>
<ul><li><b>Werkstoff:</b> Leitfähigkeit muss dem Bauteil entsprechen; sonst Material <b>niedrigerer</b> Leitfähigkeit, Abweichung höchstens ca. <b>−10 %IACS</b>. Bei ferromagnetischen Werkstoffen muss μr entsprechen; Warmbehandlungszustand beachten.</li><li><b>Leitfähigkeitsmessung:</b> ebene Platten, Ø ≈ 25 mm größer als Spule, Dicke ≥ 3 δ, unbeschichtet, hohe Oberflächengüte, zertifiziert und rückführbar (PTB).</li><li><b>Sortier-/Verwechslungsprüfung:</b> Eigenschaften werden durch zerstörende Prüfung ermittelt und vom Justierkörper „angenommen“ (→ V8).</li><li><b>Rissprüfung:</b> z. B. <b>TP 1 (Rohmann)</b>: Mehrlagenblock aus Austenit, Eisen, Titan, Aluminium; Fehlertiefen 0,2 und 0,5 mm, Durchgangsbohrung mit Nuten 0,5 mm je Lage.</li></ul>
<h3>Justierkörper für Bohrungen</h3>
<table><tr><th>Typ</th><th>Aufbau</th><th>Nut</th></tr><tr><td>1</td><td>Platte mit Bohrungen, axiale Nut</td><td>B 0,15 · T 0,5 mm · Länge = Plattendicke</td></tr><tr><td>2</td><td>Platte mit Oberflächennuten (von der Stirnseite)</td><td>B 0,2 · T 1,0 mm · ganze Länge</td></tr><tr><td>4</td><td>konische Bohrung (viele Rotier-Ø)</td><td>B 0,15 · T 0,3 mm – Verhältnis 2:1 → deutliche Phasendrehung</td></tr><tr><td>5</td><td>Mehrschichtplatte (Risse in 2. Lage)</td><td>B 0,15 · T 0,2–1,0 mm – 1:1 bis 3:1 → unrealistische Phasendrehung</td></tr><tr><td>6</td><td>konisch, zweigeteilt (Brite-Euram)</td><td>Breite:Tiefe besser als 1:10</td></tr></table>
<p>Justierkörper für Halbzeuge (Stangen, Drähte, Rohre) und Schweißnähte → V11 und V13.</p>`,
quiz:[
Q('Wie ist „Justieren“ definiert?',['Nur Kontrollieren eines Geräts','Einstellen/Abgleichen, sodass Messabweichungen möglichst klein werden – ein Eingriff','Reinigen des Sensors','Dokumentieren der Messwerte'],1,'Das Gerät wird meist bleibend verändert.'),
Q('Welches Verfahren eignet sich für Nutbreiten von nur 20–50 µm?',['Sägen','Fräsen','Funkenerosion','Elektrochemisches Bohren'],2,'BAM: sogar 15 µm.'),
Q('Welche Mindestbreite haben Kreissägeblätter für Nuten?',['0,02 mm','0,05 mm','0,2 mm','1 mm'],2,'Diamantscheiben 0,1 mm.'),
TF('Elektrochemisches Bearbeiten eignet sich zur Herstellung von Nuten in Bohrungen.',false,'Die Elektroden sind hohl (Elektrolyt) – nur Bohrungen, keine Nuten.'),
Q('Wenn die Leitfähigkeit des Justierkörpers nicht der des Bauteils entsprechen kann, soll er …',['Beliebig höher sein','Eine niedrigere Leitfähigkeit haben (max. ca. −10 %IACS)','Unmagnetisch sein','Dicker sein'],1,'Abweichung nach unten, höchstens ca. −10 %IACS.'),
NUM('Wie hoch muss die Mindestdicke des Standard-Justierkörpers für die Leitfähigkeitsmessung sein (in δ)?',3,'δ','Mindestens die dreifache Standard-Eindringtiefe.',0),
Q('Warum zeigen Typ-4/Typ-5-Justierkörper eine unrealistische Phasendrehung?',['Zu große Bohrung','Ungünstiges Tiefe-zu-Breite-Verhältnis (2:1 bzw. 1:1–3:1)','Falsches Material','Zu hohe Frequenz'],1,'Der Brite-Euram-Körper erreicht besser als 1:10.'),
Q('Wie oft ist die Justierung zu kontrollieren?',['Nur einmal pro Jahr','Vor jeder Prüfung, bei Parameteränderungen und z. B. alle 4 h bzw. bei Schichtwechsel','Nie','Nur bei Fehlalarm'],1,'Siehe 7.1.')]});

CHAPTERS.push({id:'v8',num:'V8',title:'Gefügeprüfung',sub:'Verwechslungs- und Sortierprüfung nach Werkstoff und Gefüge, Ein- und Mehrfrequenztechnik, Toleranzfelder.',min:60,html:`
<h2>8.1 Einleitung</h2>
<p>Gefügeprüfung ist die Unterscheidung von Teilen aus unterschiedlichen Werkstoffen/Legierungen (<b>Verwechslungsprüfung</b>) und/oder die Trennung nach <b>Gefügezuständen</b> (z. B. Oberflächenhärte). Unterscheidungskriterium: bei ferromagnetischen Werkstoffen die <b>Permeabilität μr</b> (bedingt σ), bei Nichteisenwerkstoffen die <b>Leitfähigkeit σ</b>. Verwechslungen oder falsche Wärmebehandlungen können schwerwiegende Folgen haben (Ausfall, Gefährdung, Rückrufaktionen).</p>
<div class="tw"><table><tr><th>Werkstoffeigenschaft</th><th>σ</th><th>μr</th></tr><tr><td>Chemische Analyse</td><td>++</td><td>++</td></tr><tr><td>Gefüge-/Wärmebehandlungszustände</td><td>–</td><td>++</td></tr><tr><td>Ausscheidungen</td><td>–</td><td>++</td></tr><tr><td>Innere Spannungen</td><td>+</td><td>++</td></tr><tr><td>Deltaferrit in Austenit / Restaustenit</td><td>+</td><td>++</td></tr></table></div>
<h2>8.2 Vorgehen und Grenzen</h2>
<ol><li>Wirbelstromsignale auswerten (Amplitude, Phase als Toleranzbereiche).</li><li>Teilegruppen sortieren (bekannt, geringe Stückzahl).</li><li>Analysewerte ermitteln (chemisch, Spektrometer).</li><li>Sortiergrenzen für die Großzahl festlegen.</li></ol>
<div class="warn">Unterscheidung von Werkstoffen ist nur bei <b>gleichem Prozesszustand</b> sicher. Jedes Gefüge hat eine eigene <b>Magnetisierungskurve</b>. Der <b>Nachweis des Werkstoffgefüges</b> gelingt nur über Schliffbild, Mikrohärte und chemische Analyse – die zerstörende Prüfung ist immer die <b>Referenzprüfung</b> und kann nie ganz entfallen. Deshalb ist <b>chargenreine Prüfung</b> nötig. Störeinflüsse: Schmelzchargen, Geometrie, Wärmebehandlungs-/Kaltverformungsschwankungen, Lageabweichung in der Spule, Temperatur, Restmagnetismus, äußere Felder.</div>
<h2>8.3 Prüfungsdurchführung</h2>
<p>Ferromagnetische Teile lassen sich trennen, wenn ihre <b>Wechselstrompermeabilität</b> unterschiedlich ist. Diese hängt von <b>Feldstärke</b> (Erregerstrom) und <b>Frequenz</b> ab – bei höherer Frequenz wird μ erheblich geringer; niedrige Frequenzen liefern große Eindringtiefe. Man wählt eine Feldstärke, bei der die Kurven weit genug auseinanderliegen.</p>
<div data-sim="muH"></div>
<ul><li><b>Einfrequenztechnik:</b> eine Frequenz, eindimensionale Sortierung (Amplitude); nur sinnvoll bei 2 Zuständen.</li><li><b>Mehrfrequenztechnik:</b> nacheinander mehrere Frequenzen (z. B. 25 Hz … 25 kHz) bei geringen Feldstärken (thermische Stabilität); findet auch <i>unbekannte</i> Zustände; Stand der Technik bei Wärmebehandlungsprüfung. Extremteile werden zerstörend analysiert; innerhalb der Ellipse liegende Teile dürfen freigegeben werden.</li><li><b>Fremdvergleich</b> (zwei Absolutspulen) oder <b>Selbstvergleich</b> (eine Absolutspule, oft Durchlaufsensor): Null mit Gutteil, dann Schlechtteil; je mehr Teile, desto genauer die statistisch berechneten Blenden (Streubereiche).</li><li><b>Frequenzbereich</b> 5 Hz – 250 kHz; Sensor-Ø optimal abstimmen; Führungen aus nichtleitendem Werkstoff.</li></ul>
<h3>Toleranzfelder</h3>
<p>Je Frequenz ein elliptisches Toleranzfeld. Werden durch Laboruntersuchung weitere Gutteile außerhalb gefunden: Das Feld <b>nicht einfach vergrößern</b> (Schlechtteile würden freigegeben), sondern <b>drehen</b> – das gelingt oft, aber nicht immer.</p>
<div data-sim="sort"></div>
<div class="merke">Es gibt <b>keine europäischen Normen</b> zur Wirbelstromprüfung von Materialeigenschaften; Prüftechnik ist zwischen Lieferant und Kunde zu vereinbaren. In den USA: ASTM E 566 (ferromagnetisch) und E 703 (nichtferromagnetisch). Die ET macht nur <b>vergleichende</b> Aussagen (gleich/ungleich) – „es müssen immer Teile geschnitten werden“.</div>`,
quiz:[
Q('Welche Größe ist das Unterscheidungskriterium bei Nichteisenwerkstoffen?',['Permeabilität','Leitfähigkeit','Härte','Dichte'],1,'Bei Ferromagnetika: Permeabilität.'),
TF('Die zerstörende Prüfung kann bei der Wirbelstromgefügeprüfung irgendwann komplett entfallen.',false,'Sie bleibt immer die Referenzprüfung.'),

Q('Fremdvergleichsverfahren bedeutet …',['Eine Absolutspule und Selbstvergleich','Zwei Absolutspulen, Prüfling gegen Kompensationsteil','Ein Sensor, drei Frequenzen','Zwei Differenzspulen am gleichen Teil'],1,'Zweispulenverfahren.')]});

CHAPTERS.push({id:'v9',num:'V9',title:'Technische Vorschriften in der ZfP',sub:'Regelwerke, Normen, Spezifikationen; ET-Normen (12718, 15549, 15548, 10893, 17643, 17635, 5817, 6520).',min:50,html:`
<h2>9.1 Begriffe</h2>
<table><tr><th>Begriff</th><th>Bedeutung</th></tr><tr><td><b>Regelwerk</b></td><td>Herstellung/Prüfung von Anlagen, meist gesetzlich verbindlich; bindet Normen ein (ASME-Code, KTA, AD-Regelwerk)</td></tr><tr><td><b>Norm</b></td><td>verfahrens-/produktbezogene Vorschrift zum Stand der Technik (DIN, ISO)</td></tr><tr><td><b>Spezifikation</b></td><td>technisches Dokument für kaufmännische/juristische Belange (Abnahme, Zahlung); z. B. Stahl-Eisen-Prüfblätter (SEP)</td></tr><tr><td><b>Richtlinie</b></td><td>nicht bindende Empfehlung – aber verbindlich wie eine Norm, wenn in einer Spezifikation genannt</td></tr><tr><td><b>Verfahrensbeschreibung / Prüfanweisung</b></td><td>abgeleitet aus technischen Vorschriften; betriebsinterne Arbeitsprozesse (→ V10)</td></tr></table>
<h2>9.2 Verfahrensbezogene Normen</h2>
<p>Drei Gruppen: <b>Begriffe</b> (DIN EN ISO 12718, 211 Begriffe in 6 Gruppen), <b>Allgemeine Grundlagen</b> (DIN EN ISO 15549: Einflussgrößen, Prüftechniken, Ausrüstung, Funktionskontrolle, Dokumentation = Prüfanweisung + Prüfbericht – eher Checkliste, keine konkreten Parameter), <b>Ausrüstung</b> (DIN EN ISO 15548-1 Geräte, -2 Sensoren, -3 System).</p>
<h3>Verifizierung (3 Stufen)</h3>
<div data-sim="verif"></div>
<h2>9.3 Produktbezogene Normen</h2>
<p>Vollständig genormt sind nur <b>Rohrprüfung</b> (DIN EN ISO 10893-1 Dichtheit, -2 Unvollkommenheiten) und <b>Schweißnahtprüfung</b>. Unterschiede liegen bei Bezugsbohrung/-nut und Zulässigkeitsgrenze; einheitlich: Kontrolle der Einstellung <b>einmal in 4 Stunden</b>, bei Bedienerwechsel sowie am Anfang und Ende eines Prüfloses.</p>
<h3>Schweißnähte</h3>
<ul><li><b>DIN EN ISO 5817</b> (Al: ISO 10042): Bewertungsgruppen <b>D</b> (niedrige), <b>C</b> (mittlere), <b>B</b> (hohe Beanspruchung) – Grenzwerte sind tatsächliche Fehlergrößen, ZfP ermittelt sie nur bedingt.</li><li><b>DIN EN ISO 17635:</b> Auswahl der ZfP-Verfahren und Bewertung; „Übertragungsfunktion“ von Bewertungsgruppe zu Prüfklasse/Zulässigkeitsgrenze – für ET: Prüfklasse nicht festgelegt, Grenzen zu vereinbaren.</li><li><b>DIN EN ISO 17643</b> (Wirbelstrom): auch durch nichtleitende Beschichtungen bis 2 mm; zweigeteilt (1. Schichtdicke messen, 2. Naht prüfen – zwei Sensortypen); 100 kHz–1 MHz; 1-mm-Nut auf 80 %; 0,5-mm-Nut mind. 50 %; Nachweisgrenze (nicht beschliffen): lineare Oberflächenanzeige 1 mm tief, 5 mm lang; Winkeleinstellung des Sensors zur Naht extrem wichtig.</li><li><b>DIN EN ISO 6520-1:</b> Klassifizierung der Unregelmäßigkeiten in 6 Gruppen mit 3–4-stelliger Nummer (1 Risse, 2 Hohlräume, 3 feste Einschlüsse, 4 Bindefehler, 5 Form-/Maßabweichungen, 6 Sonstige); für ET: <b>1 und 4</b>.</li></ul>
<div data-sim="normen"></div>`,

CHAPTERS.push({id:'v10',num:'V10',title:'Erstellen von Prüfanweisungen',sub:'Zertifizierung, Prüfstufen, Verfahrensbeschreibung vs. Prüfanweisung, 13-Punkte-Leitfaden, Formblätter.',min:55,html:`
<h2>10.1 Einführung</h2>
<p>Die <b>Zertifizierung nach DIN EN ISO 9712</b> bestätigt die allgemeine Kompetenz des Prüfers – sie ist <b>keine betriebliche Autorisierung</b>. Diese liegt beim <b>Arbeitgeber</b> (arbeitsplatzbezogene Ausbildung, Sehfähigkeit, Nachweisführung). Wo es auf hohe Auffindwahrscheinlichkeit und Reproduzierbarkeit ankommt oder nach Regelwerken/Normen/Spezifikationen geprüft wird, ist die Prüfung <b>schriftlich</b> festzulegen:</p>
<table><tr><th>ZfP-Verfahrensbeschreibung</th><th>ZfP-Prüfanweisung</th></tr><tr><td>Schriftliche Beschreibung aller wesentlichen Parameter und Vorsichtsmaßnahmen bei der zerstörungsfreien Prüfung von Produkten nach Norm(en), Regelwerk(en), Spezifikation(en).</td><td>Schriftliche Beschreibung der exakten Schritte, die befolgt werden müssen, wenn nach einer Norm, einem Regelwerk, einer Spezifikation oder einer Verfahrensbeschreibung geprüft wird.</td></tr></table>
<h3>Aufgaben der Stufen</h3>
<ul><li><b>Stufe 1:</b> prüft nach <b>Prüfanweisung</b> unter Aufsicht von Stufe 2/3: Geräte einstellen, Prüfungen durchführen, Ergebnisse aufzeichnen und nach schriftlichen Kriterien einordnen, berichten.</li><li><b>Stufe 2:</b> Prüftechnik auswählen, Anwendungsgrenzen festlegen, <b>Regelwerke/Normen/Verfahrensbeschreibungen in Prüfanweisungen umwandeln</b>, Geräte einstellen und verifizieren, Prüfungen durchführen/überwachen, Ergebnisse auslegen und bewerten, Personal anleiten, dokumentieren.</li><li><b>Stufe 3:</b> Kompetenz zur Bewertung und Interpretation auf Basis von Normen; praktische Kenntnisse zur Auswahl von Verfahren, Etablieren von Techniken, Erstellen von Zulassungskriterien; allgemeine Kenntnisse anderer Verfahren.</li></ul>
<div data-vid="pruefkette"></div>
<div class="warn">Ein Stufe-1-Prüfer kann <b>ohne Prüfanweisung nicht tätig werden</b>. Für Stufe 2 ist eine Verfahrensbeschreibung nicht zwingend, aber sinnvoll – sonst wiederholen sich Informationen zu Personal, Geräte-/Sensorkontrollen, Dokumentation, Sicherheit in jeder Prüfanweisung.</div>
<div data-sim="roles"></div>
<h2>10.2 Inhalt einer Prüfanweisung – Leitfaden</h2>
<p>13 Punkte: Titel · Geltungsbereich · mitgeltende Regelwerke (<b>mit Ausgabedatum!</b>) · Zeitpunkt/Ziel · Prüfumfang · Prüfmerkmale/Bewertungskriterien · Prüftechnik und Prüfbedingungen · Durchführung · Maßnahmen bei Abweichungen · Protokollierung · Personal · Weiteres · Formalien. Mit Verfahrensbeschreibung genügt die <b>Kurzform</b> (Formblatt), wie in der Qualifizierungsprüfung.</p>
<ul><li>Normen können <b>zusätzliche Angaben</b> verlangen (z. B. ISO 15549 Abschn. 13.2/13.3). Beispiel ISO 17635: für ET „Prüfklasse nicht festgelegt“ und Zulässigkeitsgrenzen „in einer Vereinbarung festzulegen“ → mit dem Auftraggeber vorab abstimmen und verbindlich eintragen.</li><li><b>Maßnahmen bei Abweichungen</b> sorgfältig beschreiben: Als Prüfaufsicht kann man meist keine weiteren Schritte festlegen. <b>Ausschleifen</b> nur nach Absprache mit dem Auftraggeber (oder bei innerbetrieblichen Anweisungen im Einklang mit technologischen Abläufen). Meist: <b>Unzulässigkeit dokumentieren, Prüfkörper sperren und sichern, übergeordnete Stelle verständigen</b>.</li><li>Prüfbericht in der Prüfanweisung beschreiben, besser ein <b>Muster als Anlage</b>.</li></ul>
<div data-sim="pabuilder"></div>
<h3>Beispiel-Kurzform (Übung 6.1)</h3>
<table><tr><th>Rohr S235JRH</th><td>Prüfung nach ISO 10893-2 / Tabelle 1 E3H · mind. ET1 · 100 % innen & außen, ungeprüfte Enden → 150 mm</td></tr><tr><th>System</th><td>Universalgerät · Differenzschaltung · Außendurchlaufsensor · 3 Bohrungen Ø 1,3 mm · 10 kHz · X/Y-Darstellung · 30 % polar · TP 50 Hz</td></tr><tr><th>Justierung</th><td>Frequenz einstellen · Abgleich auf fehlerfreiem Material · Schwelle: kleinstes Signal löst Alarm aus · Signal senkrecht stellen · Vormagnetisierung mit maximalem Spulenstrom</td></tr><tr><th>Prüfung / Zulässigkeit</th><td>gleichmäßige Geschwindigkeit (max. 150 mm/s) · Signale über der Ansprechschwelle unzulässig · Kontrolle der Justierung am Ende (max. Abweichung 2 dB, 5°)</td></tr></table>`,

CHAPTERS.push({id:'v11',num:'V11',title:'Rohrprüfung in der Fertigung',sub:'Prüfsysteme, Sensoren, Schaltungen und Signalentstehung, Füllungsgrad, Einstellungen, Frequenz, Störeffekte.',min:100,html:`
<h2>11.1 Einleitung</h2>
<p>Erzeugnisformen (Rohre, Profile, Stangen, Drähte) werden im Produktionsfluss zum <b>Nachweis der Dichtheit</b>, von <b>Fehlern</b>, <b>Materialverwechslungen</b> und zur <b>Dimensionskontrolle</b> geprüft. Die Kopplung erfolgt <b>berührungslos über einen Luftspalt</b>: trocken, gut automatisierbar, hohe Prüfgeschwindigkeit, heißes Prüfgut mit wassergekühlten Spulen möglich. Wegen des Skineffekts ist ET ein <b>Oberflächenverfahren</b>; bei dünnen Wänden im Bereich der Standardeindringtiefe auch Volumenprüfung.</p>
<h2>11.2 Prüfsysteme und Sensoren</h2>
<p>System = Prüfgerät (Generator-, Mess-, Anzeige-, Auswerteeinheit) + Spulensystem + Kabel + mechanische Führung (+ Aufmagnetisierung bei μ-Schwankungen). Messeinheit: Verstärkung, Demodulation, Gleichrichtung → x-y-Anzeige oder y-t. Auswerteeinheit steuert Markierung/Sortierung.</p>
<ul><li><b>Außendurchlaufsensor:</b> Prüfgeschwindigkeit bis 100 m/s; ab ca. 100 mm Außen-Ø wegen großen Wechselwirkungsvolumens eingeschränkt (ISO 10893-2 bis 250 mm); sicher für punktförmige Fehler, Querfehler, kurze Längsfehler; Dichtheitsprüfung; wassergekühlt für Heißprüfung. <b>Nachteile:</b> flach einlaufende Längsfehler ab einer Länge (Wirkbreite) kaum nachweisbar; Endeneffekt.</li><li><b>Innendurchlaufsensor:</b> manuelle Prüfung eingebauter Rohre (Wärmetauscher); langsam; Führungspuffer zentrieren und vermeiden Wackeln; mit Magnetisierung für Duplexstahl.</li><li><b>Tastsensor:</b> empfindlich auf <b>Längsfehler</b>, höhere Fehlerauflösung; rotierend (Umfangsabtastung, Vorschub und Rotation abstimmen); hohe Frequenz, ohne Sättigung; auch als „Schweißnahttaster“.</li><li><b>Segmentsensor (Sattelspule):</b> Schweißnahtprüfung (nicht UP), Dichtheit (rotierend/schraubenförmig), Mehrspulen-Anordnung (z. B. 4 × 100° bei Ø 508 mm); selbstabgleichend; bessere Auflösung als Durchlaufsensor bei großen Ø.</li></ul>
<p>Eine <b>Prüfstrecke</b> für ferromagnetische Werkstoffe enthält Aufmagnetisierung, Prüfspulen (Erreger + Absolut + Mehrfachdifferenz, z. B. „LMD“-Korrelationsspulen) und <b>Entmagnetisierung</b> (Gleich-Gegenfeld oder Wechselfeld).</p>
<h2>11.4 Schaltungen und Signalentstehung</h2>
<p><b>Absolutspulen</b> eignen sich nicht für die Fehlerprüfung (Stör-Nutzabstand 1:3 bzw. 10 dB nicht erreichbar), wohl aber für <b>Materialverwechslung, Dimensionskontrolle, offene Schweißnähte</b>, als Signalgeber/Schlitzwächter. <b>Differenzsysteme</b> (auch Doppel-/Mehrfachdifferenz) werden für Fehler- und Dichtheitsprüfung eingesetzt: kein Wackeleffekt, keine Temperaturdrift, kein Abhebeeffekt.</p>
<div data-vid="diff"></div>
<div data-sim="tube"></div>
<div class="merke">Differenzspulen reagieren auf <b>kurze</b> Fehler, Absolutspulen liefern bei <b>langen</b> Fehlern ein Dauersignal. Absolutspulen brauchen im Gerät einen automatischen Abgleich gegen Temperaturdrift.</div>
<h2>11.5 Mechanische Führung und Füllungsgrad</h2>
<p>Schon geringe Abstandsänderungen verursachen große Empfindlichkeitsschwankungen – eine <b>einwandfreie Führung</b> ist zwingend. Außensensor: η = D<sub>P</sub>²/D<sub>S</sub>²; Innensensor: η = D<sub>S</sub>²/D<sub>P</sub>². Innensensor: η ≥ <b>0,9</b> erwünscht, <b>nicht unter 0,8</b>. Außensensor je nach Prüfgut 0,5–0,95 (bei Verwechslungsprüfung auch deutlich kleiner). <b>Großer η → geringe Wackeleffekte, gleichmäßige und hohe Empfindlichkeit, großer Stör-Nutzabstand.</b></p>
<div data-sim="fill"></div>
<p><b>Segment-/Tastsensor an der Naht:</b> Luftspalt (0,5 mm Taster bei Edelstahl bis 3 mm Segmentsensor bei ferromagnetischen Rohren) und Winkelausrichtung; justierbare Stützrollen, V-Rollen zentrieren. Bei Nahtwanderung Segmentsensoren (±25° vom Zentrum). Tastsensor-Frontfläche an Naht/WEZ/Rohr-Ø anpassen (8 mm für Ø 50 gut, 35 mm für Ø 33 schlecht).</p>
<h2>11.6 Einstellungen</h2>
<ul><li>Parameter: <b>Frequenz, Filter, Phase, Verstärkung</b> – nach Prüfanweisung bzw. Norm.</li><li><b>Filter:</b> in Skala der Produktionsgeschwindigkeit; Faustregel <b>Bandpass Faktor 4: 0,5 × bis 2 × Liniengeschwindigkeit</b>.</li><li><b>Schwelle:</b> Bezugsbohrung/-nut muss die Schwelle sicher überschreiten. Schwelle <b>nicht auf 100 %</b>; empfohlen <b>25–50 %</b> der Skala, Anpassung über die Verstärkung. Ohne Bezugsreflektor: Grundrauschen auf 10 %, Schwelle 30 % → Signal-Rausch ≥ 3:1.</li><li><b>Amplitudenauswertung</b> genügt meist (Schwelle = Kreis).</li><li><b>Frequenz</b> (entscheidend): Skineffekt; hohe Frequenzen (250 kHz–1 MHz) für Oberflächenprüfung; Naht 5–10 kHz für volle Durchdringung; einseitige Anwendung bis ca. 6 mm Wand; Austenit dringt tiefer als Al/Cu; ferromagnetisch ohne Magnetisierung immer nur Oberfläche. <b>Faustregel: mindestens 1 kHz je 1 m/s Vorschub.</b></li></ul>
<div data-sim="setup"></div>
<h2>11.7 Störeffekte</h2>
<table><tr><th>Störung</th><th>Gegenmaßnahme</th></tr><tr><td>Permeabilität</td><td>Gleichstromvormagnetisierung bis Sättigung (μ ≈ 2–4), Rauschen sinkt, Eindringtiefe steigt – nur so Volumenprüfung bis 6 mm</td></tr><tr><td>Leitfähigkeit (z. B. Härte nach Ziehen)</td><td>Glühen vor der Prüfung</td></tr><tr><td>Wackeln</td><td>Führungsmechanik; Differenz-/Mehrfachdifferenzschaltung; großer η</td></tr><tr><td>Rohrendensignal</td><td>Externer Sensor schaltet Auswertung erst nach Einlauf ein → ungeprüftes Ende ≈ Rohr-Ø (ferromagnetisch mehr)</td></tr><tr><td>Geschwindigkeit</td><td>Bandbreite; automatische Filternachführung (Umspulanlagen), gespeicherte Parametersätze bei Produktwechsel</td></tr></table>
<p><b>Spiralvorschub:</b> Ganghöhe muss kleiner als die Abtastbreite sein – sonst keine überlappende Prüfung (→ Einigung auf Mindestfehlerlänge).</p>
<div data-sim="spiral"></div>`,
quiz:[
Q('Warum eignen sich Absolutspulen nicht für die Fehlerprüfung von Erzeugnisformen?',['Sie sind zu teuer','Der Stör-Nutzabstand von 1:3 (10 dB) ist nicht erreichbar','Sie funktionieren nur mit Gleichstrom','Sie brauchen Kühlwasser'],1,'Wackeln, Drift und Abheben stören.'),
Q('Welche Vorteile hat das Differenzsystem?',['Kein Wackeleffekt, keine Temperaturdrift, kein Abhebeeffekt','Es misst lange Fehler besser','Es braucht keine Führung','Es kostet nichts'],0,'Siehe 11.4.5.'),
NUM('Innendurchlaufsensor: D_S = 18 mm, D_P (Innen-Ø Rohr) = 20 mm. η = (D_S/D_P)² = ?',0.81,'','(18/20)² = 0,81 – gerade noch über der Mindestgrenze 0,8.',.01),
Q('Welchen Füllungsgrad erwünscht man bei Innendurchlaufsensoren?',['≥ 0,9, nicht unter 0,8','≥ 0,3','≥ 0,5','Egal'],0,'Großer Füllungsgrad = geringe Wackeleffekte.'),
Q('Wie wählt man die Alarmschwelle?',['100 % der Skala','25 bis 50 % der Skala','0 %','Immer 10 %'],1,'Bei 100 % wäre keine Aussage zur Signalhöhe mehr möglich.'),
NUM('Mindest-Prüffrequenz bei 4 m/s Vorschub (Faustregel 1 kHz je m/s) in kHz?',4,'kHz','Mindestens 1 kHz pro 1 m/s.',0),
Q('Was bewirkt die Gleichstromvormagnetisierung bis zur Sättigung?',['μ wird sehr groß','Rauschen sinkt, μ ≈ 2–4, Eindringtiefe steigt','Leitfähigkeit steigt','Alle Fehler verschwinden'],1,'Nur so ist Volumenprüfung bis ca. 6 mm Wanddicke möglich.'),
Q('Wie groß ist das ungeprüfte Rohrende etwa?',['0,1 mm','Rohrdurchmesser (bei ferromagnetischen oft mehr)','1 m','Wanddicke'],1,'Faustregel aus 11.7.4.'),
Q('Welcher Sensor ist besonders empfindlich auf Längsfehler an Rohren?',['Außendurchlaufsensor','Rotierender Tastsensor','Innendurchlaufsensor','Absolutspule'],1,'Größere Fehlerauflösung als Durchlaufsensoren.'),

CHAPTERS.push({id:'v12',num:'V12',title:'Schichtdickenmessung',sub:'Magnet- und Wirbelstromverfahren, Justieren, Einflüsse auf die Messung, Sonderfälle und Normen.',min:60,html:`
<h2>12.1 Einleitung und Verfahren</h2>
<p>Beschichtungen (Lack, Email, Galvanik) schützen vor Korrosion, Verschleiß oder dienen der Optik und haben eine <b>Mindestschichtdicke</b>. Typisch 3 µm bis 1500 µm (1 mil = 25,4 µm).</p>
<table><tr><th>Verfahren</th><th>Anwendung</th><th>Technik</th></tr><tr><td><b>Magnetverfahren</b></td><td>nichtferromagnetische Schicht auf <b>ferromagnetischem</b> Grundwerkstoff (Lack, Zn, Cr, Cu …); Schicht darf kein Fe, Fe-Oxid, Ni, Co enthalten</td><td>Spule auf Eisenkern, 100 Hz – 1 kHz; Feld wird vom Stahl verstärkt – Abstand ändert die Messspannung</td></tr><tr><td><b>Wirbelstromverfahren</b></td><td><b>nichtleitende</b> Schicht auf nichtferromagnetischem, aber leitfähigem Grund</td><td>Luftspule, 100 kHz bis MHz; Abstand → Induktivität (<b>Abhebeeffekt als Nutzgröße!</b>)</td></tr></table>
<h2>12.3 Gerätejustierung</h2>
<ul><li><b>Genauigkeit</b> nach Normen: ±10 % bzw. ±1,5 µm bzw. 3 µm (größerer Wert); moderne Geräte teils ±1 %.</li><li><b>Referenzproben:</b> Kalibrierfolien (Kunststoff) – guter Kontakt, nicht zu großer Anpressdruck, regelmäßig erneuern; oder beschichtete Referenzproben.</li><li><b>Spezialgeräte:</b> Werkskalibrierung (≈ 3 % bzw. besser 5 µm); Grenzen beachten (Messfläche, Krümmung, Grundwerkstoffdicke). Sonst <b>Einpunkt</b>-Justierung (Nullpunkt am unbeschichteten Teil, ≈ 2 %) oder <b>Zweipunkt</b> (Null + Folie im erwarteten Bereich, ≈ 1 %). Immer Kontrolle mit mehreren Folien.</li><li><b>Universal-Wirbelstromgeräte:</b> Lift-off in die senkrechte Achse; <b>Mehrpunkt-Kalibrierkurve</b> (z. B. 5 Dicken + Nullmessung), Genauigkeit ≈ 5 % Bildschirmhöhe ≈ 5 µm; Alarmschwelle für die Mindestdicke (Beispiel: 40 µm bei 53 %).</li></ul>
<div data-sim="mcal"></div>
<h2>12.4 Einflüsse auf die Messung</h2>
<ul><li><b>Geometrie:</b> kleine Fläche, Kanten, konvex, zu dünner Grund (muss &gt; 3 δ sein) → mehr „Luftanteil“ → <b>positiver Fehler</b> (zu große Schichtdicke). Konkav, Vertiefungen, Nähe zu senkrechten Blechen → <b>negativer Fehler</b>.</li><li><b>Leitfähigkeit</b> (Wirbelstrom): höhere σ → scheinbar kleinerer Abstand → zu kleine Dicke; Spezialgeräte kompensieren teils; sonst Justierung auf Material gleicher σ.</li><li><b>Permeabilität</b> (Magnetverfahren): Werkseinstellung für unlegierten Stahl; bei höher legiertem Stahl zu große Dicke; Nullmessung am Grundwerkstoff; Restmagnetismus durch Entmagnetisieren beheben.</li><li><b>Rauheit:</b> Schichten werden zu dick gemessen. Mittelwert aus ca. <b>10</b> Messungen unbeschichtet (gleich rau!) und beschichtet; Differenz = mittlere Dicke über den Spitzen.</li><li><b>Temperatur:</b> Drift; Kontrolle mit Folien; hohe Oberflächentemperatur kann den Sensor zerstören.</li><li><b>Äußere Störfelder:</b> Magnetverfahren – niederfrequente (Trafos, Bildschirme); Wirbelstrom – hochfrequente (Sender, Mobiltelefone).</li></ul>
<div data-sim="layer"></div>
<h2>12.5 Sonderfälle und Normen</h2>
<ul><li><b>Kleine Teile (Magnet):</b> „magnetische Masse“ vergrößern (Eisenteil unterlegen).</li><li><b>Dünne Schichten:</b> Mittelwertbildung. <b>Weiche Schichten:</b> harte Schutzfolie bekannter Dicke, abziehen.</li><li><b>Mehrfachschichten:</b> nur Gesamtdicke; Zero-Offset um die gleichmäßige untere Schicht.</li><li>Normen: ISO 2064, 3882, <b>2178</b> (Magnet), <b>2360</b> (Wirbelstrom), 2361 (Nickel).</li></ul>`,
quiz:[
Q('Welches Verfahren eignet sich für Lack auf Stahl?',['Wirbelstromverfahren','Magnetverfahren','Beide gleich','Keines'],1,'Ferromagnetischer Grund, nichtferromagnetische Schicht.'),
Q('Welche Messgröße nutzt das Wirbelstromverfahren?',['Permeabilität','Abhebeeffekt (Lift-off)','Ferritgehalt','Härte'],1,'Schichtdicke = Abstand zwischen Sensor und leitfähigem Grund.'),
Q('Wie wirkt sich eine raue Oberfläche aus?',['Schicht wird zu dünn gemessen','Schicht wird immer zu dick gemessen','Kein Effekt','Gerät schaltet ab'],1,'Mittelwertbildung (ca. 10 Messungen) auch am unbeschichteten, gleichrauen Stück.'),
Q('Welche Messfehler treten an konkaven Flächen auf?',['Positive','Negative (zu geringe Dicke)','Keine','Zufällige'],1,'Der „Luftanteil“ wird verringert.'),
Q('Welche Justierung hat die höchste Genauigkeit?',['Werkseinstellung','Einpunkt','Zweipunkt (≈ 1 %)','Keine'],2,'Einpunkt ca. 2 %, Zweipunkt ca. 1 % vom Messwert.'),
Q('Welche Störfelder beeinflussen das Wirbelstromverfahren besonders?',['Niederfrequente (Trafos)','Hochfrequente (Sender, Mobiltelefone)','Keine','Gleichfelder nur'],1,'Beim Magnetverfahren eher niederfrequente.'),
Q('Wie geht man bei sehr weichen Schichten vor?',['Stark andrücken','Harte Folie bekannter Dicke als Schutz, Foliendicke abziehen','Nicht messen','Frequenz erhöhen'],1,'Sonst zu kleine Dicke bzw. Zerstörung.'),
Q('Welche Norm betrifft die Schichtdickenmessung nach dem Wirbelstromverfahren?',['ISO 2178','ISO 2360','ISO 2361','ISO 12718'],1,'ISO 2178 ist das Magnetverfahren.'),
NUM('Eine 40-µm-Mindestschicht liegt laut Beispiel bei wie viel % Bildschirmhöhe (Alarmschwelle)?',53,'%','Beispiel Abb. 12.4.',.02)]});

CHAPTERS.push({id:'v13',num:'V13',title:'Schweißnahtprüfung',sub:'Manuelle Wirbelstromprüfung von Schweißnähten nach DIN EN ISO 17643: Sensortechnik, Justierung, Beschichtung.',min:55,html:`
<h2>13.1 Grundlagen</h2>
<p>ZfP an Schweißverbindungen erfolgt „normgerecht“: Prüfumfang, Güte (Bewertungsgruppe ISO 5817), Personal, Zeitpunkt, Durchführung/Bewertung nach <b>DIN EN ISO 17635</b>, Umgang mit Befunden und Reparaturen, Protokollierung. Vier wichtige Normen verweisen darauf: DIN EN 13445-5 (Druckbehälter), 13480-5 (Rohrleitungen), 1090-2 (Stahlbau), 15085-5 (Schienenfahrzeuge).</p>
<p>Manuelle Schweißnahtprüfung mit Wirbelstrom ist <b>begrenzt anwendbar</b>. Vorteil: <b>Oberflächenfehler und oberflächennahe rissartige Unregelmäßigkeiten unter Beschichtungen</b> (bis 2 mm). Kleinste nachweisbare Unregelmäßigkeit in ferritischer Naht (geschweißter Zustand): <b>1 mm tief, 5 mm lang</b>.</p>
<h3>Ziele und Einflussgrößen</h3>
<ul><li>schnelle, reproduzierbare Prüfung auf zur Oberfläche offene Werkstofftrennungen,</li><li>oberflächennah ≈ ≤ 3 Standardeindringtiefen,</li><li>Fehler unter bis zu 2 mm nichtmetallischen Schichten (darüber: Empfindlichkeit nachweisen),</li><li>Schweißungen unterschiedlicher Werkstoffe.</li></ul>
<table><tr><th>Bereich</th><th>Dominierende Einflussgrößen</th></tr><tr><td>Grundmaterial 1/2</td><td>μ<sub>rel</sub>, σ (unterschiedliche Werkstoffe)</td></tr><tr><td>Wärmeeinflusszone</td><td>μ<sub>rel</sub>, σ (Gefügeänderung)</td></tr><tr><td>Grenzschicht Grund/Schmelze</td><td>Geometrie, μ<sub>rel</sub>, σ (Mischung)</td></tr><tr><td>Schweißgut, Raupe</td><td>Geometrie, μ<sub>rel</sub>, σ (unebene Oberfläche)</td></tr></table>
<p>Störfaktoren, die zu unterdrücken sind: örtliche μ-/σ-Schwankungen, Nahtgeometrie am Übergang und auf der Raupe, Abhebe- und Wackeleffekte → <b>spezielle Sensortechnik</b>.</p>
<h3>Sensortechnik</h3>
<p>Sensoren mit <b>entkoppelten Wicklungen</b> (gekreuzt): das Feld einer Wicklung induziert in der anderen keine Spannung, solange keine flächige, rissartige Störung vorliegt – wie bei Segmentsensoren. Ausführung als Absolut- oder Differenzschaltung. Angezeigt werden Risse im Schweißgut (längs/quer), in der WEZ und im Grundmaterial, scharfe Einbrandkerben, offene Flankenbindefehler.</p>
<div data-sim="weld"></div>
<h2>13.2 Prüfungsdurchführung nach DIN EN ISO 17643 (auszugsweise)</h2>
<ul><li>Eignungsnachweis am Vergleichskörper mit verschieden tiefen Nuten: Differenz der Anzeigen von <b>1-mm-Nut</b> und <b>0,5-mm-Nut</b> bei gleicher Beschichtungsdicke max. <b>6 dB</b> (100 % → 50 %). Erreicht über die Frequenz; Arbeitsbereich 100 kHz–1 MHz.</li><li>Justierung für ferritische Werkstoffe an einem Körper mit funkenerodierten Nuten <b>0,5 / 1 / 2 mm</b> und simulierter nichtleitender Beschichtung der maximal erwarteten Dicke.</li><li>Eine Beschichtung (max. 2 mm) wird durch <b>Erhöhen der Verstärkung</b> ausgeglichen (Beispiel 0,5 mm: +6 dB) – gleichmäßige Dicke vorausgesetzt, zuerst mit Wirbelstrom kontrollieren.</li><li>Sicht-/Eindringprüfung: Beschichtung muss entfernt werden; MT nur ≤ 50 µm.</li><li>Nicht eindeutig zuzuordnende Anzeigen → anderes ZfP-Verfahren.</li><li>Die <b>Winkeleinstellung des Sensors zur Naht</b> ist extrem wichtig.</li></ul>
<div data-sim="justage"></div>`,
quiz:[
Q('Was ist der Hauptvorteil der Wirbelstrom-Schweißnahtprüfung gegenüber PT/VT?',['Höchste Empfindlichkeit','Prüfung unter nichtleitenden Beschichtungen (bis 2 mm) ohne Entfernen','Keine Geräte nötig','Volumenprüfung'],1,'Bei PT/VT muss die Beschichtung entfernt werden.'),

const SKRIPT={"v1": "<h2>1.1 Einleitung<\/h2>\n<p>Im Kurs ET 1 wurden die physikalischen Grundlagen der Wirbelstromprüfung bereits erarbeitet: von den verschiedenen Spannungsarten über das Induktionsgesetz bis hin zur Frage, wie Wirbelströme entstehen und wie man sie misst. Dieses Wissen wird hier vorausgesetzt und für die Stufe 2 vertieft – vor allem dort, wo es um das Rechnen mit Wechselstrom, um die Impedanzebene und um die Übertragbarkeit von Prüfergebnissen auf andere Bauteile geht.<\/p>\n<div data-sim=\"magnet\"><\/div>\n<div data-vid=\"induktion\"><\/div>\n\n<h2>1.2 Der Stromkreis<\/h2>\n<h3>1.2.1 Ohmscher Widerstand und Wechselstrom<\/h3>\n<p>In einem Gleichstromkreis ändern sich Strom und Spannung nur, wenn man den Kreis ein- oder ausschaltet. Speist man ihn dagegen mit Wechselstrom, dann ist die Quelle selbst die Ursache für ständige Schwankungen von Spannung und Strom.<\/p>\n<p>Eine Wechselspannungsquelle liefert eine Spannung, die im Rhythmus der Frequenz <i>f<\/i> zwischen dem Höchstwert +<i>U<\/i><sub>max<\/sub> und dem Tiefstwert −<i>U<\/i><sub>max<\/sub> pendelt. Innerhalb einer Periodendauer <i>T<\/i> wird jeder Spannungswert einmal im Anstieg und einmal im Abstieg durchlaufen (Abb. 1.1).<\/p>\n<div data-fig=\"v1_sine\" data-cap=\"Abb. 1.1: Zeitlicher Verlauf einer sinusförmigen Spannung und der zugehörigen Stromstärke\"><\/div>\n<p>Die Frequenz ist definiert als die Anzahl der Perioden pro Sekunde und hängt mit der Periodendauer so zusammen:<\/p>\n<div class=\"fm\"><span class=\"fr\"><span>1<\/span><span><i>T<\/i><\/span><\/span> = <i>f<\/i> &nbsp;⇔&nbsp; <i>f<\/i> = <span class=\"fr\"><span>1<\/span><span><i>T<\/i><\/span><\/span><span class=\"eq\">(1)<\/span><\/div>\n<p>Den zeitlichen Verlauf von Spannung und Strom beschreibt die Sinusfunktion:<\/p>\n<div class=\"fm\"><i>U<\/i>(<i>t<\/i>) = <i>U<\/i><sub>max<\/sub> · sin( <span class=\"fr\"><span>2π<\/span><span><i>T<\/i><\/span><\/span> · <i>t<\/i> )<br><i>I<\/i>(<i>t<\/i>) = <i>I<\/i><sub>max<\/sub> · sin( <span class=\"fr\"><span>2π<\/span><span><i>T<\/i><\/span><\/span> · <i>t<\/i> )<span class=\"eq\">(2)<\/span><\/div>\n<p>Da die Sinusfunktion als Argument einen Winkel verlangt, muss die Zeit <i>t<\/i> in einen Winkel umgerechnet werden – das leistet der Faktor 2π/<i>T<\/i>. Man nennt ihn <b>Kreisfrequenz ω<\/b>:<\/p>\n<div class=\"fm\"><i>ω<\/i> = <span class=\"fr\"><span>2π<\/span><span><i>T<\/i><\/span><\/span> = 2 · π · <i>f<\/i><span class=\"eq\">(3)<\/span><\/div>\n<p>Für das Zusammenspiel von Spannung, Strom und Widerstand gilt weiterhin das Ohm’sche Gesetz – nur sind Spannung und Strom jetzt zeitabhängig:<\/p>\n<div class=\"fm\"><i>I<\/i>(<i>t<\/i>) = <span class=\"fr\"><span><i>U<\/i>(<i>t<\/i>)<\/span><span><i>R<\/i><\/span><\/span><span class=\"eq\">(4)<\/span><\/div>\n<p>Damit lassen sich für jeden einzelnen Zeitpunkt die Verhältnisse von Strom, Spannung und Widerstand ausrechnen. Bequemer ist es, mit zeitunabhängigen Größen zu arbeiten, etwa mit den Höchstwerten <i>U<\/i><sub>max<\/sub> und <i>I<\/i><sub>max<\/sub> (siehe Abb. 1.1).<\/p>\n\n<h3>1.2.2 Ohmscher Widerstand, Induktivität und Gleichstrom<\/h3>\n<p>Wir betrachten zunächst einen Gleichstromkreis aus einem ohmschen Widerstand <i>R<\/i> und einer Induktivität (Spule) <i>L<\/i> (Abb. 1.2). Drahtquerschnitt und Windungszahl der Spule sind so gewählt, dass ihre Selbstinduktion <i>L<\/i> groß, der Widerstand des Spulendrahtes selbst aber gering ist.<\/p>\n<div data-fig=\"v1_dcckt\" data-cap=\"Abb. 1.2: Elektrischer Gleichstromkreis mit Widerstand R, Induktivität L und Schalter S\"><\/div>\n<p>Die Selbstinduktion wirkt – wie unter 1.3 noch genauer erläutert – jeder Änderung des Stromflusses entgegen. Schließt man den Schalter <i>S<\/i> zum Zeitpunkt <i>t<\/i><sub>0<\/sub>, springt der Strom deshalb nicht augenblicklich auf seinen Endwert. Er wächst vielmehr allmählich an, bis er nach dem Ohm’schen Gesetz den Wert <i>I<\/i> = <i>U<\/i><sub>0<\/sub>/<i>R<\/i> erreicht hat (Abb. 1.3).<\/p>\n<div data-fig=\"v1_dccurve\" data-cap=\"Abb. 1.3: Zeitlicher Verlauf von Strom und Spannung im Gleichstromkreis\"><\/div>\n<div data-sim=\"rl_dc\"><\/div>\n\n<h3>1.2.3 Ohmscher Widerstand, Induktivität und Wechselstrom<\/h3>\n<p>Nun ersetzen wir die Batterie durch eine Wechselspannungsquelle und lassen den Schalter weg. Den so veränderten Stromkreis zeigt Abb. 1.4.<\/p>\n<div data-fig=\"v1_acckt\" data-cap=\"Abb. 1.4: Elektrischer Wechselstromkreis\"><\/div>\n<p>Die Rolle des Schalters übernimmt jetzt die Quelle selbst: Der einmalige Schaltvorgang aus Abb. 1.3 entspricht dem Anwachsen der Spannung zu Beginn jeder Periode. Wegen der „Trägheit“ der Selbstinduktion steigt der Strom langsamer an als die Spannung, erreicht seinen Höchstwert später und fällt auch später wieder ab. Folglich verläuft die Stromkurve nicht phasengleich zur Spannungskurve, sondern ist um die Zeit Δ<i>t<\/i> verschoben (Abb. 1.5). Diese zeitliche Verschiebung von Strom und Spannung heißt <b>Phasenverschiebung<\/b>.<\/p>\n<div data-fig=\"v1_accurve\" data-cap=\"Abb. 1.5: Zeitlicher Verlauf von Strom und Spannung im Wechselstromkreis – der Strom eilt der Spannung nach\"><\/div>\n<p>Eine Induktivität verschiebt also die Nulldurchgänge von Strom und Spannung gegeneinander. Analog zu Formel (2) lässt sich das so schreiben:<\/p>\n<div class=\"fm\"><i>U<\/i>(<i>t<\/i>) = <i>U<\/i><sub>max<\/sub> · sin( <span class=\"fr\"><span>2π<\/span><span><i>T<\/i><\/span><\/span> · <i>t<\/i> )<br><i>I<\/i>(<i>t<\/i>) = <i>I<\/i><sub>max<\/sub> · sin( <span class=\"fr\"><span>2π<\/span><span><i>T<\/i><\/span><\/span> · <i>t<\/i> − <span class=\"fr\"><span>2π<\/span><span><i>T<\/i><\/span><\/span> · Δ<i>t<\/i> )<span class=\"eq\">(5)<\/span><\/div>\n<p>Neben der zeitlichen Verschiebung hat die Induktivität noch eine zweite Wirkung im Stromkreis: Sie verhält sich selbst wie ein Widerstand. Wie stark, das hängt von Frequenz und Selbstinduktion ab:<\/p>\n<div class=\"fm\"><i>X<\/i><sub>L<\/sub> = 2 · π · <i>f<\/i> · <i>L<\/i><span class=\"eq\">(6)<\/span><\/div>\n<p>Am einfachsten erfasst man diese Wirkung über die Höchstwerte <i>I<\/i><sub>max<\/sub> und <i>U<\/i><sub>max<\/sub> (siehe Abb. 1.5 und Formel 8). Wie beim Ohm’schen Gesetz gilt:<\/p>\n<div class=\"fm\"><i>U<\/i><sub>R max<\/sub> = <i>R<\/i> · <i>I<\/i><sub>max<\/sub><br><i>U<\/i><sub>L max<\/sub> = <i>X<\/i><sub>L<\/sub> · <i>I<\/i><sub>max<\/sub><span class=\"eq\">(7)<\/span><\/div>\n<p>Die obere Zeile ist das bekannte <b>Ohm’sche Gesetz<\/b> für den Sonderfall der Höchstwerte; <i>U<\/i><sub>R max<\/sub> ist die größte Spannung, die in Abb. 1.4 am Widerstand anliegt. Dasselbe Gesetz gilt für den induktiven Widerstand <i>X<\/i><sub>L<\/sub>, an dem die Höchstspannung <i>U<\/i><sub>L max<\/sub> liegt. Die Spannungsabfälle <i>U<\/i><sub>R<\/sub> und <i>U<\/i><sub>L<\/sub> kann man an den entsprechend beschrifteten Messinstrumenten ablesen.<\/p>\n<p>Wegen der Phasenverschiebung an der Spule treten <i>U<\/i><sub>R max<\/sub> und <i>U<\/i><sub>L max<\/sub> <b>nicht gleichzeitig<\/b> auf – man darf sie deshalb nicht einfach addieren. Die Phasenverschiebung zwischen Strom und Spannung beträgt am induktiven Widerstand 90°, am ohmschen dagegen 0°. Daraus folgt (Satz des Pythagoras):<\/p>\n<div class=\"fm\"><i>U<\/i><sup>2<\/sup><sub>max<\/sub> = <i>U<\/i><sup>2<\/sup><sub>R max<\/sub> + <i>U<\/i><sup>2<\/sup><sub>L max<\/sub><span class=\"eq\">(8)<\/span><\/div>\n<p>Genauso verhält es sich mit dem Gesamtwiderstand, der sogenannten <b>Impedanz Z<\/b>:<\/p>\n<div class=\"fm\"><i>Z<\/i><sup>2<\/sup> = <i>R<\/i><sup>2<\/sup> + <i>X<\/i><sub>L<\/sub><sup>2<\/sup> = <i>R<\/i><sup>2<\/sup> + (2 · π · <i>f<\/i> · <i>L<\/i>)<sup>2<\/sup><span class=\"eq\">(9)<\/span><\/div>\n<p>Man kann den Gesamtwiderstand auch zeichnerisch bestimmen: Man trägt eine Strecke der Länge <i>R<\/i> ab, senkrecht dazu eine Strecke der Länge <i>X<\/i><sub>L<\/sub> (im gleichen Maßstab) und ergänzt zum Rechteck. Die Länge der Diagonalen ist dann <i>Z<\/i> (Abb. 1.6).<\/p>\n<div data-fig=\"v1_zrect\" data-cap=\"Abb. 1.6: Grafische Ermittlung der Impedanz Z\"><\/div>\n<p>Aus der Zeichnung lässt sich außerdem der Winkel Δφ ablesen:<\/p>\n<div class=\"fm\">tan Δ<i>φ<\/i> = <span class=\"fr\"><span><i>X<\/i><sub>L<\/sub><\/span><span><i>R<\/i><\/span><\/span><span class=\"eq\">(10)<\/span><\/div>\n<p>Dieser Winkel Δφ ist die <b>Phasenverschiebung<\/b>. Sie ist mit der zeitlichen Verschiebung von Strom und Spannung verknüpft durch:<\/p>\n<div class=\"fm\">Δ<i>φ<\/i> = <span class=\"fr\"><span>2π<\/span><span><i>T<\/i><\/span><\/span> · Δ<i>t<\/i><span class=\"eq\">(11)<\/span><\/div>\n<div data-sim=\"rl_ac\"><\/div>\n<div class=\"merke\">Die grafische Darstellung der Vorgänge im Wechselstromkreis nach Abb. 1.6 hat grundlegende Bedeutung für die Wirbelstromprüfung. Sie wird im Abschnitt 1.4 weiter ausgebaut.<\/div>\n\n<h2>1.3 Induktion<\/h2>\n<h3>1.3.1 Selbstinduktion einer Spule ohne Eisenkern<\/h3>\n<p>Im Grundkurs ET 1 ging es um Induktionswirkungen, die entstehen, wenn eine Spule von einem <i>fremden<\/i> Magnetfeld durchsetzt wird. Aber auch der Strom, der durch eine Spule selbst fließt, erzeugt in deren eigenen Windungen einen magnetischen Kraftfluss. Ändert sich dieser Fluss, so wird sowohl in der Spule selbst als auch in jeder benachbarten Induktionsspule eine Spannung induziert.<\/p>\n<div class=\"def\">Die Induktionswirkung eines Stromes auf seinen eigenen Leiterkreis heißt <b>Selbstinduktion<\/b>. Auch sie wirkt ihrer Entstehungsursache entgegen.<\/div>\n<p>Bei Gleichstrom macht sich die Selbstinduktion nur im Moment des Ein- oder Ausschaltens bemerkbar. Bei Wechselstrom ändert sich der Kraftfluss dagegen ununterbrochen, deshalb ist auch die durch Selbstinduktion erzeugte Gegenspannung ständig vorhanden. Sie wirkt wie ein zusätzlicher, „scheinbarer“ Widerstand.<\/p>\n<p>Das Formelzeichen der Selbstinduktion ist <i>L<\/i>. Für den Sonderfall einer langen Spule mit der Länge <i>l<\/i>, der Querschnittsfläche <i>A<\/i> und der Windungszahl <i>n<\/i> lässt sich <i>L<\/i> berechnen. Sie wächst mit dem <b>Quadrat der Windungszahl<\/b> und <b>proportional zur Fläche<\/b>; drängt man dieselben Windungen auf eine kürzere Spulenlänge zusammen, steigt sie ebenfalls. Mit der magnetischen Feldkonstanten μ<sub>0<\/sub> lautet der Zusammenhang:<\/p>\n<div class=\"fm\"><i>L<\/i> = <i>μ<\/i><sub>0<\/sub> · <span class=\"fr\"><span><i>n<\/i><sup>2<\/sup><\/span><span><i>l<\/i><\/span><\/span> · <i>A<\/i><span class=\"eq\">(12)<\/span><\/div>\n\n<h3>1.3.2 Selbstinduktion einer Spule mit Eisenkern<\/h3>\n<p>Ein Eisenkern verstärkt wegen seiner Permeabilität das Magnetfeld einer stromdurchflossenen Spule. In einer wechselstromgespeisten Spule mit Eisenkern ändert sich der Kraftfluss deshalb wesentlich stärker als in der Luftspule – und es entsteht eine entsprechend größere Gegenspannung.<\/p>\n<p>Die Verstärkung der magnetischen Induktion im Kern beschreibt die relative Permeabilität μ<sub>r<\/sub>. Die Selbstinduktion verhält sich genauso wie die Induktion: Gegenüber Formel (12) vergrößert sie sich um den Faktor μ<sub>r<\/sub>:<\/p>\n<div class=\"fm\"><i>L<\/i> = <i>μ<\/i><sub>0<\/sub> · <i>μ<\/i><sub>r<\/sub> · <span class=\"fr\"><span><i>n<\/i><sup>2<\/sup><\/span><span><i>l<\/i><\/span><\/span> · <i>A<\/i><span class=\"eq\">(13)<\/span><\/div>\n<p>Im magnetischen Wechselfeld entstehen im Eisenkern neben den Magnetisierungseffekten auch <b>Wirbelströme<\/b>. Bei höheren Frequenzen können sie die Selbstinduktion stark beeinflussen. Besonders ausgeprägt ist dieser Einfluss bei nichtferromagnetischen, aber leitfähigen Spulenkernen.<\/p>\n\n<h3>1.3.3 Effektive Permeabilität<\/h3>\n<p>Schiebt man statt eines Eisenkerns einen nichtferromagnetischen Leiter – etwa einen Aluminiumkern – in die Spule, schwächen die im Leiter entstehenden Wirbelströme nach der Lenz’schen Regel das Spulenfeld. Den Einfluss eines leitfähigen Körpers auf das elektromagnetische Feld kann man rein formal der Permeabilität zuschlagen. Dazu führt man die <b>effektive Permeabilität μ<sub>eff<\/sub><\/b> ein:<\/p>\n<div class=\"fm\"><i>B<\/i> = <i>μ<\/i><sub>0<\/sub> · <i>μ<\/i><sub>eff<\/sub> · <i>H<\/i><span class=\"eq\">(14)<\/span><\/div>\n<p>Im Begriff der effektiven Permeabilität sind sämtliche Eigenschaften eines Körpers zusammengefasst, die die magnetische Induktion <i>B<\/i> beeinflussen.<\/p>\n<div class=\"def\">Die effektive Permeabilität ist im Wesentlichen eine Funktion der <b>Frequenz<\/b>, der <b>Leitfähigkeit<\/b>, der <b>relativen Permeabilität μ<sub>r<\/sub><\/b> und der <b>Geometrie<\/b>.<\/div>\n<div data-sim=\"coil_l\"><\/div>\n\n<h3>1.3.4 Frequenzeinfluss auf den Wechselstromwiderstand einer Spule<\/h3>\n<p>Erhöht man bei konstanter Spannungsamplitude die Frequenz, so misst man einen immer kleineren Spulenstrom. Die Erklärung liefert das Induktionsgesetz: Je höher die Frequenz, desto schneller muss sich der Kraftfluss ändern – und desto größer wird die Induktionswirkung.<\/p>\n<div class=\"def\">Der Wechselstromwiderstand einer Spule <b>steigt mit der Frequenz<\/b> der angelegten Wechselspannung.<\/div>\n\n<h2>1.4 Die Impedanzebene, Wirkwiderstand, Blindwiderstand<\/h2>\n<p>Der elektrische Widerstand aus Abb. 1.2 wandelt elektrische Energie in Wärme um. Die umgesetzte Leistung ergibt sich aus dem Produkt von Strom und Spannung und wird in Watt gemessen. Diese Wärmeleistung geht dem Stromkreis verloren – man spricht von Verlustleistung. Ein Widerstand, der Leistungsverluste verursacht, heißt <b>ohmscher Widerstand<\/b> oder <b>Wirkwiderstand<\/b> und trägt das Zeichen <i>R<\/i>.<\/p>\n<p>Anders der induktive Widerstand einer Spule im Wechselstromkreis (Abschnitt 1.2.3): Ist der ohmsche Widerstand des Spulendrahtes klein genug, erwärmt sich die Spule nicht – und behindert den Stromfluss trotzdem durch die Selbstinduktion. Dieser Widerstand verursacht <i>keine<\/i> Leistungsverluste und wird daher <b>Blindwiderstand<\/b> genannt.<\/p>\n<div class=\"def\">Der <b>Wirkwiderstand<\/b> verursacht Leistungsverluste und Erwärmung.<br>Der <b>Blindwiderstand<\/b> verursacht keine Leistungsverluste und keine Erwärmung.<\/div>\n<p>Weil Leistungsverlust und Erwärmung unmittelbar zusammenhängen, kann man den Satz auch umkehren:<\/p>\n<div class=\"merke\">Tritt in einem Stromkreis Erwärmung auf, muss an dieser Stelle ein Wirkwiderstand vorhanden sein.<\/div>\n<p>Zurück zur Spule mit Aluminiumkern aus 1.3.3. Gegenüber Wechselstrom hat sie zunächst einen induktiven Widerstand, der von der Spulengeometrie abhängt und von den Wirbelströmen im Aluminium beeinflusst wird. Zusätzlich tritt aber ein Leistungsverlust auf – die Spule besitzt also auch einen Wirkwiderstand. Lässt man Gleichstrom fließen, erwärmt sich nur der Spulendraht (abhängig von Länge, Querschnitt und Leitfähigkeit); ist der Aluminiumkern gut wärmeisoliert, bleibt er kalt.<\/p>\n<p>Bei Wechselstrom erwärmt sich dagegen auch der Aluminiumkern. Die Ursache sind die Wirbelströme in ihm. Sie bedeuten einen zusätzlichen Leistungsverlust: Zum Wirkwiderstand des Spulendrahtes kommt ein weiterer Wirkwiderstand im Kern hinzu, der von den elektrischen Eigenschaften des Aluminiums und von der Frequenz abhängt.<\/p>\n<div class=\"merke\">Wirbelströme beeinflussen sowohl den Blind- als auch den Wirkwiderstand.<\/div>\n<p>Trägt man Blind- und Wirkwiderstand senkrecht zueinander auf – wie in Abb. 1.6 –, erhält man eine Darstellung des elektrischen Widerstandes in der <b>Impedanzebene<\/b>. In abgewandelter Form dient sie in der Praxis zur Anzeige von Wirbelstromsignalen.<\/p>\n<p>Auch die Spannung lässt sich so darstellen: Man zerlegt sie gemäß Gleichung (8) in die Wirkspannung <i>U<\/i><sub>R<\/sub> und die Blindspannung <i>U<\/i><sub>L<\/sub> und trägt beide senkrecht zueinander auf. Das geht ebenso mit anderen elektrischen Messgrößen, etwa der Stromstärke <i>I<\/i> oder der effektiven Permeabilität μ<sub>eff<\/sub>.<\/p>\n\n<h2>1.5 Grundlagen der Wirbelstromprüfung<\/h2>\n<h3>1.5.1 Messgrößen und Parameter der Wirbelstromprüfung<\/h3>\n<p>Im Prinzip kann man sich die Anordnung so vorstellen: Eine Spule wird senkrecht über eine Platte aus nichtferromagnetischem Werkstoff geführt (Abb. 1.7). Die Spule erzeugt ein magnetisches Wechselfeld.<\/p>\n<div data-fig=\"v1_setup\" data-cap=\"Abb. 1.7: Parameter und Messgrößen der Wirbelstromprüfung\"><\/div>\n<p>An der Spule liegt die zeitlich veränderliche Wechselspannung <i>U<\/i> mit der Frequenz <i>f<\/i>. Abhängig vom Spulenstrom <i>I<\/i> entsteht ein magnetisches Wechselfeld <i>H<\/i>, das in den Prüfgegenstand eindringt und dort <b>Wirbelströme<\/b> <i>I<\/i><sub>W<\/sub> induziert. Diese erzeugen ihrerseits ein Magnetfeld <i>H<\/i><sub>W<\/sub>, das dem Spulenfeld entgegengerichtet ist und es schwächt. Aus der Überlagerung von <i>H<\/i> und <i>H<\/i><sub>W<\/sub> entsteht das <b>resultierende Feld<\/b>.<\/p>\n<p>Dieses resultierende Feld wirkt auf die Phasenverschiebung Δφ, auf die Stromstärke <i>I<\/i> bzw. die Spannung <i>U<\/i> an den Spulenanschlüssen (Abb. 1.7). Es hängt von Stärke und Verteilung der Wirbelströme im Prüfgegenstand ab – und damit von dessen Beschaffenheit: Leitfähigkeit, Ungänzen, Oberfläche, Geometrie.<\/p>\n<p>Bei der Auswertung geben <i>U<\/i>, <i>I<\/i> und Δφ also Auskunft über den Zustand des Prüfgegenstandes <b>am Ort der Spule<\/b>. Weil Strom und Spannung über das Ohm’sche Gesetz zusammenhängen, genügt es, eine der beiden zu messen. In der Praxis misst man die Spannung <i>U<\/i> und die Phasenverschiebung Δφ und zeigt beide in der Impedanzebene auf einem Bildschirm an (Abb. 1.8).<\/p>\n<div data-fig=\"v1_implane\" data-cap=\"Abb. 1.8: Impedanzebene – die komplexe Spannung als Zeiger aus Wirk- und Blindanteil\"><\/div>\n<div data-vid=\"wirbel\"><\/div>\n<div data-sim=\"eddy\"><\/div>\n<p>Die wichtigsten Begriffe der Wirbelstromprüfung noch einmal im Überblick:<\/p>\n<div class=\"tw\"><table class=\"t\"><tr><th>Messgrößen<\/th><th>Einflussgrößen<\/th><th>Gesucht werden<\/th><\/tr>\n<tr><td>Spannung <i>U<\/i><br>Phasenverschiebung Δφ<\/td><td>Frequenz <i>f<\/i><br>Strom <i>I<\/i><br>Windungszahl und Form der Spule<br>Abstand Spule – Prüfgegenstand<br>Leitfähigkeit σ<br>Permeabilität μ<br>Geometrie des Werkstückes<\/td><td>Ungänzen<br>Formänderungen<br>Leitfähigkeitsänderungen<br>Permeabilitätsänderungen<\/td><\/tr><\/table><\/div>\n\n<h3>1.5.2 Das Ähnlichkeitsgesetz der Wirbelstromprüfung<\/h3>\n<p>Für spezielle Fälle lassen sich Blindspannung <i>U<\/i><sub>L<\/sub> und Wirkspannung <i>U<\/i><sub>R<\/sub> (Abb. 1.8) berechnen. Als Beispiel dient eine Stange mit dem Durchmesser <i>D<\/i><sub>P<\/sub>, die mit einer Außenspule vom Durchmesser <i>D<\/i><sub>S<\/sub> geprüft wird (Abb. 1.9).<\/p>\n<div data-fig=\"v1_rodcoil\" data-cap=\"Abb. 1.9: Prüfanordnung – Stange (D<sub>P<\/sub>) in einer Außenspule (D<sub>S<\/sub>)\"><\/div>\n<p>Die entscheidende Größe ist das Verhältnis der beiden Durchmesser. Man definiert daher den <b>Füllungsgrad η<\/b>:<\/p>\n<div class=\"fm\"><i>η<\/i> = ( <span class=\"fr\"><span><i>D<\/i><sub>P<\/sub><\/span><span><i>D<\/i><sub>S<\/sub><\/span><\/span> )<sup>2<\/sup> &nbsp;<span class=\"u\">(Außendurchlaufsensor, η &lt; 1)<\/span><span class=\"eq\">(15)<\/span><\/div>\n<p>Füllt die Stange die Spule nicht ganz aus, ist <i>D<\/i><sub>P<\/sub> kleiner als <i>D<\/i><sub>S<\/sub> und η somit kleiner als 1 – und zwar umso kleiner, je dünner die Stange im Verhältnis zur Spule ist.<\/p>\n<p>Für das Beispiel in Abb. 1.9 kann die Impedanz der Spule aus Füllungsgrad η, Leitfähigkeit κ (σ), relativer Permeabilität μ<sub>r<\/sub>, Stangendurchmesser <i>D<\/i><sub>P<\/sub> und Frequenz <i>f<\/i> berechnet werden. Wie in Abb. 1.6 besteht sie aus dem induktiven Anteil<\/p>\n<div class=\"fm\"><i>X<\/i><sub>L<\/sub> = <i>ωL<\/i> &nbsp;mit&nbsp; <i>ω<\/i> = 2 · π · <i>f<\/i><span class=\"eq\">(16)<\/span><\/div>\n<p>und dem ohmschen Anteil <i>R<\/i>. Beide hängen von der Selbstinduktion der <em>leeren<\/em> Spule ab. Um eine von den Spuleneigenschaften möglichst unabhängige Darstellung zu erhalten, teilt man den induktiven Anteil durch den Blindwiderstand ω<i>L<\/i><sub>0<\/sub> der leeren Spule:<\/p>\n<div class=\"fm\"><span class=\"fr\"><span><i>X<\/i><sub>L<\/sub><\/span><span><i>ωL<\/i><sub>0<\/sub><\/span><\/span> = <span class=\"fr\"><span><i>ωL<\/i><\/span><span><i>ωL<\/i><sub>0<\/sub><\/span><\/span><span class=\"eq\">(17)<\/span><\/div>\n<p>Vom ohmschen Anteil zieht man zuvor den Wirkwiderstand <i>R<\/i><sub>0<\/sub> der leeren Spule ab und teilt ihn ebenfalls durch ω<i>L<\/i><sub>0<\/sub>:<\/p>\n<div class=\"fm\"><span class=\"fr\"><span><i>R<\/i> − <i>R<\/i><sub>0<\/sub><\/span><span><i>ωL<\/i><sub>0<\/sub><\/span><\/span><span class=\"eq\">(18)<\/span><\/div>\n<p>Diese beiden Größen heißen <b>normierter Blind- bzw. Wirkwiderstand<\/b>. Sie werden – analog zu Abb. 1.8 – senkrecht zueinander aufgetragen und ergeben die <b>normierte Darstellung<\/b> (Abb. 1.10), in der Frequenz und Füllungsgrad die Lage des Punktes bestimmen. Statt der Frequenz <i>f<\/i> verwendet man dabei die <b>Arbeitskonstante<\/b> <i>k<\/i><sub>a<\/sub> als Parameter:<\/p>\n<div class=\"fm\"><i>k<\/i><sub>a<\/sub> = <i>f<\/i> / <i>f<\/i><sub>g<\/sub> &nbsp;<span class=\"u\">(nur bei Vollmaterial, z. B. einer Stange)<\/span><\/div>\n<p><i>f<\/i><sub>g<\/sub> ist die <b>Grenzfrequenz<\/b>. Sie hängt von Durchmesser und Werkstoffeigenschaften der Probe ab und lässt sich für die Stange so berechnen:<\/p>\n<div class=\"fm\"><i>f<\/i><sub>g<\/sub> = <span class=\"fr\"><span>5066<\/span><span><i>σ<\/i> · <i>μ<\/i><sub>r<\/sub> · <i>D<\/i><sub>P<\/sub><sup>2<\/sup><\/span><\/span> &nbsp;<span class=\"u\">[Hz]<\/span><span class=\"eq\">(19)<\/span><\/div>\n<p>Die Leitfähigkeit σ (bzw. κ) wird hier in MS/m eingesetzt, der Probendurchmesser <i>D<\/i><sub>P<\/sub> in cm. Die relative Permeabilität μ<sub>r<\/sub> ist bei nichtferromagnetischen Werkstoffen näherungsweise 1 (ohne Einheit).<\/p>\n<div class=\"merke\"><b>Beispiel:<\/b> Ein Kupferdraht (μ<sub>r<\/sub> = 1) mit <i>D<\/i><sub>P<\/sub> = 1 cm und σ = 50,5 MS/m hat die Grenzfrequenz <i>f<\/i><sub>g<\/sub> = 5066/(50,5 · 1 · 1²) ≈ <b>100 Hz<\/b>. Ein Draht mit <i>D<\/i><sub>P<\/sub> = 2 cm hat entsprechend <i>f<\/i><sub>g<\/sub> ≈ <b>25 Hz<\/b>.<\/div>\n<p>Prüft man beide Drähte jeweils mit ihrer Grenzfrequenz – oder mit demselben Vielfachen davon –, so erhält man bei betragsgleicher Leitfähigkeitsänderung an beiden Drähten die <b>gleiche Anzeige<\/b> am Wirbelstromgerät. Dasselbe gilt für Formänderungen, die prozentual – bezogen auf den Drahtdurchmesser – gleich tief sind. Allgemein formuliert ergibt das das <b>Ähnlichkeitsgesetz der Wirbelstromprüfung<\/b>:<\/p>\n<div class=\"def\">Die Feldstärke- und Wirbelstromverteilung in unterschiedlichen Werkstücken ist die gleiche, wenn mit der gleichen Arbeitskonstante geprüft wird.<\/div>\n<div data-sim=\"norm\"><\/div>\n\n<h3>1.5.3 Grundlegende Eigenschaften der normierten Darstellung<\/h3>\n<p>In der normierten Darstellung (Abb. 1.10) zeigt die komplexe Spannung bei allen Spulen, deren Feldlinien durch elektrisch leitfähiges Material treten, ein ähnliches Verhalten. Mit steigender Frequenz durchläuft sie, ausgehend vom Punkt (0 | 1), eine Kurve, die sich im unteren Frequenzbereich von der Ordinate entfernt und bei hohen Frequenzen wieder an sie annähert.<\/p>\n<div data-fig=\"v1_norm\" data-cap=\"Abb. 1.10: Normierte Impedanzebene für verschiedene Füllungsgrade η (berechnet für einen Vollzylinder, Markierungen: Arbeitskonstante k)\"><\/div>\n<p>Im unteren Frequenzbereich wächst der reelle Widerstand des Systems aus Spule und leitfähigem Material mit der Frequenz, weil die Verluste durch Wirbelströme zunehmen. Erhöht man die Frequenz weiter, sinkt die Eindringtiefe der Wirbelströme: Die Verluste und damit der reelle Widerstand der Spule werden wieder kleiner und verschwinden schließlich ganz.<\/p>\n<p>Der induktive Widerstand nimmt mit steigender Frequenz immer weiter ab, weil die Wirbelströme das Spulenfeld zunehmend verdrängen (<b>Skineffekt<\/b>). Je mehr Feldlinien aus dem leitfähigen Material verdrängt werden, desto kleiner ist bei hohen Frequenzen die Induktivität der Spule. Beim Zylinder hängt sie daher vom Füllungsgrad und damit vom Zylinderdurchmesser ab (Abb. 1.10).<\/p>\n\n<h3>1.5.4 Beispiele für die Feldverteilung bei verschiedenen Spulengeometrien<\/h3>\n<p>Das Feld einer Luftspule lässt sich leicht mit Eisenfeilspänen sichtbar machen. Bei der Wirbelstromprüfung geht das nicht. Erst aufwendige Rechenprogramme haben es ermöglicht, die Feldverteilung realer Spulentypen zu berechnen. Als Beispiele zeigen Abb. 1.11 den <b>Tastsensor<\/b> und Abb. 1.12 den <b>Außendurchlaufsensor<\/b>.<\/p>\n<div data-fig=\"v1_tast\" data-cap=\"Abb. 1.11: Feldverteilung für einen Tastsensor (schematisch)\"><\/div>\n<div data-fig=\"v1_durch\" data-cap=\"Abb. 1.12: Feldverteilung für einen Durchlaufsensor (schematisch)\"><\/div>\n", "v2": "<h2>2.1 Einleitung<\/h2>\n<p>Spulensystem und Gerätetechnik gehören untrennbar zusammen. Verlässliche und reproduzierbare Prüfergebnisse erhält man nur, wenn das Prüfgerät zum Spulensystem passt <b>und<\/b> beide wiederum optimal auf das konkrete Prüfproblem abgestimmt sind.<\/p>\n\n<h2>2.2 Nutz-zu-Störsignalverhältnis<\/h2>\n<p>Bei der Wirbelstromprüfung wirkt eine ganze Reihe von Parametern und Einflussgrößen mit. Je nach Prüfaufgabe sind manche davon nützlich, andere stören. Tab. 2.1 stellt Prüfaufgaben und Einflussgrößen gegenüber: Ein <b>+<\/b> kennzeichnet eine Einflussgröße, die für die Prüfung gebraucht wird, ein <b>−<\/b> eine störende.<\/p>\n<div class=\"tcap\"><b>Tab. 2.1:<\/b> Prüfaufgaben und Einflussgrößen<\/div>\n<div class=\"tw\"><table class=\"t\"><tr><th rowspan=\"2\">Prüfaufgabe<\/th><th colspan=\"5\" style=\"text-align:center\">Einflussgrößen<\/th><\/tr>\n<tr><th>Abstand Spule – Prüfgegenstand<\/th><th>Geometrie<\/th><th>Permeabilität<\/th><th>Leitfähigkeit integral<\/th><th>Leitfähigkeit partiell<\/th><\/tr>\n<tr><td><b>Sortierprüfung<\/b><\/td><td>−<\/td><td>−<\/td><td>+<\/td><td>+<\/td><td>−<\/td><\/tr>\n<tr><td><b>Formtreue<\/b><\/td><td>+<\/td><td>+<\/td><td>−<\/td><td>−<\/td><td>−<\/td><\/tr>\n<tr><td><b>Materialtrennungen<\/b><\/td><td>−<\/td><td>−<\/td><td>−<\/td><td>−<\/td><td>+<\/td><\/tr><\/table><\/div>\n<p>Wer die Wirbelstromprüfung für eine bestimmte Aufgabe qualifiziert, muss Wege suchen, die hilfreichen Einflüsse (<b>Nutzsignale<\/b>) zu verstärken und die störenden (<b>Störsignale<\/b>) zu unterdrücken. Das Verhältnis der Amplituden von Nutz- und Störsignal heißt <b>Nutz-zu-Störsignalverhältnis<\/b>. Als Richtwert aus der Praxis gilt ein Verhältnis von etwa <b>3 : 1<\/b>. Es gibt im Wesentlichen <b>fünf<\/b> Wege, es zu verbessern:<\/p>\n<ul><li>Optimierung der Sensorgeometrie bzw. Kombination mehrerer Sensoren<\/li><li>Optimierung der Prüffrequenz bzw. Prüfung mit mehreren Frequenzen<\/li><li>Phasenselektion<\/li><li>Vormagnetisierung<\/li><li>Filtereinstellungen<\/li><\/ul>\n\n<h2>2.3 Unterdrückung von Störgrößen bei der Wirbelstromprüfung<\/h2>\n<div data-vid=\"lift\"><\/div>\n\n<p>Störsignale haben unterschiedliche Quellen: Das Prüfgut kann beim Transport durch das Spulensystem vibrieren, oder es liefern unkritische Eigenschaften wie geringe Durchmesserschwankungen ein Signal. Schon die Wahl einer geeigneten Prüffrequenz trennt Stör- und Nutzsignal ein Stück weit vor. Außerdem sind praktisch alle Wirbelstrom-Prüfgeräte so konstruiert, dass sie ein möglichst gutes Nutz-zu-Störsignalverhältnis erreichen.<\/p>\n\n<h3>2.3.1 Unterdrückung von Störsignalen durch Phasenselektion<\/h3>\n<p>Nach der Wirbelstromtheorie liefern verschiedene Fehlerarten – je nach gewählter Prüffrequenz – unterschiedliche Signalamplituden <i>und<\/i> Phasenlagen. Dasselbe gilt für Nutz- und Störsignal. Mit Bewertungsmasken und einem <b>Phasensteller<\/b> lässt sich die Auswertemaske so drehen, dass das Fehlersignal (Nutzsignal) in den auswertenden Bereich fällt, das Störsignal dagegen nicht. Moderne Prüfgeräte besitzen einen Phasensteller, der reproduzierbare 1°-Schritte zwischen 0° und 360° erlaubt.<\/p>\n<p>Abb. 2.1 zeigt am Beispiel, wie sich zwei Fehlerarten durch die richtige Prüffrequenz trennen lassen; entsprechend verhalten sich Nutz- und Störsignal.<\/p>\n<div data-fig=\"v2_phase\" data-cap=\"Abb. 2.1: Trennung von Außen- und Innenfehlern über die Phasenlage bei der Rohrprüfung (a Darstellung auf dem Schreiber, b Darstellung auf dem Bildschirm)\"><\/div>\n<div data-sim=\"phase\"><\/div>\n\n<h3>2.3.2 Der Einsatz von NF-Filtern zur Signaloptimierung<\/h3>\n<p>Signale echter Fehler – also Materialtrennungen an der Oberfläche – haben meist eine höhere Grundfrequenz als Störsignale, die von langsamen Leitfähigkeitsänderungen im Material herrühren. Auch Vibrationen des Prüfgegenstandes beim Transport durch die Spule sind niederfrequenter als das Fehlersignal.<\/p>\n<p>Dies nutzt man bei den <b>NF-Filtern<\/b> aus: Das im phasengesteuerten Gleichrichter demodulierte Ausgangssignal des Gebersystems durchläuft ein NF-Filter, das niederfrequente „Störfrequenzen“ von den höherfrequenten „Fehlerfrequenzen“ trennt. Moderne Geräte lassen sich zwischen <b>Hochpass- (HP)<\/b> und <b>Bandpass-Charakteristik (BP)<\/b> umschalten. Welcher Typ das beste Nutz-zu-Störsignalverhältnis liefert, muss man beim jeweiligen Prüfproblem durch Versuch ermitteln. Zusätzlich kann die Durchlassbandbreite an die Prüfgeschwindigkeit angepasst werden. Abb. 2.2 zeigt, wie ein NF-Filter niederfrequente Störsignale unterdrückt.<\/p>\n<div data-fig=\"v2_filter\" data-cap=\"Abb. 2.2: Wirkung eines NF-Filters (hier Hochpass): Die langsame Drift wird unterdrückt, das schnelle Fehlersignal bleibt erhalten\"><\/div>\n<div data-sim=\"filter\"><\/div>\n<h4>Maßnahmen bei ferromagnetischem Material<\/h4>\n<p>Bei ferromagnetischem Prüfgut, etwa Stahlrohren, schwankt die Permeabilität μ im Prüfbereich so stark, dass die Störsignale im Extremfall eine Oberflächenfehlerprüfung unmöglich machen. Dieser Störeffekt lässt sich durch <b>magnetische Sättigung<\/b> des Materials während der Prüfung beseitigen: Die Permeabilität wird dabei auf einen Wert nahe 1 gesenkt. In der Praxis verwendet man dazu ein Spulensystem, das als <b>Magnetisierungsjoch<\/b> bezeichnet wird und im Prüfvolumen ein starkes magnetisches Gleichfeld in Längsrichtung des Rohres erzeugt.<\/p>\n<p>Abb. 2.3 veranschaulicht den Einfluss der Sättigung am Beispiel eines Stahlrohres 30 × 2,5 mm mit künstlichen Fehlern.<\/p>\n<div data-fig=\"v2_sat\" data-cap=\"Abb. 2.3: Fehlersignalanzeigen mit und ohne magnetische Sättigung am Beispiel eines ferritischen Stahlrohres 30 × 2,5 mm (schematisch)\"><\/div>\n\n<h2>2.4 Spulensysteme<\/h2>\n<p>Trotz der Vielfalt an Prüfproblemen haben sich im Lauf der Zeit drei Haupttypen durchgesetzt: die <b>Durchlaufspule<\/b>, die <b>Segmentspule<\/b> und die <b>Tastspule<\/b>.<\/p>\n<div data-sim=\"spulen\"><\/div>\n\n<h3>2.4.1 Der Durchlaufsensor (Koaxialsensor)<\/h3>\n<h4>Elektrischer Aufbau<\/h4>\n<p>Der Durchlaufsensor wird meist an eine transformatorische Eingangsstufe angeschlossen. Außer der felderregenden Primärseite besitzt er je eine Differenz- und/oder eine Absolut-Spulenanordnung als Messwertaufnehmer (Sekundärseite). Neben der klassischen Zweispulen-Differenzanordnung kommen häufig auch Mehrfach-Differenzanordnungen zum Einsatz.<\/p>\n<h4>Anwendung<\/h4>\n<p>Der Durchlaufsensor ist der am häufigsten verwendete Wirbelstrom-Aufnehmer bei der Oberflächenprüfung von Erzeugnisformen wie Stangen, Rohren und Drähten mit rundem oder profiliertem Querschnitt bei mittleren Prüfempfindlichkeiten. Nachteilig wirkt sich dabei die Ausdehnung eines Fehlers (das Fehlervolumen) aus. Neben der Prüfung von Halbzeugen auf Oberflächenbeschaffenheit setzt man ihn oft auch zur Qualitätssortierung von Massenteilen (z. B. Schrauben) oder zur Stückprüfung ein.<\/p>\n<h4>Abmessungsbereich<\/h4>\n<p>Der üblicherweise abgedeckte Bereich liegt zwischen <b>1 mm und 170 mm<\/b>.<\/p>\n<h4>Nachweisempfindlichkeit<\/h4>\n<p>Aus der Praxis ergeben sich folgende Werte: Bei der Rohrprüfung findet das Durchlaufverfahren einen <b>Außenfehler ab 10 %<\/b> der Wanddicke und einen <b>Innenfehler ab 20 %<\/b> der Wanddicke (Wanddicken zwischen 1 und 5 mm), nahezu unabhängig vom Rohraußendurchmesser. Bei Vollmaterial beträgt die Mindestfehlertiefe <b>1 % des Materialaußendurchmessers<\/b>, jedoch nicht weniger als 0,1 mm.<\/p>\n\n<h3>2.4.2 Der Segmentsensor<\/h3>\n<h4>Elektrischer Aufbau<\/h4>\n<p>Auch der Segmentsensor wird meist an einer transformatorischen Eingangsstufe betrieben. Neben der felderregenden Primärseite hat er in der Regel nur eine Sekundärwicklung. Weil diese gegenüber der Primärseite magnetisch entkoppelt angeordnet ist, liefert sie Signale wie eine Differenzspule. Bei bestimmten Prüfproblemen ist zusätzlich ein Absolutsystem vorhanden, das in derselben Ebene wie die Feldspule liegt (Abb. 2.4).<\/p>\n<div data-fig=\"v2_segment\" data-cap=\"Abb. 2.4: Spulenanordnung bei einem Segmentsensor (1 Feldspule, 2 Messspule, 3 Magnetfeld; a Standardanordnung, b liegende Feldspule, c senkrecht stehende Feldspule)\"><\/div>\n<p>Aus Abb. 2.4 geht hervor, dass Feld- und Messspule senkrecht zueinander stehen. Dadurch sind ihre Magnetfelder entkoppelt: In homogenem Prüfmaterial wird in der Messspule keine Spannung induziert. Das gilt auch, wenn man Feld- und Messspule vertauscht. Anders bei einer Materialinhomogenität: Sie verzerrt das erregende Primärfeld, und die verzerrte Rückwirkung auf die Messspule erzeugt das Fehlersignal.<\/p>\n<div data-fig=\"v2_segsig\" data-cap=\"Abb. 2.5: a) Einlauf eines Längsrisses beim Segmentsensor, b) Verlauf der Fehlerspannung\"><\/div>\n<h4>Anwendung<\/h4>\n<p>Der Segmentsensor ist dem Durchlaufsensor in der <b>Prüfempfindlichkeit<\/b> überlegen, weil sein Wechselwirkungsvolumen kleiner ist. In der Praxis prüft man mit ihm vor allem die Nahtzone geschweißter Rohre größeren Durchmessers. Eine neuere Anwendung ist die Handprüfung von Schweißnähten. Oft verbessert sich auch die Fehlerauflösung gegenüber dem Durchlaufsensor, weil man Segmentsensoren an unebenen Oberflächen besser führen kann.<\/p>\n<h4>Abmessungsbereich<\/h4>\n<p>Bei Spulenradien über 100 mm beträgt die Segmentwirkbreite etwa ± 30 mm. Bei kleineren Radien ist sie entsprechend kleiner und wird häufig als Winkel bezogen auf die Segmentmitte angegeben; bei kleinen Spulenradien sind ± 60° keine Seltenheit.<\/p>\n\n<h3>2.4.3 Der Tastsensor<\/h3>\n<h4>Elektrischer Aufbau<\/h4>\n<p>Tastsensoren können grundsätzlich in <b>Reflexions-<\/b> oder <b>Transmissionsanordnung<\/b> arbeiten. In der Prüfpraxis überwiegt die Reflexionsanordnung. Systeme in Transmissionsanordnung nennt man „Gabelspulen“.<\/p>\n<h4>Anwendung<\/h4>\n<p>Es gibt zwei typische Einsatzbereiche. Der erste ist die Bestimmung physikalischer und geometrischer Größen: Leitfähigkeitsbestimmung von NE-Metallen, Ferritgehaltsmessung in Schweißnähten austenitischer Rohre und Schichtdickenmessung auf bestimmten Grundwerkstoffen. Der zweite ist das Auffinden von Inhomogenitäten an der Materialoberfläche, kurz die „Fehlerprüfung“.<\/p>\n<p>Für physikalische und geometrische Größen wird das <b>Absolutverfahren<\/b> verwendet, für die Fehlerprüfung in aller Regel das <b>Differenzverfahren<\/b>.<\/p>\n<h4>Nachweisempfindlichkeit<\/h4>\n<p>Je kleiner das Wechselwirkungsvolumen des Systems, desto kleiner darf die noch nachweisbare Inhomogenität sein. In bestimmten Anwendungsfällen lassen sich Fehlertiefen von <b>50 µm<\/b> auffinden.<\/p>\n\n<h2>2.5 Schaltungsarten<\/h2>\n<h3>2.5.1 Transformatorische Schaltung<\/h3>\n<p>Die transformatorische Schaltung ist die häufigste Schaltungsart von Gebersystemen. Sie besteht aus einer galvanisch getrennten Primärwicklung (Felderreger) und einer Sekundärwicklung (Empfänger). Die Sekundärseite kann ein Differenz- und/oder ein Absolutsystem sein. <b>Vorteil:<\/b> Wegen der galvanischen Trennung ist die Sekundärspannung sehr stabil. <b>Nachteil:<\/b> relativ großer Platzbedarf und viele Anschlüsse.<\/p>\n<div data-fig=\"v2_trafo\" data-cap=\"Abb. 2.6: Transformatorische Schaltung am Beispiel eines Differenzspulensystems\"><\/div>\n<h3>2.5.2 Brückenschaltung<\/h3>\n<p>Die Brückenschaltung kommt in aller Regel nur für <b>direkte<\/b> Differenzspulensysteme zum Einsatz. Eine getrennte Erreger- und Empfängerwicklung gibt es hier nicht. Die in Abb. 2.7 schraffierten Spulen – die zweite Brückenhälfte – sitzen selten am Messort und sind oft schon im Prüfgerät eingebaut.<\/p>\n<p><b>Vorteile<\/b> gegenüber der transformatorischen Schaltung: geringerer Platzbedarf und nur ein dreipoliger Anschluss. <b>Nachteile:<\/b> Wegen der kleineren Erregerenergie ist die Messspannung kleiner, die Temperaturabhängigkeit dagegen größer.<\/p>\n<div data-fig=\"v2_bridge\" data-cap=\"Abb. 2.7: Wirbelstrom-Gebersystem in Brückenschaltung\"><\/div>\n<h3>2.5.3 Parametrische Schaltung<\/h3>\n<p>Die parametrische Schaltung (Abb. 2.8) besteht nur aus einer einzigen Wicklung, die zugleich als Erreger- und Empfängerwicklung arbeitet (Absolutsystem). Sie ist die einfachste Anordnung mit der <b>kleinstmöglichen Spulenanzahl<\/b>, dem geringsten Platzbedarf und nur zwei Anschlüssen. Sehr nachteilig für die Messspannung ist die große Temperaturabhängigkeit des Kupferwiderstandes der Wicklung.<\/p>\n<div data-fig=\"v2_param\" data-cap=\"Abb. 2.8: Parametrische Schaltung von Wirbelstrom-Gebersystemen\"><\/div>\n<div class=\"tw\"><table class=\"t\"><tr><th>Schaltung<\/th><th>Spulen / Anschlüsse<\/th><th>Vorteil<\/th><th>Nachteil<\/th><\/tr>\n<tr><td>Transformatorisch<\/td><td>Primär + Sekundär, viele Anschlüsse<\/td><td>sehr stabile Sekundärspannung (galvanisch getrennt)<\/td><td>großer Platzbedarf<\/td><\/tr>\n<tr><td>Brücke<\/td><td>nur direkte Differenzsysteme, 3 Pole<\/td><td>kleiner, weniger Anschlüsse<\/td><td>kleinere Messspannung, größere Temperaturabhängigkeit<\/td><\/tr>\n<tr><td>Parametrisch<\/td><td>eine Wicklung, 2 Anschlüsse<\/td><td>einfachster Aufbau<\/td><td>starke Temperaturabhängigkeit des Kupferwiderstands<\/td><\/tr><\/table><\/div>\n\n<h2>2.6 Anwendungsübersicht verschiedener Wirbelstrom-Gebersysteme<\/h2>\n<p>Die folgende Übersicht fasst zusammen, wofür sich welches Gebersystem eignet. Sie erhebt keinen Anspruch auf Vollständigkeit.<\/p>\n<div class=\"tcap\"><b>Tab. 2.2:<\/b> Anwendungsübersicht zu Gebersystemen (Diff. = Differenz, Abs. = Absolut)<\/div>\n<div class=\"tw\"><table class=\"t\"><tr><th rowspan=\"2\">Problemstellung<\/th><th colspan=\"2\">Durchlaufsensor<\/th><th colspan=\"2\">Segmentsensor<\/th><th colspan=\"2\">Tastsensor<\/th><\/tr>\n<tr><th>Diff.<\/th><th>Abs.<\/th><th>Diff.<\/th><th>Abs.<\/th><th>Diff.<\/th><th>Abs.<\/th><\/tr>\n<tr><td>Oberflächenprüfung von Stangen und Rohren bei mittlerer Prüfempfindlichkeit<\/td><td>x<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr>\n<tr><td>Überwachung der geschweißten Zone (offen/geschweißt) von Rohren<\/td><td><\/td><td>x<\/td><td><\/td><td>x<\/td><td><\/td><td><\/td><\/tr>\n<tr><td>Schweißnahtfehlerprüfung bei geschweißten Rohren<\/td><td>x<\/td><td><\/td><td>x<\/td><td><\/td><td><\/td><td><\/td><\/tr>\n<tr><td>Manuelle Schweißnahtprüfung<\/td><td><\/td><td><\/td><td>x<\/td><td>x<\/td><td><\/td><td><\/td><\/tr>\n<tr><td>Sortierung von Massenteilen, z. B. Schrauben<\/td><td>Fremdvergleich<\/td><td>x<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr>\n<tr><td>Stückgutsortierung, z. B. Kurbelwellen<\/td><td><\/td><td>x<\/td><td><\/td><td><\/td><td><\/td><td>x<\/td><\/tr>\n<tr><td>Messung physikalischer Werkstoffeigenschaften, z. B. Leitfähigkeit, Ferritgehalt<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td>x<\/td><\/tr>\n<tr><td>Schichtdickenmessung<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td>x<\/td><\/tr>\n<tr><td>Oberflächenrissprüfung mit hoher Fehlerauflösung an ebenen Flächen<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td>x<\/td><td><\/td><\/tr>\n<tr><td>Oberflächenrissprüfung mit hoher Auflösung in Bohrungen (rotierendes System)<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td>x<\/td><td><\/td><\/tr>\n<tr><td>Oberflächenrissprüfung mit hoher Auflösung an rotationssymmetrischen Körpern<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td>x<\/td><td><\/td><\/tr><\/table><\/div>\n\n<h2>2.7 Aufbau von Wirbelstrom-Prüfgeräten<\/h2>\n<h3>2.7.1 Einteilung der Prüfgeräte<\/h3>\n<p>So vielfältig die Anwendungen der Wirbelstromprüfung sind, so vielfältig ist die Gerätepalette: vom vollautomatischen Prüfgerät bis zum batteriebetriebenen Handgerät. Grundsätzlich unterscheidet man <b>Prüfgeräte<\/b> und <b>Messgeräte<\/b>. Obwohl alle Wirbelstromgeräte im Prinzip ähnlich aufgebaut sind, kann deshalb kein einzelnes Blockdiagramm für alle Varianten gelten. Abb. 2.9 gibt einen Überblick.<\/p>\n<div data-fig=\"v2_tree\" data-cap=\"Abb. 2.9: Übersicht über die Gerätevarianten bei der Wirbelstromprüfung\"><\/div>\n<h3>2.7.2 Blockschaltplan und Signalverarbeitung<\/h3>\n<p>Ein Blockdiagramm soll die grundsätzliche elektrische Wirkungsweise eines Gerätes erkennen lassen. Wir beginnen mit dem sehr einfachen Blockschaltbild eines <b>Leitfähigkeitsmessgerätes<\/b> (Abb. 2.10).<\/p>\n<div data-fig=\"v2_blk_cond\" data-cap=\"Abb. 2.10: Blockschaltplan eines Leitfähigkeitsmessgerätes (1 Oszillator, 2 Messkreis mit Messtaster, 3 Kompensationskreis, 4 Differenzverstärker, 5 Nullinstrument)\"><\/div>\n<p>Das Messergebnis liefert ein Messtaster, der auf die Metallprobe aufgesetzt wird. Der Kompensationskreis (3) erzeugt eine Spannung, die genauso groß ist wie die des Messkreises (2). Der Differenzverstärker (4) verstärkt die Differenz beider Spannungen. Das Anzeigeinstrument (5) ist ein „Null“-Instrument: Man verändert die Kompensationsspannung so lange, bis die Differenz zwischen Messkreis- und Kompensationsspannung null wird. Auf einer Skala, die mit der Kompensationsspannung gekoppelt ist, liest man dann die Leitfähigkeit der Probe ab.<\/p>\n<p>Das zweite Beispiel (Abb. 2.11) ist das Blockschaltbild eines <b>Sortiergerätes<\/b>.<\/p>\n<div data-fig=\"v2_blk_sort\" data-cap=\"Abb. 2.11: Blockschaltplan eines Sortiergerätes nach dem Wirbelstromverfahren\"><\/div>\n<ul><li>Der <b>Oszillator (1)<\/b> erzeugt einen sinusförmigen Wechselstrom mit stufenweise einstellbarer Frequenz. Er erregt in den Spulen 2 und 3 ein Magnetfeld, das mit den Prüfgegenständen in den Spulen wechselwirkt.<\/li>\n<li>Die Ausgangsspannungen gehen auf den <b>Differenzverstärker (5)<\/b>. Sind beide Prüfgegenstände gleich, ist seine Ausgangsspannung null, andernfalls ungleich null.<\/li>\n<li>Der <b>Phasensteller (4)<\/b> hat zwei Aufgaben: Er liefert eine Hilfsspannung zur Kompensation für den Differenzverstärker und die Referenzspannung für den <b>Demodulator (9)<\/b>, der die Signale für die Sortierelektronik (13) erzeugt.<\/li>\n<li>Die <b>Bandsperre (6)<\/b> ist wahlweise zuschaltbar und unterdrückt Netzspannungsstörungen.<\/li>\n<li>Ein <b>Bandpass (7)<\/b> mit schaltbarer Durchlasscharakteristik erlaubt eine Grund- oder Oberwellenauswertung.<\/li>\n<li>Am <b>Analoganzeiger (11)<\/b> bzw. dem externen <b>Digitalanzeiger (10)<\/b> – beide parallel zum Oszillographen-Sichtteil (8) – lassen sich die Signalkomponenten X und Y oder der gesamte Signalvektor ablesen.<\/li>\n<li>Die <b>Meldelampe (12)<\/b> leuchtet, wenn der eingestellte Toleranzbereich der Signalanzeige über- oder unterschritten wird.<\/li><\/ul>\n<p>Das letzte Beispiel behandelt die Varianten eines Prüfgerätes zur <b>Oberflächen-Fehlerprüfung<\/b>. Abb. 2.12 zeigt zunächst die Grundausrüstung.<\/p>\n<div data-fig=\"v2_blk_basic\" data-cap=\"Abb. 2.12: Grundausrüstung eines Wirbelstrom-Prüfgerätes für die Oberflächen-Fehlerprüfung\"><\/div>\n<p>Der <b>Wechselstromgenerator (1)<\/b> speist die Prüfspule (2) mit dem Strom für das magnetische Wechselfeld. Moderne Geräte arbeiten im Frequenzbereich von <b>100 Hz bis 10 MHz<\/b>. Im <b>Verstärkerteil (3)<\/b> werden die Fehlersignale im Pegel angehoben, in der <b>Amplituden- und Phasendemodulation (4)<\/b> nach Amplitude und Phasenlage demoduliert. In der <b>Signalaufbereitung (5)<\/b> optimiert ein NF-Filter in Abhängigkeit von der Prüfgeschwindigkeit das Nutz-zu-Störsignalverhältnis. Zusammen mit einer reproduzierbar einstellbaren Verstärkung lassen sich die Fehlersignale gegenüber einer Bezugsphase drehen, sodass sie für die <b>Signaldarstellung (6)<\/b> auf Oszillograph oder Schreiber optimal ausgerichtet sind.<\/p>\n<p>Geräte mit dieser Grundausrüstung eignen sich für allgemeine Wirbelstromuntersuchungen, zur Lösung spezieller Prüfprobleme im Labor und für die Prüfung mit visueller Fehlersignalauswertung.<\/p>\n<p>Soll die Prüfung automatisch ablaufen – mit Signalbewertung, Fehlermarkierung und Klassifizierung –, ergänzt man die Grundausrüstung um die <b>Signalbewertung (7)<\/b> und die <b>Markier- und Sortierelektronik (8)<\/b>. Will man außer NE- auch Fe-Material prüfen, kommen noch <b>magnetische Sättigung (9)<\/b> und <b>Gleichstromspeisung (10)<\/b> hinzu (Abb. 2.13).<\/p>\n<div data-fig=\"v2_blk_auto\" data-cap=\"Abb. 2.13: Blockschaltplan eines Wirbelstrom-Oberflächenfehler-Prüfgerätes für die vollautomatische Prüfung von Erzeugnisformen, z. B. Stangen und Rohren\"><\/div>\n<p>Zur Kontrolle des Prüfsystems lassen sich moderne Einrichtungen mit einer <b>Selbstüberwachung<\/b> ausrüsten (Abb. 2.14). Ein <b>Fehlersignalsimulator (11)<\/b> erzeugt, z. B. bei der Stückgutprüfung, periodisch ein künstliches Fehlersignal – etwa wie von einer Durchgangsbohrung bei der Rohrprüfung. Die <b>Selbstüberwachung (12)<\/b> kontrolliert die Reaktion der gesamten Prüfeinrichtung darauf. So erreicht man hohe Prüfsicherheit.<\/p>\n<div data-fig=\"v2_blk_self\" data-cap=\"Abb. 2.14: Blockschaltplan eines Wirbelstrom-Oberflächenfehler-Prüfgerätes mit Selbstüberwachung\"><\/div>\n<div data-sim=\"blocks\"><\/div>\n\n<h3>2.7.3 Auswertearten<\/h3>\n<h4>Amplituden-Auswertung<\/h4>\n<p>Die Amplituden-Auswe
