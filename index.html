rtung wird sowohl bei analoger Signaldarstellung als auch bei der Bildschirmdarstellung verwendet. Überschreitet das Fehlersignal eine vorgegebene Schwelle, löst es einen Folgevorgang aus, z. B. Sortieren oder Markieren. Die Auswertung ist <b>phasenunabhängig<\/b> (Abb. 2.15a, „Kreisschwelle“ bzw. polar). Sie ist immer dann vorteilhaft, wenn keine Störsignale mit nennenswerter Größe und eindeutiger Phasenlage vorliegen – die einfachste und sicherste Bewertungsart.<\/p>\n<h4>Die Phasen-Amplituden-Auswertung<\/h4>\n<p>Sie ist heute wohl die am häufigsten angewandte Auswerteart bei Bildschirmdarstellung. Neben der Amplitude wird die Phasenlage des Signals gegenüber vorgegebenen Fehlersignalschwellen berücksichtigt. Gegenüber der reinen Amplitudenauswertung bringt das wesentliche Vorteile:<\/p>\n<ul><li>Signale mit einer zur „Auswerterichtung“ passenden Phasenlage werden bevorzugt.<\/li><li>Unerwünschte Störsignale werden unterdrückt, wenn sie einen Phasenwinkel zur Auswerterichtung haben.<\/li><li>Signale lassen sich nach Betrag (Größe) und Phasenlage (Richtung) auf einem Schreiber darstellen.<\/li><\/ul>\n<p>Typischer Vertreter ist die <b>Sektorbewertungsmarke<\/b> (Abb. 2.15c): Nur Signal 1 wird als Fehlersignal erkannt und weiterverarbeitet. Vor ihrer Anwendung sind umfassende Untersuchungen zu Amplituden und Phasenlagen möglicher Fehler- und Störsignale nötig.<\/p>\n<h4>Y-Komponenten-Auswertung<\/h4>\n<p>Eine Abwandlung davon ist die Y-Komponenten-Auswertung (Abb. 2.15b). Hier muss die <b>Y-Komponente<\/b> des Fehlersignalvektors die vorgegebene Schwelle erreichen oder überschreiten. Im Beispiel werden die Signale 1 und 2 als Fehler erkannt, weil ihre Y-Komponente die Ansprechschwelle übersteigt; Signal 3 bleibt unbewertet. Man setzt dieses Verfahren bevorzugt ein, wenn unerwünschte Signale sich in der Phasenlage klar von möglichen Fehlersignalen unterscheiden.<\/p>\n<div data-fig=\"v2_eval\" data-cap=\"Abb. 2.15: Darstellung verschiedener Fehlersignal-Auswertearten (a Amplitude – Kreisschwelle, b Y-Komponente, c Sektor)\"><\/div>\n<h4>Die Korrelationsauswertung<\/h4>\n<p>Jedes Prüfverfahren enthält eine gewisse Unsicherheit im Ergebnis, die sich u. a. als Pseudofehler-Interpretation äußern kann. Man muss deshalb nach Wegen suchen, diese Unsicherheit klein zu halten – eine davon ist die <b>Korrelationsmethode<\/b>.<\/p>\n<p>Das Gebersystem besteht hier aus <b>zwei identischen Differenzspulensystemen<\/b>, die in festem Abstand <i>a<\/i> in einem gemeinsamen Gehäuse sitzen. Durchläuft der Prüfgegenstand das System, erzeugt ein Oberflächenfehler zwei Fehlersignale. Ihr zeitlicher Abstand <i>t<\/i> hängt vom Spulenabstand <i>a<\/i> und der Prüfgeschwindigkeit <i>v<\/i> ab:<\/p>\n<div class=\"fm\"><i>t<\/i> = <span class=\"fr\"><span><i>a<\/i><\/span><span><i>v<\/i><\/span><\/span><\/div>\n<p>Legt man die Elektronik so aus, dass sie nur Signale akzeptiert, die diese Bedingung erfüllen, ist der Korrelationseffekt erreicht. Das Verfahren erlaubt eine brauchbare Fehlererkennung selbst unter rauen Bedingungen, etwa bei Prüfgeschwindigkeiten von 10 m/s und gleichzeitig starken Vibrationen des Prüfgegenstandes. Das gewonnene Fehlersignal kann anschließend mit den oben beschriebenen Auswertearten bewertet werden.<\/p>\n<div data-fig=\"v2_korr\" data-cap=\"Abb. 2.16: Prinzip einer Fehlersignalkorrelation\"><\/div>\n<p>Zum Blockschaltbild: Das Fehlersignal vom Gebersystem 1 wird elektrisch um genau die Zeit verzögert, die der Fehler bis zum Gebersystem 2 braucht. Nur wenn an beiden Ausgängen gleichzeitig Signale ankommen, werden sie weiterverarbeitet.<\/p>\n<div data-sim=\"korr\"><\/div>\n", "v3": "<h2>3.1 Arten der Permeabilität<\/h2>\n<div data-vid=\"hyst\"><\/div>\n\n<p>Bei ferromagnetischen Werkstoffen beschreibt die <b>Hysteresiskurve<\/b> (Abb. 3.1), wie die angelegte magnetische Feldstärke <i>H<\/i> mit der dadurch erzeugten magnetischen Flussdichte (Induktion) <i>B<\/i> zusammenhängt. Je nachdem, welchen Teil dieser Kurve man betrachtet, ergeben sich verschiedene „Permeabilitäten“.<\/p>\n<div data-fig=\"v3_hyst\" data-cap=\"Abb. 3.1: Prinzipieller Verlauf einer Hysteresiskurve (Feldlinien-Dichte in Tesla; Sättigung; Größenordnung der Sättigungsfeldstärke etwa 20–60 A/cm)\"><\/div>\n<div data-sim=\"hyst\"><\/div>\n\n<h3>3.1.1 Absolute Permeabilität<\/h3>\n<p>Die absolute Permeabilität μ gibt den <b>Anstieg der Flussdichte mit wachsender Feldstärke<\/b> an:<\/p>\n<div class=\"fm\"><i>μ<\/i> = <span class=\"fr\"><span><i>B<\/i><\/span><span><i>H<\/i><\/span><\/span> &nbsp;<span class=\"u\">Einheit: V·s / (A·m)<\/span><\/div>\n<p>Für die Wirbelstromprüfung ist diese Größe <b>ohne Belang<\/b>, weil sie nur für magnetische Gleichfelder definiert ist.<\/p>\n<div data-fig=\"v3_abs\" data-cap=\"Abb. 3.2: Absolute Permeabilität – Steigung der Verbindungsgeraden vom Ursprung zum Arbeitspunkt der Neukurve\"><\/div>\n\n<h3>3.1.2 Relative Permeabilität<\/h3>\n<p>Die relative Permeabilität ist der Quotient aus absoluter Permeabilität und der Permeabilität des leeren Raumes:<\/p>\n<div class=\"fm\"><i>μ<\/i><sub>r<\/sub> = <span class=\"fr\"><span><i>μ<\/i><\/span><span><i>μ<\/i><sub>0<\/sub><\/span><\/span><\/div>\n<p>mit der Induktionskonstanten (absolute Permeabilität des Vakuums)<\/p>\n<div class=\"fm\"><i>μ<\/i><sub>0<\/sub> = 4 · π · 10<sup>−7<\/sup> <span class=\"u\">V·s / (A·m)<\/span><\/div>\n<p>μ<sub>r<\/sub> ist dimensionslos und sagt aus, <b>um wievielmal<\/b> die Flussdichte <i>B<\/i> im Material bei gegebener Feldstärke <i>H<\/i> größer ist als im Vakuum. Dieselbe Aussage gilt für alle folgenden Permeabilitätsarten.<\/p>\n\n<h3>3.1.3 Relative Amplitudenpermeabilität<\/h3>\n<p>Sie gibt die Steigung der Hysteresisschleife wieder, die man bei <b>kleiner Wechselfelderregung<\/b> erhält (Abb. 3.3). In der Wirbelstromprüfung ist sie die Größe, die das magnetische Verhalten des Werkstoffs kennzeichnet, solange <b>ohne Gleichfeld-Vormagnetisierung<\/b> gearbeitet wird.<\/p>\n<div data-fig=\"v3_amp\" data-cap=\"Abb. 3.3: Relative Amplitudenpermeabilität – Steigung der kleinen Wechselfeldschleife um den Nullpunkt\"><\/div>\n\n<h3>3.1.4 Überlagerungspermeabilität<\/h3>\n<p>Die Überlagerungspermeabilität ist ähnlich definiert wie die Amplitudenpermeabilität, aber für den Fall der <b>Gleichfeld-Vormagnetisierung<\/b>: Das kleine Wechselfeld wird einem Gleichfeld überlagert (Abb. 3.4). Sie hängt außerdem von der Größe des überlagerten Wechselfeldes ΔH ab (Abb. 3.5).<\/p>\n<div data-fig=\"v3_ueber\" data-cap=\"Abb. 3.4: Überlagerungspermeabilität μ_Δ – kleine Wechselfeldschleife auf einem Gleichfeld-Arbeitspunkt\"><\/div>\n<div data-fig=\"v3_dh\" data-cap=\"Abb. 3.5: Überlagerungspermeabilität bei verschieden großem ΔH\"><\/div>\n<div class=\"merke\">Die Überlagerungspermeabilität ist die <b>entscheidende Kenngröße<\/b> magnetischer Werkstoffe bei der Wirbelstromprüfung (neben der Amplitudenpermeabilität im unmagnetisierten Fall).<\/div>\n\n<h2>3.2 Permeabilität bei der Wirbelstromprüfung<\/h2>\n<h3>3.2.1 Einfluss auf die Wirbelstromverteilung<\/h3>\n<p>Wie gesagt sind die relative Amplitudenpermeabilität μ<sub>amp<\/sub> und die Überlagerungspermeabilität μ<sub>Δ<\/sub> die für die Wirbelstromprüfung wesentlichen Materialkennwerte. Abb. 3.6 zeigt, wie die Überlagerungspermeabilität die <b>effektive Permeabilität<\/b> beeinflusst – und dieser Einfluss hängt von der Geometrie des Prüfteils ab („Permeabilität ist geometrieabhängig!“).<\/p>\n<div data-fig=\"v3_mueff\" data-cap=\"Abb. 3.6: Einfluss der Überlagerungs- auf die effektive Permeabilität (berechnet für Vollzylinder, μ_Δ = 1, 12, 40)\"><\/div>\n<p>Die angenommene Überlagerungspermeabilität μ<sub>Δ<\/sub> = 12 kommt erst beim <b>Vollzylinder<\/b> in voller Größe zur Wirkung. Mit abnehmender Wanddicke sinkt ihr Einfluss. Der Grund: Bei niedriger Frequenz <i>f<\/i> erfasst das Magnetfeld den gesamten Rohrquerschnitt, die Überlagerungspermeabilität wirkt aber nur im Bereich der Wand.<\/p>\n<p>Für eine gegebene Rohrabmessung ist bei μ<sub>Δ<\/sub> = 40 die maximale effektive Permeabilität nur etwa <b>12-mal<\/b> größer als bei μ<sub>Δ<\/sub> = 1.<\/p>\n<p>Diese Verhältnisse gelten nur für den Idealfall einer unendlich langen Wirbelstromspule mit Füllfaktor η = 1. In der Praxis sind die Spulen kurz und der Füllfaktor deutlich kleiner als 1 – dadurch wird der Einfluss der Überlagerungspermeabilität noch weiter verringert. Trotzdem gilt:<\/p>\n<div class=\"def\">Relative Amplitudenpermeabilität und Überlagerungspermeabilität haben großen Einfluss auf die effektive Permeabilität, weil sie die Wirbelstromverteilung entscheidend mitbestimmen.<\/div>\n\n<h3>3.2.2 Permeabilität als Messgröße<\/h3>\n<h4>Werkstoffeigenschaften<\/h4>\n<p>Zu den Werkstoffeigenschaften, die sich über das magnetische Verhalten erfassen lassen, zählen:<\/p>\n<ul><li>Legierungsunterschiede<\/li><li>Gefügeunterschiede<\/li><li>Kern- und Randhärte<\/li><li>Einhärtetiefe<\/li><li>Aufkohlung<\/li><li>Randentkohlung<\/li><li>innere Spannungen<\/li><\/ul>\n<p>Legierungsänderungen sowie mechanische oder thermische Behandlungen können das magnetische Verhalten des Werkstoffes verändern. Misst man die relative Amplitudenpermeabilität – in bestimmten Fällen auch die Überlagerungspermeabilität –, lassen sich solche Änderungen erkennen.<\/p>\n<div class=\"warn\">Die <b>absolute Größe<\/b> der jeweiligen Permeabilität lässt sich meist nicht bestimmen. Es werden nur <b>Relativmessungen<\/b> durchgeführt. Das setzt nach 3.2.1 eine <b>konstante Geometrie<\/b> des Prüfteils im gesamten Prüfbereich voraus.<\/div>\n\n<h4>Ferritgehaltmessung<\/h4>\n<h5>Allgemeines<\/h5>\n<p>Der starke Einfluss der Überlagerungspermeabilität auf die effektive Permeabilität macht es möglich, den <b>Ferritgehalt<\/b> mit dem Wirbelstromverfahren zu messen. Ferrit besteht aus reinen Eisenkristallen und bildet sich bei Stahl mit weniger als 0,9 % Kohlenstoff.<\/p>\n<p>Wichtig ist das besonders im Behälter- und Kesselbau, wo Oberflächen mit Auftragsschweißungen aus austenitischem Stahl gegen aggressive Medien geschützt werden. Für Güte und Korrosionsbeständigkeit dieser Auftragsschweißungen ist der Ferritgehalt maßgeblich; er darf bestimmte Grenzen weder über- noch unterschreiten.<\/p>\n<h5>Messung nach dem Wirbelstromverfahren<\/h5>\n<p>In der komplexen Spulenebene unterscheiden sich die Richtungen, in die Änderungen der Leitfähigkeit und der Permeabilität das Signal verschieben (Abb. 3.7). Dieser Unterschied nimmt mit steigender Prüffrequenz ab.<\/p>\n<div data-fig=\"v3_sigmu\" data-cap=\"Abb. 3.7: Einfluss von σ- und μ-Änderungen auf die komplexe Spannung eines Tastsensors (links niedrige, rechts hohe Frequenz; δ = 503/√(f·σ·μ_r))\"><\/div>\n<p>In der Praxis geht es meist um den <b>δ-Ferrit<\/b> in austenitischen Werkstoffen. Deren Leitfähigkeit liegt weitgehend im Bereich <b>1 &lt; σ &lt; 2 MS/m<\/b>. Mit einer <b>phasenselektiven Signalauswertung<\/b> lässt sich daher der starke Einfluss von Leitfähigkeitsänderungen auf das Spulensignal unterdrücken, sodass nur Permeabilitätsänderungen angezeigt werden. Die Prüffrequenz wird dabei so gewählt, dass zwischen σ- und μ-Änderungen praktisch ein Phasenwinkel von <b>90°<\/b> besteht.<\/p>\n<p>Abb. 3.8 zeigt eine übliche Sonde zur Ferritgehaltsmessung.<\/p>\n<div data-fig=\"v3_probe\" data-cap=\"Abb. 3.8: Tastsensor zur Ferritgehaltsmessung (Erregerspulen gleichsinnig, Messspulen gegensinnig in Reihe)\"><\/div>\n<p>Die Erregerspulen zur Felderzeugung sind <b>gleichsinnig in Reihe<\/b>, die Messspulen <b>gegensinnig in Reihe<\/b> geschaltet. In Luft ist das Messsignal ungefähr null. Setzt man die Sonde auf austenitisches Material mit δ-Ferrit auf, wird die untere Messspule durch die Wirbelströme stärker beeinflusst als die obere. Aus der entstehenden Messspannung schließt man auf den δ-Ferritgehalt. Mit solchen Sonden kann sehr lokal gemessen werden – Messbereichsdurchmesser unter 3 mm.<\/p>\n<div data-sim=\"ferrit\"><\/div>\n<h5>Kalibrierung<\/h5>\n<p>Für die <b>absolute<\/b> Bestimmung des Ferritgehaltes gibt es weder ein zerstörendes noch ein zerstörungsfreies Verfahren. Seit etwa zehn Jahren existiert jedoch – ausgehend von den USA – ein <b>Nummernsystem<\/b>, das jedem Ferritgehalt eine „Ferritzahl“ zuordnet.<\/p>\n<p>Messgeräte werden mit <b>Kalibrierstücken<\/b> (Sekundärstandards) justiert, meist Abschnitte von Auftragsschweißungen mit unterschiedlichem δ-Ferritgehalt. Je nach Volumendichte erhält das Teil eine bestimmte Ferritzahl. Diese Zahlen werden nach dem <b>Haftkraftverfahren<\/b> ermittelt; die genaue Vorgehensweise beschreibt die Norm AWS (American Welding Society) A 4.2-74. Dabei dienen <b>primäre Standards<\/b> aus Weicheisen mit unterschiedlich dickem Kupferüberzug – jeder Cu-Schichtdicke ist eine Ferritzahl zugeordnet (Abb. 3.9). Durch Vergleich der Abreißkraft eines genau definierten Permanentmagneten auf den primären und auf den sekundären Standards bestimmt man die Ferritzahl der Sekundärstandards.<\/p>\n<p>Die Sekundärstandards sind nötig, weil nur sie eine Kalibrierung von Ferritmessgeräten nach dem Wirbelstromverfahren ermöglichen.<\/p>\n<div data-fig=\"v3_fn\" data-cap=\"Abb. 3.9: Ferritnummern in Abhängigkeit von der Schichtdicke des Kupferüberzugs (schematischer Verlauf)\"><\/div>\n<div class=\"merke\">Die <b>absolute<\/b> Bestimmung des Ferritgehalts ist mit zerstörungsfreien Methoden nicht möglich. Nach dem Wirbelstromverfahren lassen sich aber sehr genaue <b>Relativmessungen<\/b> durchführen.<\/div>\n\n<h3>3.2.3 Permeabilität als Störgröße<\/h3>\n<h4>Fehlerprüfung von ferromagnetischen Werkstoffen<\/h4>\n<p>Als Störfaktor tritt die Permeabilität bei der Fehlerprüfung auf. Genauer: Nicht die Permeabilität an sich stört, sondern ihre <b>Schwankung<\/b>. Ein Stahlrohr mit hoher, aber <i>konstanter<\/i> Überlagerungspermeabilität μ<sub>Δ<\/sub> ließe sich mit derselben Empfindlichkeit prüfen wie ein Messingrohr, wenn man die Prüffrequenz so weit senkt, dass dieselbe Arbeitskonstante <i>k<\/i><sub>a<\/sub> (<i>f<\/i>/<i>f<\/i><sub>g<\/sub>) vorliegt. Weil in der Praxis aber immer lokale Permeabilitätsschwankungen auftreten, ist eine solche Prüfung nicht möglich.<\/p>\n<p>Permeabilitätsschwankungen entstehen hauptsächlich<\/p>\n<ul><li>schon beim Erstarren des Materials nach dem Guss – durch lokale Ausscheidungen, Versetzungen, Einwirkung von Magnetfeldern,<\/li>\n<li>durch den Herstellprozess des Prüfteils, z. B. mechanische oder thermische Behandlung (Walzen, Schweißen, Formen usw.),<\/li>\n<li>durch Lagerung oder Transport (z. B. mit dem Magnethebekran).<\/li><\/ul>\n<p>Änderungen der Permeabilität verändern die Impedanz der Prüfspule – es entstehen also Störsignale. Weil Schwankungen sehr lokal auftreten können, ist die Störsignalbreite oft sehr klein und liegt in der Größenordnung der Signale kurzer Fehler wie Poren oder Querrisse. Außerdem haben diese Signale <b>keine Vorzugsrichtung<\/b> in der Phasenlage: Bei der Rohrprüfung kann die Störquelle in jeder Tiefe der Wand liegen, und Signale aus verschiedenen Tiefen haben wegen des Skineffektes unterschiedliche Phasenwinkel. Eine Trennung dieser Störungen vom Nutzsignal durch phasenselektive Auswertung ist deshalb grundsätzlich nicht möglich.<\/p>\n<div class=\"warn\">Störsignale durch Permeabilitätsschwankungen in ferromagnetischem Prüfmaterial können die gleiche Phasenlage und Signalbreite haben wie natürliche Fehler.<br><b>Regel:<\/b> Jeder Einfluss der Permeabilität ist bei der Wirbelstrom-Fehlerprüfung zu vermeiden.<\/div>\n\n<h4>Unterdrückung des Permeabilitätseinflusses<\/h4>\n<p>Unter diesen Prüfbedingungen wird der Störeinfluss von Permeabilitätsschwankungen vollständig oder weitgehend vermieden:<\/p>\n<ol><li>Prüfung <b>oberhalb der Curie-Temperatur<\/b> des Werkstoffs,<\/li><li><b>magnetische Sättigung<\/b> des Prüfteils mit einem Gleichfeld,<\/li><li><b>Verkleinerung des Sensors<\/b> bei gleichzeitiger Erhöhung der Prüffrequenz.<\/li><\/ol>\n<p>Die Vormagnetisierung ferromagnetischen Materials ist seit Jahrzehnten eingeführte Praxis; trotzdem herrscht bei vielen Anwendern noch Unkenntnis über die dabei auftretenden Effekte. Zwei Fehlertypen verdeutlichen das: Nach Abb. 3.10 wird ein Stahlrohr mit einer Bohrung durch die Wand und einem schmalen Längsriss außen mit einem Elektromagnetjoch in Längsrichtung magnetisiert.<\/p>\n<div data-fig=\"v3_joch\" data-cap=\"Abb. 3.10: Magnetisierung eines Stahlrohres mit zwei verschiedenen Fehlertypen (Bohrung und Längsriss)\"><\/div>\n<p>Damit im gesamten Rohr dieselbe Überlagerungspermeabilität gilt, muss die Feldstärke der Magnetisierungsspule hinreichend groß sein (Abb. 3.11). Für drei beliebig gewählte Orte des Rohres sollen – aufgrund der in 3.2.3.1 genannten Einflüsse – unterschiedliche magnetische Eigenschaften gelten. Bei zu kleiner Gleichfeldstärke sind die wirksamen Überlagerungspermeabilitäten noch verschieden. Erhöht man die Feldstärke so weit, dass alle drei Orte gesättigt sind, werden auch die Überlagerungspermeabilitäten ausreichend gleich, und es entstehen keine Störsignale.<\/p>\n<div data-fig=\"v3_vor\" data-cap=\"Abb. 3.11: Vormagnetisierung zur Angleichung der wirksamen Überlagerungspermeabilität an drei Orten 1, 2, 3\"><\/div>\n<p>Uneingeschränkt gilt das aber nur für fehlerfreie Bereiche. Befinden sich Inhomogenitäten im magnetisierten Volumen, können vor und hinter dem Fehler Zonen entstehen, die nicht voll gesättigt sind – <b>magnetische „Zwickel“<\/b> (Abb. 3.12).<\/p>\n<div data-fig=\"v3_zwickel\" data-cap=\"Abb. 3.12: Entstehung von magnetischen „Zwickeln“ im Fehlerbereich\"><\/div>\n<p>Diese Zwickel beeinflussen das Fehlersignal bei niedriger Magnetisierung entscheidend. Abb. 3.13 zeigt die Signale einer Bohrung und von Längsrissen unterschiedlicher Breite als Funktion der Vormagnetisierungsfeldstärke. Bei niedrigen Feldstärken durchläuft die Amplitude des Bohrungssignals Minima und Maxima und nähert sich erst bei sehr hohen Feldstärken einem Grenzwert. Bei Längsrissen tritt der Effekt weniger stark auf, weil sie den Feldlinien einen deutlich geringeren Widerstand entgegensetzen; abhängig von der Rissbreite steigt die Amplitude aber mit der Feldstärke mehr oder weniger an.<\/p>\n<div data-fig=\"v3_sig\" data-cap=\"Abb. 3.13: Signalhöhe in Abhängigkeit von der Vormagnetisierung (schematisch)\"><\/div>\n<div class=\"merke\">Die Magnetisierung muss so hoch gewählt werden, dass kleine Schwankungen der Magnetisierungsfeldstärke <b>keine merklichen Änderungen des Fehlersignals<\/b> mehr bewirken.<\/div>\n<p>Hält man das nicht ein und arbeitet mit relativ niedriger Vormagnetisierung, drohen instabile Arbeitspunkte mit starken Schwankungen von Signalamplitude und Phase – die Prüfung wird unzuverlässig und nicht reproduzierbar.<\/p>\n<div data-sim=\"premag\"><\/div>\n<p>Die dritte Methode – kleiner Sensor, hohe Frequenz – wird bei der Oberflächenprüfung mit Wirbelstromsonden (Tastsensoren) verwirklicht; meist arbeitet man dort ohne Vormagnetisierung. Permeabilitätsschwankungen wirken sich hier praktisch nicht aus, weil wegen der hohen Prüffrequenz nur eine sehr dünne Oberflächenschicht von den Wirbelströmen erfasst wird und die Sensorabmessung in der Größe der aufzufindenden Fehler liegt. Das Verhältnis<\/p>\n<div class=\"fm\"><span class=\"fr\"><span>erfasstes Materialvolumen<\/span><span>Fehlervolumen<\/span><\/span><\/div>\n<p>ist dadurch deutlich kleiner als z. B. bei Durchlaufspulen (Abb. 3.14), und μ<sub>Δ<\/sub>-Änderungen innerhalb des ohnehin gering erfassten Volumens erzeugen keine merklichen Störsignale.<\/p>\n<div data-fig=\"v3_vol\" data-cap=\"Abb. 3.14: Unterschiedliches Verhältnis von erfasstem Material- zu Fehlervolumen bei a) Durchlaufsensor, b) Tastsensor\"><\/div>\n<div class=\"merke\">Der Tastsensor ist <b>empfindlicher<\/b> als der Durchlaufsensor, weil sein Wechselwirkungsvolumen kleiner ist.<\/div>\n", "v4": "<h2>4.1 Einleitung<\/h2>\n<p>Wenn in der zerstörungsfreien Prüfung von Leitfähigkeitsmessung die Rede ist, meint man normalerweise die Messung der <b>elektrischen Leitfähigkeit<\/b> in MS/m oder in Prozent IACS. Einschränkend gilt: Mit dem Wirbelstromverfahren lässt sich die Leitfähigkeit <b>nur bei nichtferromagnetischen Werkstoffen<\/b> bestimmen.<\/p>\n\n<h2>4.2 Grundlagen<\/h2>\n<p>Bei aushärtbaren <b>Aluminiumlegierungen<\/b> besteht ein Zusammenhang zwischen dem Warmbehandlungszustand und der elektrischen Leitfähigkeit. Über die Leitfähigkeit lässt sich daher häufig der Warmbehandlungszustand beurteilen – und daraus wiederum auf mechanische Kennwerte wie <b>Härte<\/b> und <b>Festigkeit<\/b> schließen. (Dieser Zusammenhang gilt in dieser Form nur für Aluminium.)<\/p>\n\n<h3>4.2.1 Definition der elektrischen Leitfähigkeit<\/h3>\n<p>Die elektrische Leitfähigkeit σ ist der <b>Kehrwert des spezifischen Widerstandes<\/b> ρ:<\/p>\n<div class=\"fm\"><i>σ<\/i> = <span class=\"fr\"><span>1<\/span><span><i>ρ<\/i><\/span><\/span> = <span class=\"fr\"><span><i>L<\/i><\/span><span><i>R<\/i> · <i>A<\/i><\/span><\/span> &nbsp;<span class=\"u\">1 MS/m = 1 m / (Ω · mm²)<\/span><\/div>\n<p>(<i>L<\/i> Länge, <i>A<\/i> Querschnitt, <i>R<\/i> Widerstand des Leiterstücks). In der Luft- und Raumfahrtindustrie gibt man die Leitfähigkeit statt in MS/m häufig in <b>Prozent IACS<\/b> an (International Annealed Copper Standard). Dabei bildet Luft mit der Leitfähigkeit 0 % das eine Ende der Skala, geglühtes Reinkupfer mit 100 % das andere; alle anderen Leitfähigkeiten werden damit verglichen.<\/p>\n<div class=\"fm\">1 MS/m = 1,724 % IACS &nbsp;&nbsp;·&nbsp;&nbsp; 1 % IACS = 0,58 MS/m<\/div>\n<div class=\"tip\">Eine gute Eselsbrücke: Geglühtes Kupfer (100 % IACS) hat etwa 58 MS/m. Rechnet man Prozent in MS/m um, multipliziert man also mit 0,58; von MS/m in Prozent mit 1,724.<\/div>\n\n<h3>4.2.2 Standard-Eindringtiefe<\/h3>\n<p>Die Standard-Eindringtiefe ist die Tiefe, in der die Wirbelstromdichte auf 1/<i>e<\/i> (<i>e<\/i> = 2,7183) – das sind rund <b>37 %<\/b> – des Wertes an der Oberfläche abgefallen ist. Näherungsweise berechnet man sie so:<\/p>\n<div class=\"fm\"><i>δ<\/i> = <span class=\"fr\"><span>503<\/span><span>√(<i>f<\/i> · <i>σ<\/i> · <i>μ<\/i><sub>r<\/sub>)<\/span><\/span> &nbsp;<span class=\"u\">δ in mm · f in Hz · σ in MS/m<\/span><\/div>\n<p>Wird die Leitfähigkeit in % IACS angegeben, gilt entsprechend<\/p>\n<div class=\"fm\"><i>δ<\/i> = <span class=\"fr\"><span>660<\/span><span>√(<i>f<\/i> · <i>σ<\/i> · <i>μ<\/i><sub>r<\/sub>)<\/span><\/span> &nbsp;<span class=\"u\">σ in % IACS<\/span><\/div>\n<p>Aus den Formeln folgt: Die Standard-Eindringtiefe ist <b>umso kleiner, je größer Frequenz, Leitfähigkeit oder relative Permeabilität<\/b> werden.<\/p>\n<div data-vid=\"skin\"><\/div>\n<div data-sim=\"skin\"><\/div>\n\n<h3>4.2.3 Spulensysteme<\/h3>\n<p>Für die Leitfähigkeitsmessung sind <b>Tastsensoren in Absolutschaltung<\/b> üblich. Die Differenzschaltung ist möglich, wenn im <b>Fremdvergleich<\/b> gearbeitet wird; im Selbstvergleich geht sie nicht.<\/p>\n<p>Die Spulengröße hängt in erster Linie von der Prüffrequenz ab, ist aber deutlich größer als bei Spulen für die Fehlersuche. Das ist gelegentlich nachteilig, wenn an schwer zugänglichen Stellen gemessen werden muss; andererseits gleicht der größere erfasste Bereich örtliche Schwankungen besser aus.<\/p>\n\n<h3>4.2.4 Prüffrequenz<\/h3>\n<p>Die Ortskurve der Leitfähigkeiten in der Impedanzebene zeigt: Bei <b>niedrigen Frequenzen<\/b> lassen sich Werkstoffe mit <b>großer<\/b> Leitfähigkeit besser trennen, bei <b>höheren Frequenzen<\/b> Werkstoffe mit <b>geringer<\/b> Leitfähigkeit (Abb. 4.1).<\/p>\n<div data-fig=\"v4_ortsk\" data-cap=\"Abb. 4.1: Abhängigkeit der Punktposition auf der Ortskurve für die Leitfähigkeit von der verwendeten Prüffrequenz\"><\/div>\n<div class=\"merke\"><b>Regel:<\/b> Je niedriger die zu untersuchende Leitfähigkeit, desto höher sollte im Prinzip die Prüffrequenz sein.<\/div>\n<p>Leider kann man sich z. B. wegen unterschiedlicher Wanddicken nicht immer streng daran halten. Einfache Prüfgeräte besitzen Festfrequenzen: etwa <b>60 oder 100 kHz<\/b> für Leitfähigkeiten <i>κ<\/i> ≥ 5 MS/m (hier gilt die Bedingung Dicke = 3 Standard-Eindringtiefen) und <b>500 kHz<\/b> für <i>κ<\/i> ≤ 5 MS/m. Diese Geräte arbeiten üblicherweise mit Analoganzeige. Aufwendigere Geräte arbeiten digital und erlauben eine gewisse Frequenzwahl oder sind selbstadaptierend.<\/p>\n\n<h3>4.2.5 Justierkörper<\/h3>\n<p>Nach dem heutigen Stand der Technik kann kein Prüfgerät die elektrische Leitfähigkeit ohne vorherige Justierung genau anzeigen. Weil bei der Leitfähigkeitsmessung teils sehr enge Grenzen für Abnahmewerte gelten, sind die Anforderungen an die Anzeigegenauigkeit hoch: Schon Abweichungen von <b>0,2 MS/m<\/b> können zu Streitfällen zwischen Lieferant und Kunde führen, wenn die Werte im Grenzbereich der Abnahmevorschrift liegen. Deshalb müssen Leitfähigkeitsmessgeräte vor dem Einsatz justiert werden.<\/p>\n<p>Dazu braucht man genaue, <b>zertifizierte Justierkörper<\/b>, deren Werte auf elektrischem Weg ermittelt wurden. Die Zertifizierung soll sich bis zu einer behördlichen Institution zurückverfolgen lassen, z. B. der Physikalisch-Technischen Bundesanstalt (PTB). Weltweit wird angestrebt, diese Körper zu standardisieren.<\/p>\n<p>Standard-Justierkörper dürfen die Justierung weder durch geometrische Einflüsse noch durch zu geringe Dicke beeinflussen. Empfohlen werden daher:<\/p>\n<ul><li>ebene Platten, deren Durchmesser etwa <b>25 mm größer<\/b> ist als der Spulendurchmesser,<\/li><li>eine Dicke von mindestens der <b>dreifachen Standard-Eindringtiefe<\/b> der jeweiligen Messfrequenz,<\/li><li>keine Oberflächenbeschichtung und eine hohe Oberflächengüte.<\/li><\/ul>\n\n<h2>4.3 Zweck der Leitfähigkeitsmessung<\/h2>\n<p>Besonders in der Luft- und Raumfahrtindustrie ist die Leitfähigkeitsmessung ein wichtiges Werkzeug, um Informationen über den <b>Warmbehandlungszustand<\/b> zu gewinnen (nur bei Aluminium!). Außerdem erlaubt sie Entscheidungen<\/p>\n<ul><li>bei einer <b>Homogenitätsüberprüfung<\/b>,<\/li><li>im Rahmen der <b>Verwechslungsprüfung<\/b>,<\/li><li>bei der <b>Reinheitsgradbestimmung<\/b> verschiedener Metalle, z. B. der Bestimmung des Phosphorgehalts von Kupfer,<\/li><li>über die <b>Wiederverwendbarkeit<\/b> eines Bauteils nach einem Brandschaden.<\/li><\/ul>\n\n<h2>4.4 Messprinzip<\/h2>\n<p>Setzt man einen geeigneten Tastsensor auf das Prüfteil, ändert sich die Impedanz der Spule. Für verschiedene Leitfähigkeiten ergibt sich in der Impedanzebene eine <b>Ortskurve der Leitfähigkeiten<\/b>, die man zur Auswertung nutzt.<\/p>\n\n<h2>4.5 Anwendung<\/h2>\n<p>Damit die Leitfähigkeitsprüfung sinnvoll einsetzbar ist, müssen die Messergebnisse bei verschiedenen Materialzuständen deutliche Unterschiede zeigen. Man könnte sie gut mit einem Bildschirmgerät durchführen, das die Impedanzebene mit der Ortskurve darstellt: Die gesuchten Leitfähigkeiten werden mit passenden Justierkörpern auf dem Bildschirm markiert, Zwischenwerte interpoliert. Die Praxis zeigt aber, dass das wenig praktikabel ist – für Prüfer, die sich nur mit Leitfähigkeitsuntersuchungen befassen, ist die Bedienung eines Bildschirmgerätes oft kompliziert, und die Ablesegeschwindigkeit ist gering.<\/p>\n<p>Deshalb gibt es reine <b>Leitfähigkeitsmessgeräte<\/b>, die die Impedanzebene intern auswerten und bei richtiger Justierung die Leitfähigkeit direkt anzeigen (Abb. 4.2).<\/p>\n<div data-fig=\"v4_meter\" data-cap=\"Abb. 4.2: Modernes Leitfähigkeitsmessgerät mit direkter digitaler Anzeige der Leitfähigkeit in MS/m oder wahlweise in % IACS\"><\/div>\n<p>Leitfähigkeitswerte einiger Aluminiumlegierungen und ihrer Behandlungszustände enthält Tab. 4.1. Der Vergleich zeigt, dass in der Praxis erhebliche Schwierigkeiten auftreten können – die Wertebereiche benachbarter Zustände liegen oft dicht beieinander oder überlappen sogar.<\/p>\n<div class=\"tcap\"><b>Tab. 4.1:<\/b> Elektrische Leitfähigkeit einiger Aluminium-Halbzeuge (Angaben siehe Werkstoffleistungsblätter). Die Einheit der Leitfähigkeitsspalte ist im Skript nicht ausgewiesen; die Werte entsprechen % IACS. „–“ = kein Wert angegeben.<\/div>\n<div class=\"tw\"><table class=\"t\"><tr><th>Werkstoff<\/th><th>Spezifikation<\/th><th>Zustand<\/th><th>Härte<\/th><th>Leitfähigkeit<\/th><\/tr>\n<tr><td colspan=\"5\"><b>Bleche und Platten<\/b><\/td><\/tr>\n<tr><td rowspan=\"6\">Alclad 2024<\/td><td rowspan=\"6\">QQ-A-250/5<\/td><td>−T3, −T351<\/td><td>B52<\/td><td>29,0 – 32,5<\/td><\/tr>\n<tr><td>−T36<\/td><td>B55<\/td><td>–<\/td><\/tr><tr><td>−T4<\/td><td>B52<\/td><td>28,5 – 32,5<\/td><\/tr><tr><td>−T6<\/td><td>B55<\/td><td>37,0 – 41,0<\/td><\/tr><tr><td>−T81, −T851<\/td><td>B64<\/td><td>37,0 – 41,0<\/td><\/tr><tr><td>−T86<\/td><td>B72<\/td><td>–<\/td><\/tr>\n<tr><td rowspan=\"2\">Al-Legierung 6061<\/td><td rowspan=\"2\">QQ-A-250/11<\/td><td>−T4<\/td><td>H91<\/td><td>35,5 – 40,5<\/td><\/tr><tr><td>−T6, −T651<\/td><td>E85<\/td><td>40,0 – 45,0<\/td><\/tr>\n<tr><td rowspan=\"4\">Al-Legierung 7075<\/td><td>QQ-A-250/12<\/td><td>−T6, −T651<\/td><td>B63<\/td><td>30,5 – 34,5<\/td><\/tr>\n<tr><td rowspan=\"2\">MMS-152<\/td><td>−T73<\/td><td>–<\/td><td>38,0 – 43,0<\/td><\/tr><tr><td>−T76<\/td><td>–<\/td><td>37,0 – 39,0<\/td><\/tr><tr><td>MMS-159<\/td><td>−T73, −T7351<\/td><td>–<\/td><td>38,0 – 43,0<\/td><\/tr>\n<tr><td rowspan=\"2\">Alclad 7075<\/td><td>QQ-A-250/13<\/td><td>−T6, −T651<\/td><td>B76<\/td><td>30,5 – 34,5<\/td><\/tr><tr><td>QQ-A-250/18<\/td><td>−T6<\/td><td>–<\/td><td>30,5 – 34,5<\/td><\/tr>\n<tr><td rowspan=\"2\">Al-Legierung 7079<\/td><td rowspan=\"2\">QQ-A-250/17<\/td><td>−T6, −T651<\/td><td>B82<\/td><td>30,5 – 34,0<\/td><\/tr><tr><td>−T652<\/td><td>B82<\/td><td>30,5 – 34,0<\/td><\/tr>\n<tr><td rowspan=\"4\">Al-Legierung 7178<\/td><td>QQ-A-250/14<\/td><td>−T6, −T651<\/td><td>B86<\/td><td>30,0 – 34,0<\/td><\/tr><tr><td>MMS-152<\/td><td>−T76<\/td><td>–<\/td><td>37,0 – 39,0<\/td><\/tr><tr><td rowspan=\"2\">QQ-A-250/21<\/td><td>−T76<\/td><td>–<\/td><td>37,0 – 39,0<\/td><\/tr><tr><td>−T7651<\/td><td>–<\/td><td>37,0 – 39,0<\/td><\/tr>\n<tr><td rowspan=\"3\">Alclad 7178<\/td><td rowspan=\"3\">QQ-A-250/15<\/td><td>−T6, −T651<\/td><td>B78<\/td><td>30,0 – 34,0<\/td><\/tr><tr><td>−T6<\/td><td>B78 (plattierte Seite), B86 (blanke Seite)<\/td><td>–<\/td><\/tr><tr><td>−T76<\/td><td>–<\/td><td>37,0 – 39,0<\/td><\/tr>\n<tr><td colspan=\"5\"><b>Strangpressprofile<\/b><\/td><\/tr>\n<tr><td rowspan=\"3\">Al-Legierung 2014<\/td><td rowspan=\"3\">QQ-A-200/2<\/td><td>−T4, −T42<\/td><td>B60<\/td><td>31,5 – 35,0<\/td><\/tr><tr><td>−T6, −T62<\/td><td>B77<\/td><td>37,0 – 41,5<\/td><\/tr><tr><td>−T651<\/td><td>B77<\/td><td>37,0 – 41,5<\/td><\/tr>\n<tr><td rowspan=\"5\">Al-Legierung 2024<\/td><td rowspan=\"5\">QQ-A-200/3<\/td><td>−T361<\/td><td>B63<\/td><td>28,5 – 32,5<\/td><\/tr><tr><td>−T4<\/td><td>B63<\/td><td>28,0 – 32,5<\/td><\/tr><tr><td>−T6<\/td><td>B66<\/td><td>36,5 – 40,5<\/td><\/tr><tr><td>−T81<\/td><td>B68<\/td><td>–<\/td><\/tr><tr><td>−T851, −T8511<\/td><td>B68<\/td><td>–<\/td><\/tr>\n<tr><td rowspan=\"2\">Al-Legierung 6061<\/td><td rowspan=\"2\">QQ-A-200/8<\/td><td>−T4<\/td><td>E60<\/td><td>35,5 – 40,5<\/td><\/tr><tr><td>−T6, −T651<\/td><td>E85<\/td><td>40,0 – 45,0<\/td><\/tr><\/table><\/div>\n\n<h2>4.6 Einflussgrößen<\/h2>\n<div data-vid=\"tiefe\"><\/div>\n\n<p>Mehrere Einflussgrößen können die Messwerte so stark verändern, dass das Ergebnis erheblich verfälscht wird: die <b>Bauteildicke<\/b>, <b>Kanten und Krümmungen<\/b>, <b>Plattierungen und Beschichtungen<\/b> sowie die <b>Temperatur<\/b> während der Messung.<\/p>\n<div data-sim=\"condlab\"><\/div>\n\n<h3>4.6.1 Bauteildicke<\/h3>\n<p>Ist die Dicke des Bauteils kleiner als die Standard-Eindringtiefe, können sich die Wirbelströme nicht frei ausbreiten. In der Impedanzebene entsteht dann bei gleicher Leitfähigkeit eine <b>neue Ortskurve für geringe Wanddicken<\/b> (Abb. 4.3). Da das Messgerät diesen Effekt nicht berücksichtigt, kommt ein verfälschter Messwert zustande. Abhilfe: eine geeignete Frequenz wählen oder mehrere Schichten desselben Materials aufeinanderlegen.<\/p>\n<div data-fig=\"v4_dicke\" data-cap=\"Abb. 4.3: Ortskurve der Bauteildicke – bei dünnerem Material weicht der Messpunkt von der Leitfähigkeits-Ortskurve ab\"><\/div>\n\n<h3>4.6.2 Kanten und Krümmungen<\/h3>\n<p>Setzt man die Tastspule direkt neben einer Kante oder auf eine <b>konvex<\/b> gekrümmte Fläche, können sich die Wirbelströme nur eingeschränkt ausbreiten. Bei <b>konkav<\/b> gekrümmten Flächen breiten sich dagegen mehr Wirbelströme aus als in einer ebenen Platte. In beiden Fällen wird der Messwert verfälscht (Abb. 4.4).<\/p>\n<div data-fig=\"v4_kruemm\" data-cap=\"Abb. 4.4: Einfluss der Krümmung auf die Wirbelstromverteilung (a eben, b konvex, c konkav)\"><\/div>\n<p>Abhilfe ist nur durch Versuche möglich, weil Krümmungsradius, Frequenz und Sondendurchmesser zusammenspielen. Als grobe Richtlinie für den Niederfrequenzbereich gilt: Ohne Korrekturmaßnahmen kann die Leitfähigkeit gemessen werden bei<\/p>\n<ul><li><b>konkaven<\/b> Flächen mit Radius <i>r<\/i> &gt; 500 mm,<\/li><li><b>konvexen<\/b> Flächen mit Radius <i>r<\/i> &gt; 100 mm.<\/li><\/ul>\n\n<h3>4.6.3 Beschichtungen<\/h3>\n<p>Bauteile tragen oft eine elektrisch nicht leitende Beschichtung, z. B. Lack. Dann bewegt man sich in der Impedanzebene auf der <b>Ortskurve des Abstandes<\/b> (Lift-off) (Abb. 4.5). Je nach Gerät kann das den Messwert verfälschen. Abhilfe bietet eine Justierung mit einer entsprechenden Zwischenschicht.<\/p>\n<div data-fig=\"v4_abstand\" data-cap=\"Abb. 4.5: Einfluss des Abstandes auf die Wirbelstromdichte\"><\/div>\n\n<h3>4.6.4 Plattierungen<\/h3>\n<p>Aluminiumbleche für den Flugzeugbau sind aus Korrosionsschutzgründen oft mit Reinaluminium plattiert. Diese Schicht hat eine Leitfähigkeit von etwa <b>35 MS/m<\/b>, der Grundwerkstoff dagegen nur etwa <b>10 bis 28 MS/m<\/b>. Von Bedeutung ist aber allein der Warmbehandlungszustand des Grundwerkstoffs. Messtechnisch ergibt sich jedoch eine <b>Mischung beider Leitfähigkeiten<\/b>; angezeigt wird daher eine größere Leitfähigkeit, als der Grundwerkstoff hat. Einen vertrauenswürdigen Messwert erhält man erst nach Entfernen der Plattierschicht.<\/p>\n\n<h3>4.6.5 Temperatur<\/h3>\n<p>Die elektrische Leitfähigkeit der meisten Materialien hängt von der Temperatur ab; meist sinkt sie mit steigender Temperatur. Übliche Leitfähigkeitstabellen beziehen sich deshalb auf <b>20 °C<\/b>. Der mittlere Korrekturwert für Aluminiumlegierungen beträgt z. B. <b>0,0016 MS/m pro Grad Celsius<\/b>.<\/p>\n<p>Abweichende Temperaturen am Messort können zu falschen Messwerten führen – zumal sich auch die Widerstände der Messspulen ändern. Messgerät, Justierkörper, Sensor und Bauteil müssen daher bei Justierung und Messung alle die Umgebungstemperatur haben.<\/p>\n\n<h3>4.6.6 Korrelation zu den mechanischen Eigenschaften<\/h3>\n<p>Ergeben sich bei verschiedenen Warmbehandlungstemperaturen hinreichend große Leitfähigkeitsunterschiede, ist im Prinzip eine Korrelation zwischen Leitfähigkeit und mechanischer Festigkeit möglich. Eindeutig ist der Zusammenhang aber nicht immer – deshalb braucht man in jedem Fall ein geeignetes <b>Versuchsprogramm<\/b>, um festzustellen, ob überhaupt eine Korrelation besteht. Abb. 4.6 zeigt das Ergebnis einer solchen Untersuchung.<\/p>\n<div data-fig=\"v4_korr_al\" data-cap=\"Abb. 4.6: Korrelation zwischen Zugfestigkeit, Leitfähigkeit und Härte für eine Aluminiumlegierung in Abhängigkeit von der Warmbehandlungstemperatur (beispielhaft)\"><\/div>\n<p>Bei genauerem Hinsehen fällt eine <b>Doppeldeutigkeit<\/b> der Leitfähigkeit auf: Bei zwei verschiedenen Warmbehandlungstemperaturen tritt dieselbe Leitfähigkeit auf. Das Problem lässt sich nur mit zusätzlichen Messungen lösen. Da die Härte an den beiden Punkten deutlich verschieden ist, hilft hier eine ergänzende <b>Härteprüfung<\/b>. Manchmal tragen auch Anlassfarben zur Klärung bei. Die schlechteste Lösung ist eine zerstörende Prüfung: Sie ist wesentlich aufwendiger und müsste – weil das Bauteil selbst ja nicht zerstört werden soll – an mitbehandelten Probestäben erfolgen.<\/p>\n<div data-sim=\"ambig\"><\/div>\n<p>Ein zweites Beispiel zeigt die Korrelation zwischen Leitfähigkeit und mechanischen Eigenschaften bei einer <b>Titanlegierung<\/b> (Abb. 4.7). Hier ergibt sich ein eindeutiger Zusammenhang, der die Leitfähigkeitsprüfung als alleiniges Messverfahren zulässt.<\/p>\n<div data-fig=\"v4_ti1\" data-cap=\"Abb. 4.7: Korrelation zwischen Dehnung δ [%], Zugfestigkeit σ<sub>B<\/sub> und der elektrischen Leitfähigkeit κ der Titanlegierung Ti 8 Mn (MIL-T-9046, Typ III, Comp. A) bei verschiedenen Warmbehandlungstemperaturen\"><\/div>\n<p>Bei einer weiteren Titanlegierung gibt es einen solchen Zusammenhang dagegen nicht (Abb. 4.8).<\/p>\n<div data-fig=\"v4_ti2\" data-cap=\"Abb. 4.8: Keine Korrelation zwischen Dehnung δ [%], Streckgrenze σ_{0,2}, Zugfestigkeit σ<sub>B<\/sub> und der elektrischen Leitfähigkeit κ der Titanlegierung 3.7034.1 (MIL-T-9046, Typ I, Comp. B)\"><\/div>\n\n<h2>4.7 Mobile Härtemessung<\/h2>\n<p>Findet man keine befriedigende Korrelation zwischen Warmbehandlungsdaten und Leitfähigkeit, lässt sich der Werkstoffzustand gegebenenfalls durch eine <b>Härteprüfung<\/b> bestimmen. Die folgenden Bilder zeigen ein mobiles Härteprüfgerät, das sich gut für den Einsatz vor Ort eignet.<\/p>\n<div data-fig=\"v4_hard1\" data-cap=\"Abb. 4.9: Mobiles Härteprüfgerät (schematisch)\"><\/div>\n<div data-fig=\"v4_hard2\" data-cap=\"Abb. 4.10: Mobile Härteprüfung im Einsatz (schematisch)\"><\/div>\n\n<h2>4.8 Anhang<\/h2>\n<p>Die folgende Tabelle zeigt Leitfähigkeitsbereiche verschiedener Legierungen und Warmbehandlungszustände.<\/p>\n<div class=\"tcap\"><b>Tab. 4.2:<\/b> Leitfähigkeitsbereiche verschiedener Legierungen<\/div>\n<div class=\"tw\"><table class=\"t\"><tr><th>Werkstoff<\/th><th>Zustand<\/th><th>Leitfähigkeit in MS/m<\/th><th>Leitfähigkeit in % IACS<\/th><\/tr>\n<tr><td>Al-99,5<\/td><td><\/td><td>35<\/td><td>60<\/td><\/tr>\n<tr><td rowspan=\"2\">Al-2014<\/td><td>T3, T4<\/td><td>18 – 20<\/td><td>31 – 35<\/td><\/tr><tr><td>T6<\/td><td>21 – 24<\/td><td>37 – 42<\/td><\/tr>\n<tr><td rowspan=\"3\">Al-2024<\/td><td>T3, T351<\/td><td>14 – 19<\/td><td>28 – 33<\/td><\/tr><tr><td>T4<\/td><td>14 – 19<\/td><td>28 – 33<\/td><\/tr><tr><td>T6<\/td><td>21 – 24<\/td><td>36 – 41<\/td><\/tr>\n<tr><td rowspan=\"2\">Al-7075<\/td><td>T6, T651<\/td><td>17 – 20<\/td><td>30 – 35<\/td><\/tr><tr><td>T73<\/td><td>22 – 25<\/td><td>38 – 43<\/td><\/tr>\n<tr><td>Al-99<\/td><td><\/td><td>19 – 20<\/td><td>33 – 34<\/td><\/tr>\n<tr><td>Al-Li-Legierung<\/td><td><\/td><td>10,72<\/td><td>18,48<\/td><\/tr>\n<tr><td>Austenitischer Stahl<\/td><td><\/td><td>1,36<\/td><td>2,34<\/td><\/tr>\n<tr><td>Ti-Legierung<\/td><td><\/td><td>0,63<\/td><td>1,09<\/td><\/tr><\/table><\/div>\n", "v5": "<p>Wer zerstörungsfrei prüft, sollte sich vorher darüber klar werden, <b>was gefunden werden soll<\/b>. Der Fehlerkatalog eines Bauteils muss bekannt sein, damit ein Prüfverfahren gewählt werden kann, das auch zum Erfolg führt. Die Entstehung von Fehlern lässt sich grundsätzlich drei Bereichen zuordnen:<\/p>\n<div class=\"kv\"><b>1<\/b><span><b>Herstellung<\/b> – Gießen, Schmieden, Walzen<\/span><b>2<\/b><span><b>Bearbeitung<\/b> – Härten, Schleifen, Galvanisieren, Schweißen<\/span><b>3<\/b><span><b>Betrieb<\/b> – Ermüdung, Thermoschock<\/span><\/div>\n<h3>Entstehung von Fehlern während der Herstellung<\/h3>\n\n<h2>5.1 Gussteile<\/h2>\n<p>Gussteile entstehen, indem geschmolzener Werkstoff in Formen oder Kokillen abgegossen wird, erstarrt und so die gewünschten Abmessungen erhält (Abb. 5.1 bis 5.6).<\/p>\n<div data-fig=\"v5_cast\" data-cap=\"Abb. 5.1 / 5.2: Prinzipielle Darstellung eines Lunkers (Durchstrahlungsaufnahme) und Lunkerbildung im Bereich von Querschnittsübergängen\"><\/div>\n<p><b>Gase und Oxide.<\/b> Verbindet sich die Schmelze mit Sauerstoff und nimmt sie – wegen ihres höheren Lösungsvermögens – Gase aus der Ofenatmosphäre auf, entstehen Oxide. Sie zeigen sich entweder als <b>Einschlüsse<\/b>, oder das beim Erstarren wieder frei werdende Gas erzeugt <b>Poren<\/b>, Porositäten oder bestimmte Arten von <b>Mikrolunkern<\/b>.<\/p>\n<p><b>Seigerungen und Lunker.<\/b> Durch Entmischung beim Erstarren entstehen Seigerungen. Beim Abkühlen zieht sich das Material zusammen (Ausdehnungskoeffizient); dabei können Schwindungshohlräume – die <b>Lunker<\/b> – auftreten.<\/p>\n<p><b>Risse.<\/b> Bei ungünstiger Formgebung entstehen beim Erstarren außerdem Risse. Geschieht das im teigigen Zustand des abkühlenden Materials, spricht man vom <b>Warmriss<\/b>; ist die Schmelze bereits fest, vom <b>Schrumpfriss<\/b>.<\/p>\n<div data-fig=\"v5_warmriss\" data-cap=\"Abb. 5.3 / 5.4: Stahlguss – Anzeige eines unter der Oberfläche liegenden Warmrisses; Warmrisse im Querschnittsübergang (schematisch)\"><\/div>\n<div data-fig=\"v5_gear\" data-cap=\"Abb. 5.5: Stahlguss – mögliche Anzeigen in Zahnrädern und Laufrädern (schematisch)\"><\/div>\n<p><b>Kaltschweißstellen.<\/b> Wird eine Gussform von mehreren Stellen gespeist, vereinigen sich die Gussströme in der Form und füllen sie gemeinsam. Kühlt das zusammentreffende Material zu stark ab oder hat es sich mit einer Oxidhaut umgeben, verschmelzen die Gießströme nur teilweise. Diese Fehlstelle heißt <b>Kaltschweißstelle<\/b> (Abb. 5.6: teilweise unverschweißte Kernstütze in Stahlguss/Gusseisen).<\/p>\n<div data-fig=\"v5_kern\" data-cap=\"Abb. 5.6: Stahlguss, Gusseisen – Anzeige einer teilweise unverschweißten Kernstütze (schematisch)\"><\/div>\n\n<h2>5.2 Schmiedeteile<\/h2>\n<p>Ausgangsmaterial für ein Schmiedestück ist der zuvor gegossene Block, der als Ganzes oder in Teilen weiterverarbeitet wird (Abb. 5.7 bis 5.10). Alle genannten Gussfehler können deshalb auch hier auftreten. Dazu kommt: Im erwärmten Zustand wird das Material plastisch verformt. Aus dem ungerichtet erstarrten Gefüge entsteht ein in Verformungsrichtung gerichtetes Gefüge – die <b>Faser<\/b>. Alle schon im Gusszustand vorhandenen Fehler machen denselben Verformungsprozess mit: Aus eher volumenhaften Fehlern werden in Faserrichtung orientierte, <b>flächenhafte<\/b> Fehler, nämlich zeilig angeordnete Oxide oder Einschlüsse sowie <b>Flocken<\/b>, die auf Wasserstoffausscheidungen zurückgehen. Zusätzlich können <b>Schmiederisse<\/b> und <b>Überlappungen<\/b> entstehen.<\/p>\n<div data-fig=\"v5_welle\" data-cap=\"Abb. 5.7: Schmiedeteile: Wellen, Achsen – a Längsriss, b Dauerbruchanriss (Umlaufbiegung), c Dauerbruchanriss (Torsion), d Schlackenzeile, e Seigerungszeile, f Schmiedefalte, g Kernzerschmiedung (Schmiedekreuz)\"><\/div>\n<div data-fig=\"v5_kurbel\" data-cap=\"Abb. 5.8: Gesenkgeschmiedete Kurbelwellen – a Schlackenzeilen, Seigerungen, b Härterisse, c Dauerbruchanriss, d Risse, e Schleifrisse, f Schmiedefalte\"><\/div>\n<div data-fig=\"v5_pleuel\" data-cap=\"Abb. 5.9: Gesenkgeschmiedete Pleuel – a Risse in der Gratnaht außen, b Riss in der Gratnaht innen, c Querrisse im Steg, d Querrisse im kleinen Auge, e Schmiedefalte, Riss\"><\/div>\n<div data-fig=\"v5_zahnkranz\" data-cap=\"Abb. 5.10: Schmiedeteil Zahnkranz – a Schleifrisse, b Schmiedefalte, c Dauerbruchanriss, d Härterisse, e Risse\"><\/div>\n\n<h2>5.3 Walzerzeugnisse<\/h2>\n<p>Ausgangspunkt ist wieder der Gusszustand mit allen vorhandenen Fehlern, gegebenenfalls eine vorgeschmiedete Form. Beim Walzen tritt nur noch eine <b>längsgerichtete<\/b> Verformung auf: Fast alle Fehlstellen nehmen deshalb eine zur Längsachse parallele Form an. Typische Fehler sind <b>Schlackenzeilen<\/b> und <b>Säume<\/b>. Gelegentlich treten Querfehler auf, in Form von Falten oder Überlappungen durch überwalztes Material.<\/p>\n<h3>Bleche<\/h3>\n<p>Auch im Blech sind alle Gussfehler vorhanden. Durch die sehr starke Verformung in einer Richtung nehmen sie teils sehr große flächenhafte Ausdehnungen an. Als typischer Blechfehler gilt die <b>Dopplung<\/b>, die aus verformten Hohlräumen wie Lunkern und Gasblasen entsteht. Mit Eindring- oder Magnetpulverprüfung findet man sie nur an den Blechkanten.<\/p>\n<div data-fig=\"v5_blech\" data-cap=\"Abb. 5.11: Walzerzeugnisse, Bleche, Profile – a Dopplungen, b Einschlüsse, Seigerungen, c Risse, d Überwalzungen, e Riefen, f Aufplatzungen, Risse\"><\/div>\n<div data-fig=\"v5_rohr\" data-cap=\"Abb. 5.12: Walzerzeugnisse Rohre – a Längsrisse, b Schmiedefalten, Überwalzung, c Einschluss, d Riefen, e Pilgerfehler (meist periodisch)\"><\/div>\n<div data-fig=\"v5_zeit\" data-cap=\"Abb. 5.13: Walzerzeugnisse, Rohre – Zeitstandrisse (schematisch)\"><\/div>\n\n<h2>5.4 Fehler, die bei der Bearbeitung entstehen<\/h2>\n<p>Beim Bearbeiten der Erzeugnisformen zum Fertigteil entsteht Fehlerbildung auf völlig andere Weise: Meist sind es <b>Spannungen<\/b>, die zum Fehler führen. Der Abbau dieser Spannungen erfolgt normalerweise an der schwächsten Stelle (Querschnitt, Festigkeit) und endet im Riss. Je nach Bearbeitungsverfahren entstehen folgende Fehler:<\/p>\n<h4>Härten (Abb. 5.8 + 5.10)<\/h4>\n<p>Das Ausdehnen und plötzliche Zusammenziehen beim Abschrecken erzeugt erhebliche Spannungen. An Querschnittsänderungen entstehen dadurch meist gerade oder leicht geschwungene <b>Härterisse<\/b>.<\/p>\n<h4>Schleifen (Abb. 5.8 + 5.10)<\/h4>\n<p>Der Materialabtrag mit rotierenden Schleifscheiben belastet die Berührungslinie von Scheibe und Werkstück teils sehr hoch thermisch. Typisch für <b>Schleifrisse<\/b> sind: meist <b>größere Anzahl<\/b>, <b>nicht allzu große Länge<\/b> und <b>Orientierung quer zur Schleifrichtung<\/b>. Treten auch Risse in anderen Richtungen auf, sind zusätzliche Spannungen im Werkstück vorhanden, z. B. durch eine Warmbehandlung.<\/p>\n<h4>Galvanisieren<\/h4>\n<p>Sind im Werkstück Spannungen aus vorhergehender spanender oder spanloser Verformung vorhanden, kann eine Behandlung mit oberflächenangreifenden Medien – z. B. Säuren – zu <b>Spannungsrisskorrosion<\/b> führen, die sich in deutlich sichtbarer Rissbildung äußert. Auch die <b>interkristalline Korrosion<\/b> geht auf beizende Medien zurück: Die Korngrenzen werden teilweise herausgelöst, und es entsteht ein netzartiges, rissähnliches Bild.<\/p>\n\n<h2>5.5 Schweißen<\/h2>\n<p>Beim Schweißen wird das zu verbindende Material schmelzflüssig und unterliegt damit mehr oder weniger denselben Bedingungen wie ein Gussteil (Abb. 5.14 bis 5.16). Es können <b>Poren<\/b>, <b>Einschlüsse<\/b> und <b>Schlacken<\/b> auftreten. Beim Abkühlen nach dem Schweißen und nach einer Wärmebehandlung können außerdem <b>Risse<\/b> entstehen, ebenso Spannungen in verschiedensten Richtungen, die zu Rissen führen.<\/p>\n<p><b>Endkraterrisse<\/b> entstehen dort, wo die Schweißung endet und ein größeres Schmelzbad plötzlich erstarrt. Durch die Abkühlung nach allen Seiten bildet sich hier oft ein sternförmiges Rissbild.<\/p>\n<div data-fig=\"v5_h2riss\" data-cap=\"Abb. 5.14: Typische Anordnung wasserstoffinduzierter Risse (WEZ = Wärmeeinflusszone)\"><\/div>\n<div data-fig=\"v5_naht\" data-cap=\"Abb. 5.15: Schweißnähte – a Längsriss, b Flankenbindefehler, c Querrisse, d Endkraterriss, e Poren\"><\/div>\n<div data-fig=\"v5_lamell\" data-cap=\"Abb. 5.16: Lamellarrisse unter einem doppelseitigen T-Stoß\"><\/div>\n<p>Mangelhaftes Aufschmelzen der Schweißkanten führt zu <b>Bindefehlern<\/b> und damit zu ungenügender Festigkeit der Verbindung. Diese Fehlerart liegt meist unter der Oberfläche. Bei unsachgemäßem Aufschmelzen der ersten Schweißlage können <b>Wurzelfehler<\/b> entstehen.<\/p>\n\n<h2>5.6 Fehler, die beim Betrieb entstehen<\/h2>\n<p>Durch die Beanspruchung im Betrieb entsteht eine weitere Fehlergruppe. Diese Fehler sind <b>immer Risse<\/b> und treten an Stellen hoher Beanspruchung oder Kerbwirkung auf. Auslöser sind oft übersehene Fehler aus der Erzeugnisform oder der Bearbeitung.<\/p>\n<h4>Ermüdungsrisse (Abb. 5.5, 5.7, 5.8, 5.10, 5.17)<\/h4>\n<p>Dynamische Belastung lässt in mehreren Stufen langsam einen Riss entstehen. Auf der Bruchfläche erkennt man die Belastung an <b>Rastlinien<\/b>, die den Rissfortschritt markieren. Reicht die Restfestigkeit wegen des fortschreitenden Risses nicht mehr aus, kommt es zum <b>Gewaltbruch<\/b> – das Bauteil ist dann endgültig zerstört.<\/p>\n<h4>Thermoschockrisse (Abb. 5.16 bis 5.19)<\/h4>\n<p>Ähnlich entstehen durch wechselnde thermische Belastung fortschreitende Thermoschockrisse. Auch sie führen bei genügender Schwächung des Querschnitts zuletzt zum Gewaltbruch.<\/p>\n<div class=\"merke\">Bei der Prüfung im Rahmen einer Überholung (Revision) muss man also <b>Risse<\/b> suchen – und diese gehen mit ganz wenigen Ausnahmen <b>von der Oberfläche<\/b> aus.<\/div>\n<div data-fig=\"v5_thermo1\" data-cap=\"Abb. 5.16 (Rohre): Walzerzeugnisse, Rohre – Thermoschockrisse\"><\/div>\n<div data-fig=\"v5_schaufel\" data-cap=\"Abb. 5.17: Gesenkgeschmiedete Turbinenschaufel – a Ermüdungsriss, b Thermoschockriss (Flugzeugtriebwerk)\"><\/div>\n<div data-fig=\"v5_luftzug\" data-cap=\"Abb. 5.18 / 5.19: Schweißnaht – Risse durch schockartiges Abkühlen nach dem Schweißen (Luftzug!); Walzerzeugnisse – Thermoschockrisse\"><\/div>\n<div data-sim=\"atlas\"><\/div>\n", "v6": "<h2>6.1 Einleitung<\/h2>\n<p>Eine wesentliche Aufgabe der Wirbelstromprüfung ist es, bei <b>Wiederholungsprüfungen<\/b> die weitere Funktionsfähigkeit von Bauteilen sicherzustellen. Zwar wird auch bei der Neuteilfertigung mit Wirbelstrom geprüft, doch dürfte die Prüfung bei der <b>Wiederinstandsetzung<\/b> – vor allem in der Luft- und Raumfahrt – prozentual einen erheblich größeren Umfang haben. Beispiele aus der Neuteilfertigung sind die Prüfung dünnwandiger austenitischer Rohre, die Prüfung von Verdichter- und Turbinenlaufscheiben und gelegentlich Verwechslungsprüfungen.<\/p>\n<p>Alle Beispiele stammen aus dem Luftfahrtbereich, sind aber ohne Weiteres auf andere Bereiche übertragbar.<\/p>\n\n<h2>6.2 Schadensarten<\/h2>\n<h3>6.2.1 Risse<\/h3>\n<p>Risse entstehen dort, wo gegenüber der Umgebung eine erhöhte Spannung auftritt. Beispiele:<\/p>\n<ul><li><b>Verdichter- und Turbinenscheiben<\/b> werden sehr unterschiedlich beansprucht. Am höchsten ist die Beanspruchung normalerweise in der <b>Nabenzone<\/b>; Rissbildung dort führt innerhalb weniger Starts zum Ausfall des Bauteils – mit meist katastrophalen Folgen.<\/li>\n<li>Der <b>Scheibenbereich<\/b> selbst ist relativ gering beansprucht. Ausnahme sind die <b>Bolzenbohrungen<\/b>, die jeweils Orte der Spannungskonzentration sind.<\/li>\n<li>Der <b>Schaufelaufnahmebereich<\/b> ist wegen der hohen Kerbwirkung ebenfalls rissgefährdet.<\/li><\/ul>\n<p>Bei Überholungen prüft man daher die kritischen Bereiche mit Wirbelstrom. Das restliche Bauteil ist mit einer geeigneten fluoreszierenden Eindringprüfung und einer Sichtprüfung ausreichend untersucht.<\/p>\n<h3>6.2.2 Thermoschockrisse<\/h3>\n<p>Turbinenschaufeln sind thermisch sehr stark beansprucht. Besonders an den <b>Schaufelkanten<\/b> können Thermoschockrisse entstehen. Bei der Wirbelstromprüfung beschränkt man sich deshalb – auch weil es so schnell geht – auf die Schaufelkanten; für das übrige Teil gilt das zuvor Gesagte.<\/p>\n<h3>6.2.3 Korrosion<\/h3>\n<p>Korrosion betrifft bei der Wirbelstromprüfung eher die <b>Flugzeugzelle<\/b>. Das Problem sind Korrosionen zwischen überlappenden Blechen, die für andere Prüfverfahren normalerweise unzugänglich sind. Korrosion schwächt nicht nur die Blechdicke: Es entstehen auch Korrosionsprodukte, die wegen ihres größeren Volumens die Bleche auseinanderdrücken – man spricht von <b>Aufbeulung<\/b>. Solche Bereiche sind besonders rissgefährdet. Gelegentlich treten, ebenfalls durch Korrosion verursacht, Risse <b>parallel zur Oberfläche<\/b> auf. Mit den üblichen Tastsonden findet man sie nicht; nur speziell entwickelte Sensoren erkennen sie, und die Rissfläche darf nicht zu klein sein.<\/p>\n<h3>6.2.4 Schweißnahtrisse<\/h3>\n<p>Schweißnähte lassen sich meist nicht mit dem in der Luft- und Raumfahrt geforderten Fehlernachweisvermögen prüfen, weil sie zu uneben sind. Werden solche Forderungen gestellt, müssen die Nähte auf <b>Automaten<\/b> geschweißt werden, oder die Nahtoberfläche bzw. Wurzelseite muss <b>nachträglich mechanisch bearbeitet<\/b> werden.<\/p>\n<h3>6.2.5 Nietnahtrisse<\/h3>\n<p>Nietnähte sind im Zellenbau ein wichtiges Verbindungselement. Im Lauf der Beanspruchung können von den Nietlöchern ausgehend Risse entstehen, die später die Nietlöcher miteinander verbinden.<\/p>\n\n<h2>6.3 Durchführung der Prüfung<\/h2>\n<div data-sim=\"scan\"><\/div>\n<h3>6.3.1 Prüfung von Flächen<\/h3>\n<p>Flächen, wie sie an Verdichter- und Turbinenscheiben im Nabenbereich vorkommen, lassen sich sehr gut mit <b>Einfachdifferenzsensoren<\/b> prüfen: Die Risse entstehen etwa senkrecht zur Tangentialspannung und verlaufen damit radial-axial. Da ein sehr hohes Fehlernachweisvermögen verlangt wird, setzt man Frequenzen von <b>1 MHz und höher<\/b> ein.<\/p>\n<h3>6.3.2 Prüfung von Bohrungen<\/h3>\n<p>Bohrungen sind häufig Ausgangspunkte von Rissen. Wegen der auftretenden Spannungen sind auch hier Risse in radial-axialer Richtung zu erwarten. Man prüft zweckmäßig mit <b>Rotiersensoren in Differenzschaltung<\/b>, die ein motorischer Rotor – meist mit <b>3000 U/min<\/b> – antreibt. Oft arbeitet man mit <b>0,5 MHz<\/b>; bei sehr kleinen Bohrungen ab 3 mm Durchmesser abwärts empfiehlt sich <b>2 MHz<\/b>, weil die Signale dann wesentlich störungsfreier darzustellen sind.<\/p>\n<div data-sim=\"bore\"><\/div>\n<h3>6.3.3 Prüfung von Schaufelkanten<\/h3>\n<p>Durch Temperatureinflüsse entstandene Risse an Schaufelkanten verlaufen meist etwa <b>senkrecht zur Kante<\/b>. Das legt eine Prüfung mit Differenzsensoren nahe. Dafür wurden spezielle <b>Mehrfachdifferenzsensoren<\/b> entwickelt, die auch sehr kleine Risse anzeigen, aber auf geometrische Änderungen wenig reagieren. Auch speziell angepasste <b>Ringkernsensoren<\/b> kommen in Frage; sie sind wesentlich kleiner und kommen daher näher an den Übergangsradius zwischen Schaufelblatt und Plattform heran. Die Prüffrequenz liegt je nach Anwendung zwischen <b>0,5 und 2,0 MHz<\/b>.<\/p>\n<p>Ein Sonderfall ist die <b>Sulfidation<\/b>: ein Korrosionsprodukt aus der Verbindung von Nickel und Schwefel bei sehr hohen Temperaturen, das praktisch keine Festigkeit besitzt. Vor allem hohle Turbinenschaufeln können innen großflächig angegriffen sein, was im fortgeschrittenen Stadium zum Schaufelbruch führen kann. Da Nickelsulfid <b>ferromagnetisch<\/b> ist, zeigt sich in der Impedanzebene eine erhebliche Phasendrehung – die Sulfidation ist daher leicht zu erkennen. Abb. 6.1 zeigt die vollständige Impedanzebene mit den zugehörigen Rissen im ferromagnetischen und nichtferromagnetischen Anteil.<\/p>\n<div data-fig=\"v6_impl\" data-cap=\"Abb. 6.1: Darstellung der vollständigen Impedanzebene (nichtferromagnetischer und ferromagnetischer Anteil, schematisch)\"><\/div>\n<h3>6.3.4 Korrosionsprüfung<\/h3>\n<p>An verklebten oder genieteten Strukturen im Zellenbereich kann Korrosion auftreten. Der korrodierte Bereich liegt häufig <b>zwischen den Blechen<\/b>; dort sammeln sich Korrosionsprodukte in Form von Aluminiumoxid an, die das dünne Blech aufbeulen können. Man stellt damit mindestens zwei Erscheinungen fest:<\/p>\n<ul><li>Wanddickenverminderung durch Oberflächenabtrag,<\/li><li>eventuell Rissbildung im korrodierten Bereich,<\/li><li>möglicherweise auch Schichtkorrosion.<\/li><\/ul>\n<p>Durch die Schwächung der tragenden Struktur verringert sich zugleich der elektrisch leitende Querschnitt – und damit wird die Korrosion für die Wirbelstromprüfung zugänglich. Ist die Eindringtiefe des Wirbelstromfeldes <b>geringfügig größer<\/b> als die Dicke des zu prüfenden Bereichs, werden Dickenschwankungen sehr empfindlich angezeigt. Sowohl die Wanddickenschwächung samt Korrosionsprodukten als auch die Aufbeulung verändern die Spulenimpedanz, und zwar bei <b>unterschiedlichen Phasenwinkeln<\/b>. Abb. 6.2 zeigt ein Bildschirmsignal mit richtig eingestellter Frequenz.<\/p>\n<div data-fig=\"v6_korr\" data-cap=\"Abb. 6.2: Bildschirmsignal einer Korrosion mit unterschiedlichem Abtrag (10 %, 20 %, 30 %) und Aufbeulung\"><\/div>\n<h4>Geräte und Prüfbedingungen<\/h4>\n<p>Prinzipiell geht die Prüfung auch mit Zeigergeräten; wesentlich vorteilhafter sind aber <b>Bildschirmgeräte mit frei wählbarer Frequenz<\/b>, weil sich die Impedanzebene damit in der gewünschten Form darstellen lässt. Da gleichmäßiger Korrosionsabtrag gemessen werden soll, sind <b>Absolutspulen<\/b> erforderlich; Differenzspulen sind ungeeignet.<\/p>\n<p>Die Bildschirmdarstellung wird so gewählt, dass der <b>Lift-off nach links<\/b> und das <b>Korrosionssignal in Y-Richtung<\/b> verläuft. Das Aufbeulungssignal soll spiegelbildlich zum Lift-off <b>nach rechts<\/b> laufen – dafür wählt man eine geeignete Frequenz. Das Tiefpassfilter muss so eingestellt sein, dass bei Handführung des Sensors über das Blech das Nutzsignal nicht beeinträchtigt wird. Abb. 6.3 zeigt die Abhängigkeit der Bildschirmdarstellung von der Frequenz.<\/p>\n<div data-fig=\"v6_freq\" data-cap=\"Abb. 6.3: Frequenzeinfluss bei der Korrosionsprüfung (zu niedrig, passend, zu hoch)\"><\/div>\n<h4>Prüftechnik<\/h4>\n<p>Zur Justierung dienen spezielle Justierkörper mit <b>ausgefrästen Bereichen<\/b>, die rückseitigen Korrosionsabtrag simulieren. Für <b>jede Blechdicke<\/b> ist ein eigener Justierkörper nötig. Der Abtrag beginnt bei 5 % und wird je nach Bedarf in Stufen von 5 % oder 10 % gesteigert. Farbschichten über 50 µm simuliert man mit nichtleitenden Folien, wie man sie auch für die Schichtdickenmessung nutzt; <b>Farbschichten unter 50 µm<\/b> kann man außer Acht lassen.<\/p>\n<p>Die Frequenz wird so eingestellt, dass eine Darstellung nach Abb. 6.3 entsteht. Danach erstellt man eine <b>Kalibrierkurve<\/b> mit vier gut abgestuften Messpunkten, die durch eine Interpolationslinie verbunden werden (Abb. 6.4).<\/p>\n<div data-fig=\"v6_kal\" data-cap=\"Abb. 6.4: Kalibrierkurve – Signalhöhe über dem Korrosionsabtrag\"><\/div>\n<p>Weil die metallische Struktur <b>hinter<\/b> der zu prüfenden Wanddicke das Ergebnis stark beeinflusst, braucht man zusätzlich eine <b>Referenzkurve<\/b>. Man erstellt sie, indem man den Justierkörper auf Bleche legt, die den tatsächlichen Strukturaufbau nachbilden. Für die Klebschichtdicke legt man Folien entsprechender Dicke zwischen Justierkörper und die dahinterliegenden Bleche. Die interessierenden Abtragsbereiche werden erneut ausgemessen und in das vorherige Diagramm eingetragen (Abb. 6.5).<\/p>\n<div data-fig=\"v6_ref\" data-cap=\"Abb. 6.5: Referenzkurve für die Bestimmung des Korrosionsabtrages (mit Strukturaufbau hinter dem Blech)\"><\/div>\n<p>Aufbeulungssignale prüft man, indem man den Justierkörper bei aufgesetztem Sensor leicht von der Unterlage abhebt. Durch geeignete Frequenzwahl muss dabei eine Darstellung nach Abb. 6.3 erzielt werden.<\/p>\n<div data-sim=\"korr6\"><\/div>\n\n<h3>6.3.5 Prüfung von Nietnähten<\/h3>\n<p>Bei der Nietnahtprüfung muss man grundsätzlich unterscheiden, ob die Nieten <b>entfernt<\/b> sind oder <b>vorhanden<\/b> bleiben.<\/p>\n<h4>Direkte Prüfung von Nietlöchern<\/h4>\n<p>Sind die Nieten entfernt, kann man eine <b>dynamische Bohrungsprüfung mit Rotiersensoren<\/b> durchführen. Vorteile: ein erheblich größeres Fehlernachweisvermögen als bei der indirekten Methode und eine relativ gute Vorschubgeschwindigkeit. Durch <b>Triggerung<\/b> lässt sich das Messsignal dem Rissort zuordnen. Mit speziellen Filtereinstellungen unterscheidet man Risssignale besser von Störsignalen:<\/p>\n<ul><li><b>Hochpassfilter<\/b> lassen nur kurze Impulse durch und sind bei dieser dynamischen Prüfung normal.<\/li><li><b>Bandpassfilter<\/b> lassen nur ein gewähltes Frequenzband durch. Sie dienen oft der „Kosmetik“ des Signals, weil die Anzeige symmetrisch dargestellt werden kann – sie neigen allerdings zum Nachschwingen.<\/li><\/ul>\n<p>Bei Rotorprüfgeräten muss die Prüffrequenz deutlich <b>oberhalb der Rotierfrequenz<\/b> liegen. Rotoren gibt es für verschiedene Frequenzbereiche; sie sind dann auch in diesem Bereich zu betreiben. Die Rotiersensoren sollen im Verhältnis zur Bohrung <b>nicht zu klein<\/b> sein, weil sonst der Abhebeeffekt unterschiedlich groß ist – am Bohrungsumfang prüft man dann mit unterschiedlicher Empfindlichkeit. Benutzt man Teflonklebeband zum Schutz von Bohrung und Sensor, sollte der Spulendurchmesser höchstens <b>0,3 mm<\/b> kleiner als der Bohrungsdurchmesser sein.<\/p>\n<h4>Justierkörper<\/h4>\n<p>Für die Bohrungsprüfung gibt es viele Justierkörper; zwei typische Ausführungen:<\/p>\n<div class=\"def\"><b>Typ 1: Platte<\/b> mit den erforderlichen Bohrungen, in denen sich jeweils eine funkenerosiv hergestellte Nut befindet.<br>Nutabmessungen: Breite 0,15 mm · Tiefe 0,5 mm · Länge = Plattendicke<\/div>\n<div data-fig=\"v6_typ1\" data-cap=\"Abb. 6.6: Platte mit axialen Schlitzen in Bohrungen verschiedenen Durchmessers\"><\/div>\n<div class=\"def\"><b>Typ 2: Platte mit Oberflächennuten<\/b> – ähnlich wie Typ 1, aber die Nut wurde von der Stirnseite der Bohrungen eingebracht.<br>Nutabmessungen: Breite 0,2 mm · Tiefe 1,0 mm · Länge über die gesamte Plattenlänge<\/div>\n<div data-fig=\"v6_typ2\" data-cap=\"Abb. 6.7: Platte vom Typ 2\"><\/div>\n<h4>Indirekte Prüfung von Nietlöchern<\/h4>\n<p>Können die Nieten nicht entfernt werden, wird es schwieriger: Ein Riss kann verdeckt oder in der nächsten Lage liegen und ist für andere ZfP-Verfahren nicht mehr zugänglich. Abb. 6.8 zeigt einen solchen Strukturaufbau.<\/p>\n<div data-fig=\"v6_niet\" data-cap=\"Abb. 6.8: Nietnahtprüfung an einer Flugzeugstruktur\"><\/div>\n<p>Man muss versuchen, mit einem Wirbelstromsensor von der Oberfläche aus in die zweite Lage oder tiefer vorzudringen; die erforderliche Eindringtiefe bestimmt die Frequenz. Man darf aber nicht dasselbe Fehlernachweisvermögen erwarten wie bei der direkten Bohrungsprüfung.<\/p>\n<p>Bei <b>gesenkten Nietköpfen<\/b> lassen sich die Nietnähte sehr gut mit <b>Mehrfachdifferenzsensoren von Hand<\/b> prüfen: Man fährt über mehrere Nietteilungen hinweg und beobachtet die typischen Bewegungen des Leuchtpunktes auf dem Bildschirm. Diese charakteristischen Ortskurven unterscheiden sich deutlich von denen rissbehafteter Nietlöcher. Eine Erleichterung bieten <b>Linearschwinger<\/b>: Der Sensor schwingt in einer Achse hin und her und erhält so eine definierte Prüfgeschwindigkeit, was auch eine Hochpassfilterung ermöglicht. Die Schwingbewegung läuft senkrecht zur Verbindungslinie der Nieten, die seitliche Verschiebung von Niete zu Niete erfolgt von Hand oder per Stellmotor.<\/p>\n<p>Bei <b>überstehenden Nietköpfen<\/b> braucht man spezielle <b>Nietkopfsensoren<\/b>, meist ein ringförmiger Ferritkern mit aufgewickelter Spule. Die Ringöffnung passt genau über den Nietkopf; geprüft werden soll nicht die Niete, sondern das umgebende Material – deshalb muss jeder Nietbereich einzeln geprüft werden. Wegen der teils nötigen hohen Eindringtiefe arbeitet man im <b>Niederfrequenzbereich<\/b>. Bei <b>Stahlnieten in Aluminiumstrukturen<\/b> kann man die Niete nutzen, um das magnetische Wechselfeld des Sensors in die Tiefe zu leiten – mit größerer Tiefenwirkung in unmittelbarer Nähe der Niete.<\/p>\n<h4>Fehlerbeispiele bei der Nietlochprüfung<\/h4>\n<div data-fig=\"v6_ftypen\" data-cap=\"Fehlertypen I bis V bei der Nietlochprüfung (schematische Querschnitte)\"><\/div>\n<div class=\"tw\"><table class=\"t\"><tr><th>Typ<\/th><th>Beschreibung<\/th><\/tr>\n<tr><td><b>I<\/b><\/td><td>Entstand sicher bei der Fertigung. Wahrscheinlich ein stehengebliebener Rest der kleineren Vorbohrung für das Nietloch – immer nur eine Ansenkung in der oberen Blechlage. Die Durchstrahlungsprüfung zeigt einen halbkreisförmigen Verlauf.<\/td><\/tr>\n<tr><td><b>II<\/b><\/td><td>Ebenfalls sicher aus der Fertigung: stehengebliebene Reste der kleineren Vorbohrung, die teilweise über die ganze Blechdicke reichen.<\/td><\/tr>\n<tr><td><b>III<\/b><\/td><td>Entstand beim Entfernen der Niete zu Inspektionszwecken: Ziehriefen in axialer Richtung des Nietlochs.<\/td><\/tr>\n<tr><td><b>IV<\/b><\/td><td>Vermutlich auf unsymmetrisches Schlagen der Niete zurückzuführen.<\/td><\/tr>\n<tr><td><b>V<\/b><\/td><td>Entstand sicher bei der Herstellung des Nietlochs: Die in den einzelnen Blechen schon auf Nietdurchmesser gebohrten Löcher passten beim Zusammenbau nicht und wurden deshalb gemeinsam aufgebohrt – daher auch die teils sehr großen Bohrriefen.<\/td><\/tr><\/table><\/div>\n", "v7": "<h2>7.1 Justierung<\/h2>\n<p>Das Prüfsystem muss <b>vor jeder Prüfung<\/b>, bei <b>Änderungen der Prüfparameter<\/b> und in <b>bestimmten zeitlichen Abständen<\/b> (z. B. alle 4 Stunden oder bei Schichtbeginn bzw. Schichtwechsel) justiert werden – oder zumindest muss die Justierung kontrolliert werden. Sie umfasst grundsätzlich:<\/p>\n<ul><li>Sensoreinstellung und Abgleich,<\/li><li>Einstellung der Empfindlichkeit.<\/li><\/ul>\n<div class=\"def\"><b>Justieren<\/b> heißt, ein Messgerät so einzustellen oder abzugleichen, dass die Messabweichungen möglichst klein werden oder die Fehlergrenzen des Messgerätes nicht überschritten werden. Das Justieren erfordert einen Eingriff, der das Messgerät – meist bleibend – verändert.<\/div>\n<p>Dabei benutzt man „Testkörper“, die eine reproduzierbare Prüfung ermöglichen bzw. mit denen ein festgelegtes Fehlernachweisvermögen erreicht wird. Leider verwenden verschiedene Normen derzeit unterschiedliche Bezeichnungen für den Testkörper. Neben dem allgemeinen Begriff <b>Justierkörper<\/b> findet man, teils mit bestimmten Aufgabengebieten:<\/p>\n<ul><li>Vergleichskörper (Empfindlichkeitseinstellung)<\/li><li>Kalibrierkörper (Gerätebewertung)<\/li><li>Kontrollkörper<\/li><li>Bezugskörper<\/li><li>Referenzkörper<\/li><\/ul>\n<p>In den folgenden Abschnitten wird unabhängig vom Verwendungszweck nur noch der Begriff <b>Justierkörper<\/b> benutzt. National und international sind vielfältige Justierkörper im Einsatz, von denen nur wenige genormt sind.<\/p>\n<div class=\"def\">Ein <b>Justierkörper<\/b> ist ein Körper bestimmter Abmessungen und bekannter physikalischer Eigenschaften zur Justierung und Kontrolle von Prüfeinrichtungen – hier Wirbelstromprüfeinrichtungen.<\/div>\n\n<h2>7.2 Herstellung<\/h2>\n<h3>7.2.1 Allgemeines<\/h3>\n<p>Testfehler lassen sich auf verschiedene Weise herstellen: durch <b>mechanische<\/b>, <b>elektrochemische<\/b> oder <b>funkenerosive<\/b> Bearbeitung. Als Testfehler haben sich <b>Nuten<\/b> und <b>Bohrungen<\/b> eingeführt; Nuten bevorzugt man normalerweise, weil ihre Signalform eher der von Rissen entspricht. Man unterscheidet Testfehler <b>an der Oberfläche<\/b> und solche <b>unter der Oberfläche<\/b>, z. B. in der zweiten Lage.<\/p>\n<p>Entscheidend bei der Auswahl des Kontroll- bzw. Vergleichskörpers ist außerdem die <b>Prüfgeometrie<\/b>: ebene Flächen bzw. Radien, Bohrungen oder rohr- bzw. stangenförmige Objekte. Weil man im einen Fall üblicherweise Tastsensoren und im anderen Durchlaufsensoren einsetzt, muss die Geometrie der Körper der Spulenausführung angepasst sein. Wichtig ist auch die <b>erwartete Fehlerlage<\/b>: Die Testfehler sollen in derselben Richtung verlaufen. Ihre Abmessungen legt man nach der kritischen Fehlergröße fest, also nach dem Grenzwert für die Beurteilung der Bauteile.<\/p>\n<h3>7.2.2 Mechanische Bearbeitung<\/h3>\n<p>Nuten entstehen durch Sägen oder Fräsen. Dabei stößt man schnell an die <b>Mindestbreite<\/b> der Werkzeuge: Kreissägeblätter sind mindestens 0,2 mm dick, Diamantscheiben mindestens 0,1 mm. Daraus ergeben sich Nutbreiten, die nicht unterschritten werden können. Zudem hängt der Nutgrund vom Scheibendurchmesser ab, sodass kurze Nuten nur eingeschränkt herstellbar sind; Nuten in Bohrungen und anderen engen Hohlräumen gehen gar nicht. Die Nutbreite entspricht damit nicht den natürlichen Rissbreiten, die meist nur einige µm oder weniger betragen. Ein weiteres Problem sind <b>schwer zerspanbare Werkstoffe<\/b> wie Nickelbasis-, Guss- und Schmiedelegierungen.<\/p>\n<p>Werden <b>Bohrungen<\/b> als Testfehler verwendet, kann man leicht zerspanbare Werkstoffe mit geeigneten Spiralbohrern auf konventionellen Maschinen bearbeiten. Bohrungen unter etwa <b>1 mm Durchmesser<\/b> verlangen – besonders bei schwer zerspanbaren Werkstoffen – Spezialbohrmaschinen; damit sind sehr genaue Bohrungen möglich, mit einer Tiefe bis zum <b>7- oder sogar 10-fachen<\/b> Durchmesser.<\/p>\n<h3>7.2.3 Elektrochemische Bearbeitung<\/h3>\n<p>Kleinere Bohrungen bis herab zu etwa <b>0,25 mm<\/b> Durchmesser lassen sich elektrochemisch herstellen, wenn Tiefen über dem 7- bis 10-fachen Durchmesser nötig sind. Nuten und Schlitze gehen so nicht, weil die Elektroden wegen des durchzupumpenden Elektrolyten hohl sein müssen.<\/p>\n<h3>7.2.4 Funkenerosive Bearbeitung<\/h3>\n<p>Nuten mit etwa <b>20 bis 50 µm<\/b> Breite lassen sich funkenerosiv herstellen; an der BAM Berlin sind seit Kurzem sogar nur <b>15 µm<\/b> möglich. Als Elektroden dienen entsprechend Länge und Tiefe der Nut Metallfolien (z. B. Tantal, Stahl oder Kupfer) mit einer Dicke über 10 µm. Sie müssen in spezielle Halter gespannt werden, um „Flattern“ beim Erodieren zu vermeiden. Als Dielektrikum verwendet man dünnflüssige, petroleumähnliche Mineralöle.<\/p>\n<p>So lassen sich Nuten an fast beliebiger Stelle erzeugen; entscheidend ist die Zugänglichkeit der Elektrode samt Halter. Die Maschine muss dem Zweck genau angepasst sein – normale Funkenerodiermaschinen für die Serienfertigung halten die geforderte Maßhaltigkeit der Schlitze nicht ein. Gelegentlich setzt man auch <b>Drahterodiermaschinen<\/b> ein: Dabei läuft ein Draht als Elektrode von einer Trommel auf eine andere, sodass stets Draht mit konstantem Durchmesser erodiert. Damit entstehen Nutbreiten unter 100 µm gleichmäßig und gerade über längere Strecken.<\/p>\n<div class=\"tw\"><table class=\"t\"><tr><th>Verfahren<\/th><th>Geeignet für<\/th><th>Grenzen<\/th><\/tr>\n<tr><td>Mechanisch (Sägen, Fräsen, Bohren)<\/td><td>Nuten ab 0,2 mm (Sägeblatt) bzw. 0,1 mm (Diamantscheibe); Bohrungen<\/td><td>Mindestbreite, keine Nuten in Hohlräumen, schwer zerspanbare Werkstoffe<\/td><\/tr>\n<tr><td>Elektrochemisch<\/td><td>Bohrungen bis ca. 0,25 mm, sehr tief<\/td><td>keine Nuten/Schlitze (hohle Elektroden)<\/td><\/tr>\n<tr><td>Funkenerosiv<\/td><td>Nuten 15–50 µm; mit Draht &lt; 100 µm<\/td><td>Zugänglichkeit der Elektrode; Spezialmaschine nötig<\/td><\/tr><\/table><\/div>\n<div data-sim=\"slot\"><\/div>\n\n<h2>7.3 Anwendungsbereiche<\/h2>\n<h3>7.3.1 Allgemeines<\/h3>\n<p>Eine weitere wichtige Größe ist der <b>Werkstoff<\/b> des Justierkörpers. Seine elektrische Leitfähigkeit muss den Verhältnissen am Bauteil entsprechen. Ist das nicht möglich, soll der Justierkörper eine <b>niedrigere<\/b> Leitfähigkeit haben als das Bauteil – höchstens etwa <b>−10 % IACS<\/b> Abweichung. Bei Leichtmetallen hat der Warmbehandlungszustand erheblichen Einfluss auf die Leitfähigkeit.<\/p>\n<p>Bei ferromagnetischen Werkstoffen geht die relative Permeabilität sehr stark in die Signalbildung ein; die Werkstoffe der Justierkörper sollen deshalb in ihrer relativen Permeabilität dem Prüfmaterial entsprechen – gegebenenfalls unter Beachtung des Warmbehandlungszustands, der die Permeabilität ebenfalls beeinflusst.<\/p>\n<h3>7.3.2 Werkstoff – Leitfähigkeiten / Leitfähigkeitsmessung<\/h3>\n<p>Wie in V4 gesagt: Kein Prüfgerät kann die Leitfähigkeit ohne vorherige Justierung genau anzeigen. Weil die Abnahmegrenzen teils sehr eng sind, ist die geforderte Anzeigegenauigkeit hoch – schon <b>0,2 MS/m<\/b> Abweichung können zu Streitfällen zwischen Lieferant und Kunde führen. Deshalb müssen Leitfähigkeitsmessgeräte vor der Anwendung justiert werden, und zwar mit genauen, <b>zertifizierten<\/b> Justierkörpern, deren Werte elektrisch ermittelt wurden und deren Zertifizierung bis zu einer behördlichen Institution wie der PTB zurückverfolgt werden kann. Weltweit wird angestrebt, diese Körper zu standardisieren.<\/p>\n<p>Standard-Justierkörper dürfen die Justierung weder durch geometrische Einflüsse noch durch zu geringe Dicke beeinflussen. Empfohlen werden ebene Platten, deren Durchmesser etwa <b>25 mm größer<\/b> ist als der Spulendurchmesser, mit einer Dicke von mindestens der <b>dreifachen Standard-Eindringtiefe<\/b> der Messfrequenz, ohne Beschichtung und mit hoher Oberflächengüte.<\/p>\n<h3>7.3.3 Werkstoff – Verwechslungsprüfung / Sortierprüfung<\/h3>\n<p>Hier vergleicht man bekannte Werkstoffeigenschaften miteinander. Diese Eigenschaften werden aber durch eine <b>zerstörende<\/b> Werkstoffprüfung ermittelt: Man <i>nimmt<\/i> sie vom Justierkörper an und vergleicht sie mit den Prüfteilen (siehe auch effektive Permeabilität). Näheres folgt in V8.<\/p>\n<h3>7.3.4 Rissprüfung<\/h3>\n<p>Bei der Rissprüfung unterscheidet man ebene und gekrümmte Flächen. Es gibt eine Fülle von Justierkörpern; als Beispiel dient einer, der mehrere Funktionen erfüllt und relativ weit verbreitet ist: der <b>TP 1<\/b> der Fa. Rohmann. Er ist ein <b>Mehrlagenblock<\/b> aus vier miteinander verbundenen Werkstofflagen (Austenit, Eisen, Titan und Aluminium). Auf den ebenen Flächen sind verschiedene Fehlertiefen erodiert (0,2 mm und 0,5 mm); in einer Durchgangsbohrung sind je Werkstofflage verschiedene Nuten eingebracht (Tiefe 0,5 mm).<\/p>\n<div data-fig=\"v7_tp1\" data-cap=\"Abb. 7.1: TP 1, Justierkörper der Fa. Rohmann (schematisch: Mehrlagenblock aus Ti, Fe, Aust, Al; Fehlertiefen 0,2 und 0,5 mm)\"><\/div>\n<h3>7.3.5 Bohrungsprüfung<\/h3>\n<p>Für die Bohrungsprüfung gibt es viele Justierkörper; typische Ausführungen:<\/p>\n<h4>Bohrungsplatte – Typ 1<\/h4>\n<p>Platte mit den erforderlichen Bohrungen, in denen sich jeweils eine funkenerosiv hergestellte Nut befindet. Nutabmessungen: Breite 0,15 mm, Tiefe 0,5 mm, Länge gleich Plattendicke.<\/p>\n<div data-fig=\"v6_typ1\" data-cap=\"Abb. 7.2: Platte mit axialen Nuten in Bohrungen verschiedenen Durchmessers\"><\/div>\n<h4>Platte mit Oberflächennuten – Typ 2<\/h4>\n<p>Ähnlich wie Typ 1, aber die Nut wurde von der Stirnseite der Bohrungen eingebracht. Nutabmessungen: Breite 0,2 mm, Tiefe 1,0 mm, Länge über die gesamte Plattenlänge.<\/p>\n<div data-fig=\"v6_typ2\" data-cap=\"Abb. 7.3: Platte mit axialer Nut in Bohrungen verschiedenen Durchmessers\"><\/div>\n<h4>Justierkörper mit konischer Bohrung – Typ 4<\/h4>\n<p>Die Grundidee: ein <b>größeres Durchmesserspektrum<\/b> an Rotiersonden mit einem Körper abzudecken, denn in einer konischen Bohrung befindet sich eine funkenerosiv hergestellte durchgehende Nut. Das Verhältnis von Nuttiefe zu -breite ist mit 2 : 1 allerdings sehr ungünstig und führt zu einer deutlichen Phasendrehung. Nutabmessungen: Breite 0,15 mm, Tiefe 0,3 mm.<\/p>\n<div data-fig=\"v7_typ4\" data-cap=\"Abb. 7.4: Typ 4 – Justierkörper mit konischer Bohrung (schematisch)\"><\/div>\n<h4>Mehrschichtplatte – Typ 5<\/h4>\n<p>Dieser Justierkörper simuliert eine typische Flugzeugstruktur; Risse in der <b>zweiten Lage<\/b> werden nachgebildet. Das Verhältnis Tiefe zu Breite liegt je nach Nuttiefe zwischen 1 : 1 und 3 : 1 und ist ebenfalls für eine unrealistische Phasendrehung verantwortlich. Nutabmessungen: Breite 0,15 mm, Tiefe 0,2 bis 1,0 mm.<\/p>\n<div data-fig=\"v7_typ5\" data-cap=\"Abb. 7.5: Typ 5 – Mehrschichtplatte (schematisch)\"><\/div>\n<h4>Konischer Justierkörper / Brite Euram – Typ 6<\/h4>\n<p>Wie Typ 4 mit konischer Bohrung, besteht aber aus <b>zwei Hälften<\/b>. Durch sehr genaue Bearbeitung der Trennfläche erreicht man ein Breite-zu-Tiefe-Verhältnis von besser als <b>1 : 10<\/b>.<\/p>\n<div data-fig=\"v7_typ6\" data-cap=\"Abb. 7.6: Justierkörper Brite Euram, Typ 6 (zwei Hälften mit konischer Bohrung, schematisch)\"><\/div>\n\n<h2>7.4 Weitere Justierkörper<\/h2>\n<p>Die Justierkörper für die Halbzeugprüfung (Stange, Draht, Rohr usw.) und für die Schweißnahtprüfung werden ausführlich in den produktbezogenen Vorträgen <b>V11<\/b> (Rohr- und Halbzeugprüfung) und <b>V13<\/b> (Schweißnahtprüfung) behandelt.<\/p>\n", "v8": "<h2>8.1 Einleitung<\/h2>\n<p>Die Gefügeprüfung zählt zu den wichtigsten Anwendungsgebieten der Wirbelstromprüfung. Verbreitet sind in der Praxis vor allem:<\/p>\n<ul><li><b>Verwechslungsprüfungen<\/b> (Legierungs- und Gefügeunterschiede),<\/li><li>die Unterscheidung nach Materialkenngrößen, etwa <b>Einhärtetiefen<\/b>,<\/li><li><b>Leitfähigkeitsmessungen<\/b> (eigenes Kapitel, V4),<\/li><li><b>Ferritgehaltsmessungen<\/b> (eigenes Kapitel).<\/li><\/ul>\n<p>Als Unterscheidungskriterium bzw. Messgröße dient bei <b>ferromagnetischen<\/b> Werkstoffen die <b>Permeabilität μ<sub>r<\/sub><\/b> (sie beeinflusst bedingt auch die Leitfähigkeit σ), bei <b>Nichteisenwerkstoffen<\/b> die <b>Leitfähigkeit σ<\/b>. Tab. 8.1 zeigt, welche Werkstoffeigenschaften sich über die beiden Größen unterscheiden lassen.<\/p>\n<div class=\"tw\"><table class=\"t\"><tr><th>Werkstoffeigenschaft<\/th><th>Leitfähigkeit σ<\/th><th>Permeabilität μ<sub>r<\/sub><\/th><\/tr>\n<tr><td>Chemische Analyse<\/td><td>++<\/td><td>++<\/td><\/tr>\n<tr><td>Gefüge-/Wärmebehandlungszustände<\/td><td>−<\/td><td>++<\/td><\/tr>\n<tr><td>Ausscheidungen<\/td><td>−<\/td><td>++<\/td><\/tr>\n<tr><td>Innere Spannungen<\/td><td>+<\/td><td>++<\/td><\/tr>\n<tr><td>Deltaferrit in Austenit / Restaustenit<\/td><td>+<\/td><td>++<\/td><\/tr><\/table><\/div>\n<div class=\"tcap\"><b>Tab. 8.1:<\/b> Unterscheidbare Werkstoffeigenschaften (− geringer Einfluss, + Einfluss vorhanden, ++ starker Einfluss)<\/div>\n\n<h2>8.2 Gefügeprüfung (Verwechslungsprüfung)<\/h2>\n<p>Insbesondere bei ferromagnetischen <b>Massenteilen<\/b> prüft man auf Legierungs-, Gefüge- oder Härteunterschiede. In den meisten Fällen lassen sich auch Teile mit unterschiedlichen <b>Randeigenschaften<\/b> trennen, z. B. Randentkohlung, Einsatzhärtetiefe oder Weichfleckigkeit.<\/p>\n<p>Materialverwechslungen sowie Gefüge- und Härteunterschiede durch falsche Wärmebehandlung können schwerwiegende Folgen haben: den Ausfall funktionswichtiger Bauteile, die Gefährdung von Menschenleben oder Rückrufaktionen bei Fahrzeugen.<\/p>\n<div class=\"def\"><b>Gefügeprüfung<\/b> ist die Unterscheidung von Teilen aus unterschiedlichen Werkstoffen bzw. Legierungen (<i>Verwechslungsprüfung<\/i>) und/oder die Trennung nach unterschiedlichen Gefügezuständen (z. B. Oberflächenhärte).<\/div>\n<h3>8.2.1 Unterschiedliche Werkstoffe<\/h3>\n<p>Typische Aufgaben sind etwa die Trennung von 9S20 (Automatenstahl), St 52 (Baustahl), C15 und 15MnCr5 (Einsatzstähle), 45CrSi6 und 100Cr6 (Vergütungsstähle) oder X10CrNi18-8 (austenitischer Stahl). Man geht dabei in vier Schritten vor:<\/p>\n<ol><li>Auswertung der Wirbelstromsignale (z. B. Amplitude und Phase in Form von Toleranzbereichen),<\/li><li>Sortierung unterschiedlicher Teilegruppen (soweit bekannt und in relativ geringer Stückzahl) anhand der unterschiedlichen Signale,<\/li><li>Ermittlung der Analysewerte (chemische Analyse, Spektrometeranalyse),<\/li><li>Festlegung von Sortiergrenzen für die Großzahluntersuchung.<\/li><\/ol>\n<div class=\"warn\">Werkstoffe lassen sich nur dann sicher unterscheiden, wenn die Teile den <b>gleichen Prozesszustand<\/b> haben.<\/div>\n<h3>8.2.2 Unterschiedliche Gefügezustände<\/h3>\n<p>In der Praxis geht es häufig um die Trennung nach<\/p>\n<ul><li><b>Wärmebehandlung:<\/b> unbehandelt, weichgeglüht, gehärtet (in verschiedensten Ausführungen), vergütet;<\/li><li><b>Oberflächenzustand:<\/b> Oberflächenhärte, Einhärtetiefe, Einsatzhärtetiefe, Nitrierhärtetiefe (nur bedingt möglich), Aufkohlungstiefe, Randentkohlung;<\/li><li><b>Gefügeunterschieden:<\/b> Weichfleckigkeit, Restaustenit, Spannungszustand (Eigenspannungen), Ausscheidungen, Deltaferrit in austenitischen Stählen, Verformungsgrad, Texturen.<\/li><\/ul>\n<p>Die Vorgehensweise entspricht der in 8.2.1; alle genannten Aufgaben sind durch eine Wirbelstrom-Gefügeprüfung lösbar. Voraussetzung ist, dass <b>jedes Gefüge und jede Legierung eine eigene Magnetisierungskurve<\/b> besitzt.<\/p>\n<p>Ein vorhandenes Gefüge ergibt sich aus Werkstoff und Wärmebehandlung und liefert die gewünschten technologischen Eigenschaften wie Härte, Einhärtetiefe, Zugfestigkei
