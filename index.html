<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wirbelstromprüfung ET 2 – E-Learning</title><style>:root{--ac:#0aa89e;--pri:#0f3d63;--pri2:#1769a6;--acc:#0aa89e;--warn:#e8590c;--ok:#1f9d55;--bad:#d62839;--bg:#edf2f7;--card:#fff;--ink:#12202f;--mut:#5d6f80;--line:#dfe7ef;--scr:#06130e;--grn:#3dff95;--amb:#ffb938;--r:16px;
--sh:0 1px 2px rgba(15,61,99,.06),0 8px 24px -8px rgba(15,61,99,.14);--sh2:0 2px 4px rgba(15,61,99,.08),0 18px 40px -12px rgba(15,61,99,.25);
--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Noto Serif",Georgia,serif}
*{box-sizing:border-box}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font:16.5px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);background-image:radial-gradient(900px 500px at 85% -10%,rgba(10,168,158,.10),transparent 60%),radial-gradient(800px 500px at -10% 30%,rgba(23,105,166,.08),transparent 60%);background-attachment:fixed;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}a{color:var(--pri2)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.wrap>*{animation:rise .5s both}.wrap>*:nth-child(2){animation-delay:.05s}.wrap>*:nth-child(3){animation-delay:.1s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.app{display:flex;min-height:100vh}
nav.side{width:318px;flex:none;background:linear-gradient(180deg,#071d33 0%,#0b2f4f 60%,#0a3b55 100%);color:#d5e3ef;position:sticky;top:0;height:100vh;overflow:auto;padding:20px 14px 34px;scrollbar-width:thin;scrollbar-color:#2a5a7d transparent;border-right:1px solid rgba(255,255,255,.06)}
nav.side::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:18px 18px;pointer-events:none}
nav.side>*{position:relative}
nav.side .brand{display:flex;gap:12px;align-items:center;margin-bottom:8px;padding:4px 6px}
nav.side .logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#0aa89e,#1769a6);display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px;letter-spacing:.02em;box-shadow:0 6px 18px rgba(10,168,158,.4)}
nav.side h1{font-family:var(--serif);font-size:19px;margin:0;line-height:1.15;color:#fff;font-weight:700}nav.side small{color:#8eb0c9;display:block;font-size:12px;margin-top:2px}
.ring{margin:14px 4px 16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:11px 13px}
.bar{height:7px;background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#0aa89e,#3dff95);width:0;transition:width .6s;border-radius:6px}
.ring span{font-size:12px;color:#a9c4d8;display:block;margin-top:6px}
nav.side a{display:flex;gap:10px;align-items:center;padding:9px 11px;border-radius:12px;color:#d5e3ef;text-decoration:none;font-size:14.5px;margin:2px 0;transition:background .15s;line-height:1.3;position:relative}
nav.side a:hover{background:rgba(255,255,255,.08)}
nav.side a.on{background:linear-gradient(90deg,rgba(10,168,158,.32),rgba(10,168,158,.08));color:#fff;font-weight:600}
nav.side a.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:#3dff95}
nav.side a b{width:34px;height:26px;flex:none;font-size:11.5px;color:#7fe0d6;background:rgba(255,255,255,.07);border-radius:8px;display:grid;place-items:center;font-weight:700}
nav.side a .st{margin-left:auto;font-size:11.5px;color:#3dff95;white-space:nowrap}
nav.side .grp{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#6d93af;margin:18px 10px 6px;font-weight:700}
main{flex:1;min-width:0;padding:0 0 70px}
.top{display:none;position:sticky;top:0;z-index:30;background:rgba(7,29,51,.92);backdrop-filter:blur(10px);color:#fff;padding:10px 14px;align-items:center;gap:12px}
.top button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;padding:6px 12px;font-size:18px}
.top .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{position:fixed;left:0;top:0;height:3px;background:linear-gradient(90deg,#0aa89e,#3dff95);z-index:70;width:0}
.wrap{max-width:1020px;margin:0 auto;padding:26px 22px}
.hero{position:relative;background:radial-gradient(600px 300px at 90% 0%,rgba(61,255,149,.22),transparent 60%),linear-gradient(135deg,#06213a 0%,#0f3d63 50%,color-mix(in srgb,var(--ac) 80%,#0f3d63) 130%);color:#fff;border-radius:26px;padding:34px 32px 30px;margin-bottom:18px;overflow:hidden;box-shadow:var(--sh2)}
.hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:20px 20px;pointer-events:none;mask-image:linear-gradient(90deg,transparent,#000 70%)}
.hero .big{position:absolute;right:18px;bottom:-34px;font-family:var(--serif);font-weight:800;font-size:170px;line-height:1;color:rgba(255,255,255,.09);letter-spacing:-.04em;pointer-events:none}
.hero h2{margin:8px 0 8px;font-family:var(--serif);font-size:36px;line-height:1.1;color:#fff;border:0;padding:0;font-weight:800;letter-spacing:-.01em;position:relative}
.hero p{margin:6px 0;color:#d6e8f5;max-width:620px;position:relative;font-size:17px}
.hero .chip{display:inline-block;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px);padding:3px 12px;border-radius:20px;font-size:12.5px;margin:0 6px 4px 0;position:relative;font-weight:600;letter-spacing:.02em}
.hero canvas{position:absolute;right:0;top:0;height:100%;opacity:.55;pointer-events:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:14px 0 6px}
.stat{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:var(--sh);border:1px solid var(--line)}.stat b{display:block;font-family:var(--serif);font-size:30px;color:var(--pri);line-height:1}.stat span{font-size:12.5px;color:var(--mut)}
.toc{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin:0 -2px 6px;scrollbar-width:none}.toc a{white-space:nowrap;background:#fff;border:1px solid var(--line);color:var(--pri);text-decoration:none;padding:6px 13px;border-radius:20px;font-size:13.5px;font-weight:600;box-shadow:0 1px 2px rgba(15,61,99,.05)}.toc a:hover{border-color:var(--ac);color:var(--ac)}
h2{font-family:var(--serif);font-size:26px;margin:44px 0 12px;color:var(--pri);padding:0 0 0 16px;border:0;position:relative;line-height:1.2;font-weight:800;scroll-margin-top:70px}
h2::before{content:"";position:absolute;left:0;top:.12em;bottom:.12em;width:5px;border-radius:5px;background:linear-gradient(180deg,var(--ac),#1769a6)}
h3{font-size:18.5px;margin:26px 0 6px;color:var(--pri2);font-weight:700}
p{margin:.7em 0}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line);padding:18px 20px;margin:16px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tile{--c:var(--ac);background:#fff;border-radius:20px;box-shadow:var(--sh);border:1px solid var(--line);padding:16px 16px 15px;text-decoration:none;color:inherit;display:block;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.tile::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--c)}
.tile:hover{transform:translateY(-4px);box-shadow:var(--sh2)}
.tile .num{display:inline-grid;place-items:center;min-width:42px;height:30px;padding:0 9px;border-radius:10px;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);font-weight:800;font-size:13px;margin-bottom:8px}
.tile b{color:var(--pri);font-family:var(--serif);font-size:18.5px;display:block;line-height:1.2}.tile small{color:var(--mut);display:block;font-size:13px;margin-top:4px}
.tile .pill{display:inline-block;margin-top:9px;font-size:12px;font-weight:700;padding:2px 10px;border-radius:20px;background:#eef3f8;color:var(--mut)}.tile .pill.ok{background:#dcf5e6;color:var(--ok)}
.merke,.warn,.def,.tip{border-radius:14px;padding:12px 16px 12px 18px;margin:18px 0;border:1px solid transparent;border-left-width:5px;box-shadow:0 1px 2px rgba(15,61,99,.04)}
.merke{background:#e4f7f4;border-color:#bfece6;border-left-color:#0aa89e}.merke::before{content:"💡 MERKE";display:block;font-size:11px;letter-spacing:.14em;font-weight:800;color:#07756e;margin-bottom:2px}
.warn{background:#fff1e6;border-color:#ffd9bf;border-left-color:var(--warn)}.warn::before{content:"⚠ ACHTUNG";display:block;font-size:11px;letter-spacing:.14em;font-weight:800;color:var(--warn);margin-bottom:2px}
.def{background:#e7f0fa;border-color:#c5dbf0;border-left-color:var(--pri2)}.def::before{content:"📘 DEFINITION";display:block;font-size:11px;letter-spacing:.14em;font-weight:800;color:var(--pri2);margin-bottom:2px}
.tip{background:#f0ebff;border-color:#d9ccff;border-left-color:#7048e8}.tip::before{content:"🛠 PRAXIS";display:block;font-size:11px;letter-spacing:.14em;font-weight:800;color:#7048e8;margin-bottom:2px}
.fm{background:linear-gradient(135deg,#081c30,#0e3350);color:#d9f6ff;border-radius:14px;padding:14px 18px;margin:16px 0;font:16px/1.85 ui-monospace,"SF Mono",Menlo,Consolas,monospace;overflow-x:auto;text-align:center;border:1px solid #1b4a6b;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.fm small{color:#8fb7d1;font-family:system-ui}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14.5px;margin:14px 0;background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--sh)}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}tr:last-child td,tr:last-child th{border-bottom:0}th:last-child,td:last-child{border-right:0}
th{background:linear-gradient(180deg,#eef4fa,#e5eef7);color:var(--pri);font-weight:700}tbody tr:nth-child(even) td,table tr:nth-child(even) td{background:#fafcfe}
.tw{overflow-x:auto;border-radius:14px}
ul,ol{padding-left:22px}li{margin:4px 0}li::marker{color:var(--ac)}
details{background:#fff;border:1px solid var(--line);border-radius:14px;margin:8px 0;padding:2px 14px;box-shadow:0 1px 2px rgba(15,61,99,.04)}summary{cursor:pointer;font-weight:600;padding:9px 0;color:var(--pri)}
.sim{background:#fff;border:1px solid #cbdced;border-radius:22px;box-shadow:var(--sh2);margin:28px 0;overflow:hidden}
.sim>header{background:linear-gradient(110deg,#071d33,#0f3d63 60%,#126c8c);color:#fff;padding:13px 18px;display:flex;gap:12px;align-items:center;position:relative}
.sim>header::after{content:"";position:absolute;right:0;top:0;bottom:0;width:40%;background:radial-gradient(circle at 100% 50%,rgba(61,255,149,.25),transparent 70%)}
.sim>header .tag{font-size:10.5px;letter-spacing:.14em;background:rgba(61,255,149,.16);color:#6dffb3;border:1px solid rgba(61,255,149,.4);padding:3px 10px;border-radius:12px;font-weight:800;position:relative;white-space:nowrap}
.sim>header .tag::before{content:"●";margin-right:6px;font-size:8px;animation:blink 1.6s infinite}@keyframes blink{50%{opacity:.25}}
.sim>header b{font-size:16.5px;position:relative;font-weight:700}
.sim .body{padding:16px 18px 18px;background:linear-gradient(180deg,#fbfdff,#f4f8fc)}
.sim .task{background:linear-gradient(90deg,#fff6d9,#fffbed);border:1px solid #f4dd90;border-left:5px solid #f4b400;padding:10px 14px;border-radius:12px;font-size:14.5px;margin:0 0 14px}
.sim .task::before{content:"🎯 AUFGABE  ";font-weight:800;color:#a87400;font-size:12px;letter-spacing:.1em}
.sim .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sim canvas{width:100%;display:block;border-radius:14px;background:#fff;border:1px solid #dbe6f0;touch-action:none}
.sim canvas.dark{background:var(--scr);border-color:#10331f;box-shadow:inset 0 0 40px rgba(61,255,149,.07)}
.ctls{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 22px;margin-top:14px}
.ctl{display:block;font-size:13.5px}.ctl .lb{display:flex;justify-content:space-between;gap:8px;color:var(--mut);font-weight:500}.ctl .lb output{font-weight:800;color:var(--pri);font-variant-numeric:tabular-nums;background:#e8f1f9;border-radius:8px;padding:0 8px}
.ctl select,.ctl input[type=number]{border:1px solid #c3d4e3;border-radius:10px;background:#fff}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:2px 0}
input[type=range]::-webkit-slider-runnable-track{height:7px;border-radius:7px;background:linear-gradient(90deg,#c8dbea,#dbe7f1)}
input[type=range]::-moz-range-track{height:7px;border-radius:7px;background:#d3e2ee}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--ac);margin-top:-8.5px;box-shadow:0 2px 8px rgba(15,61,99,.35);transition:transform .12s}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--ac);box-shadow:0 2px 8px rgba(15,61,99,.35)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.2)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.seg button,.btn{border:1px solid #bdd0e0;background:#fff;color:var(--pri);border-radius:12px;padding:7px 14px;font-size:14px;font-weight:600;box-shadow:0 1px 2px rgba(15,61,99,.06);transition:all .15s}
.seg button:hover,.btn:hover{border-color:var(--pri2);transform:translateY(-1px)}
.seg button.on,.btn.pri{background:linear-gradient(135deg,#1769a6,#0f4f82);color:#fff;border-color:#0f4f82;box-shadow:0 4px 12px rgba(23,105,166,.35)}
.btn.ok{background:linear-gradient(135deg,#1fa862,#12874c);color:#fff;border-color:#12874c;box-shadow:0 4px 12px rgba(31,157,85,.35)}
.ro{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 4px}
.ro div{background:#fff;border:1px solid #d8e4ee;border-left:4px solid #8fb3d1;border-radius:12px;padding:6px 13px 7px;font-size:12px;color:var(--mut);min-width:110px;box-shadow:0 1px 2px rgba(15,61,99,.05)}
.ro div b{display:block;font-size:18px;color:var(--pri);font-variant-numeric:tabular-nums;line-height:1.3}
.ro div.g{border-left-color:var(--ok)}.ro div.g b{color:var(--ok)}.ro div.r{border-left-color:var(--bad)}.ro div.r b{color:var(--bad)}
.cap{font-size:13.5px;color:var(--mut);margin-top:8px}
.quiz{background:#fff;border:1px solid #c3d6e8;border-radius:22px;margin:38px 0 10px;overflow:hidden;box-shadow:var(--sh2)}
.quiz>header{background:linear-gradient(110deg,#1769a6,#0f4f82);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:16px}
.quiz .qb{padding:18px}.quiz .q{font-weight:700;font-size:18px;margin-bottom:10px;color:var(--pri);line-height:1.4}
.quiz .opt{display:block;width:100%;text-align:left;background:#f6f9fc;border:2px solid var(--line);border-radius:14px;padding:12px 15px;margin:8px 0;color:var(--ink);transition:all .15s;font-size:16px}
.quiz .opt:hover{border-color:var(--pri2);background:#eef5fb;transform:translateX(3px)}.quiz .opt.sel{border-color:var(--pri2);background:#e3f0fa}.quiz .opt.ok{border-color:var(--ok);background:#e3f7ea;font-weight:600}.quiz .opt.no{border-color:var(--bad);background:#fde8ea}
.quiz .ex{background:#f0f5fa;border-radius:12px;padding:11px 14px;margin:12px 0;font-size:15px;border-left:4px solid var(--pri2)}
.quiz input.num{font-size:18px;padding:9px 12px;border:2px solid var(--line);border-radius:12px;width:160px}
.quiz .nav{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.dots{display:flex;gap:5px;flex-wrap:wrap}.dots i{width:12px;height:12px;border-radius:50%;background:#d3dfea}.dots i.ok{background:var(--ok)}.dots i.no{background:var(--bad)}.dots i.cur{outline:3px solid #bcd7ee}
.vid{background:#07121b;border-radius:22px;overflow:hidden;margin:28px 0;box-shadow:var(--sh2);border:1px solid #17384f}
.vid header{padding:11px 16px;color:#d4e6f3;font-size:14.5px;display:flex;gap:10px;align-items:center;background:linear-gradient(90deg,#0b2236,#07121b)}.vid header .tag{background:linear-gradient(135deg,#ff7a2f,#e8590c);color:#fff;font-size:10.5px;padding:3px 10px;border-radius:12px;font-weight:800;letter-spacing:.1em}
.vid canvas{width:100%;display:block;background:#0a1620}
.vid .cc{padding:14px 20px;min-height:76px;color:#fff;font-size:17px;background:linear-gradient(180deg,#0f2536,#0b1d2c);line-height:1.5;border-top:1px solid #17384f}
.vid .vc{display:flex;gap:12px;align-items:center;padding:10px 14px;background:#07121b}.vid .vc button{background:linear-gradient(135deg,#1769a6,#0f4f82);color:#fff;border:0;border-radius:12px;padding:8px 16px;font-weight:600}.vid .vc input{flex:1}.vid .vc span{color:#9db6c8;font-size:12px;font-variant-numeric:tabular-nums}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:36px}.pn a{flex:1;background:#fff;border-radius:16px;padding:14px 18px;text-decoration:none;color:var(--pri);box-shadow:var(--sh);border:1px solid var(--line);font-weight:700;font-family:var(--serif);font-size:17px;transition:transform .15s}.pn a:hover{transform:translateY(-3px)}.pn a small{display:block;color:var(--mut);font-weight:500;font-family:system-ui;font-size:12.5px}
.pn a:last-child{text-align:right}
.badge{display:inline-block;padding:1px 10px;border-radius:12px;font-size:12px;background:#e1ecf6;color:var(--pri);margin-right:4px;font-weight:600}
.fc{perspective:900px;height:150px;margin:8px 0;cursor:pointer}.fc>div{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}.fc.f>div{transform:rotateY(180deg)}
.fc i,.fc u{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:grid;place-items:center;padding:16px;text-align:center;text-decoration:none;font-style:normal}
.fc i{background:linear-gradient(135deg,#0f3d63,#1769a6);color:#fff;font-weight:700;font-family:var(--serif);font-size:18px;box-shadow:var(--sh)}.fc u{background:#e4f7f4;color:var(--ink);transform:rotateY(180deg);border:2px solid var(--ac);font-size:14.5px}
[data-fc] h3{margin-top:34px}
@media(max-width:900px){nav.side{position:fixed;z-index:60;left:0;top:0;transform:translateX(-105%);transition:transform .25s;width:86vw;max-width:340px;box-shadow:0 0 50px rgba(0,0,0,.5)}nav.side.open{transform:none}.top{display:flex}.wrap{padding:14px 12px}.sim .cols{grid-template-columns:1fr}.hero{padding:24px 20px;border-radius:22px}.hero h2{font-size:27px}.hero .big{font-size:110px}.hero canvas{display:none}h2{font-size:22px;margin-top:34px}.sim .body{padding:12px}.sim>header{padding:11px 13px}.sim>header b{font-size:15px}}
.scrim{display:none;position:fixed;inset:0;background:rgba(3,14,26,.55);backdrop-filter:blur(2px);z-index:55}.scrim.on{display:block}
.hero h2::before{display:none}.hero h2{padding:0}
.fm{font:italic 19px/2 var(--serif);letter-spacing:.2px;text-align:center;overflow-x:auto}
.fm .eq{float:right;font:600 13px system-ui;color:#7fb4d4;margin-left:18px;font-style:normal}
.fm sub,.fm sup{font-size:.68em;line-height:0}
.fm .u,.fm u{font-style:normal;text-decoration:none;font-size:.8em;color:#8fb7d1;margin-left:.4em;font-family:system-ui}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 4px;line-height:1.35}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 5px 1px}.fr>span:last-child{padding:1px 5px 0}
.fm .sq{display:inline-block;border-top:1.5px solid currentColor;padding:0 2px;margin-left:1px}
figure.fg,div.fg{margin:20px 0;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 12px 10px;box-shadow:var(--sh)}
.fg .svgw{overflow-x:auto}.fg svg{width:100%;height:auto;display:block;max-width:760px;margin:0 auto}
.fg figcaption{font-size:14px;color:var(--mut);text-align:center;margin-top:8px;line-height:1.45}.fg figcaption b{color:var(--pri)}
.tw{overflow-x:auto;margin:18px 0}.tw table{margin:0}

"use strict";
const FIGS={};
const FC={pri:'#0f3d63',ac:'#0aa89e',bl:'#1769a6',red:'#d62839',or:'#e8590c',gr:'#6b7b8a',ln:'#cbd6e0',ink:'#12202f',gn:'#1f9d55',vi:'#7048e8',bg:'#eef4f9',am:'#f0a30a'};
function sm(t){return String(t).replace(/_\{([^}]*)\}|_(\w)/g,(m,a,b)=>`<tspan baseline-shift="sub" font-size="72%">${a||b}</tspan>`).replace(/\^\{([^}]*)\}|\^(\w)/g,(m,a,b)=>`<tspan baseline-shift="super" font-size="72%">${a||b}</tspan>`)}
function SV(w,h,body){return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" role="img"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker><marker id="dt" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker></defs>${body}</svg>`}
const LN=(x1,y1,x2,y2,c=FC.ink,w=1.6,x='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" ${x}/>`;
const AR=(x1,y1,x2,y2,c=FC.ink,w=1.8,x='')=>LN(x1,y1,x2,y2,c,w,'marker-end="url(#ah)" '+x);
const AR2=(x1,y1,x2,y2,c=FC.ink,w=1.6)=>LN(x1,y1,x2,y2,c,w,'marker-end="url(#ah)" marker-start="url(#ah)"');
const TX=(x,y,t,o={})=>`<text x="${x}" y="${y}" text-anchor="${o.a||'middle'}" fill="${o.c||FC.ink}" font-size="${o.s||13}" ${o.b?'font-weight="700"':''} ${o.i?'font-style="italic"':''} ${o.r?`transform="rotate(${o.r} ${x} ${y})"`:''}>${sm(t)}</text>`;
const PA=(d,c=FC.ink,w=1.8,f='none',x='')=>`<path d="${d}" stroke="${c}" stroke-width="${w}" fill="${f}" ${x}/>`;
const RC=(x,y,w,h,c=FC.ink,f='none',s=1.6,r=0)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" stroke="${c}" stroke-width="${s}" fill="${f}"/>`;
const CI=(x,y,r,c=FC.ink,f='none',s=1.6)=>`<circle cx="${x}" cy="${y}" r="${r}" stroke="${c}" stroke-width="${s}" fill="${f}"/>`;
// Bauteile
const RES=(x,y,w=46,h=16)=>RC(x,y-h/2,w,h,FC.ink,'#fff',1.8);
const IND=(x,y,n=4,w=14)=>{let d=`M${x} ${y}`;for(let i=0;i<n;i++)d+=` a${w/2} ${w/2} 0 0 1 ${w} 0`;return PA(d,FC.ink,2)};
const VM=(x,y,t)=>CI(x,y,13,FC.ink,'#fff',1.6)+TX(x,y+4.5,t,{s:12,b:1});
const GRID=(w,h,dx=40,c='#eef2f6')=>{let s='';for(let x=0;x<=w;x+=dx)s+=LN(x,0,x,h,c,1);for(let y=0;y<=h;y+=dx)s+=LN(0,y,w,y,c,1);return s};
function mountFig(el){const f=FIGS[el.dataset.fig];el.className='fg';if(!f){el.textContent='Abbildung fehlt: '+el.dataset.fig;return}el.innerHTML='<div class="svgw">'+f()+'</div>'+(el.dataset.cap?'<figcaption>'+el.dataset.cap.replace(/^(Abb\.\s*[\d.]+|Tab\.\s*[\d.]+):?/,'<b>$1:</b>')+'</figcaption>':'')}

"use strict";
const PTH=(pts,c=FC.bl,w=2.4,x='')=>PA('M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L'),c,w,'none',x);
const SIN=(x0,y0,amp,per,ph,len,n=120)=>{const p=[];for(let i=0;i<=n;i++){const x=i/n*len;p.push([x0+x,y0-amp*Math.sin(2*Math.PI*(x-ph)/per)])}return p};
const TAXES=(x0,y0,w,h,xl='t',yl='')=>AR(x0,y0,x0+w,y0,FC.gr,1.4)+AR(x0,y0+h/2,x0,y0-h/2,FC.gr,1.4)+TX(x0+w-4,y0+16,xl,{a:'end',c:FC.gr,i:1})+(yl?TX(x0+6,y0-h/2+4,yl,{a:'start',c:FC.gr,i:1}):'');

sim('magnet','Induktion: Magnet in die Spule schieben','Ziehe den Magneten mit Finger/Maus in die Spule hinein und wieder heraus. Beobachte Betrag und <b>Vorzeichen</b> der Spannung. Was passiert, wenn der Magnet stillsteht? Drehe die Polarität um!',b=>{
 let mx=.12,Phi0=null,U=0,hist=[],pol=1,auto=false,tt=0,dragging=false,sm=0;const sp={N:100,B:1};
 const O=cvs(b,{ar:.66,draw:(c,w,hh)=>{const sh=hh*.58,cx=w*.66,cy=sh*.52,mw=w*.24,mh=w*.085;
  c.fillStyle='#f4f8fb';c.fillRect(0,0,w,sh);
  // Feldlinien
  const mc=mx*w;c.strokeStyle='rgba(20,97,143,.25)';c.lineWidth=1;for(let i=1;i<=3;i++){c.beginPath();c.ellipse(mc,cy,mw/2+i*mh*.55,mh*.5+i*mh*.9,0,0,TAU);c.stroke()}
  // Spule hinten
  const cw=w*.16,ch=sh*.62;c.lineWidth=3;c.strokeStyle='#b5651d';for(let i=0;i<9;i++){const x=cx-cw/2+i*cw/8;c.beginPath();c.ellipse(x,cy,ch*.12,ch/2,0,Math.PI/2,Math.PI*1.5);c.stroke()}
  // Magnet
  const grad=(x,col)=>{c.fillStyle=col;return x};c.fillStyle=pol>0?'#d62839':'#2b6cb0';c.fillRect(mc-mw/2,cy-mh/2,mw/2,mh);c.fillStyle=pol>0?'#2b6cb0':'#d62839';c.fillRect(mc,cy-mh/2,mw/2,mh);
  text(c,pol>0?'N':'S',mc-mw/4,cy+5,'#fff',16,'center','bold');text(c,pol>0?'S':'N',mc+mw/4,cy+5,'#fff',16,'center','bold');c.strokeStyle='#17222d';c.lineWidth=1.5;c.strokeRect(mc-mw/2,cy-mh/2,mw,mh);
  c.lineWidth=3;c.strokeStyle='#d98a3d';for(let i=0;i<9;i++){const x=cx-cw/2+i*cw/8;c.beginPath();c.ellipse(x,cy,ch*.12,ch/2,0,-Math.PI/2,Math.PI/2);c.stroke()}
  // induzierter Strom
  if(Math.abs(U)>3){const col=U>0?'#e8590c':'#7048e8';arrow(c,cx-cw/2,cy-ch/2-10,cx+cw/2,cy-ch/2-10,col);if(U<0){}text(c,'Induktionsstrom '+(U>0?'→':'←'),cx,cy-ch/2-18,col,12,'center')}
  text(c,'Ziehen →',w*.05,sh-8,'#6b7b8a',12);
  // Messgeraet
  const gx=w*.14,gy=sh*.22,gr=Math.min(w*.1,sh*.2);c.fillStyle='#fff';c.strokeStyle='#8aa0b2';c.lineWidth=2;c.beginPath();c.arc(gx,gy+gr*.4,gr,Math.PI,TAU);c.closePath();c.fill();c.stroke();
  const ang=clamp(U/100,-1,1)*Math.PI*.38-Math.PI/2;arrow(c,gx,gy+gr*.4,gx+Math.cos(ang)*gr*.9,gy+gr*.4+Math.sin(ang)*gr*.9,'#d62839',2,0);text(c,'mV',gx,gy+gr*.4+14,'#6b7b8a',11,'center');
  // Verlauf
  const R={x:36,y:sh+16,w:w-48,h:hh-sh-34};const ymax=Math.max(100,...hist.map(Math.abs));const m=axes(c,R,[0,hist.length>1?300:300],[-ymax,ymax],{nx:0,ny:2,xf:()=>'',yf:v=>fmt(v,0)});
  c.strokeStyle='#8aa0b2';c.beginPath();c.moveTo(R.x,m.y(0));c.lineTo(R.x+R.w,m.y(0));c.stroke();line(c,hist.map((v,i)=>[m.x(i+300-hist.length),m.y(v)]),'#e8590c',2);text(c,'U_ind (mV) über der Zeit',R.x+4,R.y+12,'#425566',11)}});
 O.drag((x,y,t)=>{if(t==='down'||t==='move'){mx=clamp(x/O.w,.08,.95);dragging=true;auto=false;ab.classList.remove('pri')}else dragging=false});
 const st=animate(O,dt=>{tt+=dt;if(auto)mx=.5+.38*Math.sin(tt*sp.speed);const d=(mx-.66),Phi=pol*sp.B*Math.pow(1/(1+Math.pow(d/.11,2)),1.5);
  if(Phi0===null)Phi0=Phi;const dP=(Phi-Phi0)/Math.max(dt,.001);Phi0=Phi;sm=lerp(sm,dP,.35);U=-sp.N*sm*.07;if(dt>0){hist.push(U);if(hist.length>300)hist.shift()}
  upd('u',fmt(U,0)+' mV',Math.abs(U)>3?'r':'');upd('phi',fmt(Phi,2)+' mWb');upd('v',Math.abs(U)<3?'keine Induktion':U*pol>0?'Gegenfeld: Abstoßung':'Gegenfeld: Anziehung')});
 const c1=h('div',{cls:'ctls'});b.append(c1);sp.speed=2;
 slider(c1,{label:'Windungszahl N',min:10,max:500,step:10,value:100,on:v=>sp.N=v});slider(c1,{label:'Magnetstärke',min:.2,max:3,step:.1,value:1,on:v=>sp.B=v});
 const row=h('div',{cls:'seg'});b.append(row);const ab=btn(row,'↔ Automatisch schwingen',()=>{auto=!auto;ab.classList.toggle('pri',auto)});btn(row,'⇄ Pole vertauschen',()=>{pol*=-1});
 const upd=readouts(b,[['u','Induzierte Spannung'],['phi','Fluss Φ in der Spule'],['v','Lenz’sche Regel']]);
 b.append(h('div',{cls:'cap'},'U = −N · dΦ/dt: Nicht der Fluss selbst, sondern seine <b>Änderung</b> erzeugt die Spannung. Schneller bewegen → größere Spannung.'.replace(/<\/?b>/g,'')))});

sim('rl_dc','Gleichstromkreis mit Spule: Einschalt- und Ausschaltvorgang','Schalte ein und aus. Vergrößere L: Wie ändert sich die Zeitkonstante τ = L/R? Wie groß ist der Strom nach 5 τ?',b=>{
 let i=0,on=false,hist=[],tm=0;const P={R:10,L:50,U:10};
 const O=cvs(b,{ar:.5,draw:(c,w,hh)=>{const R={x:46,y:16,w:w-62,h:hh-50};const tau=P.L/1000/P.R,win=6*tau,Imax=P.U/P.R*1.1;const m=axes(c,R,[0,win*1000],[0,Imax],{xl:'Zeit t in ms',yl:'Strom I in A',xf:v=>fmtg(v),yf:v=>fmt(v,2),yo:38});
  const I0=P.U/P.R;line(c,[[R.x,m.y(I0)],[R.x+R.w,m.y(I0)]],'#9bb',1,[4,4]);text(c,'I∞ = U/R = '+fmt(I0,2)+' A',R.x+R.w-6,m.y(I0)-5,'#5b6b7a',11,'right');
  line(c,hist.map(p=>[m.x(p[0]*1000),m.y(p[1])]),'#0b6cb0',2.5);line(c,hist.map(p=>[m.x(p[0]*1000),m.y(Math.abs(p[2])/P.R)]),'#e8590c',1.5);
  const tx=m.x(tau*1000);line(c,[[tx,R.y],[tx,R.y+R.h]],'#2b9348',1,[3,3]);text(c,'τ',tx+3,R.y+12,'#2b9348',12);
  text(c,'Strom i(t)',R.x+8,R.y+14,'#0b6cb0',12);text(c,'u_L/R (Gegenspannung der Spule)',R.x+8,R.y+28,'#e8590c',12);

sim('condlab','Leitfähigkeitsmessung: Justieren, Messen, Einflussgrößen','Wähle eine Probe und ein Gerät. Zuerst: Ist die Frequenz passend (niedrige Leitfähigkeit → höhere Frequenz) und die Dicke ≥ 3δ? Dann schalte die Störeinflüsse ein: <b>Lack, Temperatur, Plattierung, Kante</b>. Streitfälle beginnen schon bei 0,2 MS/m Abweichung!',b=>{
 const S=[['Al-99,5',35],['Al-2014-T6',22.5],['Al-2024-T3',16.5],['Al-2024-T6',22.5],['Al-7075-T6',18.5],['Al-7075-T73',23.5],['Al-Li-Legierung',10.72],['Austenit',1.36],['Titanlegierung',.63]];

sim('tube','Rohr durch die Spule führen: Absolut, Differenz, Doppel- und Mehrfachdifferenz','Ziehe das Rohr nach links/rechts durch das Spulensystem. Wähle kurze oder lange Fehler und schalte <b>Wackeln</b> und <b>Temperaturdrift</b> zu. Welche Schaltung zeigt den langen Fehler dauerhaft? Welche unterdrückt Wackeln und Drift?',b=>{
 const P={sys:'abs',len:6,wob:0,drift:0,pos:-150,dep:1};const sg=9,a=22,u0=0;
 const Sabs=x=>{let s=0;for(let u=u0-10;u<=u0+P.len+10;u+=1){const d=(u>=u0&&u<=u0+P.len)?P.dep:0;if(d)s+=Math.exp(-Math.pow((x-u)/sg,2)/2)}s/=(sg*2.5066);return s+P.wob*.5*Math.sin(x/8)+P.drift*x/300};
 const S=x=>{switch(P.sys){case'abs':return Sabs(x);case'diff':return Sabs(x-a/2)-Sabs(x+a/2);case'dd':return(Sabs(x-a)-2*Sabs(x)+Sabs(x+a))*-1;default:return(Sabs(x-1.5*a)-Sabs(x-.5*a)+Sabs(x+.5*a)-Sabs(x+1.5*a))*.9}};
 const O=cvs(b,{ar:.75,draw:(c,w,hh)=>{c.fillStyle='#f7fafc';c.fillRect(0,0,w,hh);const sh=hh*.34,cy=sh*.55,k=w/420,ox=w/2;const X=v=>ox+v*k;
  c.fillStyle='#aebdca';c.fillRect(0,cy-14,w,28);c.fillStyle='#d62839';c.fillRect(X(P.pos+u0),cy-14,P.len*k,10);c.fillStyle='rgba(255,255,255,.5)';for(let i=0;i<w;i+=26)c.fillRect(i,cy+2,12,3);
  const coils={abs:[0],diff:[-a/2,a/2],dd:[-a,0,a],md:[-1.5*a,-.5*a,.5*a,1.5*a]}[P.sys];c.strokeStyle='#b5651d';c.lineWidth=3;coils.forEach((x,i)=>{c.beginPath();c.ellipse(X(x),cy,6,26,0,0,TAU);c.stroke();c.fillStyle='#b5651d';c.font='11px system-ui';text(c,(P.sys==='dd'&&i===1)||(P.sys==='md'&&i%2===0)?'−':'+',X(x),cy-32,'#425566',12,'center')});
  text(c,'Rohr (mit Fehler in Rot) mit Finger/Maus ziehen ↔',8,sh-4,'#6b7b8a',11);
  const R={x:36,y:sh+10,w:w-48,h:hh-sh-44};const xr=[-210,210];const m=axes(c,R,xr,[-.1,.1],{nx:6,ny:2,xl:'Rohrposition relativ zur Spule in mm',xf:v=>fmt(v,0),yf:()=>'',nolab:false});
  const ymax=Math.max(.001,...Array.from({length:84},(_,i)=>Math.abs(S(-210+i*5-P.pos))))*1.15;const pts=[];for(let x=-210;x<=210;x+=3)pts.push([m.x(x),R.y+R.h/2-S(x-P.pos)/ymax*R.h/2]);line(c,pts,'#0b6cb0',2.2);
  line(c,[[m.x(0),R.y],[m.x(0),R.y+R.h]],'#999',1,[3,3]);const cur=S(0-P.pos);dot(c,m.x(0),R.y+R.h/2-clamp(cur/ymax,-1,1)*R.h/2,5,'#e8590c');text(c,'Signal',R.x+6,R.y+12,'#0b6cb0',12)}});
 O.drag((x,y,t)=>{if(t==='down'||t==='move'){P.pos=clamp((x-O.w/2)/(O.w/420),-200,200);O.redraw()}});
 const cr=h('div',{cls:'ctls'});b.append(cr);const rd=()=>O.redraw();slider(cr,{label:'Fehlerlänge',min:1,max:150,log:true,value:6,unit:'mm',on:v=>{P.len=v;rd()}});slider(cr,{label:'Wackeln (Abstand)',min:0,max:1,step:.05,value:0,fmt:v=>fmt(v*100,0)+' %',on:v=>{P.wob=v;rd()}});slider(cr,{label:'Temperaturdrift',min:0,max:1,step:.05,value:0,fmt:v=>fmt(v*100,0)+' %',on:v=>{P.drift=v;rd()}});
 seg(b,[['abs','Absolutsystem'],['diff','Differenz'],['dd','Doppeldifferenz'],['md','Mehrfachdifferenz']],'abs',v=>{P.sys=v;rd()});b.append(h('div',{cls:'cap'},'Differenzspulen reagieren auf kurze Fehler (und die Enden langer Fehler), Absolutspulen liefern bei langen Fehlern ein Dauersignal – aber auch Wackel-, Temperatur- und Abhebeeffekte.'))});

 const P={DP:30,DS:34,off:0,type:'out'};const eta=()=>P.type==='out'?Math.pow(P.DP/P.DS,2):Math.pow(P.DS/P.DP,2);
 const O=cvs(b,{ar:.5,draw:(c,w,hh)=>{c.fillStyle='#f7fafc';c.fillRect(0,0,w,hh);const cx=w*.27,cy=hh/2,sc=Math.min(w*.2,hh*.42)/Math.max(P.DP,P.DS);const out=P.type==='out';const Rs=P.DS/2*sc,Rp=P.DP/2*sc,ox=P.off*sc*.5;

  text(c,out?'Außendurchlaufsensor':'Innendurchlaufsensor',cx,hh-8,'#425566',12,'center');const e=eta();const bx=w*.55,bw=w*.4;

  const wob=P.off*(1-e)*.25;bar('Füllungsgrad η',e,hh*.2,e>=(out?.5:.8)?'#2b9348':'#d62839');bar('Empfindlichkeit',e,hh*.42,'#14618f');bar('Wackel-Störsignal',clamp(wob*2.5,0,1),hh*.64,'#e8590c');bar('Stör-Nutz-Abstand',clamp(e*(1-wob*2),0,1),hh*.86,'#7048e8');
  u('e',fmt(e,2),(out?e>=.5:e>=.8)?'g':'r');u('b',out?(e>=.95?'sehr hoch (Grenze 0,95)':e>=.5?'üblich 0,5 … 0,95':'zu klein für Fehlerprüfung'):(e>=.9?'optimal (≥ 0,9)':e>=.8?'noch zulässig (≥ 0,8)':'zu klein (< 0,8)'),(out?e>=.5:e>=.8)?'g':'r')}});
 const cr=h('div',{cls:'ctls'});b.append(cr);const rd=()=>O.redraw();slider(cr,{label:'Prüfgut-Durchmesser D_P',min:10,max:60,step:1,value:30,unit:'mm',on:v=>{P.DP=v;rd()}});slider(cr,{label:'Spulen-Durchmesser D_S',min:10,max:60,step:1,value:34,unit:'mm',on:v=>{P.DS=v;rd()}});slider(cr,{label:'Wackeln (Exzentrizität)',min:0,max:10,step:.5,value:0,unit:'mm',on:v=>{P.off=v;rd()}});
 seg(b,[['out','Außendurchlaufsensor: η = (D_P/D_S)²'],['in','Innendurchlaufsensor: η = (D_S/D_P)²']],'out',v=>{P.type=v;rd()});const u=readouts(b,[['e','Füllungsgrad η'],['b','Bewertung']])});

sim('setup','Prüfeinstellung prüfen (Rohrprüfung in der Fertigung)','Gib die Eckdaten ein. Der Check bewertet Frequenz, Filter, Schwelle, Magnetisierung und das ungeprüfte Rohrende nach den Regeln aus dem Skript.',b=>{
 const P={v:1,f:5,thr:30,ferro:true,mag:true,wall:3,D:33.7,proc:'bp',noise:false};const out=h('div',{cls:'card'});
 const run=()=>{const L=[];const ok=(c,t)=>L.push((c?'<span style="color:var(--ok)">✔</span> ':'<span style="color:var(--bad)">✘</span> ')+t);
  ok(P.f>=P.v,'Prüffrequenz '+fmtg(P.f)+' kHz vs. Faustregel ≥ 1 kHz je m/s ('+fmt(P.v,1)+' m/s ⇒ ≥ '+fmt(P.v,1)+' kHz) – genügend Schwingungen je Signal für die Demodulation.');
  const bp=[.5*P.v,2*P.v];L.push('ℹ Bandpass-Faustregel (Faktor 4): '+fmt(bp[0],1)+' … '+fmt(bp[1],1)+' × Liniengeschwindigkeit (Skala am Gerät).');
  ok(P.thr<100&&P.thr>=25&&P.thr<=50,'Alarmschwelle '+P.thr+' % – empfohlen 25–50 % der Skala; 100 % ist ungeschickt (keine Aussage über die Signalhöhe).');
  if(P.ferro){ok(P.mag,'Ferromagnetischer Werkstoff: Gleichstromvormagnetisierung bis zur Sättigung '+(P.mag?'vorhanden – μ nur noch ≈ 2…4, Volumenprüfung bis ca. 6 mm möglich.':'fehlt – nur Oberflächenprüfung, hohes Grundrauschen durch Weiß’sche Bezirke.'))}
  ok(P.wall<=6||!P.ferro,'Wandstärke '+P.wall+' mm: praktische Grenze der einseitigen Anwendung ca. 6 mm'+(P.wall>6?' – überschritten.':'.'));
  const fseam=P.f>=250?'Oberflächenprüfung (250 kHz–1 MHz üblich)':P.f<=10?'Nahtprüfung mit voller Durchdringung (5–10 kHz typisch)':'Zwischenbereich';L.push('ℹ Frequenzbereich: '+fseam+'.');
  L.push('ℹ Ungeprüftes Rohrende (Einzelrohrprüfung) ≈ Rohrdurchmesser ≈ '+fmt(P.D,0)+' mm'+(P.ferro?' (bei ferromagnetischen oft mehr)':'')+'.');
  ok(!P.noise||P.thr===30,'Ohne Bezugsreflektor: Grundrauschen auf 10 % einstellen und Schwelle auf 30 % → Signal-Rausch-Abstand ≥ 3:1.');out.innerHTML=L.join('<br>')};
 const cr=h('div',{cls:'ctls'});b.append(cr);slider(cr,{label:'Liniengeschwindigkeit',min:.1,max:6,step:.1,value:1,unit:'m/s',on:v=>{P.v=v;run()}});slider(cr,{label:'Prüffrequenz',min:.5,max:1000,log:true,value:5,unit:'kHz',on:v=>{P.f=v;run()}});slider(cr,{label:'Alarmschwelle',min:10,max:100,step:5,value:30,unit:'%',on:v=>{P.thr=v;run()}});slider(cr,{label:'Wandstärke',min:.5,max:12,step:.5,value:3,unit:'mm',on:v=>{P.wall=v;run()}});slider(cr,{label:'Rohrdurchmesser',min:10,max:250,step:1,value:34,unit:'mm',on:v=>{P.D=v;run()}});
 seg(b,[[true,'ferromagnetisch'],[false,'nichtferromagnetisch']],true,v=>{P.ferro=v;run()});seg(b,[[true,'mit Vormagnetisierung'],[false,'ohne Vormagnetisierung']],true,v=>{P.mag=v;run()});seg(b,[[false,'Bezugsreflektor vorhanden'],[true,'nur Grundrauschen']],false,v=>{P.noise=v;run()});b.append(out);run();
 b.append(h('div',{html:'<h3>Typische Liniengeschwindigkeiten</h3><table><tr><td>Edelstahlrohre, TIG</td><td>0,5–4 m/min</td></tr><tr><td>Edelstahlrohre, Laser</td><td>bis 12 m/min</td></tr><tr><td>Ferromagnetische Rohre, HF-Induktion</td><td>bis 120 m/min</td></tr><tr><td>Einzelrohr-Endkontrolle</td><td>bis 240 m/min</td></tr><tr><td>Umspulanlagen</td><td>bis 360 m/min</td></tr></table>'}))});

sim('spiral','Spiralvorschub und Rotiersensor: Überdeckung','Der Rotiersensor tastet das Rohr schraubenförmig ab. Die <b>Ganghöhe</b> (Vorschub je Umdrehung) muss kleiner als die Abtastbreite sein, sonst bleiben Streifen ungeprüft.',b=>{
 const P={v:30,n:600,w:12,D:40};const O=cvs(b,{ar:.5,draw:(c,w,hh)=>{const pitch=P.v*1000/P.n;const circ=Math.PI*P.D;c.fillStyle='#f7fafc';c.fillRect(0,0,w,hh);const R={x:30,y:16,w:w-44,h:hh-44},Lmm=pitch*5.5;const kx=R.w/Lmm,ky=R.h/circ;c.fillStyle='#dfe7ee';c.fillRect(R.x,R.y,R.w,R.h);

  text(c,'abgewickelte Rohroberfläche (Umfang π·D = '+fmt(circ,0)+' mm, senkrecht)',R.x,R.y+R.h+16,'#425566',12);const ov=(P.w-pitch)/P.w;u('p',fmt(pitch,1)+' mm',pitch<=P.w?'g':'r');u('w',P.w+' mm');u('o',pitch<=P.w?fmt(ov*100,0)+' % Überdeckung':fmt(100*(pitch-P.w)/pitch,0)+' % ungeprüft',pitch<=P.w?'g':'r')}});
 const cr=h('div',{cls:'ctls'});b.append(cr);const rd=()=>O.redraw();slider(cr,{label:'Vorschub v',min:1,max:120,step:1,value:30,unit:'m/min',on:v=>{P.v=v;rd()}});slider(cr,{label:'Drehzahl n',min:100,max:3000,step:50,value:600,unit:'U/min',on:v=>{P.n=v;rd()}});slider(cr,{label:'Abtastbreite (Wirkbreite)',min:2,max:40,step:1,value:12,unit:'mm',on:v=>{P.w=v;rd()}});slider(cr,{label:'Rohrdurchmesser',min:10,max:120,step:1,value:40,unit:'mm',on:v=>{P.D=v;rd()}});const u=readouts(b,[['p','Ganghöhe = v/n'],['w','Wirkbreite'],['o','Ergebnis']])});

sim('layer','Schichtdickenmessung: Justieren und Messen mit Einflussgrößen','Das Gerät (Wirbelstrom auf Aluminium, Lift-off als Messgröße) wird <b>nullgestellt</b> bzw. zweipunkt-justiert. Miss dann mit verschiedenen Störeinflüssen. Raue Oberfläche: Mittelwert aus ca. 10 Messungen und Nullmessung auf gleichrauem unbeschichtetem Stück!',b=>{

 const bias=()=>{let d=0;d+=-6*Math.log(P.sig/sigcal);d+={flat:0,edge:12,convex:9,concave:-10}[P.geo];d+=P.zeroRough?0:.9*P.rough*1;d+=.15*(P.T-Tcal);return d};
 const meas=()=>{const sd=(P.cal==='none'?.03:P.cal==='one'?.02:.01)*P.t+.3+(P.emi?6:0)+(P.mean?0:P.rough*.35);let n=P.mean?10:1,s=0;for(let i=0;i<n;i++)s+=P.t+bias()+gauss()*sd*(P.cal==='none'?1.2:1);let v=s/n;if(P.cal==='none')v+=3*(P.t/60)+(P.sig!==35?0:0);return Math.max(0,v)};
 const O=cvs(b,{ar:.46,draw:(c,w,hh)=>{c.fillStyle='#f7fafc';c.fillRect(0,0,w,hh);const bx=w*.06,by=hh*.5,bw=w*.4,tpx=P.t*.4;c.fillStyle=P.geo==='concave'?'#8d99a5':'#9aa8b4';c.fillRect(bx,by+10,bw,hh*.3);if(P.rough>0){c.fillStyle='#9aa8b4';for(let i=0;i<bw;i+=5)c.fillRect(bx+i,by+10-Math.abs(Math.sin(i*1.7))*P.rough*.6,3,P.rough*.6)}
  c.fillStyle='rgba(255,200,60,.85)';c.fillRect(bx,by+10-tpx*.2-P.rough*.3,bw,tpx*.2+2);c.fillStyle='#d98a3d';rrect(c,bx+bw*.35,by-28-tpx*.2,bw*.3,22,4);c.fill();text(c,'Sensor',bx+bw*.5,by-34-tpx*.2,'#425566',11,'center');text(c,'Schicht '+P.t+' µm',bx+bw/2,by+hh*.3+30,'#425566',12,'center');

vid('hyst',{title:'Magnetisierung, Sättigung und Hysterese',dur:44,caps:[[0,'Ein unmagnetischer Stahl wird durch ein Feld H aufmagnetisiert: Die Weiß’schen Bezirke richten sich aus – die Neukurve.'],[11,'Ab der Sättigung wächst die Induktion B kaum noch. Die Permeabilität μ = B/H sinkt.'],[20,'Wird das Feld zurückgenommen, bleibt Magnetismus zurück: die Remanenz B_r.'],[28,'Erst das Gegenfeld H_c, die Koerzitivfeldstärke, bringt B auf null. Mit Wechselfeld entsteht die ganze Hystereseschleife.'],[38,'Genau deshalb ist Permeabilität ein „unruhiger“ Störer – und Entmagnetisieren oder Sättigen so wichtig.']],

  const n=9,d0=t<11?seg01(t,0,11):1;for(let i=0;i<n;i++){const a=lerp(rn(i+3)*TAU,0,d0);arrow(c,w*.06+i%3*30,hh*.62+Math.floor(i/3)*28,w*.06+i%3*30+18*Math.cos(a),hh*.62+Math.floor(i/3)*28-18*Math.sin(a),'#9fb4c3',2,5)}VT(c,'Weiß’sche Bezirke',w*.06+40,hh*.58,'#9fb4c3',12)}});

vid('strecke',{title:'Rohrprüfstrecke: Magnetisieren – Prüfen – Entmagnetisieren',dur:44,caps:[[0,'Ein ferromagnetisches Rohr läuft in die Prüfstrecke. Die Weiß’schen Bezirke sind noch ungeordnet – das erzeugt Rauschen.'],[12,'Die Gleichfeld-Magnetisierung bringt das Rohr in die Sättigung: alle Bezirke zeigen in eine Richtung.'],[22,'Jetzt prüft die Spule: Der Fehler liefert ein klares Signal, das Grundrauschen ist deutlich gesunken.'],[32,'Zum Schluss entmagnetisiert ein abklingendes Wechselfeld das Rohr – es verlässt die Strecke ohne Restmagnetismus.']],

vid('rotier',{title:'Rotierende Tastsensoren: Vorschub und Überdeckung',dur:40,caps:[[0,'Das Rohr wird abgewickelt dargestellt: waagerecht die Länge, senkrecht der Umfang. Der Tastsensor rotiert und das Rohr läuft vor.'],[8,'Die Spur des Sensors ist eine Schraubenlinie. Ist die Ganghöhe kleiner als die Spurbreite, überlappen sich die Bahnen.'],[18,'Wird der Vorschub zu groß, bleiben ungeprüfte Streifen: Ein Längsfehler kann unentdeckt durchlaufen.'],[30,'Deshalb gilt: Ganghöhe kleiner als Abtastbreite – oder man vereinbart eine Mindestfehlerlänge.']],
 draw(c,t,w,hh){const x0=w*.08,y0=hh*.14,W=w*.84,H=hh*.62,ph2=t>=18,pitch=ph2?W*.17:W*.08,sw=W*.12,tt=ph2?clamp((t-18)/16,0,1):clamp(t/16,0,1);rect(c,x0,y0,W,H,'#1d2a34','#9fb4c3');

vid('naht',{title:'Schweißnahtprüfung: konventioneller und optimierter Sensor',dur:40,caps:[[0,'Der Sensor fährt quer über die Naht: Grundmaterial, Wärmeeinflusszone, Raupe – jedes mit eigener Permeabilität und Leitfähigkeit.'],[12,'Ein konventioneller Tastsensor reagiert auf diese Übergänge und Geometrieänderungen mit starken Störsignalen.'],[22,'Der optimierte Sensor mit entkoppelten, gekreuzten Wicklungen bleibt dort ruhig.'],[30,'Trifft er einen Riss, zeigt nur dieses Gerät ein klares Fehlersignal.']],

CHAPTERS.push({id:'v1',num:'V1',title:'Physikalische Grundlagen',sub:'Wechselstromkreis, Induktion, Impedanzebene und das Ähnlichkeitsgesetz der Wirbelstromprüfung.',min:75,html:`
<h2>1.1 Wiederholung: Wechselstrom und Induktion</h2>
<p>Im Grundkurs ET1 wurden Spannungsarten, das Induktionsgesetz sowie Erzeugen und Messen von Wirbelströmen behandelt. Hier wird das Wissen für die Stufe 2 vertieft. Zeitverhalten von Spannung und Strom folgen der Sinusfunktion:</p>
<div class="fm">U(t) = U<sub>max</sub> · sin(2π/T · t) &nbsp; · &nbsp; f = 1/T &nbsp; · &nbsp; ω = 2π/T = 2π·f</div>
<p>Für jeden Zeitpunkt gilt das Ohm’sche Gesetz I(t) = U(t)/R. Zum Rechnen nutzt man zeitunabhängige Größen wie die Maximalwerte U<sub>max</sub> und I<sub>max</sub>.</p>
<div data-sim="magnet"></div>
<div data-vid="induktion"></div>
<h2>1.2 Der Stromkreis mit Spule</h2>
<h3>Gleichstrom: Einschaltvorgang</h3>
<p>Die Selbstinduktion wirkt jeder Stromänderung entgegen. Beim Einschalten steigt der Strom daher nicht sprunghaft, sondern allmählich bis I = U<sub>0</sub>/R an. Die Zeitkonstante ist τ = L/R.</p>
<div data-sim="rl_dc"></div>
<h3>Wechselstrom: Phasenverschiebung und Impedanz</h3>
<p>Wegen der „Trägheit“ der Selbstinduktion wächst der Strom langsamer als die Spannung und erreicht sein Maximum später: Strom und Spannung sind um Δt <b>phasenverschoben</b>. Am induktiven Widerstand beträgt die Phasenverschiebung <b>90°</b>, am ohmschen <b>0°</b>. Deshalb dürfen U<sub>R,max</sub> und U<sub>L,max</sub> nicht einfach addiert werden:</p>
<div class="fm">X<sub>L</sub> = 2π·f·L<br>U²<sub>max</sub> = U²<sub>R max</sub> + U²<sub>L max</sub><br>Z² = R² + X<sub>L</sub>² &nbsp;·&nbsp; tan Δφ = X<sub>L</sub>/R &nbsp;·&nbsp; Δφ = 2π/T · Δt</div>
<div data-sim="rl_ac"></div>
<div class="merke">Der Wechselstromwiderstand einer Spule <b>steigt mit der Frequenz</b>. Die grafische Ermittlung von Z (Rechteck-Diagonale aus R und X<sub>L</sub>) ist die Grundlage der Impedanzebene.</div>
<h2>1.3 Induktion und Spulen</h2>
<h3>Selbstinduktion ohne und mit Eisenkern</h3>
<p>Der Strom erzeugt in den eigenen Windungen einen Kraftfluss; dessen Änderung induziert eine Gegenspannung, die der Ursache entgegenwirkt (Lenz). Bei Gleichstrom macht sie sich nur beim Ein-/Ausschalten bemerkbar, bei Wechselstrom ist sie ständig vorhanden und wirkt wie ein <b>scheinbarer Widerstand</b>.</p>
<div class="fm">L = μ<sub>0</sub> · n²/l · A &nbsp;(Luftspule)<br>L = μ<sub>0</sub> · μ<sub>r</sub> · n²/l · A &nbsp;(mit Kern)</div>
<p>L wächst quadratisch mit der Windungszahl n, proportional mit der Fläche A, und steigt, wenn man die Windungen auf kürzerer Länge l zusammendrängt. Ein Eisenkern verstärkt das Feld um den Faktor μ<sub>r</sub>.</p>
<h3>Effektive Permeabilität</h3>
<p>Ein nichtferromagnetischer Leiter (z. B. Aluminiumkern) schwächt das Spulenfeld durch Wirbelströme nach Lenz. Das lässt sich formal der Permeabilität zuordnen: der <b>effektiven Permeabilität μ<sub>eff</sub></b>. Sie ist im Wesentlichen eine Funktion von <b>Frequenz, Leitfähigkeit, relativer Permeabilität und Geometrie</b>.</p>
<div data-sim="coil_l"></div>
<h2>1.4 Impedanzebene: Wirk- und Blindwiderstand</h2>
<p>Ein ohmscher Widerstand wandelt Energie in Wärme um (Verlustleistung) – er ist ein <b>Wirkwiderstand R</b>. Der induktive Widerstand einer verlustarmen Spule bringt keine Leistungsverluste – er ist ein <b>Blindwiderstand</b>.</p>
<div class="merke">Tritt in einem Stromkreis Erwärmung auf, muss dort ein Wirkwiderstand vorhanden sein. <b>Wirbelströme beeinflussen Blind- und Wirkwiderstand</b>: Die Spule mit Aluminiumkern erwärmt sich bei Wechselstrom auch im Kern.</div>
<p>Trägt man Blind- und Wirkwiderstand senkrecht zueinander auf, erhält man die <b>Impedanzebene</b> – in abgewandelter Form die gängige Anzeige für Wirbelstromsignale. Auch Spannung, Strom oder μ<sub>eff</sub> können so dargestellt werden.</p>
<h2>1.5 Grundlagen der Wirbelstromprüfung</h2>
<h3>Messgrößen und Parameter</h3>
<p>Eine Spule über einer Platte aus nichtferromagnetischem Werkstoff erzeugt ein Wechselfeld H. Es induziert im Prüfgegenstand Wirbelströme I<sub>W</sub>, deren Feld H<sub>W</sub> dem Spulenfeld entgegengerichtet ist. Das <b>resultierende Feld</b> beeinflusst Phasenverschiebung Δφ, Stromstärke I und Spannung U an der Spule – abhängig von Stromstärke und Verteilung der Wirbelströme, also von Leitfähigkeit, Ungänzen, Oberfläche und Geometrie.</p>
<table><tr><th>Messgrößen</th><td>Spannung U, Phasenverschiebung Δφ</td></tr><tr><th>Einflussgrößen</th><td>Frequenz f, Strom I, Windungszahl und Spulenform, Abstand Spule–Prüfgegenstand, Leitfähigkeit σ, Permeabilität μ, Geometrie des Werkstücks</td></tr><tr><th>Gesucht</th><td>Ungänzen, Formänderungen, Leitfähigkeits- und Permeabilitätsänderungen</td></tr></table>
<div data-vid="wirbel"></div>
<div data-sim="eddy"></div>
<h3>Das Ähnlichkeitsgesetz</h3>
<p>Für eine Stange (Durchmesser D<sub>P</sub>) in einer Außenspule (D<sub>S</sub>) definiert man den <b>Füllungsgrad η = (D<sub>P</sub>/D<sub>S</sub>)²</b> (bei Außensensoren kleiner als 1). Um von den Spuleneigenschaften unabhängig zu werden, <b>normiert</b> man die Impedanz auf den Blindwiderstand ωL<sub>0</sub> der leeren Spule:</p>
<div class="fm">X̄<sub>L</sub> = ωL / ωL<sub>0</sub> &nbsp;·&nbsp; R̄ = (R − R<sub>0</sub>) / ωL<sub>0</sub><br>k<sub>a</sub> = f / f<sub>g</sub> &nbsp;·&nbsp; f<sub>g</sub> = 5066 / (σ · μ<sub>r</sub> · D<sub>P</sub>²) [Hz]<br><small>σ in MS/m, D<sub>P</sub> in cm; nur bei Vollmaterial (Stange)</small></div>
<p>Beispiel: Kupferdraht (σ = 50,5 MS/m, μ<sub>r</sub> = 1) mit D = 1 cm hat f<sub>g</sub> = 100 Hz; mit D = 2 cm 25 Hz.</p>
<div class="def"><b>Ähnlichkeitsgesetz:</b> Die Feldstärke- und Wirbelstromverteilung in unterschiedlichen Werkstücken ist die gleiche, wenn mit der <b>gleichen Arbeitskonstante</b> geprüft wird. Betragsgleiche Leitfähigkeitsänderungen oder prozentual gleich tiefe Formänderungen liefern dann die gleiche Anzeige.</div>
<div data-sim="norm"></div>
<h3>Verhalten der normierten Darstellung</h3>
<p>Mit zunehmender Frequenz durchläuft die Spannung vom Punkt (0 | 1) ausgehend eine Kurve: Im unteren Bereich wächst der <b>Wirkwiderstand</b> (wachsende Wirbelstromverluste), bei hohen Frequenzen sinkt er wieder, weil die Eindringtiefe abnimmt. Der <b>induktive Widerstand</b> sinkt kontinuierlich, da das Spulenfeld durch die Wirbelströme verdrängt wird (Skineffekt) – beim Zylinder abhängig vom Füllungsgrad.</p>
<h3>Feldverteilung</h3>
<p>Das Feld einer Luftspule macht man mit Eisenfeilspänen sichtbar; bei der Wirbelstromprüfung nicht – Feldverteilungen realer Spulen (Tastsensor, Außendurchlaufsensor) werden berechnet. Der Tastsensor hat ein kleines, oberflächennahes Wechselwirkungsvolumen.</p>
<div data-fc='[["Ähnlichkeitsgesetz","Gleiche Arbeitskonstante k = f/fg ⇒ gleiche Feld- und Wirbelstromverteilung in unterschiedlichen Werkstücken."],["Blindwiderstand","X_L = 2π·f·L – keine Verlustleistung, keine Erwärmung."],["Füllungsgrad (außen)","η = (D_P/D_S)² < 1"],["μ_eff","Zusammenfassung aller Körpereigenschaften, die B beeinflussen: f, σ, μr, Geometrie."]]'></div>`,
quiz:[
Q('Wie ändert sich der Wechselstromwiderstand einer Spule bei steigender Frequenz?',['Er sinkt','Er steigt','Er bleibt gleich','Er schwankt zufällig'],1,'X_L = 2π·f·L steigt proportional mit f.'),
NUM('Eine Spule mit L = 10 mH wird mit f = 1 kHz betrieben. Wie groß ist X_L in Ω?',62.83,'Ω','X_L = 2π · 1000 Hz · 0,01 H ≈ 62,8 Ω.'),
NUM('R = 30 Ω und X_L = 40 Ω. Wie groß ist die Impedanz Z in Ω?',50,'Ω','Z = √(30² + 40²) = 50 Ω.'),
Q('Welche Phasenverschiebung zwischen Strom und Spannung herrscht an einer idealen Induktivität?',['0°','45°','90°','180°'],2,'Am induktiven Widerstand 90°, am ohmschen 0°.'),
Q('Ein Aluminiumkern in einer wechselstromgespeisten Spule …',['erhöht L stark wie Eisen','schwächt durch Wirbelströme das Feld und erwärmt sich','hat keinerlei Einfluss','macht den Strom zu Gleichstrom'],1,'Wirbelströme (Lenz) schwächen das Feld (μ_eff < 1) und verursachen Verluste = zusätzlicher Wirkwiderstand.'),
Q('Wovon hängt die effektive Permeabilität im Wesentlichen ab?',['Nur von der Frequenz','Frequenz, Leitfähigkeit, relative Permeabilität und Geometrie','Nur von der Temperatur','Nur vom Spulenstrom'],1,'So steht es im Skript (1.3.3).'),
NUM('Kupferstange (σ = 50,5 MS/m, μr = 1) mit D = 2 cm: Wie groß ist die Grenzfrequenz f_g in Hz?',25,'Hz','f_g = 5066 / (50,5 · 1 · 4) ≈ 25 Hz.',.03),
Q('Was besagt das Ähnlichkeitsgesetz der Wirbelstromprüfung?',['Gleiche Frequenz → gleiche Anzeige','Gleiche Arbeitskonstante f/f_g → gleiche Feld- und Wirbelstromverteilung','Gleiche Spule → gleiche Eindringtiefe','Gleiche Leitfähigkeit → gleiche Phasenlage'],1,'Nicht die Frequenz, sondern k = f/f_g muss gleich sein.'),
TF('Ein Wirkwiderstand verursacht Erwärmung, ein Blindwiderstand nicht.',true,'Wirkwiderstand = Verlustleistung; Blindwiderstand = keine Verluste.'),
MU('Welche Größen sind Messgrößen der Wirbelstromprüfung (praktisch)?',['Spannung U','Phasenverschiebung Δφ','Frequenz f','Windungszahl'],[0,1],'Frequenz und Windungszahl sind Parameter/Einflussgrößen.'),
Q('Im niedrigen Frequenzbereich der normierten Impedanzkurve wächst …',['der Blindwiderstand','der Wirkwiderstand wegen wachsender Wirbelstromverluste','nichts','die Eindringtiefe'],1,'Der Wirkanteil steigt zunächst, geht bei hohen Frequenzen wieder zurück.')]});

CHAPTERS.push({id:'v2',num:'V2',title:'Gerätetechnik, Anwendungsübersicht',sub:'Nutz-zu-Störsignal, Phasenselektion, Filter, Sensortypen, Schaltungen, Blockschaltbild und Auswertearten.',min:80,html:`
<h2>2.1 Einleitung</h2>
<p>Spulensysteme und Gerätetechnik müssen immer zusammen betrachtet werden: Zuverlässige, reproduzierbare Ergebnisse gibt es nur, wenn Prüfgerät, Spulensystem und Prüfproblem optimal aufeinander abgestimmt sind.</p>
<h2>2.2 Nutz-zu-Störsignalverhältnis</h2>
<p>Je nach Prüfaufgabe sind Einflussgrößen hilfreich (+) oder störend (–):</p>
<div class="tw"><table><tr><th>Prüfaufgabe</th><th>Abstand</th><th>Geometrie</th><th>Permeabilität</th><th>Leitf. partiell</th><th>Leitf. integral</th></tr><tr><td>Sortierprüfung</td><td>–</td><td>–</td><td>+</td><td>+</td><td>–</td></tr><tr><td>Formtreue</td><td>+</td><td>+</td><td>–</td><td>–</td><td>–</td></tr><tr><td>Materialtrennungen</td><td>–</td><td>–</td><td>–</td><td>–</td><td>+</td></tr></table></div>
<div class="merke">Das <b>Nutz-zu-Störsignalverhältnis</b> verbessert man durch fünf Maßnahmen: (1) Sensorgeometrie/Kombination mehrerer Sensoren, (2) Prüffrequenz bzw. Mehrfrequenz, (3) <b>Phasenselektion</b>, (4) <b>Vormagnetisierung</b>, (5) <b>Filtereinstellungen</b>.</div>
<h2>2.3 Unterdrückung von Störgrößen</h2>
<h3>Phasenselektion</h3>
<p>Verschiedene Fehlerarten (auch Nutz- und Störsignal) haben je nach Prüffrequenz unterschiedliche Amplituden und Phasenlagen. Mit Bewertungsmaske und <b>Phasensteller</b> (reproduzierbar in 1°-Schritten von 0–360°) dreht man die Auswertemaske so, dass das Nutzsignal im auswertenden Bereich liegt und das Störsignal unterdrückt wird – z. B. Trennung von Außen- und Innenfehlern bei der Rohrprüfung.</p>
<div data-sim="phase"></div>
<h3>NF-Filter</h3>
<p>Echte Fehler (Materialtrennungen) liefern meist <b>höherfrequente</b> Signale als langsame Leitfähigkeitsänderungen oder Vibrationen. Daher lässt man das demodulierte Signal ein NF-Filter durchlaufen (umschaltbar <b>Hochpass</b> oder <b>Bandpass</b>; Bandbreite an Prüfgeschwindigkeit anpassbar). Welcher Typ optimal ist, muss durch Versuch ermittelt werden.</p>
<div data-sim="filter"></div>
<h3>Magnetische Sättigung</h3>
<p>Bei ferromagnetischen Materialien (Stahlrohre) schwankt μ so stark, dass die Oberflächenfehlerprüfung unmöglich werden kann. Ein <b>Magnetisierungsjoch</b> erzeugt ein starkes Gleichfeld in Rohrlängsachse; die Permeabilität wird auf einen Wert nahe 1 reduziert (→ V3).</p>
<h2>2.4 Spulensysteme</h2>
<p>Drei Haupttypen: <b>Durchlaufspule</b> (Koaxialsensor), <b>Segmentspule</b>, <b>Tastspule</b>. Wähle unten eine Prüfaufgabe (Tab. 2.2) und sieh die passenden Systeme.</p>
<div data-sim="spulen"></div>
<h2>2.7 Aufbau von Wirbelstromprüfgeräten</h2>
<p>Geräte reichen vom vollautomatischen Prüfgerät bis zum batteriebetriebenen Handgerät; man unterscheidet <b>Prüfgeräte</b> (Oberflächen-/QS-Prüfung) und <b>Messgeräte</b> (physikalische/geometrische Eigenschaften). Beispiele: Das <b>Leitfähigkeitsmessgerät</b> arbeitet mit Kompensationsschaltung (Nullinstrument), das <b>Sortiergerät</b> mit Differenzverstärker, Phasensteller, Bandsperre (gegen Netzstörungen), umschaltbarem Bandpass, Demodulator, Toleranzlampe.</p>
<div data-sim="blocks"></div>
<h3>Auswertearten</h3>
<ul><li><b>Amplitudenauswertung</b> (Kreisschwelle/polar): phasenunabhängig, einfachste und sicherste Bewertung, wenn keine Störsignale gleicher Größe und eindeutiger Phase vorliegen.</li><li><b>Phasen-Amplituden-Auswertung</b> (z. B. Sektormarke): bevorzugt Signale mit bestimmter Phasenlage, unterdrückt Störsignale – vorher umfassende Untersuchung von Fehler- und Störsignalen nötig.</li><li><b>Y-Komponenten-Auswertung</b>: Fehler gilt, wenn die Y-Komponente die Schwelle erreicht – bevorzugt, wenn sich Stör- und Fehlersignal klar in der Phase unterscheiden.</li><li><b>Korrelationsauswertung</b>: zwei identische Differenzsysteme im Abstand a; echter Fehler erzeugt zwei Signale im Abstand t = a/v. Funktioniert selbst bei 10 m/s mit starker Vibration.</li></ul>
<div data-sim="korr"></div>`,
quiz:[

Q('Wofür wird der Tastsensor im Absolutverfahren typischerweise genutzt?',['Fehlerprüfung','Leitfähigkeit, Ferritgehalt, Schichtdicke','Rohr-Dichtheitsprüfung','Prüfen von Drähten'],1,'Differenzverfahren dagegen für die Fehlerprüfung.'),

CHAPTERS.push({id:'v3',num:'V3',title:'Permeabilität',sub:'Hysteresekurve, Permeabilitätsarten, Ferritgehalt, Vormagnetisierung und Unterdrückung von Permeabilitätsstörungen.',min:60,html:`
<h2>3.1 Arten der Permeabilität</h2>
<p>Bei ferromagnetischen Werkstoffen verknüpft die <b>Hysteresekurve</b> die Feldstärke H mit der Flussdichte B. Sättigung tritt bei etwa 20–60 A/cm ein (ca. 1 Tesla und mehr).</p>
<div data-sim="hyst"></div>
<table><tr><th>Art</th><th>Bedeutung</th></tr><tr><td><b>Absolute Permeabilität</b> μ = B/H (Vs/Am)</td><td>nur für magnetische <b>Gleichfelder</b> definiert – für ET ohne Belang</td></tr><tr><td><b>Relative Permeabilität</b> μ<sub>r</sub> = μ/μ<sub>0</sub></td><td>dimensionslos; μ<sub>0</sub> = 4π·10⁻⁷ Vs/Am; „wievielmal größer B als im Vakuum“</td></tr><tr><td><b>Relative Amplitudenpermeabilität</b> μ<sub>amp</sub></td><td>Steigung der Schleife bei <b>kleiner Wechselfelderregung</b>; maßgeblich ohne Gleichfeld-Vormagnetisierung</td></tr><tr><td><b>Überlagerungspermeabilität</b> μ<sub>Δ</sub></td><td>wie μ<sub>amp</sub>, aber mit Gleichfeld-Vormagnetisierung; abhängig vom überlagerten Wechselfeld ΔH – die <b>entscheidende Kenngröße</b> bei der Wirbelstromprüfung</td></tr></table>
<h2>3.2 Permeabilität bei der Wirbelstromprüfung</h2>
<h3>Einfluss auf die Wirbelstromverteilung</h3>
<p>μ<sub>amp</sub> und μ<sub>Δ</sub> bestimmen die Wirbelstromverteilung und damit die effektive Permeabilität – <b>geometrieabhängig</b>: Der volle Einfluss zeigt sich erst beim Vollzylinder; mit abnehmender Wanddicke wird er geringer. In der Praxis (kurze Spulen, Füllfaktor ≪ 1) ist der Einfluss noch kleiner.</p>
<h3>Permeabilität als Messgröße</h3>
<ul><li>Legierungs- und Gefügeunterschiede, Kern-/Randhärte, Einhärtetiefe, Aufkohlung, Randentkohlung, innere Spannungen.</li><li>Absolute Permeabilität meist nicht bestimmbar → nur <b>Relativmessungen</b> bei konstanter Geometrie.</li></ul>
<h3>Ferritgehaltsmessung</h3>
<p>Der starke Einfluss von μ<sub>Δ</sub> ermöglicht die Messung des δ-Ferritgehalts in austenitischen Auftragsschweißungen (Behälter- und Kesselbau). Austenit hat σ ≈ 1–2 MS/m; mit <b>phasenselektiver Auswertung</b> und einer Frequenz, bei der σ- und μ-Änderung <b>90°</b> auseinanderliegen, wird der σ-Einfluss unterdrückt. Der Tastsensor hat gleichsinnig in Reihe geschaltete Erreger- und gegensinnig geschaltete Messspulen; Messbereich &lt; 3 mm.</p>
<div data-sim="ferrit"></div>
<div class="warn">Es gibt kein zerstörendes <i>oder</i> zerstörungsfreies Verfahren zur <b>absoluten</b> Bestimmung des Ferritgehalts. Das System arbeitet mit „<b>Ferritzahlen</b>“: Sekundärstandards (Kalibrierstücke aus Auftragsschweißungen) werden über das Haftkraftverfahren (AWS A4.2-74) an Primärstandards (Weicheisen mit Cu-Überzug) angeschlossen. Wirbelstrom liefert sehr genaue <b>Relativmessungen</b>.</div>
<h3>Permeabilität als Störgröße</h3>
<p>Bei der Fehlerprüfung ferromagnetischer Werkstoffe stört nicht μ selbst, sondern seine <b>Schwankung</b> (Erstarrung, Herstellprozess wie Walzen/Schweißen, Lagerung/Transport z. B. Magnethebekran). Die Störsignale haben keine Vorzugsphase – Signale aus verschiedenen Tiefen haben wegen des Skineffekts unterschiedliche Phasenwinkel – und können gleiche Breite wie echte Fehler haben. Daher <b>keine Trennung per Phasenselektion</b>.</p>
<div class="merke">Jeder Einfluss der Permeabilität ist bei der Wirbelstromfehlerprüfung zu vermeiden. Drei Wege: (1) Prüfung <b>über dem Curiepunkt</b>, (2) <b>magnetische Sättigung</b> mit Gleichfeld, (3) <b>kleinerer Sensor bei höherer Prüffrequenz</b> (z. B. Tastsensor: kleines erfasstes Volumen im Verhältnis zum Fehlervolumen).</div>
<h3>Vormagnetisierung richtig dimensionieren</h3>
<p>Die Gleichfeldstärke muss so hoch sein, dass <b>alle</b> Orte im Zustand der Sättigung sind, damit die Überlagerungspermeabilitäten ausreichend gleich sind. Im Fehlerbereich können vor und hinter Inhomogenitäten nicht voll gesättigte Zonen („<b>magnetische Zwickel</b>“) entstehen. Das Bohrungssignal durchläuft bei niedrigen Feldstärken Minima und Maxima und strebt erst bei hohen Feldstärken einem Grenzwert zu – Längsrisse zeigen den Effekt schwächer, aber mit breitenabhängigem Anstieg.</p>
<div data-sim="premag"></div>
<div class="tip">Wird bei zu niedriger Vormagnetisierung gearbeitet, drohen instabile Arbeitspunkte mit starken Amplituden- und Phasenschwankungen – die Prüfung ist dann nicht reproduzierbar. Der <b>Tastsensor</b> ist durch sein kleines Wechselwirkungsvolumen empfindlicher als der Durchlaufsensor und arbeitet meist ohne Vormagnetisierung.</div>`,
quiz:[
Q('Welche Permeabilität ist bei der ET mit Gleichfeld-Vormagnetisierung die entscheidende Kenngröße?',['Absolute Permeabilität','Anfangspermeabilität','Überlagerungspermeabilität','Vakuumpermeabilität'],2,'Sie gilt für überlagertes Wechselfeld bei Vormagnetisierung.'),

CHAPTERS.push({id:'v4',num:'V4',title:'Leitfähigkeit',sub:'Leitfähigkeitsmessung nach dem Wirbelstromverfahren, Eindringtiefe, Justierkörper und Einflussgrößen.',min:70,html:`
<h2>4.1 Einleitung und Grundlagen</h2>
<p>Leitfähigkeitsmessung in der ZfP ist die Messung der elektrischen Leitfähigkeit σ in <b>MS/m</b> oder <b>%IACS</b>. Mit Wirbelstrom ist sie nur an <b>nicht-ferromagnetischen</b> Werkstoffen möglich. Besonders bei aushärtbaren <b>Aluminiumlegierungen</b> hängt σ vom Warmbehandlungszustand ab – und damit von Härte und Festigkeit.</p>
<div class="def"><b>Leitfähigkeit</b> σ = 1/ρ = L/(R·A) in MS/m. <b>%IACS</b>: 0 % = Luft, 100 % = geglühtes Reinkupfer (58 MS/m). Umrechnung: <b>1 MS/m = 1,724 %IACS</b>; 1 %IACS = 0,58 MS/m.</div>
<h3>Standard-Eindringtiefe</h3>
<p>Die Tiefe, bei der die Wirbelstromdichte auf <b>1/e ≈ 37 %</b> des Oberflächenwerts abgesunken ist:</p>
<div class="fm">δ [mm] = 503 / √(f · σ · μ<sub>r</sub>) &nbsp;(f in Hz, σ in MS/m)<br>δ = 660 / √(f · σ · μ<sub>r</sub>) &nbsp;(σ in %IACS)</div>
<div data-vid="skin"></div>
<div data-sim="skin"></div>
<h3>Spulensysteme, Frequenz, Justierkörper</h3>
<ul><li><b>Tastsensor in Absolutschaltung</b> ist üblich; Differenzschaltung nur im <b>Fremdvergleich</b> (nicht im Selbstvergleich). Spulen sind größer als für die Fehlersuche – das gleicht örtliche Schwankungen aus.</li><li><b>Prüffrequenz:</b> Je niedriger die zu untersuchende Leitfähigkeit, desto höher die Frequenz. Einfache Geräte: Festfrequenz 60 oder 100 kHz für σ ≥ 5 MS/m und 500 kHz für σ ≤ 5 MS/m (analoge Anzeige).</li><li><b>Justierkörper:</b> Ohne Justierung kein genauer Wert. Zertifiziert, rückführbar (PTB). Ebene Platten, Ø ≈ 25 mm größer als der Spulendurchmesser, Dicke ≥ <b>3 δ</b>, unbeschichtet, hohe Oberflächengüte.</li></ul>
<div class="warn">Schon Abweichungen von <b>0,2 MS/m</b> können zu Streitfällen zwischen Lieferant und Kunde führen, wenn sie im Grenzbereich der Abnahmevorschrift liegen.</div>
<h2>4.3 Zweck, Messprinzip, Anwendung</h2>
<p>Informationen über den <b>Warmbehandlungszustand</b> (Luft-/Raumfahrt), Homogenitätsüberprüfung, <b>Verwechslungsprüfung</b>, Reinheitsgrad (z. B. Phosphorgehalt in Kupfer), Wiederverwendbarkeit nach Brandschaden. Beim Aufsetzen des Tastsensors ändert sich die Impedanz; verschiedene σ liefern eine <b>Ortskurve der Leitfähigkeiten</b>. In der Praxis nutzt man Leitfähigkeits-Messgeräte, die die Impedanzebene auswerten und σ direkt anzeigen (MS/m oder %IACS).</p>
<div class="tw"><table><tr><th>Werkstoff / Zustand</th><th>σ in MS/m</th><th>%IACS</th></tr><tr><td>Al-99,5</td><td>35</td><td>60</td></tr><tr><td>Al-2014 T3/T4 · T6</td><td>18–20 · 21–24</td><td>31–35 · 37–42</td></tr><tr><td>Al-2024 T3/T4 · T6</td><td>14–19 · 21–24</td><td>28–33 · 36–41</td></tr><tr><td>Al-7075 T6/T651 · T73</td><td>17–20 · 22–25</td><td>30–35 · 38–43</td></tr><tr><td>Al-Li-Legierung</td><td>10,72</td><td>18,5</td></tr><tr><td>Austenit</td><td>1,36</td><td>2,3</td></tr><tr><td>Ti-Legierung</td><td>0,63</td><td>1,1</td></tr></table></div>
<h2>4.6 Einflussgrößen</h2>
<ul><li><b>Bauteildicke &lt; δ:</b> neue Ortskurve → verfälschter Wert; Abhilfe: andere Frequenz oder mehrere Lagen.</li><li><b>Kanten und Krümmungen:</b> konvex/Kante: eingeschränkte Wirbelströme; konkav: mehr. Ohne Korrektur messbar bei konkav r &gt; 500 mm, konvex r &gt; 100 mm (grobe Richtlinie, Niederfrequenz).</li><li><b>Beschichtungen (Lack):</b> Lift-off-Ortskurve; Abhilfe: Justierung mit gleicher Zwischenschicht.</li><li><b>Plattierung</b> (Reinaluminium ≈ 35 MS/m auf Grundwerkstoff 10–28 MS/m): „Mischleitfähigkeit“ → zu hoher Wert; vertrauenswürdig erst nach Entfernen der Schicht.</li><li><b>Temperatur:</b> Tabellen für 20 °C; mittlerer Korrekturwert für Al-Legierungen 0,0016 MS/m je °C (Skript). Gerät, Justierkörper, Sensor, Bauteil auf Umgebungstemperatur.</li></ul>
<div data-sim="condlab"></div>
<h3>Korrelation mit mechanischen Eigenschaften</h3>
<p>Ein Zusammenhang σ ↔ Festigkeit/Härte ist möglich, aber nicht immer eindeutig – ein <b>Versuchsprogramm</b> ist nötig. Bei Al-Legierungen kann es eine <b>Doppeldeutigkeit</b> geben (gleiche σ bei zwei Temperaturen) – eine Härteprüfung (ggf. mobil) oder Anlassfarben lösen sie; zerstörende Prüfung an mitbehandelten Probestäben ist die schlechteste/aufwendigste Option. Bei der Ti-Legierung Ti 8 Mn ergibt sich ein eindeutiger Zusammenhang (σ als alleiniges Verfahren zulässig), bei einer anderen Ti-Legierung nicht.</p>
<div data-sim="ambig"></div>`,
quiz:[
Q('Wie ist die Standard-Eindringtiefe definiert?',['Tiefe, bei der die Wirbelstromdichte auf 50 % gefallen ist','Tiefe, bei der sie auf 1/e ≈ 37 % gefallen ist','Tiefe, bei der sie Null ist','Doppelte Spulenhöhe'],1,'δ ist die Tiefe mit 1/e der Oberflächen-Stromdichte.'),
NUM('Berechne δ in mm für Aluminium (σ = 35 MS/m, μr = 1) bei f = 100 kHz.',0.269,'mm','δ = 503/√(10⁵·35) = 503/1871 ≈ 0,269 mm.',.03),
NUM('Wie viele %IACS entsprechen 35 MS/m?',60.3,'%IACS','35 · 1,724 ≈ 60,3 %IACS.',.02),
Q('Wie ändert sich δ, wenn die Frequenz vervierfacht wird?',['Sie vervierfacht sich','Sie halbiert sich','Sie viertelt sich','Sie bleibt'],1,'δ ∝ 1/√f.'),
Q('Welche Dicke müssen Justierkörper für die Leitfähigkeitsmessung mindestens haben?',['1 δ','2 δ','3 δ','10 δ'],2,'Mindestens die dreifache Standard-Eindringtiefe.'),
Q('Welche Frequenz-Regel gilt für Leitfähigkeitsmessung?',['Je niedriger σ, desto niedriger f','Je niedriger σ, desto höher f','Unabhängig','Immer 50 Hz'],1,'Bei geringen Leitfähigkeiten höhere Frequenz (z. B. 500 kHz bei σ ≤ 5 MS/m).'),
Q('Welchen Effekt hat eine Reinaluminium-Plattierung auf die gemessene Leitfähigkeit?',['Der Wert wird zu niedrig angezeigt','Es wird eine Mischleitfähigkeit – also ein zu hoher Wert – angezeigt','Kein Effekt','Messung unmöglich'],1,'Plattierung ≈ 35 MS/m, Grundwerkstoff 10–28 MS/m.'),
TF('Die Differenzschaltung ist bei der Leitfähigkeitsmessung im Selbstvergleich möglich.',false,'Nur im Fremdvergleich.'),
MU('Welche Größen verfälschen die Leitfähigkeitsmessung?',['Bauteildicke < δ','Lackschicht','Temperatur','Farbe des Lackes'],[0,1,2],'Die Farbe ist ohne Bedeutung, die nichtleitende Schichtdicke wirkt als Abstand.'),
Q('Wie löst man eine Doppeldeutigkeit der Leitfähigkeit bei Al-Legierungen am besten?',['Mit einer ergänzenden Härteprüfung','Durch Frequenzerhöhung','Durch Wiederholen','Gar nicht'],0,'Die Härte unterscheidet sich bei den zwei Temperaturen deutlich.')]});

CHAPTERS.push({id:'v5',num:'V5',title:'Objektkunde – Unregelmäßigkeiten',sub:'Welche Fehler entstehen bei Herstellung, Bearbeitung und Betrieb – und wie sehen sie aus?',min:45,html:`
<p>Bei jeder zerstörungsfreien Prüfung muss klar sein, <b>was gefunden werden soll</b>. Der Fehlerkatalog eines Bauteils bestimmt das geeignete Verfahren. Fehler entstehen in drei Phasen: <b>Herstellung · Bearbeitung · Betrieb</b>.</p>
<h2>5.1 Gussteile</h2>
<p>Aus der erstarrenden Schmelze entstehen: <b>Oxide/Einschlüsse</b> (Sauerstoff), <b>Poren/Porositäten/Mikrolunker</b> (freiwerdendes Gas), <b>Seigerungen</b> (Entmischung), <b>Lunker</b> (Schwindungshohlräume, z. B. an Querschnittsübergängen), <b>Risse</b> – <b>Warmriss</b> im teigigen Zustand, <b>Schrumpfriss</b> im festen Zustand – sowie die <b>Kaltschweißstelle</b>, wenn Gießströme zu kalt oder oxidiert aufeinandertreffen.</p>
<h2>5.2/5.3 Schmieden und Walzen</h2>
<p>Ausgangsmaterial ist der gegossene Block – alle Gussfehler sind noch vorhanden und machen den Verformungsprozess mit: Aus dem ungerichteten Gefüge entsteht eine <b>Faser</b>. Volumenhafte Fehler werden zu <b>flächigen, in Faserrichtung orientierten</b> Fehlern (Schlackenzeilen, Seigerungszeilen, Flocken durch Wasserstoff). Dazu kommen Schmiederisse, Überlappungen/Falten. Bei Walzerzeugnissen nur längsgerichtete Verformung: <b>Schlackenzeilen und Säume</b>, selten Querfehler (Falten, Überwalzungen). <b>Bleche</b> zeigen <b>Dopplungen</b> aus verformten Hohlräumen – nur an Blechkanten mit PT/MT findbar.</p>
<div data-sim="forming"></div>
<h2>5.4 Fehler bei der Bearbeitung</h2>
<p>Meist <b>Spannungen</b>, die an der schwächsten Stelle zum Riss führen:</p>
<ul><li><b>Härten:</b> Abschrecken → <b>Härterisse</b>, gerade oder leicht geschwungen, an Querschnittsänderungen.</li><li><b>Schleifen:</b> thermische Belastung → <b>Schleifrisse</b>: meist viele, nicht lang, quer zur Schleifrichtung. Risse in anderen Richtungen deuten auf zusätzliche Spannungen (Wärmebehandlung).</li><li><b>Galvanisieren/Beizen:</b> Spannungsrisskorrosion; interkristalline Korrosion (netzartiges Bild).</li></ul>
<h2>5.5 Schweißen</h2>
<p>Wie beim Guss: Poren, Einschlüsse, Schlacken; Risse beim Abkühlen/nach Wärmebehandlung (u. a. wasserstoffinduziert, <b>Lamellarrisse</b> am T-Stoß). <b>Endkraterriss</b>: sternförmig am Ende der Schweißung. Mangelhaftes Aufschmelzen → <b>Bindefehler</b> (meist unter der Oberfläche), <b>Wurzelfehler</b>. Risse durch schockartiges Abkühlen (Luftzug!).</p>
<h2>5.6 Fehler im Betrieb</h2>
<p>Immer <b>Risse</b> an Stellen hoher Beanspruchung/Kerbwirkung; Auslöser oft übersehene Fehler aus Herstellung/Bearbeitung. <b>Ermüdungsrisse:</b> dynamische Last, Rastlinien, am Ende Gewaltbruch. <b>Thermoschockrisse:</b> intermittierende thermische Belastung. Bei Revisionen sucht man Risse – mit ganz wenigen Ausnahmen gehen sie von der <b>Oberfläche</b> aus.</p>
<div data-sim="defgame"></div>
<div data-sim="atlas"></div>`,
quiz:[
Q('Was ist ein Warmriss?',['Riss im bereits festen Zustand','Riss im teigigen Zustand des abkühlenden Materials','Riss durch Ermüdung','Riss durch Schleifen'],1,'Im festen Zustand spricht man vom Schrumpfriss.'),
Q('Was wird aus einem kugeligen Gaseinschluss beim Walzen eines Blechs?',['Eine Pore bleibt','Eine Dopplung (flächig)','Ein Querriss','Ein Härteriss'],1,'Durch die starke Verformung in einer Richtung werden Hohlräume flächig.'),
Q('Schleifrisse sind typischerweise …',['wenige, sehr lange, längs','viele, nicht allzu lange, quer zur Schleifrichtung','sternförmig','netzartig'],1,'Entstehen durch hohe thermische Belastung an der Berührlinie.'),

Q('Welche Fehlergruppe ist beim Betrieb immer vorhanden?',['Poren','Risse','Lunker','Seigerungen'],1,'Ermüdungs- und Thermoschockrisse – ausgehend von der Oberfläche.'),

CHAPTERS.push({id:'v6',num:'V6',title:'Prüfung von Oberflächen',sub:'Rissprüfung an Flächen, Bohrungen, Schaufelkanten, Korrosion und Nietnähten – Sonde führen und Signale deuten.',min:90,html:`
<h2>6.1 Einleitung und Schadensarten</h2>
<p>Eine wesentliche Aufgabe der Wirbelstromprüfung ist die Sicherstellung der weiteren Funktionsfähigkeit von Bauteilen bei der <b>Wiederholungsprüfung</b> (Luft-/Raumfahrt). Neuteil-Beispiele: dünnwandige austenitische Rohre, Verdichter-/Turbinenscheiben, Verwechslungsprüfungen.</p>
<table><tr><th>Schaden</th><th>Ort / Eigenschaft</th></tr><tr><td>Risse</td><td>Stellen erhöhter Spannung: Nabenzone (Scheiben), Bolzenbohrungen, Schaufelaufnahme (Kerbwirkung)</td></tr><tr><td>Thermoschockrisse</td><td>Turbinenschaufelkanten – Prüfung beschränkt sich auf die Kanten</td></tr><tr><td>Korrosion</td><td>zwischen Blechüberlappungen (Flugzeugzelle); Abtrag + Aufbeulung; Risse parallel zur Oberfläche nur mit Spezialsensoren</td></tr><tr><td>Schweißnahtrisse</td><td>Naht meist zu uneben für das geforderte Nachweisvermögen → maschinell geschweißt oder nachbearbeitet</td></tr><tr><td>Nietnahtrisse</td><td>von Nietlöchern ausgehend, später verbindend</td></tr></table>
<h2>6.3 Durchführung der Prüfung</h2>
<h3>Flächen</h3>
<p>Naben-Flächen lassen sich mit <b>Einfachdifferenzsensoren</b> prüfen (Risse radial-axial, senkrecht zur Tangentialspannung). Hohes Nachweisvermögen: Frequenzen <b>≥ 1 MHz</b>.</p>
<div class="tip">Typische Handprüfung: Erst <b>Phase</b> so einstellen, dass das Lift-off-Signal horizontal liegt – dann wird der Riss als vertikale Auslenkung erkannt. Höhere Frequenz trennt Riss- und Lift-off-Richtung besser.</div>
<div data-sim="scan"></div>
<h3>Bohrungen</h3>
<p>Risse radial-axial; <b>Rotiersensoren in Differenzschaltung</b>, meist 3000 U/min, oft 0,5 MHz; bei Bohrungen ≤ 3 mm besser <b>2 MHz</b>. Die Prüffrequenz muss <b>deutlich über der Rotierfrequenz</b> liegen.</p>
<div data-sim="bore"></div>
<h3>Schaufelkanten</h3>
<p>Thermoschockrisse etwa senkrecht zur Kante → Differenzsensoren; spezielle <b>Mehrfachdifferenzsensoren</b> oder <b>Ringkernsensoren</b> (klein, nahe am Übergangsradius); 0,5–2,0 MHz. <b>Sulfidation</b> (Nickelsulfid, ferromagnetisch) erzeugt eine erhebliche Phasendrehung und ist daher leicht erkennbar.</p>
<h3>Korrosionsprüfung</h3>
<p>Wanddickenverminderung, evtl. Rissbildung, Schichtkorrosion, <b>Aufbeulung</b> durch Korrosionsprodukte. Dünne Bleche → Eindringtiefe geringfügig größer als die Blechdicke → hohe Empfindlichkeit. <b>Absolutspulen</b> (Differenzspulen ungeeignet), <b>Bildschirmgeräte</b> mit frei wählbarer Frequenz; Bildschirmanordnung: <b>Lift-off links, Korrosion nach oben, Aufbeulung nach rechts</b>. Tiefpass so einstellen, dass das Nutzsignal bei Handführung nicht beeinträchtigt wird.</p>
<ul><li><b>Justierkörper</b> mit gefrästem Rückseiten-Abtrag, pro Blechdicke eigener Körper; Abtrag ab 5 % in 5- oder 10-%-Stufen.</li><li><b>Farbschichten &gt; 50 µm:</b> nichtleitende Folien zur Simulation; &lt; 50 µm vernachlässigbar.</li><li><b>Kalibrierkurve</b> aus 4 gut abgestuften Punkten (Interpolation), dazu eine <b>Referenzkurve</b> mit simulierter Struktur dahinter (ggf. Klebschicht-Folien).</li><li>Aufbeulung: Justierkörper bei aufgesetztem Sensor leicht abheben.</li></ul>
<div data-sim="korr6"></div>
<h3>Nietnähte</h3>
<ul><li><b>Direkt</b> (Nieten entfernt): dynamische Bohrungsprüfung mit Rotiersensoren – größeres Nachweisvermögen, gute Vorschubgeschwindigkeit, Triggerung ordnet Signal dem Rissort zu; <b>Hochpass</b> lässt nur kurze Impulse durch, <b>Bandpass</b> symmetriert, neigt aber zum Nachschwingen.</li><li><b>Justierkörper:</b> Typ 1 (Platte mit Nut in Bohrungen: B 0,15 mm × T 0,5 mm × Länge = Plattendicke), Typ 2 (Oberflächennuten: 0,2 × 1,0 mm).</li><li><b>Indirekt</b> (Nieten bleiben): geringeres Nachweisvermögen, zweite Lage über die Frequenz erreichen; Mehrfachdifferenzsensoren bei gesenkten Köpfen, <b>Linearschwinger</b> ermöglichen Hochpassfilterung, bei überstehenden Köpfen <b>Nietkopfsensoren</b> (Ringferritkern), Niederfrequenz; Stahlnieten in Al leiten das Feld in die Tiefe.</li></ul>
<table><tr><th>Fehlertyp (Nietloch)</th><th>Ursache</th></tr><tr><td>I</td><td>Fertigung: Rest der kleineren Vorbohrung, nur obere Lage (Ansenkung)</td></tr><tr><td>II</td><td>Fertigung: Reste der Vorbohrung über die ganze Blechdicke</td></tr><tr><td>III</td><td>Beim Entfernen der Niete: Ziehriefen axial</td></tr><tr><td>IV</td><td>Unsymmetrisches Schlagen der Niete</td></tr><tr><td>V</td><td>Gemeinsames Aufbohren nicht passender Löcher → Bohrriefen</td></tr></table>`,
quiz:[
Q('Welche Frequenz ist für hohes Fehlernachweisvermögen an Flächen (Nabenzone) nötig?',['50 Hz','1 kHz','≥ 1 MHz','100 Hz'],2,'Frequenzen im Bereich von 1 MHz und höher.'),
Q('Mit welchem System prüft man Bohrungen auf radial-axiale Risse?',['Außendurchlaufsensor','Rotiersensor in Differenzschaltung','Absolutsensor flach','Gabelspule'],1,'Motorischer Rotor, meist 3000 U/min.'),
