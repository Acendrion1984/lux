.fr, C0.eta, C0.m.mu)); }   // Nullabgleich auf defektfreiem Blech\n  S.crackX = clamp(S.crackX, 5, S.plateLen-5);\n  S.crackY = clamp(S.crackY, 0, S.plateWidth);\n  S.probeX = clamp(S.probeX, 0, S.plateLen);\n  S.probeY = clamp(S.probeY, 0, S.plateWidth);\n  S.weldX = clamp(S.weldX, 10, S.plateLen-10); S.alIx = alongBand()[0];\n  S.burnX = clamp(S.burnX, 8, S.plateLen-8); S.burnY = clamp(S.burnY, 0, S.plateWidth); $('burnX').max = S.plateLen-8; $('burnY').max = S.plateWidth;\n  $('crackX').max = S.plateLen-5; $('crackY').max = S.plateWidth; $('weldX').max = S.plateLen-10;\n  $('probeX').max = S.plateLen;   $('probeY').max = S.plateWidth;\n}\n/* Die Spur im Impedanzdiagramm wird feiner abgetastet als das C-Bild-Raster\n   (alle \u2248 0,2 mm). Mit der groben Rasterweite von knapp 1 mm w\u00e4re die Schmetterlingsfigur\n   der Differenzsonde ein eckiger Polygonzug. */\n/* Ger\u00e4te-Filter (Hoch-/Tiefpass, 1. Ordnung) auf dem Sondensignal \u2013 wirken nur w\u00e4hrend des Scans.\n   Die Sonde l\u00e4uft mit der eingestellten Sondengeschwindigkeit v (die Darstellung l\u00e4uft in Zeitlupe); aus dem Wegst\u00fcck zwischen zwei Messpunkten ergibt sich der Zeitschritt. */\nconst LPF_OFF = 10000;                                   // Tiefpass am Anschlag = aus\nconst probeSpeed = () => Math.max(1, S.vProbe*1000);    // mm/s \u2013 reale Sondengeschwindigkeit; die Darstellung l\u00e4uft unabh\u00e4ngig davon in Zeitlupe\nconst fmtHz = f => f >= 1000 ? deC(f/1000, f >= 10000 ? 0 : 1)+' kHz' : Math.round(f)+' Hz';\nconst sliderHpf = v => v <= 0 ? 0 : Math.round(Math.pow(10, v/100*3.3));          // 1 Hz \u2026 2 kHz, logarithmisch\nconst sliderLpf = v => v >= 100 ? LPF_OFF : Math.round(10*Math.pow(10, v/100*3)); // 10 Hz \u2026 10 kHz, logarithmisch\nfunction filt(z, x, y){\n  if(!S.scanning || (S.hpf <= 0 && S.lpf >= LPF_OFF)){ S._flt = null; return z; }\n  let f = S._flt;\n  if(!f){ S._flt = {px:x, py:y, lp:{re:z.re, im:z.im}, hin:{re:z.re, im:z.im}, hp:{re:0, im:0}}; return S.hpf > 0 ? {re:0, im:0} : z; }\n  const dt = Math.max(1e-4, Math.hypot(x-f.px, y-f.py)/probeSpeed()); f.px = x; f.py = y;\n  let o = z;\n  if(S.lpf < LPF_OFF){\n    const a = dt/(1/(2*Math.PI*S.lpf)+dt);\n    f.lp.re += a*(z.re-f.lp.re); f.lp.im += a*(z.im-f.lp.im); o = {re:f.lp.re, im:f.lp.im};\n  } else { f.lp = {re:z.re, im:z.im}; }\n  if(S.hpf > 0){\n    const rc = 1/(2*Math.PI*S.hpf), b = rc/(rc+dt);\n    f.hp = {re:b*(f.hp.re + o.re - f.hin.re), im:b*(f.hp.im + o.im - f.hin.im)}; f.hin = {re:o.re, im:o.im}; o = {re:f.hp.re, im:f.hp.im};\n  } else { f.hin = {re:o.re, im:o.im}; f.hp = {re:0, im:0}; }\n  return o;\n}\nfunction pushTrail(z){\n  trail.push(z); if(trail.length > MAXTRAIL) trail.shift();\n  const m = balMag(z);\n  if(!S.peak || m > S.peak.m) S.peak = {re:z.re, im:z.im, m};\n}\nfunction traceTo(x1, y1, C, dir){\n  if(S.trX !== null && S.trX !== undefined){\n    const dx = x1-S.trX, dy = y1-S.trY, dist = Math.hypot(dx,dy);\n    const n = Math.min(120, Math.ceil(dist/TRAIL_STEP));\n    for(let i=1; i<n; i++){\n      const t = i/n;\n      pushTrail(filt(probeRaw(S.trX+dx*t, S.trY+dy*t, C, dir), S.trX+dx*t, S.trY+dy*t));\n    }\n  }\n  S.trX = x1; S.trY = y1;\n}\nfunction sample(sx, sy, C, dir){\n  traceTo(sx, sy, C, dir);\n  const z = filt(probeRaw(sx, sy, C, dir), sx, sy);  // Rohsignal (ggf. gefiltert); Verst\u00e4rkung/Phase erst bei der Anzeige\n  strip.push(z); if(strip.length > MAXSTRIP) strip.shift();\n  pushTrail(z);\n  lastAmp = Math.hypot(z.re, z.im);\n  return z;\n}\nfunction advanceScan(C, dir){\n  S.scanAcc += S.scanSpeed*0.55;\n  let n = 0;\n  while(S.scanAcc >= 1 && n < 90){\n    S.scanAcc -= 1; n++;\n    S.scanIx += 1;                                   // immer von links nach rechts, dann R\u00fccklauf zur n\u00e4chsten Zeile (ohne Signal)\n    if(S.scanIx >= NX){ S.scanIx = 0; S.scanIy++; S.trX = null; S._flt = null; }\n    if(S.scanIy >= NY){ S.scanning = false; S.scanIy = NY-1; updateScanBtn(); stopLoop(); break; }\n    const spirale = S.mode === 'burn' && S.burnForm === 'ring';   // umlaufender Brand: Sonde l\u00e4uft wie am rotierenden Ring (Schraubenbahn) \u2013 y r\u00fcckt stetig vor, das Signal l\u00e4uft glatt durch den Streifen statt in Zeilenstufen zu springen\n    const px = (S.scanIx+0.5)*S.plateLen/NX, py = (S.scanIy+(spirale ? (S.scanIx+0.5)/NX : 0.5))*S.plateWidth/NY;\n    S.probeX = px; S.probeY = py;\n    const z = sample(px, py, C, dir);\n    grid[S.scanIy][S.scanIx] = Math.max(grid[S.scanIy][S.scanIx], balMag(z));\n    scanned[S.scanIy][S.scanIx] = 1;\n  }\n}\nfunction startLoop(){\n  if(rafId) return;\n  const step = () => { if(!S.scanning){ rafId=null; return; } render(); rafId = requestAnimationFrame(step); };\n  rafId = requestAnimationFrame(step);\n}\nfunction stopLoop(){ if(rafId){ cancelAnimationFrame(rafId); rafId = null; } }\nfunction updateScanBtn(){\n  $('btnScan').textContent = S.scanning ? '\u23f8 Pause' : '\u25b6 Scan starten';\n  $('btnScan').classList.toggle('stop', S.scanning);\n  $('probeX').disabled = S.scanning; $('probeY').disabled = S.scanning;\n}\nfunction scannedPct(){\n  let c=0; for(let iy=0;iy<NY;iy++) for(let ix=0;ix<NX;ix++) if(scanned[iy][ix]) c++;\n  if(S.mode === 'tube') return Math.min(100, Math.round(100*S.probeX/S.plateLen));\n  const bd = alongBand(), tot = alongOn() ? (bd[1]-bd[0]+1)*NY : NX*NY;\n  return Math.min(100, Math.round(100*c/tot));\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 Kennzahlen \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\n/* Wirksamer Winkel zwischen Riss- und Abhebungsanzeige, einschlie\u00dflich\n   der Phasennacheilung \u00fcber die Risstiefe. */\nfunction sepEff(C, dir){\n  const cAx = crackAxis(C, dir);\n  if(cAx === null) return dir.sep;\n  let d = (cAx - liftAxis(dir).a)*180/Math.PI;\n  while(d > 180) d -= 360; while(d < -180) d += 360;\n  return d;\n}\nfunction updateRiss(C, dir, live){\n  const amp = Math.hypot(live.re, live.im);\n  const alarm = overThreshold(live.re, live.im);\n  const phi = Math.atan2(live.im, live.re)*180/Math.PI;\n  const pk = S.peak ? gr(S.peak) : null;\n  const cards = [\n    ['Eindringtiefe \u03b4', deC(C.delta,3)+' <small>mm<\/small>'],\n    ['Grenzfrequenz f_g', fmtFreqShort(C.fg)],\n    ['Normierte Frequenz f/f_g', deC(C.fr,2), 'hl'],\n    ['Riss zu Abhebung', deC(Math.abs(sepEff(C,dir)),0)+'\u00b0', 'hl'],\n    ['Signalh\u00f6he', Math.round(clamp(amp,0,1.6)*100/1.6)+' <small>%<\/small>'],\n    ['Anzeigewinkel', deC(phi,0)+'\u00b0'],\n    ['Spitzenwert', pk ? Math.round(Math.hypot(pk.re,pk.im)*100/1.6)+' <small>%<\/small>' : '\u2013', pk && Math.hypot(pk.re,pk.im) > 1.6 ? 'bad' : 'hl'],\n    ['Spitzenwinkel', pk ? deC(Math.atan2(pk.im,pk.re)*180/Math.PI,0)+'\u00b0' : '\u2013', 'hl'],\n  ].concat(scnCards(C, dir));\n  $('stats').innerHTML = cards.map(c =>\n    `<div class=\"stat${c[2]?' '+c[2]:''}\"><div class=\"k\">${c[0]}<\/div><div class=\"v\">${c[1]}<\/div><\/div>`).join('')\n    + `<div class=\"stat ${alarm?'bad':'ok'}\"><div class=\"k\">Status<\/div><div class=\"v\">${alarm?'Alarm':'frei'}<\/div><\/div>`;\n\n  const v = $('verdict');\n  const sep = Math.abs(sepEff(C, dir));\n  const liftDeg = ((liftAxis(dir).a*180/Math.PI)%360+360)%360;\n  const liftHoriz = Math.abs(liftDeg - 180) < 8;\n  if(S.mode !== 'riss'){ const r = scnVerdict(C, dir, live); v.className = r.cls; v.innerHTML = r.html; }\n  else if(!S.crackOn){\n    v.className = 'verdict';\n    v.innerHTML = 'Kein Riss im Pr\u00fcfst\u00fcck. Bei der Absolutsonde bleibt trotzdem die Abhebung sichtbar \u2014 bei der Differenzsonde nicht.';\n  } else if(sep < 20){\n    v.className = 'verdict bad';\n    v.innerHTML = `<b>Riss- und Abhebungsrichtung liegen nur ${deC(sep,0)}\u00b0 auseinander.<\/b> Bei dieser Frequenz l\u00e4sst sich beides kaum trennen; jede Wackelbewegung der Sonde sieht aus wie ein Riss. Pr\u00fcffrequenz erh\u00f6hen, bis f/f_g deutlich \u00fcber 1 liegt.`;\n  } else if(!liftHoriz){\n    v.className = 'verdict';\n    v.innerHTML = `<b>${deC(sep,0)}\u00b0 zwischen Riss und Abhebung \u2014 gut trennbar.<\/b> Jetzt die Phase so drehen, dass die Abhebung waagerecht nach links zeigt; dann steht die Rissanzeige aufrecht und der Y-Kanal tr\u00e4gt nur noch sie.`;\n  } else {\n    v.className = 'verdict ok';\n    v.innerHTML = `<b>Abgeglichen.<\/b> Die Abhebung zeigt waagerecht nach links, die Rissanzeige steht ${deC(sep,0)}\u00b0 dazu. Der Y-Kanal des Streifenschreibers tr\u00e4gt jetzt fast nur noch den Riss.`\n      + (S.probe === 'diff' ? ` Bei der Differenzsonde bleibt die Abhebung ohnehin ohne Anzeige \u2014 die Linie dient hier nur als Phasenbezug f\u00fcr die Tiefenbewertung.` : '');\n  }\n  $('kSigma').textContent = deC(C.m.sigma,2)+' MS/m';\n  $('kMu').textContent = C.m.mu;\n  $('kDelta').textContent = deC(C.delta,3)+' mm';\n  $('bDelta').textContent = '\u03b4 = '+deC(C.delta,C.delta<1?3:2)+' mm'; $('bDelta').className = 'badge';\n  $('kFg').textContent = fmtFreqShort(C.fg);\n  $('bProbe').textContent = S.probe==='diff' ? 'Differenzsonde' : 'Absolutsonde';\n  $('bProbe').className = 'badge acc';\n  $('bMat').textContent = C.m.name;\n  $('bSig').textContent = alarm ? 'Alarm' : 'frei';\n  $('bSig').className = 'badge ' + (alarm?'bad':'ok');\n  $('cscanInfo').textContent = (S.mode==='tube' ? 'Rohr \u2205 '+S.tubeD+' mm \u00b7 '+(nSec()>1 ? nSec()+' Segmentspulen' : 'Ringspule')+' \u00b7 einmaliger Durchlauf \u00b7 ' : '')+(S.mode==='hole' ? 'Abwicklung der Bohrung (Umfang \u00d7 Tiefe) \u00b7 ' : '')+`Fl\u00e4che ${S.plateLen} \u00d7 ${S.plateWidth} mm \u00b7 Spur \u2205 ${deC(S.coilDia,1)} mm \u00b7 Klick/Ziehen setzt die Sonde`;\n  $('cscanProg').textContent = scannedPct()+' % gescannt';\n}\n\nfunction updateGef(){\n  const fs = freqSet(), done = serieIdx+1;\n  const shown = serie.slice(0, done);\n  const bad = shown.filter(o=>!o.ok).length;\n  const missedAll = shown.filter(o=>o.weich && o.okAll).length;\n  const eH = tolEllipse(CLASSES[0], fs[S.win]);\n  const dist = ellipseDist(eH, measPoint(fs[S.win]));\n  const sep = separationAt(fs[S.win]);\n\n  const cards = [\n    ['Fenster', `f${S.win+1} <small>${fmtFreqShort(fs[S.win])}<\/small>`, 'hl'],\n    ['\u03b4 im Sollzustand', deC(skinDepth(fs[S.win], CLASSES[0].sigma, CLASSES[0].mu),3)+' <small>mm<\/small>'],\n    ['Einzelteil, Abstand', deC(dist,2)+' <small>\u00d7 Toleranz<\/small>', dist<=1?'ok':'bad'],\n    ['Trennsch\u00e4rfe', deC(sep,2), sep>=1?'ok':'bad'],\n    ['Gepr\u00fcft', `${done} <small>von ${serie.length||S.serieN}<\/small>`],\n    ['davon n.i.O.', String(bad), bad?'bad':'hl'],\n  ];\n  $('statsG').innerHTML = cards.map(c =>\n    `<div class=\"stat${c[2]?' '+c[2]:''}\"><div class=\"k\">${c[0]}<\/div><div class=\"v\">${c[1]}<\/div><\/div>`).join('');\n\n  const v = $('verdictG');\n  if(done === 0){\n    v.className = 'verdict';\n    v.innerHTML = dist <= 1\n      ? `Das Einzelteil liegt im Toleranzfeld <b>${esc(CLASSES[0].name)}<\/b>. Mit dem Regler <b>Weg zum abweichenden Zustand<\/b> wandert der Messpunkt in Richtung ${esc(CLASSES[1].name)}.`\n      : `<b>Einzelteil au\u00dferhalb der Toleranz<\/b> (${deC(dist,2)}-facher Toleranzradius). Bei dieser Abweichung w\u00e4re ${S.mode==='mix'?'ein Werkstoffwechsel (Verwechslung)':'die W\u00e4rmebehandlung bzw. das Gef\u00fcge'} zu pr\u00fcfen.`;\n  } else {\n    const teil = shown.filter(o=>o.partial).length;\n    v.className = bad ? 'verdict bad' : 'verdict ok';\n    v.innerHTML = `<b>${done} Teile gepr\u00fcft, ${bad} im Fenster f${S.win+1} als n.i.O. erkannt.<\/b> `\n      + (sep < 1\n         ? `Achtung: bei dieser Frequenz \u00fcberlappen die Toleranzfelder von ${esc(CLASSES[0].kurz)} und ${esc(CLASSES[1].kurz)} \u2014 ein abweichendes Teil kann durchrutschen.`\n         : `${esc(CLASSES[0].kurz)} und ${esc(CLASSES[1].kurz)} sind in diesem Fenster sauber getrennt.`)\n      + (missedAll ? ` <b>${missedAll} abweichende(s) Teil(e) blieben in allen vier Fenstern unauff\u00e4llig.<\/b>` : '')\n      + (teil ? ` ${teil} Teil(e) liegen im Mischzustand zwischen den Wolken \u2014 genau dort entscheidet die Frequenzwahl.` : '');\n  }\n\n  $('kSigH').textContent = deC(CLASSES[0].sigma,2)+' MS/m';\n  $('kSigW').textContent = deC(CLASSES[1].sigma,2)+' MS/m';\n  $('kMuHW').textContent = CLASSES[0].mu + ' / ' + CLASSES[1].mu;\n  $('vSoll').textContent = CLASSES[0].name; $('lSigH').textContent = '\u03c3 '+CLASSES[0].kurz; $('lSigW').textContent = '\u03c3 '+CLASSES[1].kurz;\n  $('lgA').textContent = 'Toleranzfeld '+CLASSES[0].name; $('lgB').textContent = 'Toleranzfeld '+CLASSES[1].name;\n  $('bProbe').textContent = 'Durchlaufspule';\n  $('bProbe').className = 'badge acc';\n  $('bMat').textContent = CLASSES[0].kurz+' / '+CLASSES[1].kurz;\n  $('bSig').textContent = sep>=1 ? 'trennbar' : '\u00dcberlappung';\n  $('bSig').className = 'badge ' + (sep>=1?'ok':'bad');\n\n  let html = `<thead><tr><th>Nr.<\/th><th>\u03c3<\/th><th>\u00b5\u1d63<\/th><th>Abstand f${S.win+1}<\/th>`+\n             `<th>f1 f2 f3 f4<\/th><th>Bewertung<\/th><th>Zustand<\/th><\/tr><\/thead><tbody>`;\n  shown.forEach((o,i) => {\n    html += `<tr class=\"${i===done-1?'cur':''}\"><td>#${o.idx}<\/td><td>${deC(o.sigma,2)}<\/td>`+\n      `<td>${deC(o.mu,0)}<\/td><td>${deC(o.dist,2)}<\/td>`+\n      `<td>${o.inWin.map(b=>b?'\u25cf':'\u25cb').join(' ')}<\/td>`+\n      `<td class=\"${o.ok?'v-ok':'v-bad'}\">${o.ok?'i.O.':'n.i.O.'}<\/td>`+\n      `<td style=\"text-align:left\">${esc(o.art)}<\/td><\/tr>`;\n  });\n  if(done === 0) html += `<tr><td colspan=\"7\" style=\"text-align:left;color:var(--text-faint)\">Noch keine Serie gepr\u00fcft.<\/td><\/tr>`;\n  $('serieTable').innerHTML = html + '<\/tbody>';\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 Render \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nfunction render(){\n  if(isMeas()){ renderMeas(); return; }\n  if(S.mode === 'gef'){ renderGef(); return; }\n  if(isSort()){\n    drawSortView(); drawSeparation(); updateGef(); syncLabels();\n    return;\n  }\n  const C = rissCtx();\n  const dir = directions(C.fr, C.eta, C.m.mu);\n  if(S.scanning) { if(alongOn()) advanceAlong(C, dir); else if(S.mode === 'tube') advanceTube(C, dir); else if(S.mode === 'hole') advanceRot(C, dir); else advanceScan(C, dir); }\n  const live = S.scanning ? gr(trail[trail.length-1] || {re:0,im:0}) : probeSignal(S.probeX, S.probeY, C, dir);\n  lastAmp = Math.hypot(live.re, live.im);\n  const lim = impLimit(live);\n  drawImp(C, dir, live, lim);\n  drawCscan();\n  drawStrip(lim);\n  drawSection(C);\n  $('cscanTitle').textContent = (S.mode === 'tube') ? 'Rohrquerschnitt \u00b7 Fehlerlage am Umfang' : (S.mode === 'hole' ? 'C-Bild \u00b7 abgewickelte Bohrung' : 'C-Bild, Draufsicht');\n  $('tubeSecField').style.display = (S.mode === 'tube' && S.tubeCoil === 'seg') ? '' : 'none';\n  updateRiss(C, dir, live);\n  syncLabels();\n}\nfunction syncLabels(){\n  $('vFreq').textContent = fmtFreqShort(freqHz());\n  $('vCoilDia').textContent = deC(S.coilDia,1)+' mm';\n  $('vLiftOff').textContent = deC(S.liftOff,2)+' mm';\n  $('vPlateLen').textContent = S.plateLen+' mm';\n  $('vPlateWidth').textContent = S.plateWidth+' mm';\n  $('vCrackDepth').textContent = deC(S.crackDepth,2)+' mm';\n  $('vCrackOrient').textContent = S.crackOrient+'\u00b0';\n  $('vCrackX').textContent = S.crackX+' mm';\n  $('vCrackY').textContent = S.crackY+' mm';\n  $('vGain').textContent = S.gain+' dB';\n  $('vPhaseRot').textContent = S.phaseRot+'\u00b0';\n  $('vProbeX').textContent = Math.round(S.probeX)+' mm';\n  $('vProbeY').textContent = Math.round(S.probeY)+' mm';\n  $('vScanSpeed').textContent = S.scanSpeed;\n  $('vVProbe').textContent = deC(S.vProbe,1)+' m/s';\n  $('vHpf').textContent = S.hpf > 0 ? fmtHz(S.hpf) : 'aus';\n  $('vLpf').textContent = S.lpf < LPF_OFF ? fmtHz(S.lpf) : 'aus';\n  $('fltHint').textContent = 'Bei '+deC(S.vProbe,1)+' m/s (Darstellung in Zeitlupe): ein 1 mm breiter Fehler erzeugt Signalanteile bis \u2248 '+fmtHz(probeSpeed()/2)+'. Hochpass unterdr\u00fcckt langsame \u00c4nderungen (Abhebung, Werkstoffdrift), Tiefpass Rauschen \u2013 zu enge Filter verkleinern oder verschmieren den Fehlerausschlag. Wirkt w\u00e4hrend des Scans.';\n  $('vPartDia').textContent = S.partDia+' mm';\n  $('vFill').textContent = deC(S.fill,2);\n  $('vThreshR').textContent = deC(S.threshR,2);\n  $('vThreshAngle').textContent = S.threshAngle+'\u00b0';\n  for(let k=0;k<4;k++) $('vFw'+(k+1)).textContent = fmtFreq(sliderHz(S.fS[k]));\n  $('vNoise').textContent = deC(S.noise,1)+' %';\n  $('vT1').textContent = deC(S.t1,1)+' mm'; $('vT2').textContent = deC(S.t2,1)+' mm';\n  $('vBurnX').textContent = S.burnX+' mm'; $('vBurnW').textContent = deC(S.burnW,1)+' mm'; $('vBurnSev').textContent = Math.round(S.burnSev*100)+' %'; $('vBurnY').textContent = S.burnY+' mm'; $('burnXField').style.display = S.burnForm === 'spot' ? '' : 'none';\n  $('vWeldX').textContent = S.weldX+' mm'; $('vWeldW').textContent = S.weldW+' mm'; $('vWeldCap').textContent = deC(S.weldCap,1)+' mm'; $('vTubeD').textContent = S.tubeD+' mm'; $('vSat').textContent = S.sat+' %';\n  $('vMatDev').textContent = (S.matDev>0?'+':'')+S.matDev+' %';\n  $('vSerieN').textContent = S.serieN;\n  $('vSerieBad').textContent = S.serieBad;\n  if(!S.scanning){ $('probeX').value = S.probeX; $('probeY').value = S.probeY; }\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 Bedienung \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nMATERIALS.forEach(m => {\n  const b = document.createElement('button');\n  b.dataset.mat = m.id; b.textContent = m.short;\n  if(m.id === S.material) b.classList.add('on');\n  $('segMat').appendChild(b);\n});\n\nconst RESET_KEYS = new Set(['coilDia','liftOff','plateLen','plateWidth','crackDepth','crackOrient','crackX','crackY','freqS','t1','t2','weldX','weldW','weldCap','burnX','burnY','burnW','burnSev','tubeD','sat','tubeSec','hpf','lpf','vProbe']);\nfunction bindRange(id, key, parse){\n  $(id).addEventListener('input', () => {\n    S[key] = parse ? parse(parseFloat($(id).value)) : parseFloat($(id).value);\n    if(RESET_KEYS.has(key)) resetScan();\n    if(key==='partDia' || key==='fill' || key==='noise') rejudge();\n    syncLabels(); render();\n  });\n}\nbindRange('freq','freqS');\nbindRange('coilDia','coilDia');\nbindRange('liftOff','liftOff', v=>v/100);\nbindRange('plateLen','plateLen');\nbindRange('plateWidth','plateWidth');\nbindRange('crackDepth','crackDepth');\nbindRange('crackOrient','crackOrient');\nbindRange('crackX','crackX');\nbindRange('crackY','crackY');\nbindRange('gain','gain');\nbindRange('phaseRot','phaseRot');\nbindRange('scanSpeed','scanSpeed');\nbindRange('vProbe','vProbe');\nbindRange('hpf','hpf', sliderHpf);\nbindRange('lpf','lpf', sliderLpf);\nbindRange('partDia','partDia');\nbindRange('fill','fill', v=>v/100);\nbindRange('noise','noise');\n[0,1,2,3].forEach(k => {\n  $('fw'+(k+1)).addEventListener('input', () => {\n    S.fS[k] = parseFloat($('fw'+(k+1)).value);\n    rejudge(); syncLabels(); render();\n  });\n});\n$('btnFotoSatz').addEventListener('click', () => {\n  S.fS = [4000, 2000, 1000, 640].map(hzSlider);\n  S.fS.forEach((v,k) => { $('fw'+(k+1)).value = v; });\n  rejudge(); syncLabels(); render();\n});\nbindRange('t1','t1'); bindRange('t2','t2');\nbindRange('weldX','weldX'); bindRange('weldW','weldW'); bindRange('weldCap','weldCap');\nbindRange('burnX','burnX'); bindRange('burnY','burnY'); bindRange('burnW','burnW');\n$('burnSev').addEventListener('input', () => { S.burnSev = parseFloat($('burnSev').value)/100; resetScan(); syncLabels(); render(); });\nbindToggle('tglBurn', null, on => { S.burnOn = on; });\nsegPick('segBurnForm','bform', v => { S.burnForm = v; resetScan(); syncLabels(); render(); });\nsegPick('segBurnType','btype', v => { S.burnType = v; resetScan(); syncLabels(); render(); });\n$('tubeD').addEventListener('input', () => { S.tubeD = parseFloat($('tubeD').value); S.plateWidth = Math.round(Math.PI*S.tubeD); $('plateWidth').value = S.plateWidth; resetScan(); syncLabels(); render(); });\nbindRange('sat','sat'); bindRange('tubeSec','tubeSec');\nbindRange('threshR','threshR');\nbindRange('threshAngle','threshAngle');\nbindRange('matDev','matDev');\nbindRange('serieN','serieN');\nbindRange('serieBad','serieBad');\n\nfunction probeMoved(){\n  const C = rissCtx(), dir = directions(C.fr, C.eta, C.m.mu);\n  const z = sample(S.probeX, S.probeY, C, dir);\n  const ix = clamp(Math.floor(S.probeX/(S.plateLen/NX)),0,NX-1);\n  const iy = clamp(Math.floor(S.probeY/(S.plateWidth/NY)),0,NY-1);\n  grid[iy][ix] = Math.max(grid[iy][ix], balMag(z));\n  scanned[iy][ix] = 1;\n  syncLabels(); render();\n}\n['probeX','probeY'].forEach(id => {\n  $(id).addEventListener('input', () => {\n    if(S.scanning) return;\n    S[id] = parseFloat($(id).value);\n    probeMoved();\n  });\n});\n/* Sonde direkt im C-Bild setzen (Klick oder Ziehen) */\n(function(){\n  const cv = $('cscan'); let dragging = false;\n  const fromPointer = e => {\n    const r = cv.getBoundingClientRect();\n    S.probeX = clamp((e.clientX - r.left)/r.width*S.plateLen, 0, S.plateLen);\n    S.probeY = clamp((e.clientY - r.top)/r.height*S.plateWidth, 0, S.plateWidth);\n    probeMoved();\n  };\n  cv.addEventListener('pointerdown', e => {\n    if(!isScan() || S.mode === 'tube' || S.scanning) return;\n    dragging = true; try{ cv.setPointerCapture(e.pointerId); }catch(_){}\n    fromPointer(e);\n  });\n  cv.addEventListener('pointermove', e => { if(dragging) fromPointer(e); });\n  ['pointerup','pointercancel'].forEach(ev => cv.addEventListener(ev, () => { dragging = false; }));\n})();\ndocument.addEventListener('keydown', e => {\n  if(e.code !== 'Space' || !isScan()) return;\n  const tg = (e.target.tagName||'').toLowerCase();\n  if(['input','select','textarea','button','summary'].indexOf(tg) >= 0) return;\n  e.preventDefault(); $('btnScan').click();\n});\n['crackLen','crackOpen'].forEach(id => {\n  $(id).addEventListener('input', () => { S[id] = parseFloat($(id).value)||0.01; resetScan(); render(); });\n});\n\nfunction segPick(container, attr, cb){\n  $(container).addEventListener('click', e => {\n    const b = e.target.closest('button'); if(!b) return;\n    [].slice.call($(container).children).forEach(x=>x.classList.remove('on'));\n    b.classList.add('on');\n    cb(b.dataset[attr]);\n  });\n}\nsegPick('segProbe','probe', v => {\n  S.probe = v;\n  $('probeHint').textContent = v === 'diff'\n    ? 'Zwei gegeneinander geschaltete Spulen. Unterdr\u00fcckt Abhebung und langsame Werkstoffdrift, spricht nur auf \u00f6rtliche Anomalien an \u2014 typisch als Schmetterlingsfigur.'\n    : 'Eine Spule gegen einen festen Abgleich. Sieht auch Abhebung und langsame Werkstoff\u00e4nderungen, daf\u00fcr ist die Anzeige leichter zu deuten.';\n  resetScan(); render();\n});\nsegPick('segThresh','thresh', v => {\n  S.threshType = v;\n  $('threshAngleField').style.display = v === 'line' ? '' : 'none';\n  $('threshHint').textContent = v === 'line'\n    ? 'Alarm, sobald der Messpunkt die Gerade beidseitig um mehr als den Schwellwert \u00fcberschreitet. Bei 90\u00b0 reagiert die Schwelle nur auf den Y-Kanal und bleibt f\u00fcr reine Abhebung stumm.'\n    : 'Alarm, sobald der Messpunkt weiter als der Schwellwert vom Abgleichpunkt entfernt ist \u2014 in jeder Richtung, auch bei reiner Abhebung.';\n  render();\n});\nsegPick('segScale','scale', v => { S.impScale = v; S.impLim = null; render(); });\nsegPick('segMat','mat', v => { S.material = v; resetScan(); render(); });\nsegPick('segWin','win', v => { S.win = parseInt(v,10); rejudge(); render(); });\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 Pr\u00fcfaufgaben: Texte, Standardwerte, Panels \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nconst MODEDEF = {\n  riss: {eyebrow:'Wirbelstrompr\u00fcfung', sub:'Impedanzebene, C-Bild und Streifenschreiber \u00b7 Absolut- und Differenzsonde',\n         hint:'Oberfl\u00e4chenrisse an einem Lagerring aus geh\u00e4rtetem 100Cr6 suchen (H\u00e4rte-, Schleif- und Materialrisse <div class="warn">Der Vortrag V14 „Sondertechniken“ ist im vorliegenden Skriptauszug nicht abgedruckt (nur im Zeitplan/Inhaltsverzeichnis genannt). Dieses Kapitel ist daher ein <b>allgemeiner Überblick</b> und ergänzt den Stoff – prüfungsrelevante Details bitte mit dem Kursleiter abgleichen.</div>
<h2>Gepulster Wirbelstrom (PEC)</h2>
<p>Statt einer sinusförmigen Anregung wird die Spule mit einem <b>Strompuls</b> betrieben. Nach dem Abschalten klingen die im Prüfteil induzierten Wirbelströme ab und diffundieren in die Tiefe; der <b>zeitliche Abklingverlauf</b> des Empfangssignals enthält Information über Wanddicke und Materialverluste. Das Pulsspektrum enthält niederfrequente Anteile → große Eindringtiefe: typische Anwendung ist die Wanddickenüberwachung <b>unter Isolierung</b> (Rohrleitungen, Behälter). Die Ortsauflösung ist geringer als bei hochfrequenter Oberflächenprüfung.</p>
<div data-lab="pec" data-task="Miss die Restwanddicke unter Isolierung – wie wirkt sich die Isolierdicke aus?"></div>
<h2>Weitere Techniken (Stichworte)</h2>
<ul><li><b>Mehrfrequenz- / Mehrparametertechnik:</b> Signale bei mehreren Frequenzen werden gemischt, um Störgrößen (z. B. Lift-off, Stützplatten) zu eliminieren – in ISO 12718 definiert.</li><li><b>Fernfeldtechnik:</b> Erreger- und Empfangsspule im Abstand von mehreren Rohrdurchmessern; Feld durchdringt die Rohrwand zweimal – für Rohrinnenprüfung.</li><li><b>Sensorarrays / Mehrkanalgeräte:</b> viele Spulen decken große Flächen schnell ab.</li></ul>`,
