Raupe und auf der Raupe,<\/li><li>Abhebe- und Wackeleffekte.<\/li><\/ul>\n<p>Es ist eine <b>spezielle Sensortechnik<\/b> nötig: Sensoren, die gegen Schwankungen von μ<sub>rel<\/sub>, gegen den Abhebeeffekt und gegen Leitfähigkeitsänderungen unempfindlich sind.<\/p>\n<div data-vid=\"naht\"><\/div>\n<h3>13.1.3 Sensortechnik für Schweißnahtprüfung<\/h3>\n<p>Ähnlich wie bei der automatisierten Nahtprüfung mit Segmentsensoren verwendet man Sensoren mit <b>entkoppelten Wicklungen<\/b>: Das Feld der einen Wicklung induziert in der zweiten keine Spannung, solange keine flächige, rissartige Störung im Wirkbereich liegt. Das erreicht man z. B. durch <b>gekreuzte Wicklungen<\/b> (Draufsicht). Es gibt eine Absolut- und eine Differenzschaltung (Abb. 13.2).<\/p>\n<div data-fig=\"v13_sensor\" data-cap=\"Abb. 13.2: Sensoraufbau für die Schweißnahtprüfung – Absolutschaltung und Differenzschaltung mit gekreuzten Wicklungen (Draufsicht, schematisch)\"><\/div>\n<p>Beide Typen zeigen <b>flächige, rissartige, zur Oberfläche offene Trennungen<\/b> an: Risse im Schweißgut (längs und quer), in der Wärmeeinflusszone und im angrenzenden unbeeinflussten Grundmaterial (meist parallel zur Naht) sowie scharfe Einbrandkerben bis hin zu offenen Flankenbindefehlern.<\/p>\n<p>Abb. 13.3 und 13.4 vergleichen Anzeigen eines <b>konventionellen Tastsensors<\/b> mit denen eines <b>für die Schweißnahtprüfung optimierten Sensors<\/b> an einer abgeschliffenen Raupe – ohne und mit Fehler: Der optimierte Sensor liefert an der fehlerfreien Raupe ein ruhiges Signal, während der konventionelle durch Geometrie und Gefüge deutlich gestört wird; der Fehler hebt sich nur beim optimierten Sensor klar ab.<\/p>\n<div data-fig=\"v13_vgl\" data-cap=\"Abb. 13.3/13.4: Konventioneller Tastsensor und optimierter Schweißnahtsensor – abgeschliffene Raupe ohne und mit Fehler (schematisch)\"><\/div>\n\n<h2>13.2 Prüfungsdurchführung nach DIN EN ISO 17643 (auszugsweise)<\/h2>\n<h3>13.2.1 Amplitudenverhältnis der Nutanzeigen<\/h3>\n<p>Die Norm verlangt einen Nachweis der Geräteeignung hinsichtlich der Empfindlichkeit an einem Vergleichskörper mit verschieden tiefen Nuten. Dabei darf der Unterschied zwischen der Anzeige einer <b>1-mm-Nut<\/b> und einer <b>0,5-mm-Nut<\/b> bei gleicher Beschichtungsdicke <b>höchstens 6 dB<\/b> betragen (z. B. 100 % zu 50 % Bildschirmhöhe). Das Verhältnis erreicht man über eine geeignete <b>Frequenzeinstellung<\/b> (erlaubter Arbeitsbereich nach Norm: 100 kHz bis 1 MHz).<\/p>\n<div data-fig=\"v13_nuten\" data-cap=\"Abb. 13.5: Typische Anzeigen bei der Justierung am Vergleichskörper – 1-mm-Nut und 0,5-mm-Nut, jeweils mit 0,5 mm Schicht (schematisch)\"><\/div>\n<h3>13.2.2 Durchführung der Justierung für ferritische Werkstoffe<\/h3>\n<p>Man nutzt einen Vergleichskörper mit <b>funkenerodierten Nuten von 0,5, 1 und 2 mm Tiefe<\/b> und einer simulierten nichtleitenden Beschichtung in der maximal zu erwartenden Dicke (hier 0,5 mm).<\/p>\n<div data-fig=\"v13_besch\" data-cap=\"Abb. 13.6: Nutsignale vom Vergleichskörper – ohne Beschichtung und mit Beschichtung (Verstärkung +6 dB)\"><\/div>\n<p>Wie Abb. 13.6 zeigt, lässt sich eine <b>Beschichtung (max. 2 mm nach ISO 17643, Abschn. 6.3) durch höhere Verstärkung ausgleichen<\/b> – vorausgesetzt, die Schicht ist gleichmäßig dick; das ist in einem ersten Schritt mit Wirbelstrom zu kontrollieren. Das Prüfen durch vorhandene Beschichtungen ist ein großer Vorteil: Bei Sicht- und Eindringprüfung müssen Beschichtungen unbedingt entfernt werden, bei der Magnetpulverprüfung sind nur Schichten ≤ 50 µm zulässig. Allerdings ist die Empfindlichkeit der Wirbelstromprüfung derzeit noch recht niedrig; die ISO 17643 gibt als Nachweisgrenze eine Mindestlänge von <b>5 mm bei 1 mm Tiefe<\/b> an.<\/p>\n<div class=\"warn\">Sind Anzeigen mit Wirbelstrom nicht eindeutig zuzuordnen, sollte man mit einem geeigneten anderen ZfP-Verfahren nachprüfen.<\/div>\n<div data-sim=\"weld\"><\/div><div data-sim=\"justage\"><\/div>\n<h3>13.2.3 Ergebnisbeispiele<\/h3>\n<p>Die Abbildungen 13.7 bis 13.9 zeigen typische Signalverläufe:<\/p>\n<ul><li><b>Abb. 13.7:<\/b> Übergangszone Grundmaterial/Schweißnaht – ohne und mit Fehler,<\/li><li><b>Abb. 13.8:<\/b> Fehler im Nahtbereich bei abgeschliffener Raupe unter einer 0,5 mm dicken Beschichtung,<\/li><li><b>Abb. 13.9:<\/b> Naht eines widerstandsgeschweißten Profils mit offenen Bindefehlern, geprüft mit einem <b>Großflächensensor<\/b>, der die Naht samt Wärmeeinflusszonen überdeckt.<\/li><\/ul>\n<div data-fig=\"v13_bsp\" data-cap=\"Abb. 13.7: Signalverlauf an der Übergangszone Grundmaterial/Schweißnaht – ohne Fehler (links) und mit Fehler (rechts); Beispiele 13.8 und 13.9 analog\"><\/div>\n"};

const GLOSS=[['Abgleich','Einstellung des Prüfsystems auf einen definierten Nullzustand (z. B. am fehlerfreien Material).'],['Abhebeeffekt (Lift-off)','Änderung des Signals durch Änderung des Abstands zwischen Sensor und Prüfgegenstand. Bei der Schichtdickenmessung die Messgröße, sonst Störgröße.'],['Absolutmessung','Messung mit einer einzelnen Spule bzw. gegen einen festen Bezug; zeigt auch langsame Änderungen (Leitfähigkeit, Temperatur, lange Fehler).'],['Amplitudenauswertung','Auswertung nach dem Betrag des Signalvektors; phasenunabhängig (Kreisschwelle).'],['Amplitudenpermeabilität','Steigung der bei kleiner Wechselfelderregung erhaltenen Hysteresisschleife; bei ET ohne Vormagnetisierung maßgeblich.'],['Arbeitskonstante k','Verhältnis f/f_g der Prüffrequenz zur Grenzfrequenz (Ähnlichkeitsgesetz).'],['Außendurchlaufsensor','Spule, die das Prüfgut außen umfasst.'],['Bezugskörper / Justierkörper','Körper bekannter Abmessungen und Eigenschaften zur Justierung und Kontrolle von Prüfeinrichtungen.'],['Blindwiderstand X_L','Induktiver Widerstand 2π·f·L; verursacht keine Leistungsverluste und keine Erwärmung.'],['Differenzmessung','Vergleich zweier benachbarter Prüfbereiche (Selbstvergleich) – unempfindlich gegen langsame Änderungen, Wackeln, Drift.'],['Doppeldifferenz / Mehrfachdifferenz','Weiterentwicklungen der Differenzschaltung zur Unterdrückung des Wackeleffekts.'],['Eindringtiefe (Standard-)','Tiefe, in der die Wirbelstromdichte auf 1/e (≈ 37 %) gefallen ist; δ = 503/√(f·σ·μr) in mm.'],['Endeneffekt','Ungeprüftes Rohrende/-anfang bei Einzelprüfung (≈ Rohrdurchmesser).'],['Fremdvergleich','Vergleich des Prüfgegenstands mit einem separaten Referenzteil (zwei Spulen).'],['Füllungsgrad η','Verhältnis der Querschnitte von Prüfgut und Spule; außen (D_P/D_S)², innen (D_S/D_P)².'],['Grenzfrequenz f_g','Frequenz, bei der k = 1; f_g = 5066/(σ·μr·D²) [σ in MS/m, D in cm].'],['Hystereseschleife','B-H-Zusammenhang ferromagnetischer Werkstoffe.'],['IACS','International Annealed Copper Standard: 100 % IACS = 58 MS/m.'],['Impedanzebene','Darstellung von Wirk- (R) und Blindwiderstand (X_L) senkrecht zueinander; Anzeige von Wirbelstromsignalen.'],['Induktion','Entstehung einer Spannung durch Änderung des magnetischen Flusses.'],['Justieren','Einstellen eines Messgeräts, sodass Messabweichungen möglichst klein werden – ein Eingriff.'],['Kanteneffekt','Signalstörung bei Annäherung an Kanten des Prüfgegenstands.'],['Korrelationsauswertung','Auswertung zweier zeitlich um t = a/v versetzter Signale zur Unterdrückung von Pseudofehlern.'],['Lenz’sche Regel','Induktionswirkung wirkt ihrer Ursache entgegen.'],['Nutz-zu-Störsignal-Verhältnis','Verhältnis der Amplituden von Nutz- und Störsignalen; ≥ 3:1 bzw. 10 dB gefordert.'],['Ohmscher Widerstand (Wirkwiderstand)','Verursacht Leistungsverluste und Erwärmung.'],['Phasensteller','Dreht das Signal reproduzierbar in 1°-Schritten (0–360°).'],['Segmentsensor','Sensor mit senkrecht stehender Feld- und Messspule (entkoppelt, selbstabgleichend).'],['Selbstinduktion','Induktionswirkung des Stroms auf den eigenen Leiterkreis.'],['Skineffekt','Verdrängung des Wechselstroms/der Wirbelströme an die Oberfläche.'],['Tastsensor','Sensor für ebene Flächen; Reflexions- oder Transmissionsanordnung („Gabelspule“).'],['Überlagerungspermeabilität','Permeabilität bei Gleichfeld-Vormagnetisierung; entscheidende Kenngröße ferromagnetischer Werkstoffe.'],['Verifizierung (15548)','Stufe 1: funktional/häufig; Stufe 2: jährlich ausführlich; Stufe 3: alle Kennwerte.'],['Wackeleffekt','Signal durch seitliche Bewegung des Prüfguts in der Spule.'],['Wechselwirkungsvolumen','Vom Sensor erfasstes Materialvolumen; klein → empfindlich für kleine Fehler.'],['Wirbelstrom','In einem Leiter durch ein magnetisches Wechselfeld induzierter Strom.'],['Wirkbreite','Erfassungsbreite eines Sensors (z. B. Segmentsensor ±30 mm).'],['Y-Komponenten-Auswertung','Fehler gilt, wenn die Y-Komponente die Schwelle erreicht.']];

px 10px; font-weight:600;}\n  #segMode button{width:100%; padding:8px 6px; line-height:1.25;}\n  select.sel{width:100%; padding:7px 9px; border-radius:8px; border:1.5px solid var(--border); background:var(--bg-2); color:var(--text); font-family:var(--mono); font-size:10.5px;}\n  select.sel:focus-visible{outline:2px solid var(--cyan); outline-offset:2px;}\n  body.mode-gef .riss-only{display:none !important;}\n  body:not(.mode-gef) .gef-only{display:none !important;}\n  @media(prefers-reduced-motion:reduce){ *{transition:none!important; animation:none!important;} }\n  /* \u2500\u2500 Einflussgr\u00f6\u00dfen-Listen und Diagrammschrift der neuen Verfahren \u2500\u2500 */\n  svg.view text{font-family:var(--mono);}\n  .factors{display:flex;flex-direction:column;margin-top:2px;}\n  .frow{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--border-soft);font-size:12px;}\n  .frow:first-child{border-top:0;}\n  .frow .dot{width:10px;height:10px;border-radius:50%;background:var(--green);justify-self:center;}\n  .frow.warn .dot{background:var(--red);}\n  .frow.idle .dot{background:var(--text-faint);opacity:.5;}\n  .frow .nm{font-family:var(--disp);font-weight:600;}\n  .frow .nm small{display:block;font-family:var(--mono);font-weight:400;font-size:10px;color:var(--text-dim);line-height:1.35;}\n  .frow .vv{font-family:var(--mono);font-weight:700;font-size:12px;color:var(--green);white-space:nowrap;}\n  .frow.warn .vv{color:var(--red);}\n  .frow.idle .vv{color:var(--text-faint);}\n  .btn.tog.on{border-color:var(--cyan);color:var(--cyan);}\n  .stage .stats{padding:0 14px 10px;}\n  .stage-sub{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);font-weight:400;letter-spacing:0;text-transform:none;}\n  .gstates{display:grid;grid-template-columns:1fr 1fr;gap:5px 6px;}\n  .gstates .toggle{margin:0;padding:6px 8px;font-size:10.5px;cursor:pointer;}\n<\/style>\n<script id=\"perf-guard\">\n/* Entlastung: Bildschleifen passen sich der Rechenzeit an (kein Dauer-Vollgas auf schwachen/mobilen Ger\u00e4ten) */\n(function(){var raf=window.requestAnimationFrame.bind(window),st=new WeakMap();\nwindow.requestAnimationFrame=function(cb){return raf(function w(t){\n  var o=st.get(cb)||{last:0,ema:0}; st.set(cb,o);\n  var gap=Math.min(100,o.ema*1.2);\n  if(o.last&&t-o.last<gap){return raf(w);}\n  var s=performance.now(); o.last=t; try{cb(t);}finally{o.ema=o.ema*0.8+(performance.now()-s)*0.2; if(o.ema<10) o.ema=0;}\n});};\n})();\n<\/script>\n\n\n<style id=\"fit-css\">\n/* \u2550\u2550\u2550 Kompakt-Dashboard (wie UT): kleine Schrift, dichte Panels, alles auf einem Bildschirm \u2550\u2550\u2550 */\nhtml.fit, html.fit body{height:100%; overflow:hidden;}\nhtml.fit .app{box-sizing:border-box; display:flex; flex-direction:column; padding:5px 12px 8px; gap:6px; max-width:none; width:100%; height:100vh; height:100dvh; overflow:hidden; zoom:1 !important;}\nhtml.fit .sfl-bar{display:none;}\nhtml.fit header.top{margin:0; padding:0 0 4px; flex:0 0 auto; align-items:center; gap:12px; flex-wrap:nowrap;}\nhtml.fit header.top .brand-eyebrow, html.fit .eyebrow{font-size:9px; margin:0 0 1px;}\nhtml.fit header.top h1{font-size:21px; line-height:1.05; margin:0;}\nhtml.fit header.top h1 small, html.fit header.top .title-group > small, html.fit header.top .sub{font-size:11.5px; line-height:1.2;}\nhtml.fit .badge{font-size:10.5px; padding:3px 9px;}\nhtml.fit .icon-btn{width:30px; height:30px; font-size:14px;}\nhtml.fit .fitgrid{flex:1 1 0; min-height:0; display:grid; gap:8px; margin:0; align-items:stretch;}\nhtml.fit .fcol{display:flex; flex-direction:column; gap:8px; min-height:0; min-width:0; overflow-y:auto; overflow-x:hidden; padding:0 2px 4px 0; scrollbar-width:thin;}\nhtml.fit .fcol > *{flex:0 0 auto; margin:0 !important;}\nhtml.fit .fcol.dual{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); grid-auto-rows:auto; align-content:start; column-gap:8px; row-gap:8px;}\nhtml.fit .fcol.dual > .sub{display:flex; flex-direction:column; gap:8px; min-width:0;}\nhtml.fit .fcol.dual > .sub > *{flex:0 0 auto; margin:0 !important;}\nhtml.fit .fcol.dual > .spanall{grid-column:1 / -1;}\nhtml.fit .fitgrid #pcDecay{max-height:300px !important; width:100% !important;}\nhtml.fit .fitgrid #pcProfile{max-height:230px !important; width:100% !important;}\nhtml.fit .fitgrid .fcol.dual > .spanall #secSvg{max-height:330px !important; width:100% !important;}\nhtml.fit .panel{padding:8px 10px 9px; border-radius:10px;}\nhtml.fit .panel h2, html.fit .stage-title, html.fit .panel > .stage-title{margin:0 0 5px; font-size:10.5px; letter-spacing:.07em; line-height:1.25;}\nhtml.fit .stage-head{gap:4px 10px; flex-wrap:wrap; padding:0 0 4px; margin:0 0 2px;}\nhtml.fit .ctl-row, html.fit .field{margin:0 0 5px;}\nhtml.fit .ctl-row label, html.fit .field label{font-size:11.5px; margin:0 0 1px; line-height:1.25;}\nhtml.fit .ctl-row label .val, html.fit .field label .val{font-size:11.5px;}\nhtml.fit input[type=range]{margin:1px 0; height:18px;}\nhtml.fit .hint, html.fit .note, html.fit .ctl-row .note, html.fit .sidebar-note, html.fit .panel .hint{font-size:10.5px; line-height:1.32; margin:2px 0 0;}\nhtml.fit .btnrow{gap:5px; margin:4px 0;}\nhtml.fit button, html.fit select{font-size:11.5px; padding:5px 9px;}\nhtml.fit .callout, html.fit .verdict{font-size:11.5px; line-height:1.4; padding:7px 10px; margin-top:5px; max-height:none; overflow:visible;}\nhtml.fit .stat{padding:5px 8px;} html.fit .stat .k{font-size:9.5px; line-height:1.2;} html.fit .stat .v{font-size:14.5px;}\nhtml.fit .stats{gap:5px; grid-template-columns:repeat(3,1fr);}\nhtml.fit .seg{gap:4px;}\nhtml.fit .seg button, html.fit .toggle button{padding:6px 5px; min-width:0; white-space:normal; line-height:1.2; font-size:11px;}\nhtml.fit .seg.mini button{padding:3px 8px; font-size:10.5px;}\nhtml.fit .toggle{flex-wrap:wrap; padding:5px 8px; margin:0 0 4px;}\nhtml.fit .legend{font-size:10px; margin-top:4px; gap:3px 12px;}\nhtml.fit table.res td, html.fit table.res th, html.fit table.ht td, html.fit table.ht th{padding:3px 5px; font-size:10.5px;}\nhtml.fit .pstep, html.fit .step{padding-top:5px; padding-bottom:5px; gap:8px;}\nhtml.fit .pstep p, html.fit .step p{font-size:10.5px; line-height:1.38; margin-top:2px;}\nhtml.fit .pstep h4{font-size:12px;}\nhtml.fit .frow{padding:3px 0; font-size:11.5px;}\nhtml.fit .frow .nm small{font-size:10px; line-height:1.25;}\nhtml.fit .live{padding:8px 11px; margin-bottom:6px;}\nhtml.fit .live-val{font-size:19px;}\nhtml.fit .pbar{margin:6px 0 4px;}\nhtml.fit .stage, html.fit .panel > .stage{margin:0;}\nhtml.fit .foot{font-size:10.5px; padding-top:3px;}\nhtml.fit .kv{font-size:11px;}\nhtml.fit:not(.zz):not(.zz) .legend{font-size:12px;}\nhtml.fit canvas, html.fit svg.view{max-width:100%; height:auto;}\nhtml.fit .step p, html.fit .pstep p{display:none;}\nhtml.fit .step.cur p, html.fit .pstep.cur p{display:block;}\n/* Slider-reiche Panels: zwei Regler nebeneinander */\nhtml.fit .panel.fit2{display:grid; grid-template-columns:1fr 1fr; column-gap:12px; align-content:start;}\nhtml.fit .panel.fit2 > *{grid-column:1/-1;}\nhtml.fit .panel.fit2 > .ctl-row, html.fit .panel.fit2 > .field{grid-column:auto; min-width:0;}\n\n/* Grafiken: nur Breite begrenzt, H\u00f6he folgt dem Seitenverh\u00e4ltnis \u2192 nie verzerrt */\nhtml.fit .stage canvas, html.fit .stage svg{max-width:100%; height:auto;}\n/* Kompaktstufen (nur Abst\u00e4nde, Schriftgr\u00f6\u00dfe bleibt \u2192 Browser-Zoom wirkt normal) */\nhtml.fit.d1 .fitgrid, html.fit.d1 .fcol{gap:6px;}\nhtml.fit.d1 .panel{padding:6px 8px 7px;}\nhtml.fit.d1 .panel h2, html.fit.d1 .stage-title{margin-bottom:3px;}\nhtml.fit.d1 .ctl-row, html.fit.d1 .field{margin-bottom:3px;}\nhtml.fit.d1 .hint, html.fit.d1 .note, html.fit.d1 .panel .hint{margin-top:1px; line-height:1.25;}\nhtml.fit.d1 .stat{padding:3px 7px;} html.fit.d1 .stats{gap:4px;}\nhtml.fit.d1 .toggle{padding:3px 7px; margin-bottom:3px;}\nhtml.fit.d1 .seg button, html.fit.d1 .toggle button{padding:4px 4px;}\nhtml.fit.d1 button, html.fit.d1 select{padding:3px 8px;}\nhtml.fit.d1 .callout, html.fit.d1 .verdict{padding:5px 8px; margin-top:3px; line-height:1.3;}\nhtml.fit.d1 .pstep, html.fit.d1 .step{padding-top:3px; padding-bottom:3px;}\nhtml.fit.d1 .legend{margin-top:2px;} html.fit.d1 .btnrow{margin:2px 0;}\nhtml.fit.d1 header.top{padding-bottom:2px;}\nhtml.fit.d2 .fitgrid, html.fit.d2 .fcol{gap:4px;}\nhtml.fit.d2 .panel{padding:4px 7px 5px; border-radius:8px;}\nhtml.fit.d2 .panel h2, html.fit.d2 .stage-title{margin-bottom:2px; font-size:10px;}\nhtml.fit.d2 .ctl-row, html.fit.d2 .field{margin-bottom:1px;}\nhtml.fit.d2 input[type=range]{height:14px; margin:0;}\nhtml.fit.d2 .hint, html.fit.d2 .note, html.fit.d2 .panel .hint{line-height:1.18; font-size:10px; margin-top:0;}\nhtml.fit.d2 .stat{padding:2px 6px;} html.fit.d2 .stat .v{font-size:13px;} html.fit.d2 .stats{gap:3px;}\nhtml.fit.d2 .toggle{padding:2px 6px; margin-bottom:2px;}\nhtml.fit.d2 .seg button, html.fit.d2 .toggle button{padding:3px 3px;}\nhtml.fit.d2 button, html.fit.d2 select{padding:2px 7px;}\nhtml.fit.d2 .callout, html.fit.d2 .verdict{padding:3px 7px; margin-top:2px; line-height:1.25;}\nhtml.fit.d2 .pstep, html.fit.d2 .step{padding-top:2px; padding-bottom:2px;}\nhtml.fit.d2 header.top h1{font-size:19px;} html.fit.d2 header.top h1 small{display:none;}\nhtml.fit.d2 .legend{margin-top:1px;} html.fit.d2 .btnrow{margin:1px 0;} html.fit.d2 .live{padding:5px 9px; margin-bottom:3px;}\n\nhtml.fit .thermal-wrap{align-items:start;}\nhtml.fit #heat{height:auto !important; align-self:start;}\nhtml.fit #cbar{height:100%;}\n/* Tabellen: nie rechts abschneiden */\nhtml.fit .fcol div:has(> table), html.fit .fcol .tablewrap, html.fit .fcol .skiptbl-wrap{overflow-x:auto; max-width:100%;}\nhtml.fit .fcol table{font-size:10.5px;}\nhtml.fit .fcol table th, html.fit .fcol table td{padding:3px 4px; white-space:normal;}\n/* alte max-height-Kappen der Einzel-Apps aufheben: H\u00f6he folgt nur dem Seitenverh\u00e4ltnis (keine Seitenbalken) */\nhtml.fit svg, html.fit .stage svg, html.fit #setup, html.fit #wave, html.fit #chart, html.fit #view{max-height:none !important;}\nhtml.fit .panel.fit2 > .ctl-row, html.fit .panel.fit2 > .field{min-width:0; overflow:hidden;}\nhtml.fit .panel.fit2 select, html.fit .panel.fit2 input[type=range]{width:100%; max-width:100%; min-width:0;}\n/* ET-spezifisch */\nhtml.fit .fitgrid .stagegrid, html.fit .fitgrid .stagegrid.wide{grid-template-columns:1fr !important;}\nhtml.fit .fitgrid .impgrid{display:grid; grid-template-columns:1fr; gap:8px; align-items:start;}\nhtml.fit .fitgrid .impgrid > svg{width:100%; height:auto; max-height:none;}\nhtml.fit .fitgrid .impside{min-width:0;}\nhtml.fit .fitgrid #secSvg, html.fit .fitgrid #cvMicro, html.fit .fitgrid #imp, html.fit .fitgrid #cscan, html.fit .fitgrid #strip{width:100%; max-width:100%; height:auto; max-height:none; margin:0 auto; display:block;}\nhtml.fit .fitgrid #tubeRefBox{display:grid; grid-template-columns:1fr 1fr; gap:4px 6px;}\nhtml.fit .fitgrid #tubeRefBox .toggle{margin:0; font-size:11px; padding:4px 7px;}\nhtml.fit .fitgrid #gefInfo{font-size:11px; line-height:1.35;}\nhtml.fit .fitgrid #statsGef{grid-template-columns:repeat(3,1fr);}\nhtml.fit .gstates{gap:4px 6px;}\nhtml.fit .gstates .toggle{padding:5px 7px; font-size:11px;}\n\n<\/style>\n\n<\/head>\n<body>\n<div class=\"app\">\n\n  <header class=\"top\">\n    <div>\n      <p class=\"eyebrow\" id=\"eyebrow\">Wirbelstrompr\u00fcfung<\/p>\n      <h1>Wirbelstrom-Simulator\n        <small id=\"h1sub\">Impedanzebene, C-Bild und Streifenschreiber \u00b7 Absolut- und Differenzsonde<\/small>\n      <\/h1>\n    <\/div>\n    <div class=\"hdr-right\">\n      <span class=\"badge\"><span class=\"dot\"><\/span>Simulation<\/span>\n      <span class=\"badge\" id=\"bProbe\">\u2014<\/span>\n      <span class=\"badge\" id=\"bMat\">\u2014<\/span>\n      <span class=\"badge\" id=\"bDelta\" title=\"Standardeindringtiefe \u03b4 bei aktueller Frequenz und Werkstoff\">\u03b4 \u2014<\/span>\n      <span class=\"badge\" id=\"bSig\">\u2014<\/span>\n      <button class=\"icon-btn\" id=\"themeBtn\" aria-label=\"Hell/Dunkel umschalten\">\u2600<\/button>\n    <\/div>\n  <\/header>\n\n  <div class=\"layout\">\n    <div class=\"sidebar\">\n\n      <div class=\"panel\">\n        <h2>Pr\u00fcfaufgabe<\/h2>\n        <select class=\"sel\" id=\"modeSel\" aria-label=\"Pr\u00fcfaufgabe w\u00e4hlen\"><\/select>\n        <div class=\"seg\" id=\"segMode\">\n          <button data-mode=\"riss\" class=\"on\">Risspr\u00fcfung<\/button>\n          <button data-mode=\"corr\">Korrosion<br>zwischen 2 Platten<\/button>\n          <button data-mode=\"weld\">Schwei\u00dfnaht-<br>pr\u00fcfung<\/button>\n          <button data-mode=\"burn\">Schleifbrand<br>Anlass-/Neuh\u00e4rtezone<\/button>\n          <button data-mode=\"tube\">Rohrpr\u00fcfung<br>0,8 \u00b7 1,0 \u00b7 1,2 mm<\/button>\n          <button data-mode=\"mix\">Verwechslungs-<br>pr\u00fcfung<\/button>\n          <button data-mode=\"gef\">Gef\u00fcgepr\u00fcfung<\/button>\n          <button data-mode=\"cond\">Leitf\u00e4higkeit<br>W\u00e4rmebehandlung<\/button>\n          <button data-mode=\"coat\">Schichtdicke<br>(Abhebung)<\/button>\n          <button data-mode=\"hole\">Bohrungspr\u00fcfung<br>rotierende Sonde<\/button>\n          <button data-mode=\"pec\">Gepulster ET<br>Wand unter Isolierung<\/button>\n          <button data-mode=\"mfm\">Mehrfrequenz-Mischung<br>St\u00fctzplatte<\/button>\n        <\/div>\n        <div class=\"hint\" id=\"modeHint\">Oberfl\u00e4chenrisse an einem Pr\u00fcfblech suchen: Sonde abscannen, Rissanzeige von der Abhebung trennen.<\/div>\n      <\/div>\n\n      <div class=\"panel riss-only\">\n        <h2>Sonde und Frequenz<\/h2>\n        <div class=\"field\">\n          <label>Sondenbauart<\/label>\n          <div class=\"seg\" id=\"segProbe\">\n            <button data-probe=\"abs\">Absolutsonde<\/button>\n            <button data-probe=\"diff\" class=\"on\">Differenzsonde<\/button>\n          <\/div>\n          <div class=\"hint\" id=\"probeHint\">Zwei gegeneinander geschaltete Spulen. Unterdr\u00fcckt Abhebung und langsame Werkstoffdrift, spricht nur auf \u00f6rtliche Anomalien an \u2014 typisch als Schmetterlingsfigur.<\/div>\n        <\/div>\n        <div class=\"field\">\n          <label for=\"freq\">Pr\u00fcffrequenz f <span class=\"val\" id=\"vFreq\">\u2014<\/span><\/label>\n          <input type=\"range\" id=\"freq\" min=\"0\" max=\"100\" step=\"0.5\" value=\"55\">\n        <\/div>\n        <div class=\"row2\">\n          <div class=\"field\">\n            <label for=\"coilDia\">Spulen-\u2205 <span class=\"val\" id=\"vCoilDia\">8 mm<\/span><\/label>\n            <input type=\"range\" id=\"coilDia\" min=\"2\" max=\"16\" step=\"0.5\" value=\"8\">\n          <\/div>\n          <div class=\"field\">\n            <label for=\"liftOff\">Abhebung <span class=\"val\" id=\"vLiftOff\">0,10 mm<\/span><\/label>\n            <input type=\"range\" id=\"liftOff\" min=\"0\" max=\"60\" step=\"1\" value=\"10\">\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"panel riss-only\">\n        <h2>Werkst\u00fcck<\/h2>\n        <div class=\"field\">\n          <label>Werkstoff<\/label>\n          <div class=\"seg\" id=\"segMat\"><\/div>\n        <\/div>\n        <div class=\"kv\">\n          <span class=\"k\">Leitf\u00e4higkeit \u03c3<\/span><span class=\"v\" id=\"kSigma\">\u2014<\/span>\n          <span class=\"k\">Permeabilit\u00e4t \u00b5\u1d63<\/span><span class=\"v\" id=\"kMu\">\u2014<\/span>\n          <span class=\"k\">Eindringtiefe \u03b4<\/span><span class=\"v\" id=\"kDelta\">\u2014<\/span>\n          <span class=\"k\">Grenzfrequenz f_g<\/span><span class=\"v\" id=\"kFg\">\u2014<\/span>\n        <\/div>\n        <div class=\"row2\" style=\"margin-top:11px\">\n          <div class=\"field\">\n            <label for=\"plateLen\">L\u00e4nge <span class=\"val\" id=\"vPlateLen\">90 mm<\/span><\/label>\n            <input type=\"range\" id=\"plateLen\" min=\"40\" max=\"150\" step=\"5\" value=\"90\">\n          <\/div>\n          <div class=\"field\">\n            <label for=\"plateWidth\">Breite <span class=\"val\" id=\"vPlateWidth\">40 mm<\/span><\/label>\n            <input type=\"range\" id=\"plateWidth\" min=\"20\" max=\"80\" step=\"5\" value=\"40\">\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"panel riss-only\" data-scn=\"corr\">\n        <h2>Korrosion zwischen zwei Platten<\/h2>\n        <div class=\"row2\">\n          <div class=\"field\">\n            <label for=\"t1\">Deckblech t\u2081 <span class=\"val\" id=\"vT1\">1,5 mm<\/span><\/label>\n            <input type=\"range\" id=\"t1\" min=\"0.5\" max=\"3\" step=\"0.1\" value=\"1.5\">\n          <\/div>\n          <div class=\"field\">\n            <label for=\"t2\">2. Platte t\u2082 <span class=\"val\" id=\"vT2\">2,0 mm<\/span><\/label>\n            <input type=\"range\" id=\"t2\" min=\"1\" max=\"4\" step=\"0.1\" value=\"2\">\n          <\/div>\n        <\/div>\n        <div class=\"field\">\n          <label>Korrosionsfehler bearbeiten<\/label>\n          <div class=\"seg\" id=\"segCorr\" style=\"grid-template-columns:repeat(4,1fr)\">\n            <button data-k=\"0\" class=\"on\">K1<\/button><button data-k=\"1\">K2<\/button><button data-k=\"2\">K3<\/button><button data-k=\"3\">K4<\/button>\n          <\/div>\n        <\/div>\n        <div class=\"toggle on\" id=\"tglCorrOn\"><span id=\"corrSelName\">K1 \u00b7 rund<\/span><div class=\"switch\"><\/div><\/div>\n        <div class=\"row2\">\n          <div class=\"field\">\n            <label for=\"corrLoss\">Materialabtrag <span class=\"val\" id=\"vCorrLoss\">0,20 mm<\/span><\/label>\n            <input type=\"range\" id=\"corrLoss\" min=\"0.05\" max=\"2\" step=\"0.05\" value=\"0.2\">\n          <\/div>\n          <div class=\"field\">\n            <label for=\"corrSize\">Ausdehnung <span class=\"val\" id=\"vCorrSize\">4 mm<\/span><\/label>\n            <input type=\"range\" id=\"corrSize\" min=\"2\" max=\"14\" step=\"0.5\" value=\"4\">\n          <\/div>\n        <\/div>\n        <div class=\"field\">\n          <label>Tiefenlage<\/label>\n          <div class=\"seg\" id=\"segCorrLayer\"><button data-layer=\"joint\" class=\"on\">F\u00fcgefl\u00e4che<\/button><button data-layer=\"back\">R\u00fcckseite 2. Platte<\/button><\/div>\n          <div class=\"hint\">Vier Fehler auf einem Teil mit unterschiedlicher <b>Form<\/b> (rund, oval, Lochfra\u00df, fl\u00e4chig), <b>Tiefenlage<\/b> und <b>Sch\u00e4digung<\/b>: Die Stufe (1 Anfang \u2026 4 kritisch) folgt aus der Restwanddicke der 2. Platte. R\u00fcckseitenkorrosion liegt tiefer und braucht eine niedrigere Frequenz; die <b>Phase<\/b> verr\u00e4t die Tiefenlage.<\/div>\n        <\/div>\n        <h2 style=\"margin-top:14px\">Toleranzfelder<\/h2>\n        <div class=\"toggle on\" id=\"tglCorrAuto\"><span>Felder automatisch aus Referenzk\u00f6rper<\/span><div class=\"switch\"><\/div><\/div>\n        <div class=\"row2\">\n          <div class=\"field\">\n            <label for=\"corrPhTol\">Phasentoleranz \u00b1 <span class=\"val\" id=\"v_corrPhTol\">12 \u00b0<\/span><\/label>\n            <input type=\"range\" id=\"corrPhTol\" min=\"4\" max=\"30\" step=\"1\" value=\"12\">\n          <\/div>\n          <div class=\"field\">\n            <label for=\"corrMax\">Max. zul\u00e4ssige Stufe<\/label>\n            <select class=\"sel\" id=\"corrMax\"><option value=\"1\">Stufe 1<\/option><option value=\"2\" selected>Stufe 2<\/option><option value=\"3\">Stufe 3<\/option><\/select>\n          <\/div>\n        <\/div>\n        <div class=\"btnrow\"><button class=\"btn\" id=\"btnCorrFields\">Felder neu aus Referenz<\/button><\/div>\n        <div class=\"hint\">Zus\u00e4tzlich zur Schwelle gibt es <b>Toleranzfelder in der Impedanzebene<\/b>: Ein Referenzk\u00f6rper mit Abtr\u00e4gen von 10, 25 und 50 % der 2. Platte (F\u00fcgefl\u00e4che und R\u00fcckseite) legt je Tiefenlage ein <b>Phasenband<\/b> und drei <b>Amplitudenringe<\/b> (Stufe 1\u20134) fest. Jede Anzeige wird einem Feld zugeordnet und als zul\u00e4ssig oder nicht zul\u00e4ssig bewertet. Nach \u00c4nderung von Frequenz, Verst\u00e4rkung oder Phase m\u00fcssen die Felder neu aus der Referenz abgeleitet werden.<\/div>\n      <\/div>\n\n      <div class=\"panel riss-only\" data-scn=\"burn\">\n        <h2>Schleifbrand<\/h2>\n        <div class=\"toggle on\" id=\"tglBurn\"><span>Schleifbrand im Pr\u00fcfst\u00fcck<\/span><div class=\"switch\"><\/div><\/div>\n        <div class=\"field\">\n          <label>Form<\/label>\n          <div class=\"seg\" id=\"segBurnForm\">\n            <button data-bform=\"ring\" class=\"on\">Umlaufend (in Scanrichtung)<\/button>\n            <button data-bform=\"spot\">\u00d6rtlich (Fleck)<\/button>\n          <\/div>\n          <div class=\"hint\">Kleiner umlaufender Schleifbrand: schmaler Streifen in Scanrichtung \u2013 so, wie die Sonde am Ring uml\u00e4uft (Scan von links nach rechts, Zeile f\u00fcr Zeile quer dazu). Der \u00f6rtliche Fleck ist ein einzelner Brandfleck.<\/div>\n        <\/div>\n        <div class=\"field\">\n          <label>Zone<\/label>\n          <div class=\"seg\" id=\"segBurnType\">\n            <button data-btype=\"temper\" class=\"on\">Anlasszone (weicher)<\/button>\n            <button data-btype=\"rehard\">Neuh\u00e4rtung (h\u00e4rter)<\/button>\n          <\/div>\n        <\/div>\n        <div class=\"row2\">\n          <div class=\"field\" id=\"burnXField\">\n            <label for=\"burnX\">Lage x <span class=\"val\" id=\"vBurnX\">45 mm<\/span><\/label>\n            <input type=\"range\" id=\"burnX\" min=\"10\" max=\"80\" step=\"1\" value=\"45\">\n          <\/div>\n          <div class=\"field\">\n            <label for=\"burnW\">Breite <span class=\"val\" id=\"vBurnW\">3 mm<\/span><\/label>\n            <input type=\"range\" id=\"burnW\" min=\"1\" max=\"12\" step=\"0.5\" value=\"3\">\n          <\/div>\n        <\/div>\n        <div class=\"field\">\n          <label for=\"burnSev\">Auspr\u00e4gung (Gef\u00fcge\u00e4nderung) <span class=\"val\" id=\"vBurnSev\">40 %<\/span><\/label>\n          <input type=\"range\" id=\"burnSev\" min=\"10\" max=\"100\" step=\"5\" value=\"40\">\n          <div class=\"hint\">Die Brandzone ist nur ca. 0,05\u20130,3 mm dick: eine <b>h\u00f6here Frequenz<\/b> (kleinere Eindringtiefe) macht sie deutlich besser sichtbar. Anlasszone und Neuh\u00e4rtung drehen das Signal in entgegengesetzte Richtung.<\/div>\n        <\/div>\n        <div class=\"field\" id=\"burnYField\">\n          <label for=\"burnY\">Lage y (quer zur Scanrichtung) <span class=\"val\" id=\"vBurnY\">20 mm<\/span><\/label>\n          <input type=\"range\" id=\"burnY\" min=\"0\" max=\"40\" step=\"1\" value=\"20\">\n        <\/div>\n      <\/div>\n\n      <div class=\"panel riss-only\" data-scn=\"weld\">\n        <h2>Schwei\u00dfnaht<\/h2>\n        <div class=\"toggle on\" id=\"tglWeldSeam\"><span>Schwei\u00dfnaht im Pr\u00fcfst\u00fcck<\/span><div class=\"switch\"><\/div><\/div>\n        <div class=\"toggle on\" id=\"tglWeldPores\"><span>Poren in der Naht<\/span><div class=\"switch\"><\/div><\/div>\n        <div class=\"field\">\n          <label>Scanrichtung<\/label>\n          <div class=\"seg\" id=\"segWeldDir\">\n            <button data-wdir=\"along\" class=\"on\">Entlang der Naht<\/button>\n            <button data-wdir=\"across\">Quer zur Naht<\/button>\n          <\/div>\n          <div class=\"hint\">Entlang der Naht liefert die Naht ein <b>gleichbleibendes<\/b> Signal. Nach dem Nullabgleich bleiben nur Poren und Riss als Ausschl\u00e4ge \u00fcbrig.<\/div>\n        <\/div>\n        <div class=\"btnrow\"><button class=\"btn\" id=\"btnWeldSet\">Sonde auf Naht setzen + Nullabgleich<\/button><\/div>\n        <div class=\"row2\">\n          <div class=\"field\">\n            <label for=\"weldX\">Nahtlage x <span class=\"val\" id=\"vWeldX\">45 mm<\/span><\/label>\n            <input type=\"range\" id=\"weldX\" min=\"15\" max=\"75\" step=\"1\" value=\"45\">\n          <\/div>\n          <div class=\"field\">\n            <label for=\"weldW\">Nahtbreite <span class=\"val\" id=\"vWeldW\">9 mm<\/span><\/label>\n            <input type=\"range\" id=\"weldW\" min=\"5\" max=\"16\" step=\"1\" value=\"9\">\n          <\/div>\n        <\/div>\n        <div class=\"field\">\n          <label for=\"weldCap\">Naht\u00fcberh\u00f6hung <span class=\"val\" id=\"vWeldCap\">1,0 mm<\/span><\/label>\n          <input type=\"range\" id=\"weldCap\" min=\"0\" max=\"2.5\" step=\"0.1\" value=\"1\">\n          <div class=\"hint\">Naht und W\u00e4rmeeinflusszone haben andere Leitf\u00e4higkeit und Permeabilit\u00e4t; die \u00dcberh\u00f6hung wirkt wie Abhebung. Zus\u00e4tzlich l\u00e4sst sich unten ein <b>Riss<\/b> in der Naht einstellen.<\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"panel riss-only\" data-scn=\"tube\">\n        <h2>W\u00e4lzlagerrohr \u00b7 Referenz- und Pr\u00fcfrohr<\/h2>\n        <div class=\"field\">\n          <label>Pr\u00fcfobjekt<\/label>\n          <div class=\"seg\" id=\"segTubeObj\">\n            <button data-obj=\"ref\" class=\"on\">Referenzrohr<br>(justieren)<\/button>\n            <button data-obj=\"lot\">Pr\u00fcfrohr<br>(Los, unbekannt)<\/button>\n          <\/div>\n          <div class=\"btnrow\" style=\"margin-top:6px\"><button class=\"btn\" id=\"btnTubeAuto\">Auto-Einstellung am Referenzrohr<\/button><button class=\"btn\" id=\"btnTubeNew\">Neues Pr\u00fcfrohr<\/button><button class=\"btn tog\" id=\"btnTubeReveal\" aria-pressed=\"false\">Wahre Fehler zeigen<\/button><\/div>\n          <div class=\"hint\">Erst am <b>Referenzrohr<\/b> justieren (gr\u00f6\u00dfte Anzeige \u2248 80 %, Schwelle = 50 % der kleinsten), dann ein <b>Pr\u00fcfrohr<\/b> durchziehen und entscheiden: i. O. oder n. i. O.?<\/div>\n        <\/div>\n        <div class=\"field\">\n          <label>Pr\u00fcfanordnung<\/label>\n          <div class=\"seg\" id=\"segTubeCoil\">\n            <button data-coil=\"through\" class=\"on\">Ringspule<br>(Durchlauf)<\/button>\n            <button data-coil=\"seg\">Segmentspulen<br>(Durchlauf)<\/button>\n          <\/div>\n          <div class=\"hint\">Das Rohr wird <b>einmal<\/b> durch die Spule gezogen. Ringspule: nur L\u00e4ngslage, Segmentspulen: zus\u00e4tzlich die Lage am Umfang.<\/div>\n        <\/div>\n        <div class=\"field\" id=\"tubeSecField\" style=\"display:none\">\n          <label for=\"tubeSec\">Segmentspulen: Sektoren <span class=\"val\" id=\"vTubeSec\">8<\/span><\/label>\n          <input type=\"range\" id=\"tubeSec\" min=\"4\" max=\"12\" step=\"2\" value=\"8\">\n        <\/div>\n      <\/div>\n      <div class=\"panel riss-only\" data-scn=\"tube\">\n        <h2>Vormagnetisierung &amp; Referenzfehler<\/h2>\n        <div class=\"field\">\n          <label for=\"sat\">Vormagnetisierung (S\u00e4ttigung) <span class=\"val\" id=\"vSat\">0 %<\/span><\/label>\n          <input type=\"range\" id=\"sat\" min=\"0\" max=\"100\" step=\"1\" value=\"0\">\n          <div class=\"hint\">Gilt f\u00fcr <b>ferromagnetische Rohre<\/b> (Stahl): Ein Gleichfeld s\u00e4ttigt das Rohr, die Permeabilit\u00e4t \u00b5 geht gegen 1. Damit verschwindet das \u00b5-Rauschen, das sonst kleine Bohrungen \u00fcberdeckt. Bei Messing, Kupfer oder Edelstahl ist keine Vormagnetisierung n\u00f6tig.<\/div>\n        <\/div>\n        <div id=\"tubeRefBox\">\n          <div class=\"toggle on\" id=\"tglT0\"><span>Bohrung \u00d8 0,8 mm<\/span><div class=\"switch\"><\/div><\/div>\n          <div class=\"toggle on\" id=\"tglT1\"><span>Bohrung \u00d8 1,0 mm<\/span><div class=\"switch\"><\/div><\/div>\n          <div class=\"toggle on\" id=\"tglT2\"><span>Bohrung \u00d8 1,2 mm<\/span><div class=\"switch\"><\/div><\/div>\n        <\/div>\n        <div class=\"field\">\n          <label for=\"tubeD\">Rohrdurchmesser <span class=\"val\" id=\"vTubeD\">20 mm<\/span><\/label>\n          <input type=\"range\" id=\"tubeD\" min=\"10\" max=\"25\" step=\"1\" value=\"20\">\n          <div class=\"hint\">W\u00e4lzlagerrohre (100Cr6, 100CrMnSi6-4, 20MnCr5 \u2026) werden meist weichgegl\u00fcht geliefert. Das Referenzrohr enth\u00e4lt Bohrungen mit \u00d8 0,8 \u00b7 1,0 \u00b7 1,2 mm an verschiedenen Umfangslagen; die Pr\u00fcfrohre aus dem Los haben Fehler derselben Gr\u00f6\u00dfen.<\/div>\n        <\/div>\n      <\/div>\n\n      <div id=\"moreHole\" style=\"display:contents\"><\/div>\n\n      <div class=\"panel riss-only\" data-scn=\"riss weld\">\n        <h2>Riss<\/h2>\n        <div class=\"toggle on\" id=\"tglCrack\"><span>Riss im Pr\u00fcfst\u00fcck<\/span><div class=\"switch\"><\/div><\/div>\n        <div id=\"crackFields\">\n          <div class=\"field\">\n            <label for=\"crackDepth\">Risstiefe <span class=\"val\" id=\"vCrackDepth\">0,50 mm<\/span><\/label>\n            <input type=\"range\" id=\"crackDepth\" min=\"0.05\" max=\"4\" step=\"0.05\" value=\"0.5\">\n            <div class=\"hint\">Die Tiefe steckt vor allem im <b>Phasenwinkel<\/b> der Anzeige, nicht in ihrer H\u00f6he \u2014 das ist die Grundlage der Tiefenbewertung.<\/div>\n          <\/div>\n          <div class=\"field\">\n            <label for=\"crackOrient\">Lage zur Scanrichtung <span class=\"val\" id=\"vCrackOrient\">90\u00b0<\/span><\/label>\n            <input type=\"range\" id=\"crackOrient\" min=\"0\" max=\"90\" step=\"5\" value=\"90\">\n            <div class=\"hint\">90\u00b0 = quer zur Scanrichtung, unterbricht die Wirbelstrombahnen maximal. 0\u00b0 = l\u00e4ngs, kaum erfassbar.<\/div>\n          <\/div>\n          <div class=\"row2\">\n            <div class=\"field\">\n              <label for=\"crackX\">Position x <span class=\"val\" id=\"vCrackX\">45 mm<\/span><\/label>\n              <input type=\"range\" id=\"crackX\" min=\"5\" max=\"85\" step=\"1\" value=\"45\">\n            <\/div>\n            <div class=\"field\">\n              <label for=\"crackY\">Position y <span class=\"val\" id=\"vCrackY\">20 mm<\/span><\/label>\n              <input type=\"range\" id=\"crackY\" min=\"0\" max=\"40\" step=\"1\" value=\"20\">\n            <\/div>\n          <\/div>\n          <details class=\"adv\">\n            <summary>Weitere Rissma\u00dfe<\/summary>\n            <div class=\"body row2\">\n              <div class=\"field\">\n                <label for=\"crackLen\">L\u00e4nge mm<\/label>\n                <input type=\"number\" id=\"crackLen\" value=\"3\" step=\"0.1\" min=\"0.2\" max=\"20\">\n              <\/div>\n              <div class=\"field\">\n                <label for=\"crackOpen\">\u00d6ffnung mm<\/label>\n                <input type=\"number\" id=\"crackOpen\" value=\"0.05\" step=\"0.01\" min=\"0.01\" max=\"1\">\n              <\/div>\n            <\/div>\n          <\/details>\n        <\/div>\n      <\/div>\n\n      <div class=\"panel riss-only\">\n        <h2>Pr\u00fcfger\u00e4t und Scan<\/h2>\n        <div class=\"row2\">\n          <div class=\"field\">\n            <label for=\"gain\">Verst\u00e4rkung <span class=\"val\" id=\"vGain\">24 dB<\/span><\/label>\n            <input type=\"range\" id=\"gain\" min=\"0\" max=\"60\" step=\"1\" value=\"24\">\n          <\/div>\n          <div class=\"field\">\n            <label for=\"phaseRot\">Phasendrehung <span class=\"val\" id=\"vPhaseRot\">0\u00b0<\/span><\/label>\n            <input type=\"range\" id=\"phaseRot\" min=\"0\" max=\"360\" step=\"1\" value=\"0\">\n          <\/div>\n        <\/div>\n        <div class=\"row2\">\n          <div class=\"field\">\n            <label for=\"hpf\">Hochpass <span class=\"val\" id=\"vHpf\">aus<\/span><\/label>\n            <input type=\"range\" id=\"hpf\" min=\"0\" max=\"100\" step=\"1\" value=\"0\">\n          <\/div>\n          <div class=\"field\">\n            <label for=\"lpf\">Tiefpass <span class=\"val\" id=\"vLpf\">aus<\/span><\/label>\n            <input type=\"range\" id=\"lpf\" min=\"0\" max=\"100\" step=\"1\" value=\"100\">\n          <\/div>\n        <\/div>\n        <div class=\"field\">\n          <label for=\"vProbe\">Sondengeschwindigkeit (f\u00fcr die Filter) <span class=\"val\" id=\"vVProbe\">0,5 m/s<\/span><\/label>\n          <input type=\"range\" id=\"vProbe\" min=\"0.1\" max=\"5\" step=\"0.1\" value=\"0.5\">\n        <\/div>\n        <div class=\"hint\" id=\"fltHint\">\u2014<\/div>\n        <div class=\"btnrow\">\n          <button class=\"btn\" id=\"btnLiftH\">Abhebung waagerecht nach links legen<\/button>\n          <button class=\"btn\" id=\"btnBal\">Nullabgleich an Sondenposition<\/button>\n          <button class=\"btn\" id=\"btnBalClr\">Abgleich l\u00f6schen<\/button>\n        <\/div>\n        <div class=\"row2\" style=\"margin-top:9px\">\n          <div class=\"field\">\n            <label for=\"probeX\">Sonde x <span class=\"val\" id=\"vProbeX\">5 mm<\/span><\/label>\n            <input type=\"range\" id=\"probeX\" min=\"0\" max=\"90\" step=\"1\" value=\"5\">\n          <\/div>\n          <div class=\"field\">\n            <label for=\"probeY\">Sonde y <span class=\"val\" id=\"vProbeY\">20 mm<\/span><\/label>\n            <input type=\"range\" id=\"probeY\" min=\"0\" max=\"40\" step=\"1\" value=\"20\">\n          <\/div>\n        <\/div>\n        <div class=\"field\">\n          <label for=\"scanSpeed\">Darstellung (Zeitlupe) <span class=\"val\" id=\"vScanSpeed\">5<\/span><\/label>\n          <input type=\"range\" id=\"scanSpeed\" min=\"1\" max=\"10\" step=\"1\" value=\"5\">\n        <\/div>\n        <div class=\"btnrow\">\n          <button class=\"btn primary\" id=\"btnScan\" title=\"Leertaste\">\u25b6 Scan starten<\/button>\n          <button class=\"btn\" id=\"btnScanReset\">\u27f2 Zur\u00fccksetzen<\/button>\n        <\/div>\n      <\/div>\n\n      <div class=\"panel riss-only\">\n        <h2>Alarmschwelle<\/h2>\n        <div class=\"field\">\n          <label>Schwellenform<\/label>\n          <div class=\"seg\" id=\"segThresh\">\n            <button data-thresh=\"circle\" class=\"on\">Kreis<\/button>\n            <button data-thresh=\"line\">Gerade<\/button>\n          <\/div>\n        <\/div>\n        <div class=\"field\">\n          <label for=\"threshR\">Schwellwert <span class=\"val\" id=\"vThreshR\">0,05<\/span><\/label>\n          <input type=\"range\" id=\"threshR\" min=\"0.01\" max=\"3\" step=\"0.01\" value=\"0.05\">\n        <\/div>\n        <div class=\"field\" id=\"threshAngleField\" style=\"display:none\">\n          <label for=\"threshAngle\">Ausrichtung der Geraden <span class=\"val\" id=\"vThreshAngle\">90\u00b0<\/span><\/label>\n          <input type=\"range\" id=\"threshAngle\" min=\"0\" max=\"180\" step=\"1\" value=\"90\">\n        <\/div>\n        <div class=\"hint\" id=\"threshHint\">Alarm, sobald der Messpunkt weiter als der Schwellwert vom Abgleichpunkt entfernt ist \u2014 in jeder Richtung.<\/div>\n      <\/div>\n\n      <div id=\"moreSide\" style=\"display:contents\"><\/div>\n      <div class=\"panel gef-only\" data-scn=\"gef\">\n        <h2>\u2460 Pr\u00fcfteil herstellen \u00b7 W\u00e4rmebehandlung<\/h2>\n        <div class=\"hint\" style=\"margin-top:0\">Stahl 100Cr6: Aus der W\u00e4rmebehandlung entsteht das Gef\u00fcge \u2013 und damit H\u00e4rte, Leitf\u00e4higkeit und Permeabilit\u00e4t, die das Wirbelstromger\u00e4t misst.<\/div>\n        <div class=\"field\">\n          <label for=\"gCool\">Abk\u00fchlung nach dem Austenitisieren<\/label>\n          <select class=\"sel\" id=\"gCool\">\n            <option value=\"wasser\">Wasser (Abschrecken)<\/option>\n            <option value=\"oel\">\u00d6l (Abschrecken)<\/option>\n            <option value=\"luft\">Luft (Normalisieren)<\/option>\n            <option value=\"ofen\">Ofen, langsam (Weichgl\u00fchen)<\/option>\n          <\/select>\n        <\/div>\n        <div class=\"field\">\n          <label for=\"gTa\">Austenitisierungstemperatur <span class=\"val\" id=\"vGTa\">840 \u00b0C<\/span><\/label>\n          <input type=\"range\" id=\"gTa\" min=\"780\" max=\"950\" step=\"5\" value=\"840\">\n        <\/div>\n        <div class=\"field\">\n          <label for=\"gTt\">Anlasstemperatur <span class=\"val\" id=\"vGTt\">200 \u00b0C<\/span><\/label>\n          <input type=\"range\" id=\"gTt\" min=\"20\" max=\"700\" step=\"10\" value=\"200\">\n        <\/div>\n        <div class=\"btnrow\">\n          <button class=\"btn\" id=\"btnGRiddle\">\ud83c\udfb2 Teil aus dem Los ziehen<\/button>\n        <\/div>\n        <div id=\"gDecide\" style=\"display:none\">\n          <div class=\"hint\" style=\"margin-top:6px\">Das Teil ist verdeckt. Pr\u00fcfen Sie es (Frequenz w\u00e4hlen, Landkarte und Gef\u00fcgebild ansehen) und entscheiden Sie:<\/div>\n          <div class=\"btnrow\"><button class=\"btn primary\" id=\"btnGOk\">\u2714 i. O.<\/button><button class=\"btn\" id=\"btnGNok\">\u2716 n. i. O.<\/button><\/div>\n        <\/div>\n        <div class=\"kv\" style=\"margin-top:10px\">\n          <span class=\"k\">Gef\u00fcge<\/span><span class=\"v\" id=\"gkS\">\u2014<\/span>\n          <span class=\"k\">H\u00e4rte<\/span><span class=\"v\" id=\"gkH\">\u2014<\/span>\n          <span class=\"k\">Leitf\u00e4higkeit \u03c3<\/span><span class=\"v\" id=\"gkSig\">\u2014<\/span>\n          <span class=\"k\">Permeabilit\u00e4t \u00b5\u1d63<\/span><span class=\"v\" id=\"gkMu\">\u2014<\/span>\n        <\/div>\n      <\/div>\n\n      <div class=\"panel gef-only\" data-scn=\"gef\">\n        <h2>\u2461 Pr\u00fcfen \u00b7 Wirbelstrompr\u00fcfung<\/h2>\n        <div class=\"field\">\n          <label for=\"gFreq\">Pr\u00fcffrequenz <span class=\"val\" id=\"vGFreq\">0,5 kHz<\/span><\/label>\n          <input type=\"range\" id=\"gFreq\" min=\"0\" max=\"100\" step=\"1\" value=\"35\">\n          <div class=\"hint\">Bei niedriger Frequenz wirkt vor allem die Permeabilit\u00e4t, bei hoher die Leitf\u00e4higkeit \u2013 nur die passende Frequenz trennt \u00e4hnliche Gef\u00fcge.<\/div>\n        <\/div>\n        <div class=\"hint\" style=\"margin-top:0\"><b>Pr\u00fcfauftrag:<\/b> Soll-Gef\u00fcge ist immer <b>Martensit, angelassen 200 \u00b0C<\/b> \u2013 Teile in diesem Toleranzfeld sind i. O.<\/div>\n        <select id=\"gSoll\" style=\"display:none\"><\/select>\n        <div class=\"row2\">\n          <div class=\"field\">\n            <label for=\"gDia\">Probe \u2205 <span class=\"val\" id=\"vGDia\">20 mm<\/span><\/label>\n            <input type=\"range\" id=\"gDia\" min=\"6\" max=\"60\" step=\"1\" value=\"20\">\n          <\/div>\n          <div class=\"field\">\n            <label for=\"gFill\">F\u00fcllfaktor <span class=\"val\" id=\"vGFill\">0,80<\/span><\/label>\n            <input type=\"range\" id=\"gFill\" min=\"0.3\" max=\"0.95\" step=\"0.01\" value=\"0.8\">\n          <\/div>\n        <\/div>\n      <\/div>\n      <div class=\"panel gef-only\" data-scn=\"gef\">\n        <h2>\u2462 Kandidaten eingrenzen (optional)<\/h2>\n        <div class=\"hint\" style=\"margin-top:0\">Nur <b>aktive<\/b> Zust\u00e4nde erscheinen in der Landkarte und kommen als Ergebnis der Bestimmung infrage. Der Soll-Zustand bleibt immer aktiv.<\/div>\n        <div id=\"gefStates\" class=\"gstates\"><\/div>\n        <div class=\"btnrow\" style=\"margin-top:6px\">\n          <button class=\"btn\" id=\"gsAll\">Alle<\/button>\n          <button class=\"btn\" id=\"gsMart\">Martensit-Reihe<\/button>\n          <button class=\"btn\" id=\"gsPerl\">Perlit-Reihe<\/button>\n          <button class=\"btn\" id=\"gsSoll\">Nur Soll<\/button>\n        <\/div>\n      <\/div>\n\n      <div class=\"panel gef-only\" data-scn=\"mix\">\n        <h2 id=\"gefHead\">Pr\u00fcfteil 100Cr6<\/h2>\n        <div class=\"field\" data-scn=\"mix\">\n          <label for=\"sollSel\">Soll-Werkstoff<\/label>\n          <select class=\"sel\" id=\"sollSel\"><\/select>\n        <\/div>\n        <div class=\"field\" data-scn=\"mix\">\n          <label for=\"abwSel\">M\u00f6glicher verwechselter Werkstoff<\/label>\n          <select class=\"sel\" id=\"abwSel\"><\/select>\n        <\/div>\n        <div class=\"kv\">\n          <span class=\"k\">Sollzustand<\/span><span class=\"v\" id=\"vSoll\">\u2014<\/span>\n          <span class=\"k\" id=\"lSigH\">\u03c3 Soll<\/span><span class=\"v\" id=\"kSigH\">\u2014<\/span>\n          <span class=\"k\" id=\"lSigW\">\u03c3 abweichend<\/span><span class=\"v\" id=\"kSigW\">\u2014<\/span>\n          <span class=\"k\">\u00b5\u1d63 Soll / abw.<\/span><span class=\"v\" id=\"kMuHW\">\u2014<\/span>\n        <\/div>\n        <div class=\"field\" style=\"margin-top:11px\">\n          <label for=\"partDia\">Bauteil-\u2205 <span class=\"val\" id=\"vPartDia\">26 mm<\/span><\/label>\n          <input type=\"range\" id=\"partDia\" min=\"6\" max=\"60\" step=\"1\" value=\"26\">\n        <\/div>\n        <div class=\"field\">\n          <label for=\"fill\">F\u00fcllfaktor \u03b7 <span class=\"val\" id=\"vFill\">0,80<\/span><\/label>\n          <input type=\"range\" id=\"fill\" min=\"30\" max=\"95\" step=\"1\" value=\"80\">\n          <div class=\"hint\">Verh\u00e4ltnis von Bauteil- zu Spulenquerschnitt in der Durchlaufspule.<\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"panel gef-only\" data-scn=\"mix\">\n        <h2>Frequenzsatz<\/h2>\n        <div class=\"field\">\n          <label for=\"fw1\">Pr\u00fcffrequenz f1 <span class=\"val\" id=\"vFw1\">\u2014<\/span><\/label>\n          <input type=\"range\" id=\"fw1\" min=\"0\" max=\"100\" step=\"0.5\" value=\"45\">\n        <\/div>\n        <div class=\"field\">\n          <label for=\"fw2\">Pr\u00fcffrequenz f2 <span class=\"val\" id=\"vFw2\">\u2014<\/span><\/label>\n          <input type=\"range\" id=\"fw2\" min=\"0\" max=\"100\" step=\"0.5\" value=\"34.5\">\n        <\/div>\n        <div class=\"field\">\n          <label for=\"fw3\">Pr\u00fcffrequenz f3 <span class=\"val\" id=\"vFw3\">\u2014<\/span><\/label>\n          <input type=\"range\" id=\"fw3\" min=\"0\" max=\"100\" step=\"0.5\" value=\"24\">\n        <\/div>\n        <div class=\"field\">\n          <label for=\"fw4\">Pr\u00fcffrequenz f4 <span class=\"val\" id=\"vFw4\">\u2014<\/span><\/label>\n          <input type=\"range\" id=\"fw4\" min=\"0\" max=\"100\" step=\"0.5\" value=\"17.5\">\n          <div class=\"hint\">Jedes Fenster arbeitet mit seiner eigenen Frequenz, alle vier gleichzeitig. Bereich 50 Hz bis 40 kHz.<\/div>\n        <\/div>\n        <div class=\"btnrow\">\n          <button class=\"btn\" id=\"btnFotoSatz\">Satz 4000 / 2000 / 1000 / 640 Hz<\/button>\n        <\/div>\n        <div class=\"field\">\n          <label>Aktives Fenster<\/label>\n          <div class=\"seg\" id=\"segWin\">\n            <button data-win=\"0\" class=\"on\">f1<\/button>\n            <button data-win=\"1\">f2<\/button>\n            <button data-win=\"2\">f3<\/button>\n            <button data-win=\"3\">f4<\/button>\n          <\/div>\n        <\/div>\n        <div class=\"field\">\n          <label for=\"noise\">Grundrauschen <span class=\"val\" id=\"vNoise\">1,5 %<\/span><\/label>\n          <input type=\"range\" id=\"noise\" min=\"0.2\" max=\"5\" step=\"0.1\" value=\"1.5\">\n          <div class=\"hint\">Fester Rauschpegel des Ger\u00e4ts. Er weitet die Toleranzfelder auf und begrenzt nach oben, wie hoch die Pr\u00fcffrequenz sinnvoll gew\u00e4hlt werden kann.<\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"panel gef-only\" data-scn=\"mix\">\n        <h2>Einzelteil<\/h2>\n        <div class=\"field\">\n          <label for=\"matDev\">Weg zum abweichenden Zustand <span class=\"val\" id=\"vMatDev\">0 %<\/span><\/label>\n          <input type=\"range\" id=\"matDev\" min=\"-10\" max=\"110\" step=\"1\" value=\"0\">\n          <div class=\"hint\">0 % ist der Sollzustand, 100 % der abweichende Zustand (anderes Gef\u00fcge bzw. verwechselter Werkstoff). Der Messpunkt wandert dabei von der gr\u00fcnen zur roten Wolke.<\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"panel gef-only\" data-scn=\"mix\">\n        <h2>Serienpr\u00fcfung<\/h2>\n        <div class=\"field\">\n          <label for=\"serieN\">Losgr\u00f6\u00dfe <span class=\"val\" id=\"vSerieN\">14<\/span><\/label>\n          <input type=\"range\" id=\"serieN\" min=\"5\" max=\"40\" step=\"1\" value=\"14\">\n        <\/div>\n        <div class=\"field\">\n          <label for=\"serieBad\">davon abweichend <span class=\"val\" id=\"vSerieBad\">3<\/span><\/label>\n          <input type=\"range\" id=\"serieBad\" min=\"0\" max=\"10\" step=\"1\" value=\"3\">\n        <\/div>\n        <div class=\"btnrow\">\n          <button class=\"btn primary\" id=\"btnSerie\">\u25b6 Serie pr\u00fcfen<\/button>\n          <button class=\"btn\" id=\"btnSerieReset\">\u27f2 Leeren<\/button>\n        <\/div>\n      <\/div>\n\n\n    <\/div>\n\n    <div class=\"main\">\n\n      <div class=\"stage riss-only\">\n        <div class=\"stage-head\">\n          <span class=\"stage-title\">Impedanzebene \u00b7 Ger\u00e4tesicht nach Nullabgleich<\/span>\n          <div class=\"toggle\" id=\"tglRef\" style=\"margin:0;padding:5px 9px\"><span style=\"font-size:10.5px\">Bezugslinien<\/span><div class=\"switch\"><\/div><\/div>\n          <div class=\"seg mini\" id=\"segScale\" role=\"group\" aria-label=\"Skalierung der Impedanzebene\">\n            <button data-scale=\"auto\" class=\"on\" title=\"Ma\u00dfstab folgt automatisch dem Signal\">Auto<\/button>\n            <button data-scale=\"0.5\">\u00b10,5<\/button>\n            <button data-scale=\"1.5\">\u00b11,5<\/button>\n            <button data-scale=\"5\">\u00b15<\/button>\n          <\/div>\n          <div class=\"legend\">\n            <span><i class=\"pt\" style=\"background:var(--text-dim)\"><\/i>Abgleichpunkt<\/span>\n            <span><i style=\"background:var(--text-faint)\"><\/i>Abhebungsrichtung<\/span>\n            <span><i style=\"background:var(--green)\"><\/i>Rissrichtung<\/span>\n            <span><i class=\"pt\" style=\"background:var(--red)\"><\/i>Messpunkt<\/span>\n            <span><i style=\"background:var(--red); opacity:.6\"><\/i>Alarmschwelle<\/span>\n          <\/div>\n        <\/div>\n        <div class=\"impgrid\">\n          <svg class=\"view\" id=\"imp\" viewBox=\"0 0 520 504\" role=\"img\" aria-label=\"Impedanzebene des Pr\u00fcfger\u00e4ts\"><\/svg>\n          <div class=\"impside\">\n            <div class=\"stats\" id=\"stats\"><\/div>\n            <div class=\"verdict\" id=\"verdict\">Sonde \u00fcber den Riss fahren oder den Scan starten.<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"stage riss-only\" data-scn=\"corr weld tube hole burn\">\n        <div class=\"stage-head\"><span class=\"stage-title\" id=\"secTitle\">Schnittbild<\/span><\/div>\n        <svg class=\"view\" id=\"secSvg\" viewBox=\"0 0 620 230\" role=\"img\" aria-label=\"Schnittbild der Pr\u00fcfaufgabe\"><\/svg>\n      <\/div>\n\n      <div class=\"stagegrid riss-only\">\n        <div class=\"stage\">\n          <div class=\"stage-head\">\n            <span class=\"stage-title\" id=\"cscanTitle\">C-Bild, Draufsicht<\/span>\n            <div class=\"legend\">\n              <span><i style=\"background:#1b4a5c\"><\/i>schwach<\/span>\n              <span><i style=\"background:var(--amber)\"><\/i>mittel<\/span>\n              <span><i style=\"background:var(--red)\"><\/i>stark<\/span>\n            <\/div>\n          <\/div>\n          <canvas class=\"view\" id=\"cscan\" width=\"900\" height=\"400\"><\/canvas>\n          <div class=\"foot\"><span id=\"cscanInfo\">\u2014<\/span><span id=\"cscanProg\">0 % gescannt<\/span><\/div>\n        <\/div>\n        <div class=\"stage\">\n          <div class=\"stage-head\">\n            <span class=\"stage-title\">Streifenschreiber<\/span>\n            <div class=\"legend\">\n              <span><i style=\"background:var(--cyan)\"><\/i>X-Kanal<\/span>\n              <span><i style=\"background:var(--amber)\"><\/i>Y-Kanal<\/span>\n            <\/div>\n          <\/div>\n          <svg class=\"view\" id=\"strip\" viewBox=\"0 0 620 260\" role=\"img\" aria-label=\"Streifenschreiber\"><\/svg>\n          <div class=\"foot\"><span>Der Y-Kanal ist nach dem Abgleich unempfindlich gegen Abhebung.<\/span><\/div>\n        <\/div>\n      <\/div>\n\n      <div id=\"moreMain\" style=\"display:contents\"><\/div>\n      <div class=\"stage gef-only\" data-scn=\"gef\">\n        <div class=\"stage-head\">\n          <span class=\"stage-title\">\u2463 Kontrollieren \u00b7 Gef\u00fcgebild (schematischer Schliff)<\/span>\n          <span class=\"stage-sub\" id=\"gMicroInfo\">\u2014<\/span>\n        <\/div>\n        <canvas class=\"view\" id=\"cvMicro\" width=\"900\" height=\"330\" role=\"img\" aria-label=\"Gef\u00fcgebild von Pr\u00fcfteil und Referenz\"><\/canvas>\n        <div class=\"foot\"><span id=\"gConstit\">\u2014<\/span><\/div>\n      <\/div>\n\n      <div class=\"stagegrid wide gef-only\" data-scn=\"gef\">\n        <div class=\"stage\">\n          <div class=\"stage-head\">\n            <span class=\"stage-title\">Hintergrund \u00b7 Gef\u00fcge-Landkarte (Impedanzebene)<\/span>\n            <div class=\"legend\">\n              <span><i class=\"pt\" style=\"background:var(--amber)\"><\/i>Pr\u00fcfteil<\/span>\n              <span><i style=\"background:var(--green)\"><\/i>Soll<\/span>\n            <\/div>\n          <\/div>\n          <svg class=\"view\" id=\"gefMap\" viewBox=\"0 0 620 440\" role=\"img\" aria-label=\"Gef\u00fcge-Landkarte\"><\/svg>\n          <div class=\"foot\"><span id=\"gMapInfo\">\u2014<\/span><\/div>\n        <\/div>\n        <div class=\"stage\">\n          <div class=\"stage-head\"><span class=\"stage-title\">Hintergrund \u00b7 Trennbarkeit \u00fcber der Frequenz<\/span><\/div>\n          <svg class=\"view\" id=\"gefFreq\" viewBox=\"0 0 620 300\" role=\"img\" aria-label=\"Abstand zum Soll \u00fcber der Frequenz\"><\/svg>\n          <div class=\"foot\"><span id=\"gFreqInfo\">\u2014<\/span><\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"stage gef-only\" data-scn=\"gef\">\n        <div class=\"stage-head\"><span class=\"stage-title\">\u2462 Auswerten \u00b7 Gef\u00fcgebestimmung<\/span><\/div>\n        <div class=\"stats\" id=\"statsGef\"><\/div>\n        <div class=\"verdict\" id=\"verdictGef\">\u2014<\/div>\n        <div id=\"gefCand\" style=\"margin-top:10px\"><\/div>\n      <\/div>\n\n      <div class=\"stage gef-only\" data-scn=\"gef\">\n        <div class=\"stage-head\"><span class=\"stage-title\">Hintergrund \u00b7 Gef\u00fcge-Atlas 100Cr6<\/span><span class=\"stage-sub\">Zeile anklicken = Referenzgef\u00fcge ansehen<\/span><\/div>\n        <div id=\"gefAtlas\" style=\"overflow-x:auto\"><\/div>\n        <div class=\"verdict\" id=\"gefInfo\" style=\"margin-top:10px\">\u2014<\/div>\n      <\/div>\n\n      <div class=\"stage gef-only\" data-scn=\"mix\">\n        <div class=\"stage-head\">\n          <span class=\"stage-title\">Sortierdisplay \u00b7 vier Pr\u00fcffrequenzen<\/span>\n          <div class=\"legend\">\n            <span><i style=\"background:var(--green)\"><\/i><b id=\"lgA\" style=\"font-weight:500\">Toleranzfeld Soll<\/b><\/span>\n            <span><i style=\"background:var(--red)\"><\/i><b id=\"lgB\" style=\"font-weight:500\">Toleranzfeld abweichend<\/b><\/span>\n            <span><i class=\"pt\" style=\"background:var(--green)\"><\/i>i.O.<\/span>\n            <span><i class=\"pt\" style=\"background:var(--red)\"><\/i>n.i.O.<\/span>\n          <\/div>\n        <\/div>\n        <svg class=\"view\" id=\"sortView\" viewBox=\"0 0 900 640\"  role=\"img\" aria-label=\"Vierfrequenz-Sortierdisplay\"><\/svg>\n        <div class=\"foot\"><span id=\"sortInfo\">\u2014<\/span><\/div>\n        <div class=\"stats\" id=\"statsG\"><\/div>\n        <div class=\"verdict\" id=\"verdictG\">Noch keine Serie gepr\u00fcft.<\/div>\n      <\/div>\n\n      <div class=\"stagegrid wide gef-only\" data-scn=\"mix\">\n        <div class=\"stage\">\n          <div class=\"stage-head\">\n            <span class=\"stage-title\">Trennsch\u00e4rfe hart gegen weich \u00fcber der Frequenz<\/span>\n          <\/div>\n          <svg class=\"view\" id=\"sepChart\" viewBox=\"0 0 620 300\" role=\"img\" aria-label=\"Trennsch\u00e4rfe \u00fcber der Frequenz\"><\/svg>\n          <div class=\"foot\"><span id=\"sepInfo\">\u2014<\/span><\/div>\n        <\/div>\n        <div class=\"stage\">\n          <div class=\"stage-head\"><span class=\"stage-title\">Serienergebnis<\/span><\/div>\n          <div class=\"tblwrap\"><table class=\"res\" id=\"serieTable\"><\/table><\/div>\n        <\/div>\n      <\/div>\n\n      <details class=\"note plain\">\n        <summary><\/summary>\n        <p><b>Vereinfachtes didaktisches Modell, kein kalibriertes Pr\u00fcfger\u00e4t.<\/b> Grundlage ist das normierte Impedanzdiagramm nach F\u00f6rster. Die wirksame Permeabilit\u00e4t folgt der geschlossenen L\u00f6sung mit komplexen Bessel-Funktionen:<\/p>\n        <p><code>\u00b5_eff = 2\u00b7J1(k\u00b7a) / (k\u00b7a\u00b7J0(k\u00b7a))<\/code> mit <code>k\u00b7a = (1\u2212j)\u00b7a/\u03b4<\/code> und <code>a/\u03b4 = \u221a(f/f_g)<\/code><\/p>\n        <p>Daraus folgt die normierte Spulenimpedanz <code>X_n = 1 \u2212 \u03b7 + \u03b7\u00b7\u00b5\u1d63\u00b7Re(\u00b5_eff)<\/code> und <code>R_n = \u2212\u03b7\u00b7\u00b5\u1d63\u00b7Im(\u00b5_eff)<\/code>. Die Eindringtiefe folgt <code>\u03b4 \u2248 503/\u221a(f\u00b7\u00b5\u1d63\u00b7\u03c3)<\/code> (\u03b4 in mm, f in Hz, \u03c3 in MS/m), die Grenzfrequenz ist \u00fcber <code>\u03b4 = a<\/code> definiert, also <code>f_g = (503/a)\u00b2/(\u00b5\u1d63\u00b7\u03c3)<\/code>.<\/p>\n        <p><b>Risspr\u00fcfung.<\/b> Eine gr\u00f6\u00dfere Abhebung verringert die Kopplung \u03b7, die Abhebungsrichtung ist deshalb <code>\u2202Z_n/\u2202\u03b7<\/code>. Ein Riss wirkt wie eine kleinere Leitf\u00e4higkeit; seine Richtung ist die Tangente an die Leitf\u00e4higkeitsortskurve. Der Winkel zwischen beiden ist damit ein Ergebnis des Modells und keine eingetragene Zahl \u2014 er w\u00e4chst mit f/f_g, und genau deshalb l\u00e4sst sich die Abhebung bei passender Frequenz ausblenden. Die Wirbelstr\u00f6me in der Tiefe z eilen um <code>z/\u03b4<\/code> nach, ein tieferer Riss dreht die Anzeige also weiter aus der Abhebungsrichtung heraus.<\/p>\n        <p><b>Differenzsonde.<\/b> Das Rissignal hat zwei Anteile mit unterschiedlichem Ortsprofil und unterschiedlicher Phase: die St\u00f6rung der Strombahnen und die ge\u00e4nderte Kopplung \u00fcber der Riss\u00f6ffnung. Die Differenz zweier versetzter Spulen durchl\u00e4uft deshalb eine punktsymmetrische Doppelschleife, die bekannte Schmetterlingsfigur.<\/p>\n        <p><b>Hart-Weich-Pr\u00fcfung an 100Cr6.<\/b> Der geh\u00e4rtete, martensitische Zustand hat sowohl eine niedrigere Leitf\u00e4higkeit als auch eine deutlich niedrigere Permeabilit\u00e4t als das weichgegl\u00fchte, ferritisch-perlitische Gef\u00fcge. Beide bilden im Diagramm getrennte Wolken. Die Toleranzfelder entstehen, indem die zul\u00e4ssige \u03c3- und \u00b5\u1d63-Streuung durch dasselbe Modell abgebildet und daraus die Hauptachsen-Ellipse bestimmt wird; Lage, Gr\u00f6\u00dfe und Neigung \u00e4ndern sich deshalb mit der Frequenz. Genau darum arbeitet ein Sortierger\u00e4t mit mehreren Frequenzen gleichzeitig \u2014 ein Teil muss in allen Fenstern im Feld liegen.<\/p>\n      <\/details>\n\n\n    <\/div>\n  <\/div>\n<\/div>\n\n<script>\n(function(){\n'use strict';\nconst $ = id => document.getElementById(id);\nconst clamp = (v,a,b) => Math.max(a, Math.min(b,v));\nconst deC = (v,d) => v.toFixed(d).replace('.',',');\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 Komplexe Rechnung und Bessel-Funktionen \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nconst cmul = (a,b) => ({re:a.re*b.re - a.im*b.im, im:a.re*b.im + a.im*b.re});\nconst cdiv = (a,b) => { const d = b.re*b.re + b.im*b.im;\n  return {re:(a.re*b.re + a.im*b.im)/d, im:(a.im*b.re - a.re*b.im)/d}; };\nconst cabs = a => Math.hypot(a.re, a.im);\nfunction J0(z){\n  let t = {re:1,im:0}, s = {re:1,im:0}; const z2 = cmul(z,z);\n  for(let m=1;m<=90;m++){\n    const f = cmul(t,z2);\n    t = {re:-f.re/(4*m*m), im:-f.im/(4*m*m)};\n    s.re += t.re; s.im += t.im;\n    if(cabs(t) < 1e-17*(cabs(s)+1e-300)) break;\n  }\n  return s;\n}\nfunction J1(z){\n  let t = {re:0.5*z.re, im:0.5*z.im}, s = {re:t.re, im:t.im}; const z2 = cmul(z,z);\n  for(let m=1;m<=90;m++){\n    const f = cmul(t,z2);\n    t = {re:-f.re/(4*m*(m+1)), im:-f.im/(4*m*(m+1))};\n    s.re += t.re; s.im += t.im;\n    if(cabs(t) < 1e-17*(cabs(s)+1e-300)) break;\n  }\n  return s;\n}\nfunction muEff(fRatio){\n  const ad = Math.sqrt(Math.max(fRatio, 1e-9));\n  if(ad > 12) return {re:1/ad, im:-1/ad};\n  const ka = {re:ad, im:-ad};\n  const q = cdiv(J1(ka), cmul(ka, J0(ka)));\n  return {re:2*q.re, im:2*q.im};\n}\nfunction Zn(fRatio, eta, mu){\n  const m = muEff(fRatio);\n  return { x: eta*mu*(-m.im), y: 1 - eta + eta*mu*m.re };\n}\nconst skinDepth = (fHz, sigma, mu) => 503/Math.sqrt(fHz*mu*sigma);\nconst limitFreq = (aMM, sigma, mu) => Math.pow(503/aMM,2)/(mu*sigma);\nfunction znAt(fHz, diaMM, sigma, mu, eta){\n  return Zn(fHz/limitFreq(diaMM/2, sigma, mu), eta, mu);\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 Werkstoffe Risspr\u00fcfung \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nconst MATERIALS = [\n  {id:'100cr6',  name:'100Cr6 geh\u00e4rtet (60 HRC)',            short:'100Cr6 geh.', sigma:2.35, mu:42 },\n  {id:'gl100',   name:'100Cr6 weichgegl\u00fcht (Rohr/Rohling)',  short:'100Cr6 GKZ',  sigma:3.55, mu:95 },\n  {id:'mnsi',    name:'100CrMnSi6-4 geh\u00e4rtet',               short:'100CrMnSi6',  sigma:2.2,  mu:40 },\n  {id:'mo7',     name:'100CrMo7-3 geh\u00e4rtet',                 short:'100CrMo7-3',  sigma:2.25, mu:41 },\n  {id:'q42',     name:'42CrMo4+QT (Gro\u00dflagerring)',          short:'42CrMo4',     sigma:3.1,  mu:78 },\n  {id:'mn5',     name:'20MnCr5 einsatzgeh\u00e4rtet',             short:'20MnCr5',     sigma:3.0,  mu:60 },\n  {id:'x47',     name:'X47Cr14 (rostfreier Lagerstahl)',     short:'X47Cr14',     sigma:1.7,  mu:25 },\n  {id:'m50',     name:'M50 (Hochtemperatur-Lagerstahl)',     short:'M50',         sigma:2.0,  mu:36 },\n  {id:'alu',     name:'Aluminium (Geh\u00e4use/K\u00e4fig)',           short:'Alu',         sigma:30,   mu:1  },\n  {id:'brass',   name:'Messing CuZn37 (K\u00e4fig)',              short:'Messing',     sigma:15.9, mu:1  },\n  {id:'v2a',     name:'Edelstahl 1.4301 (Geh\u00e4use)',          short:'1.4301',      sigma:1.4,  mu:1  },\n];\nconst matById = id => MATERIALS.find(m=>m.id===id) || MATERIALS[0];\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 100Cr6: geh\u00e4rtet gegen weichgegl\u00fcht \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nlet CLASSES = [\n  {id:'hart',  kurz:'hart',  name:'100Cr6 geh\u00e4rtet',     sigma:2.35, mu:42, tolS:4, tolM:9,  tolE:2.5, col:'var(--green)'},\n  {id:'weich', kurz:'weich', name:'100Cr6 weichgegl\u00fcht', sigma:3.55, mu:95, tolS:5, tolM:11, tolE:2.5, col:'var(--red)'},\n];\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 Zustand \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nconst S = {\n  mode:'riss', probe:'diff', freqS:55,\n  coilDia:8, liftOff:0.10,\n  material:'100cr6', plateLen:90, plateWidth:40,\n  crackOn:true, crackDepth:0.5, crackOrient:90, crackX:45, crackY:20,\n  crackLen:3, crackOpen:0.05,\n  gain:24, phaseRot:0, hpf:0, lpf:10000, vProbe:0.5, probeX:5, probeY:20, scanSpeed:5,\n  scanning:false, scanIx:0, scanIy:0, scanDir:1, scanAcc:0,\n  partDia:26, fill:0.80, fS:[45, 34.5, 24, 17.5], win:0, showRef:false, noise:1.5,\n  matDev:0, serieN:14, serieBad:3,\n  threshType:'circle', threshR:0.05, threshAngle:90,\n  impScale:'auto', impLim:null, peak:null,\n  t1:1.5, t2:2,\n  weldX:45, weldW:9, weldCap:1, weldSeam:true, weldPores:true,\n  burnOn:true, burnForm:'ring', burnType:'temper', burnX:45, burnY:20, burnW:3, burnSev:0.4,\n  tubeD:20, bore:[true,true,true],\n  pair:0, soll:'100cr6', abw:'mn5',\n  tubeCoil:'through', sat:0, bal:{re:0,im:0}, scanAlong:true, alIx:0, alIy:-1, alDir:1\n};\nconst NX = 96, NY = 42, MAXSTRIP = 300, MAXTRAIL = 700, TRAIL_STEP = 0.2;\nlet grid, scanned, trail = [], strip = [], rafId = null;\nlet serie = [], serieIdx = -1, serieTimer = null, lastAmp = 0;\n\nconst freqHz  = () => Math.pow(10, 1 + 5.7*S.freqS/100);\nconst sliderHz = v => Math.pow(10, 1.7 + 2.9*v/100);     // 50 Hz \u2026 40 kHz\nconst hzSlider  = f => clamp((Math.log10(f) - 1.7)/2.9*100, 0, 100);\nconst freqSet = () => S.fS.map(sliderHz);\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 Pr\u00fcfaufgaben: Moduslogik \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nconst SCAN_MODES = ['riss','corr','weld','tube','hole','burn'], SORT_MODES = ['mix','gef'];\nconst isScan = () => SCAN_MODES.indexOf(S.mode) >= 0;\nconst isSort = () => SORT_MODES.indexOf(S.mode) >= 0;\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 Werkstoffpaarungen f\u00fcr Verwechslungs- und Gef\u00fcgepr\u00fcfung \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nconst MIXMATS = MATERIALS.map(m => ({id:m.id, name:m.name, sigma:m.sigma, mu:m.mu}));       // W\u00e4lzlagerst\u00e4hle und einige Zusatzwerkstoffe\nconst mixById = id => MIXMATS.find(m=>m.id===id) || MIXMATS[0];\nconst PAIRS_GEF = [\n  {name:'100Cr6: geh\u00e4rtet \u2194 weichgegl\u00fcht',\n   a:{kurz:'hart', name:'100Cr6 geh\u00e4rtet',      sigma:2.35, mu:42, tolS:4, tolM:9,  tolE:2.5},\n   b:{kurz:'weich',name:'100Cr6 weichgegl\u00fcht',  sigma:3.55, mu:95, tolS:5, tolM:11, tolE:2.5}},\n  {name:'100Cr6: geh\u00e4rtet \u2194 angelassen (400 \u00b0C)',\n   a:{kurz:'hart',    name:'100Cr6 geh\u00e4rtet',   sigma:2.35, mu:42, tolS:4, tolM:9,  tolE:2.5},\n   b:{kurz:'angelass.',name:'100Cr6 angelassen', sigma:2.8,  mu:56, tolS:4, tolM:9,  tolE:2.5}},\n  {name:'C45: verg\u00fctet \u2194 normalgegl\u00fcht',\n   a:{kurz:'verg\u00fctet', name:'C45 verg\u00fctet',      sigma:4.4,  mu:70,  tolS:4, tolM:10, tolE:2.5},\n   b:{kurz:'normal',   name:'C45 normalgegl\u00fcht', sigma:5.3,  mu:125, tolS:4, tolM:10, tolE:2.5}},\n  {name:'Einsatzstahl: Randschicht geh\u00e4rtet \u2194 ungeh\u00e4rtet',\n   a:{kurz:'Rand hart',name:'16MnCr5 Rand geh\u00e4rtet', sigma:3.1, mu:48,  tolS:4, tolM:9,  tolE:2.5},\n   b:{kurz:'ungeh\u00e4rtet',name:'16MnCr5 ungeh\u00e4rtet',   sigma:4.9, mu:115, tolS:4, tolM:10, tolE:2.5}},\n];\nfunction applyPair(){\n  if(S.mode === 'gef'){\n    const p = PAIRS_GEF[S.pair] || PAIRS_GEF[0];\n    CLASSES = [Object.assign({id:'a', col:'var(--green)'}, p.a), Object.assign({id:'b', col:'var(--red)'}, p.b)];\n  } else {\n    const a = mixById(S.soll), b = mixById(S.abw);\n    const mk = (m,col,kurz) => ({id:kurz, kurz, name:m.name, sigma:m.sigma, mu:m.mu, tolS:3.5, tolM:m.mu>1.5?8:0.6, tolE:2.5, col});\n    CLASSES = [mk(a,'var(--green)','Soll'), mk(b,'var(--red)','verwechselt')];\n  }\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 Streuung des Signals: Normierung auf einen Bezugszustand \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nfunction sensC(C){\n  const h = 1e-3, z0 = Zn(C.fr, C.eta, C.m.mu), zs = Zn(C.fr*(1-h), C.eta, C.m.mu);\n  return Math.hypot(zs.x-z0.x, zs.y-z0.y)/h;\n}\nconst SENS_REF = (() => {\n  const m = matById('alu'), f = 13600, a = 4, fg = limitFreq(a, m.sigma, m.mu);\n  return sensC({fr:f/fg, eta:0.9*Math.exp(-2.0*0.1/a), m}) || 1;\n})();\nconst sensNorm = C => sensC(C)/SENS_REF;\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 Korrosion zwischen zwei Platten: vier Fehler \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nconst CORR_DEFS = [\n  {id:'K1', form:'rund',            shape:'round', x:15, y:12, ra:4,  rb:4,   rot:0,   loss:0.20, layer:'joint', on:true},\n  {id:'K2', form:'oval, gestreckt', shape:'oval',  x:38, y:27, ra:9,  rb:3.5, rot:20,  loss:0.50, layer:'joint', on:true},\n  {id:'K3', form:'Lochfra\u00df',        shape:'pits',  x:60, y:12, ra:7,  rb:7,   rot:0,   loss:0.90, layer:'back',  on:true},\n  {id:'K4', form:'fl\u00e4chig',         shape:'area',  x:76, y:28, ra:10, rb:7,   rot:-15, loss:1.40, layer:'joint', on:true},\n];\nS.corr = CORR_DEFS.map(d => Object.assign({}, d)); S.corrSel = 0;\nconst PIT_OFF = [[-0.55,-0.2],[0.1,-0.6],[0.6,-0.15],[-0.15,0.1],[0.35,0.55],[-0.6,0.5]];\nfunction corrParts(d){\n  const rs = Math.PI/180*d.rot;\n  const at = (ox, oy, ra, rb, rot) => ({cx:d.x + ox*Math.cos(rs) - oy*Math.sin(rs), cy:d.y + ox*Math.sin(rs) + oy*Math.cos(rs), ra, rb, rot:d.rot+(rot||0)});\n  if(d.shape === 'pits') return PIT_OFF.map(q => at(q[0]*d.ra, q[1]*d.ra, Math.max(0.7, d.ra*0.26), Math.max(0.7, d.ra*0.26)));\n  if(d.shape === 'area') return [at(0,0,d.ra*0.62,d.rb*0.7), at(d.ra*0.5,d.rb*0.25,d.ra*0.5,d.rb*0.55,25), at(-d.ra*0.45,-d.rb*0.2,d.ra*0.55,d.rb*0.5,-20)];\n  return [at(0,0,d.ra,d.rb)];\n}\nfunction corrProfile(d, sx, sy){\n  let best = 0;\n  corrParts(d).forEach(p => {\n    const r = Math.PI/180*p.rot, dx = sx-p.cx, dy = sy-p.cy, u = dx*Math.cos(r)+dy*Math.sin(r), v = -dx*Math.sin(r)+dy*Math.cos(r);\n    const dd = Math.sqrt((u/p.ra)*(u/p.ra)+(v/p.rb)*(v/p.rb));\n    best = Math.max(best, 1/(1+Math.exp((dd-1)/0.22)));\n  });\n  return best;\n}\nfunction corrZ(d){                       // Tiefenlage von \u2026 bis \u2026 (mm unter der Oberfl\u00e4che)\n  const loss = Math.min(d.loss, S.t2);\n  return d.layer === 'back' ? [S.t1+S.t2-loss, S.t1+S.t2] : [S.t1, S.t1+loss];\n}\nfunction corrAmpOf(d, C){\n  const z = corrZ(d), a = Math.exp(-z[0]/C.delta) - Math.exp(-z[1]/C.delta);\n  const fo = Math.pow(503/(1.5*S.t1), 2)/(C.m.sigma*C.m.mu), sf = C.m.mu > 1.5 ? Math.min(1, fo/C.f) : 1;   // ferromagnetisch: Empfindlichkeit w\u00e4chst nur bis \u03b4 \u2248 1,5 \u00d7 Deckblech\n  return 1.3*(C.m.mu > 1.5 ? 11 : 1)*sf*sensTube(C)*a*Math.exp(-1.6*S.liftOff/C.a);\n}\nfunction corrStage(d){\n  const res = (S.t2 - Math.min(d.loss, S.t2))/S.t2;\n  const k = res >= 0.9 ? 1 : (res >= 0.75 ? 2 : (res >= 0.5 ? 3 : 4));\n  return {k, res, name:['','Stufe 1 \u00b7 Anfang','Stufe 2 \u00b7 m\u00e4\u00dfig','Stufe 3 \u00b7 stark','Stufe 4 \u00b7 kritisch'][k], col:['','var(--green)','var(--cyan)','var(--amber)','var(--red)'][k]};\n}\nfunction corrSignal(sx, sy, C, dir){\n  let re = 0, im = 0;\n  S.corr.forEach(d => {\n    if(!d.on) return;\n    const g = corrProfile(d, sx, sy); if(g < 1e-4) return;\n    const z = corrZ(d), p = dir.angCrack - clamp((z[0]+z[1])/2/C.delta, 0, Math.PI*0.95), A = corrAmpOf(d, C)*g;\n    re += A*Math.cos(p); im += A*Math.sin(p);\n  });\n  return {re, im};\n}\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 Toleranzfelder in der Impedanzebene (aus Referenzk\u00f6rper) \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\n   Der Referenzk\u00f6rper enth\u00e4lt Abtr\u00e4ge von 10 %, 25 % und 50 % der Wanddicke der 2. Platte an der F\u00fcgefl\u00e4che\n   und an der R\u00fcckseite. Daraus entstehen je Tiefenlage ein Phasenband und drei Amplitudenringe\n   (Grenzen zwischen Stufe 1/2, 2/3 und 3/4). Jede Anzeige wird einem Toleranzfeld zugeordnet. */\nS.corrTol = {auto:true, phTol:12, maxStage:2, frozen:null};\nfunction corrRefFields(C, dir){\n  const g = Math.pow(10,(S.gain-24)/20), rot = S.phaseRot;\n  const ref = (frac, layer) => {\n    const d = {loss:frac*S.t2, layer}, z = corrZ(d);\n    return {A:corrAmpOf(d, C)*g, ph:(dir.angCrack - clamp((z[0]+z[1])/2/C.delta, 0, Math.PI*0.95))*180/Math.PI - rot};\n  };\n  const j = [ref(0.10,'joint'), ref(0.25,'joint'), ref(0.50,'joint')], b = [ref(0.10,'back'), ref(0.25,'back'), ref(0.50,'back')];\n  return {rJ:j.map(q => q.A), rB:b.map(q => q.A), phJ:j[1].ph, phB:b[1].ph};\n}\nfunction corrFields(C, dir){\n  const t = S.corrTol;\n  if(t.auto) return corrRefFields(C, dir);\n  if(!t.frozen) t.frozen = corrRefFields(C, dir);\n  return t.frozen;\n}\nfunction corrClassify(x, F){\n  const tol = S.corrTol.phTol, dJ = angDiff(x.phi, F.phJ), dB = angDiff(x.phi, F.phB);\n  let layer = null;\n  if(dJ <= tol && dB <= tol) layer = dJ <= dB ? 'joint' : 'back';           // Felder \u00fcberlappen: n\u00e4chstgelegenes\n  else if(dJ <= tol) layer = 'joint'; else if(dB <= tol) layer = 'back';\n  const rings = layer === 'back' ? F.rB : F.rJ;\n  const stage = layer === null ? null : (x.amp < rings[0] ? 1 : (x.amp < rings[1] ? 2 : (x.amp < rings[2] ? 3 : 4)));\n  return {layer, stage, overlap:angDiff(F.phJ, F.phB) < 2*tol,\n          ok:layer === x.d.layer && stage === x.st.k, allowed:stage !== null && stage <= S.corrTol.maxStage};\n}\nconst STAGE_COL = ['', 'var(--green)', 'var(--cyan)', 'var(--amber)', 'var(--red)'];\nfunction corrFieldsSVG(C, dir, toX, toY, k, cx0, cy0){\n  const F = corrFields(C, dir), tol = S.corrTol.phTol; let s = '<g clip-path=\"url(#impClip)\">';\n  const pt = (r, a) => [cx0 + r*k*Math.cos(a*Math.PI/180), cy0 - r*k*Math.sin(a*Math.PI/180)];\n  const sector = (r0, r1, a0, a1, col, op) => {\n    const p0 = pt(r1, a0), p1 = pt(r1, a1), p2 = pt(r0, a1), p3 = pt(r0, a0);\n    return `<path d=\"M${p0[0].toFixed(1)},${p0[1].toFixed(1)} A${(r1*k).toFixed(1)},${(r1*k).toFixed(1)} 0 0 0 ${p1[0].toFixed(1)},${p1[1].toFixed(1)} L${p2[0].toFixed(1)},${p2[1].toFixed(1)} `\n         + (r0 > 0 ? `A${(r0*k).toFixed(1)},${(r0*k).toFixed(1)} 0 0 1 ${p3[0].toFixed(1)},${p3[1].toFixed(1)} Z` : 'Z')\n         + `\" fill=\"${col}\" fill-opacity=\"${op}\" stroke=\"${col}\" stroke-width=\"1.1\" stroke-opacity=\".75\"/>`;\n  };\n  [[F.phJ, F.rJ, 'F\u00fcgefl\u00e4che'], [F.phB, F.rB, 'R\u00fcckseite']].forEach(q => {\n    const rr = [0, q[1][0], q[1][1], q[1][2], q[1][2]*1.7];\n    for(let i=0; i<4; i++){\n      const allowed = (i+1) <= S.corrTol.maxStage;\n      s += sector(rr[i], rr[i+1], q[0]-tol, q[0]+tol, STAGE_COL[i+1], allowed ? 0.16 : 0.13);\n      const lp = pt((rr[i]+rr[i+1])/2, q[0]);\n      if(rr[i+1]*k - rr[i]*k > 14) s += txt(lp[0], lp[1]+3, 'S'+(i+1), {anchor:'middle', s
