<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sichtprüf-Simulator · VT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media=\'all\'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    --bg:#1c1e20; --bg-2:#242628; --panel:#2a2d30; --panel-2:#2f3236;
    --border:#4a5058; --border-soft:#3a4048; --text:#f0f2f4; --text-dim:#b8bec4; --text-faint:#7a8490;
    --amber:#ffc94d; --amber-dim:#8a6420; --amber-glow:rgba(255,201,77,.24);
    --cyan:#4de9d4; --cyan-dim:#1f6a61; --cyan-glow:rgba(77,233,212,.18);
    --blue:#6cc0ec; --red:#ff6f66; --green:#5fe072; --green-glow:rgba(95,224,114,.55);
    --mono:'JetBrains Mono',ui-monospace,monospace; --disp:'Space Grotesk',sans-serif; --body:'Inter',sans-serif;
  }
  body.light-mode{
    --bg:#f4f7f6; --bg-2:#e9f1ee; --panel:#ffffff; --panel-2:#f2f7f5;
    --border:#c3d3cc; --border-soft:#d7e4de; --text:#0c1f16; --text-dim:#274134; --text-faint:#4c6b5c;
    --amber:#a2590a; --amber-dim:#c97a1e; --amber-glow:rgba(162,89,10,.16);
    --cyan:#08954C; --cyan-dim:#3fae76; --cyan-glow:rgba(8,149,76,.16);
    --blue:#0a4a6e; --red:#a3231f; --green:#08954C; --green-glow:rgba(8,149,76,.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--body);transition:background .2s,color .2s;}
  body{min-height:100vh;background:
      radial-gradient(ellipse 1400px 700px at 10% -5%,#0a1e30 0%,transparent 55%),
      radial-gradient(ellipse 900px 500px at 95% 5%,#14101e 0%,transparent 50%),
      var(--bg);}
  body.light-mode{background:
      radial-gradient(ellipse 1400px 700px at 10% -5%,#d7ecdf 0%,transparent 55%),
      radial-gradient(ellipse 900px 500px at 95% 5%,#e4f2ea 0%,transparent 50%),
      var(--bg);}
  .app{max-width:1200px;margin:0 auto;padding:14px 12px 48px;}
  @media(min-width:768px){.app{padding:20px 20px 56px;}}
  @media(min-width:1500px){.app{max-width:1760px;}}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px;margin-bottom:16px;border-bottom:1.5px solid var(--border);flex-wrap:wrap;}
  .brand-eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);margin:0 0 4px;display:flex;align-items:center;gap:6px;}
  .brand-eyebrow::before{content:'';display:inline-block;width:18px;height:1.5px;background:var(--cyan);opacity:.8;}
  h1{font-family:var(--disp);font-weight:700;font-size:20px;margin:0;background:linear-gradient(120deg,var(--text) 60%,var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  h1 small{display:block;font-family:var(--body);font-weight:400;font-size:11.5px;color:var(--text-dim);margin-top:2px;-webkit-text-fill-color:var(--text-dim);}
  @media(min-width:600px){h1{font-size:24px;}h1 small{font-size:12.5px;}}
  .badge-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .badge{font-family:var(--mono);font-size:10px;padding:4px 9px;border-radius:20px;border:1.5px solid var(--border);color:var(--text-dim);background:var(--panel);display:flex;align-items:center;gap:5px;white-space:nowrap;transition:border-color .2s;}
  .badge.active-badge{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-glow);}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2.5s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .theme-toggle{background:var(--panel-2);border:1.5px solid var(--border);border-radius:30px;padding:5px 10px;cursor:pointer;display:flex;align-items:center;gap:5px;font-size:14px;color:var(--text-dim);transition:.2s;font-family:var(--body);}
  .theme-toggle:hover{border-color:var(--cyan);background:var(--cyan-glow);}

  /* ── Schaeffler-Markenbalken ─────────────────────────────────── */
  .sfl-bar{display:flex;align-items:center;gap:10px;padding:5px 10px;background:#ffffff;border-radius:8px;border-bottom:3px solid #08954C;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.25);}
  .sfl-bar img{height:16px;width:auto;display:block;}
  .sfl-bar .sfl-sep{width:1px;height:13px;background:#c8d2d8;flex-shrink:0;}
  .sfl-bar .sfl-text{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#08954C;font-weight:700;white-space:nowrap;}
  @media(max-width:480px){.sfl-bar .sfl-text{font-size:8px;letter-spacing:.08em;}.sfl-bar img{height:14px;}}

  /* ── Light-Mode Textkontrast (analog UT-Simulator) ────────────── */
  body.light-mode h1{background:linear-gradient(120deg,#0c1f16 60%,#08954C);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  body.light-mode h1 small{-webkit-text-fill-color:#1e3144;color:#1e3144;font-weight:500;}
  body.light-mode .brand-eyebrow{color:#08954C;font-weight:700;}
  body.light-mode .stage-title{color:#1e3144;font-weight:700;}
  body.light-mode .legend span{color:#1e3144;}
  body.light-mode .badge{color:#1e3144;font-weight:600;}
  body.light-mode .hint{color:#1e3144;}
  body.light-mode .ctl-row label{color:#07111a;font-weight:600;}
  body.light-mode .stat .k{color:#1e3144;}
  body.light-mode .stat .v{color:#08954C;}
  body.light-mode button{color:#07111a;background:#dde8f0;border-color:#6a8099;}
  body.light-mode button:hover{color:#07111a;background:rgba(8,149,76,.12);border-color:#08954C;}
  body.light-mode .toggle button.sel{background:#08954C;border-color:#08954C;color:#fff;}
  body.light-mode select{color:#07111a;}

  .grid{display:grid;grid-template-columns:1fr;gap:16px;}
  @media(min-width:960px){.grid{grid-template-columns:1.3fr .9fr;align-items:start;}}
  @media(min-width:1500px){.grid{grid-template-columns:1.6fr .9fr;gap:22px;}}
  .panel{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--border-soft);border-radius:14px;padding:14px;}
  .stage-title{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;}
  .stage{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--border-soft);background:#050505;margin-bottom:14px;}
  svg{display:block;width:100%;height:auto;}

  .ctl-row{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .ctl-row label{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--text-dim);display:flex;justify-content:space-between;}
  .ctl-row label b{color:var(--amber);font-weight:700;}
  input[type=range]{-webkit-appearance:none;width:100%;height:5px;border-radius:4px;background:var(--panel-2);outline:none;border:1px solid var(--border-soft);}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--amber);border:2px solid #1a1200;box-shadow:0 0 8px var(--amber-glow);cursor:pointer;}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--amber);border:2px solid #1a1200;cursor:pointer;}
  select{width:100%;background:var(--panel-2);color:var(--text);border:1px solid var(--border-soft);border-radius:8px;padding:8px 10px;font-family:var(--body);font-size:13px;}

  .toggle{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
  .toggle button{flex:1;min-width:70px;}
  .toggle button.sel{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-glow);}
  button{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:9px 10px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);cursor:pointer;transition:.15s;}
  button:hover{border-color:var(--cyan);color:var(--cyan);}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px;}
  .stat{background:var(--panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:8px 10px;}
  .stat .k{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);}
  .stat .v{font-family:var(--disp);font-size:16px;font-weight:700;color:var(--cyan);}
  .stat.warn .v{color:var(--red);}
  .stat.ok .v{color:var(--green);}
  .stat.full{grid-column:1/-1;}

  .callout{margin-top:12px;padding:10px 12px;border-radius:8px;border:1px solid var(--border-soft);background:var(--panel-2);font-size:12px;color:var(--text-dim);line-height:1.5;}
  .callout.bad{border-color:#7a2a2a;color:#ffb3ac;}
  body.light-mode .callout.bad{color:#7a1a12;background:#fbe4e2;}
  .callout.good{border-color:#245c30;color:#b7f0c0;}
  body.light-mode .callout.good{color:#0f4a20;background:#e2f5e6;}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:9.5px;color:var(--text-faint);}
  .legend span{display:flex;align-items:center;gap:4px;}
  .legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}
  .hint{font-size:11.5px;color:var(--text-faint);margin-bottom:10px;line-height:1.5;}

  /* ─── Desktop: kompakteres Layout, damit die Seite ohne vertikales
     Scrollen auf den Bildschirm passt (nur ab 960px – dort greift ohnehin
     erst die 2-Spalten-Ansicht; die mobile Ansicht bleibt unangetastet).
     Verkleinert vor allem die beiden SVG-Grafiken (Prüfaufbau + Prüfersicht)
     per max-height – das Seitenverhältnis bleibt über preserveAspectRatio
     erhalten, ein entstehender Rand wird vom ohnehin dunklen .stage-
     Hintergrund kaschiert – sowie diverse Innenabstände/Abstände. Gleiches
     Prinzip wie beim AE-Simulator (Schallemissionsprüfung). ─── */
  @media(min-width:960px){
    .app{padding-top:10px;padding-bottom:20px;}
    header.top{margin-bottom:10px;padding-bottom:8px;}
    .grid{gap:14px;}
    .panel{padding:12px;}
    .stage{margin-bottom:8px;}
    #setup{max-height:190px;}
    #view{max-height:170px;}
    .stage-title{margin-bottom:6px;}
    .toggle{margin-bottom:8px;}
    .ctl-row{margin-bottom:8px;gap:4px;}
  }

  /* ── Desktop-Dashboard: alles gleichzeitig sichtbar, ohne Scrollen der
     ganzen Seite (nur die einzelne Spalte scrollt bei Bedarf) – analog
     zum UT-Schallfeld-Simulator ── */
  @media(min-width:1050px){
    html,body{height:100%;overflow:hidden;}
    body{overflow:hidden;}
    .app{height:100vh;height:100dvh;padding:8px 16px 6px;display:flex;flex-direction:column;overflow:hidden;}
    .sfl-bar{flex:0 0 auto;margin-bottom:6px;padding:4px 10px;}
    header.top{flex:0 0 auto;margin-bottom:6px;padding-bottom:6px;}
    .grid{flex:1 1 auto;min-height:0;height:100%;grid-template-columns:1.3fr .9fr;gap:12px;}
    .grid>div{height:100%;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:2px;}
    .panel{padding:9px 12px;}
    .stage-title{margin-bottom:4px;}
    .stage{margin-bottom:5px;}
    #setup{max-height:34vh;}
    #view{max-height:28vh;}
    .toggle{margin-bottom:6px;}
    .ctl-row{margin-bottom:6px;gap:3px;}
    .stats{margin-top:2px;}
  }

  /* ═══ Upgrade: Optik, Prüfablauf, Kamera-Modus ═══ */
  .hidden{display:none !important;}
  .panel{box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 10px 28px -14px rgba(0,0,0,.55);}
  body.light-mode .panel{box-shadow:0 10px 26px -16px rgba(12,31,22,.28);}
  .stage{box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),0 8px 20px -12px rgba(0,0,0,.7);}
  input[type=range]{background:linear-gradient(90deg,var(--amber) var(--p,40%),var(--panel-2) var(--p,40%));}
  input[type=range]:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}
  .mode-switch{margin-bottom:12px;}
  .mode-switch button{font-weight:600;padding:11px 10px;line-height:1.25;text-transform:none;letter-spacing:.02em;font-size:11.5px;}
  .mode-switch button.sel{box-shadow:0 0 0 1px var(--cyan) inset,0 0 20px var(--cyan-glow);}
  .sub-title{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);margin:2px 0 8px;}
  .ctl-note{font-size:10.5px;color:var(--text-faint);line-height:1.4;margin-top:-2px;}
  body.light-mode .ctl-note{color:var(--text-dim);}

  .steps{display:flex;flex-direction:column;}
  .step{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--border-soft);}
  .step:first-child{border-top:0;padding-top:2px;}
  .step .ic{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:700;border:1.5px solid var(--border);color:var(--text-dim);background:var(--panel-2);}
  .step.ok .ic{border-color:var(--green);color:var(--green);background:var(--cyan-glow);}
  .step.warn .ic{border-color:var(--red);color:var(--red);background:rgba(255,111,102,.12);}
  .step h4{margin:0;font-family:var(--disp);font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
  .step h4 .val{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--text-dim);text-align:right;}
  .step.ok h4 .val{color:var(--green);}
  .step.warn h4 .val{color:var(--red);}
  .step p{margin:3px 0 0;font-size:11px;line-height:1.45;color:var(--text-faint);}
  body.light-mode .step p{color:var(--text-dim);}
  .step p.fix{color:var(--red);font-weight:500;}
  .step.cur{background:linear-gradient(90deg,var(--cyan-glow),transparent 70%);margin:0 -6px;padding-left:6px;padding-right:6px;border-radius:8px;}
</style>
<script>
/* Lokaler Theme-Zustand (Hell/Dunkel), gespeichert in localStorage. */
var themeCtl=(function(){
  var cbs=[], mode=null, KEY='zfp-theme';
  function store(v){ try{ if(v===undefined) return localStorage.getItem(KEY); localStorage.setItem(KEY,v); }catch(e){} return null; }
  function init(){ if(mode) return; var s=store(); mode=(s==='light'||s==='dark')?s:((document.body&&(document.body.classList.contains('light-mode')||document.body.classList.contains('light')))?'light':'dark'); }
  return {
    onTheme:function(f){ if(typeof f!=='function') return; cbs.push(f); init(); f(mode); },
    toggleTheme:function(){ init(); mode=mode==='light'?'dark':'light'; store(mode); cbs.forEach(function(f){ try{ f(mode); }catch(e){} }); }
  };
})();
</script>

<style id="fit-css">
/* ═══ Kompakt-Dashboard (wie UT): kleine Schrift, dichte Panels, alles auf einem Bildschirm ═══ */
html.fit, html.fit body{height:100%; overflow:hidden;}
html.fit .app{box-sizing:border-box; display:flex; flex-direction:column; padding:5px 12px 8px; gap:6px; max-width:none; width:100%; height:100vh; height:100dvh; overflow:hidden; zoom:1 !important;}
html.fit .sfl-bar{display:none;}
html.fit header.top{margin:0; padding:0 0 4px; flex:0 0 auto; align-items:center; gap:12px; flex-wrap:nowrap;}
html.fit header.top .brand-eyebrow, html.fit .eyebrow{font-size:9px; margin:0 0 1px;}
html.fit header.top h1{font-size:21px; line-height:1.05; margin:0;}
html.fit header.top h1 small, html.fit header.top .title-group > small, html.fit header.top .sub{font-size:11.5px; line-height:1.2;}
html.fit .badge{font-size:10.5px; padding:3px 9px;}
html.fit .icon-btn{width:30px; height:30px; font-size:14px;}
html.fit .fitgrid{flex:1 1 0; min-height:0; display:grid; gap:8px; margin:0; align-items:stretch;}
html.fit .fcol{display:flex; flex-direction:column; gap:8px; min-height:0; min-width:0; overflow-y:auto; overflow-x:hidden; padding:0 2px 4px 0; scrollbar-width:thin;}
html.fit .fcol > *{flex:0 0 auto; margin:0 !important;}
html.fit .panel{padding:8px 10px 9px; border-radius:10px;}
html.fit .panel h2, html.fit .stage-title, html.fit .panel > .stage-title{margin:0 0 5px; font-size:10.5px; letter-spacing:.07em; line-height:1.25;}
html.fit .stage-head{gap:4px 10px; flex-wrap:wrap; padding:0 0 4px; margin:0 0 2px;}
html.fit .ctl-row, html.fit .field{margin:0 0 5px;}
html.fit .ctl-row label, html.fit .field label{font-size:11.5px; margin:0 0 1px; line-height:1.25;}
html.fit .ctl-row label .val, html.fit .field label .val{font-size:11.5px;}
html.fit input[type=range]{margin:1px 0; height:18px;}
html.fit .hint, html.fit .note, html.fit .ctl-row .note, html.fit .sidebar-note, html.fit .panel .hint{font-size:10.5px; line-height:1.32; margin:2px 0 0;}
html.fit .btnrow{gap:5px; margin:4px 0;}
html.fit button, html.fit select{font-size:11.5px; padding:5px 9px;}
html.fit .callout, html.fit .verdict{font-size:11.5px; line-height:1.4; padding:7px 10px; margin-top:5px; max-height:none; overflow:visible;}
html.fit .stat{padding:5px 8px;} html.fit .stat .k{font-size:9.5px; line-height:1.2;} html.fit .stat .v{font-size:14.5px;}
html.fit .stats{gap:5px; grid-template-columns:repeat(3,1fr);}
html.fit .seg{gap:4px;}
html.fit .seg button, html.fit .toggle button{padding:6px 5px; min-width:0; white-space:normal; line-height:1.2; font-size:11px;}
html.fit .seg.mini button{padding:3px 8px; font-size:10.5px;}
html.fit .toggle{flex-wrap:wrap; padding:5px 8px; margin:0 0 4px;}
html.fit .legend{font-size:10px; margin-top:4px; gap:3px 12px;}
html.fit table.res td, html.fit table.res th, html.fit table.ht td, html.fit table.ht th{padding:3px 5px; font-size:10.5px;}
html.fit .pstep, html.fit .step{padding-top:5px; padding-bottom:5px; gap:8px;}
html.fit .pstep p, html.fit .step p{font-size:10.5px; line-height:1.38; margin-top:2px;}
html.fit .pstep h4{font-size:12px;}
html.fit .frow{padding:3px 0; font-size:11.5px;}
html.fit .frow .nm small{font-size:10px; line-height:1.25;}
html.fit .live{padding:8px 11px; margin-bottom:6px;}
html.fit .live-val{font-size:19px;}
html.fit .pbar{margin:6px 0 4px;}
html.fit .stage, html.fit .panel > .stage{margin:0;}
html.fit .foot{font-size:10.5px; padding-top:3px;}
html.fit .kv{font-size:11px;}
html.fit canvas, html.fit svg.view{max-width:100%; height:auto;}
html.fit .step p, html.fit .pstep p{display:none;}
html.fit .step.cur p, html.fit .pstep.cur p{display:block;}
/* Slider-reiche Panels: zwei Regler nebeneinander */
html.fit .panel.fit2{display:grid; grid-template-columns:1fr 1fr; column-gap:12px; align-content:start;}
html.fit .panel.fit2 > *{grid-column:1/-1;}
html.fit .panel.fit2 > .ctl-row, html.fit .panel.fit2 > .field{grid-column:auto; min-width:0;}

/* Grafiken: nur Breite begrenzt, Höhe folgt dem Seitenverhältnis → nie verzerrt */
html.fit .stage canvas, html.fit .stage svg{max-width:100%; height:auto;}
/* Kompaktstufen (nur Abstände, Schriftgröße bleibt → Browser-Zoom wirkt normal) */
html.fit.d1 .fitgrid, html.fit.d1 .fcol{gap:6px;}
html.fit.d1 .panel{padding:6px 8px 7px;}
html.fit.d1 .panel h2, html.fit.d1 .stage-title{margin-bottom:3px;}
html.fit.d1 .ctl-row, html.fit.d1 .field{margin-bottom:3px;}
html.fit.d1 .hint, html.fit.d1 .note, html.fit.d1 .panel .hint{margin-top:1px; line-height:1.25;}
html.fit.d1 .stat{padding:3px 7px;} html.fit.d1 .stats{gap:4px;}
html.fit.d1 .toggle{padding:3px 7px; margin-bottom:3px;}
html.fit.d1 .seg button, html.fit.d1 .toggle button{padding:4px 4px;}
html.fit.d1 button, html.fit.d1 select{padding:3px 8px;}
html.fit.d1 .callout, html.fit.d1 .verdict{padding:5px 8px; margin-top:3px; line-height:1.3;}
html.fit.d1 .pstep, html.fit.d1 .step{padding-top:3px; padding-bottom:3px;}
html.fit.d1 .legend{margin-top:2px;} html.fit.d1 .btnrow{margin:2px 0;}

<script>
const el = id => document.getElementById(id);
const svgSetup = el('setup'), svgView = el('view');
const themeToggle = el('themeToggle');
let light = true, ready = false;

function setTheme(mode){
  light = mode==='light';
  document.body.classList.toggle('light-mode', light);
  themeToggle.innerHTML = light
    ? '<span class="icon">🌙</span><span class="icon" style="opacity:0.35">☀️</span>'
    : '<span class="icon">☀️</span><span class="icon" style="opacity:0.35">🌙</span>';
  if(ready) render();
}
themeCtl.onTheme(setTheme);
themeToggle.addEventListener('click', ()=>{ themeCtl.toggleTheme(); if(ready) render(); });

const DEFECT_Z = 120; // Lage des Defekts in der Bohrung (mm ab Einlauf)
const state = {
  mode:'direct', defect:'riss', clean:true, size:80,
  angle:12, lux:500, mag:1, dist:40,
  bore:20, probe:6, view:90, depth:115, led:60, res:1280, fov:70
};

/* ── Eingaben ─────────────────────────────────────────────── */
function fill(inp){ inp.style.setProperty('--p', ((inp.value-inp.min)/(inp.max-inp.min)*100)+'%'); }
function bind(id, key, fmt, labelId){
  const input = el(id), label = el(labelId || 'v'+id.charAt(0).toUpperCase()+id.slice(1));
  input.addEventListener('input', ()=>{
    state[key] = parseFloat(input.value);
    label.textContent = fmt ? fmt(state[key]) : state[key];
    fill(input);
    render();
  });
}
bind('angle','angle'); bind('lux','lux');
bind('mag','mag', v=>v.toFixed(1).replace('.0',''));
bind('dist','dist'); bind('size','size');
bind('bore','bore'); bind('probe','probe', v=>v.toFixed(1).replace('.0',''));
bind('depth','depth'); bind('viewdir','view',null,'vView'); bind('led','led');
el('res').addEventListener('change', e=>{ state.res = parseInt(e.target.value,10); render(); });

function bindToggle(id, fn){
  el(id).addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    el(id).querySelectorAll('button').forEach(x=>x.classList.toggle('sel', x===b));
    fn(b); render();
  });
}
bindToggle('defectToggle', b=>{ state.defect = b.dataset.d; });
bindToggle('cleanToggle',  b=>{ state.clean = b.dataset.c==='1'; });
bindToggle('modeToggle',   b=>{ state.mode = b.dataset.m; });

/* ── Hilfsfunktionen ─────────────────────────────────────── */
function rng(seed){ let s = seed % 2147483647; if(s<=0) s += 2147483646; return ()=>{ s = s*16807 % 2147483647; return (s-1)/2147483646; }; }
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const fmtPct = v => Math.round(v*100)+' %';
const rad = d => d*Math.PI/180;

/* ── Modell ──────────────────────────────────────────────── */
function compute(){
  const s = state;
  const isTopo = s.defect==='riss' || s.defect==='kratzer' || s.defect==='pore';
  const depthGain = s.defect==='riss'?1.0:(s.defect==='kratzer'?0.55:0.75);
  const cleanF = s.clean ? 1 : 0.55;

  if(s.mode==='direct'){
    const sweet = s.defect==='pore'?20:12;
    const sigma = s.defect==='pore'?16:10;
    const shadowFactor = isTopo ? depthGain*Math.exp(-((s.angle-sweet)**2)/(2*sigma*sigma)) : 1.0;
    const irradiance = Math.sin(rad(s.angle)) * s.lux;
    const illumFactor = Math.min(irradiance/500, 1.6);
    const minResolvable_um = s.dist*3.0;
    const apparent_um = s.size*s.mag;
    const sizeFactor = Math.min(apparent_um/minResolvable_um, 1.8);
    let visibility = shadowFactor*illumFactor*Math.min(sizeFactor,1.4);
    visibility = clamp(visibility*(isTopo?1:1.15)*cleanF, 0, 1);
    const luxOK = s.lux>=500;
    const distOK = s.dist<=60 || s.mag>=3;
    const resOK = sizeFactor>=0.9;
    const detected = visibility>=0.32 && luxOK;
    return {mode:'direct', isTopo, shadowFactor, illumFactor, sizeFactor, visibility, luxOK, distOK, resOK, detected, apparent_um, minResolvable_um, cleanF};
  }

  // ── Kamera / Boroskop ──
  const R = s.bore/2;
  const dz = DEFECT_Z - s.depth;                 // >0: Defekt liegt vor der Sondenspitze
  const phi = Math.atan2(R, dz)*180/Math.PI;     // Winkel zur Bohrungsachse (0° = geradeaus)
  const r = Math.hypot(R, dz);                   // Arbeitsabstand Kamera–Defekt
  const sinPhi = Math.sin(rad(phi));
  const fits = s.probe <= s.bore-1;
  const delta = phi - s.view;
  const inFOV = Math.abs(delta) <= s.fov/2;
  const raw = (s.led/100)*Math.pow(13/r,2)*Math.max(sinPhi,0.1);   // relative Belichtung
  const expState = raw<0.25 ? 'dark' : (raw>1.4 ? 'over' : 'ok');
  const expQ = raw<0.25 ? raw/0.25 : (raw>1.4 ? Math.max(0.25,1-(raw-1.4)/1.0) : 1);
  const pitch_um = 2*r*Math.tan(rad(s.fov/2))*1000/s.res;           // µm pro Pixel
  const minResolvable_um = 3*pitch_um/Math.max(sinPhi,0.15);
  const sizeFactor = Math.min(s.size/minResolvable_um, 1.8);
  const resOK = sizeFactor>=0.9;
  const blur = r<4 ? (4-r)*0.8 : (r>60 ? (r-60)*0.05 : 0);          // Schärfentiefe 4–60 mm
  const focusQ = 1/(1+blur*0.6);
  const contrast = isTopo ? depthGain*(0.55+0.45*Math.exp(-((phi-25)**2)/(2*25*25))) : 1.0;
  let visibility = contrast*expQ*focusQ*Math.min(sizeFactor,1.4)*cleanF*(isTopo?1:1.15)*1.2;
  visibility = clamp(visibility,0,1);
  const detected = fits && inFOV && raw>=0.25 && visibility>=0.32;
  return {mode:'cam', isTopo, R, dz, phi, r, sinPhi, fits, delta, inFOV, raw, expState, expQ, pitch_um, minResolvable_um, sizeFactor, resOK, blur, focusQ, contrast, visibility, detected, cleanF};
}

/* ── Gemeinsame SVG-Bausteine ─────────────────────────────── */
function defsCommon(){
  return `
  <radialGradient id="rust" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#a24a1c" stop-opacity=".95"/><stop offset=".6" stop-color="#8a4a22" stop-opacity=".6"/><stop offset="1" stop-color="#7a5a30" stop-opacity="0"/></radialGradient>
  <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
  <filter id="brush" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.7" numOctaves="2" seed="5"/><feColorMatrix type="matrix" values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .5 -.05"/></filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="1" seed="9"/><feColorMatrix type="matrix" values="0 0 0 0 .55  0 0 0 0 .55  0 0 0 0 .55  0 0 0 .9 -.1"/></filter>`;
}

function defectShapes(kind, alpha, relief, rnd){
  const dark = `rgba(18,10,8,${0.4+alpha*0.55})`;
  const hi = `rgba(255,255,255,${0.1+relief*0.45})`;
  let o = '';
  if(kind==='riss'){
    const d = 'M-90,10 Q-30,-25 10,8 T95,-14';
    const b1 = 'M-28,-6 L-14,-30 L-6,-44', b2 = 'M38,2 L52,22 L58,34';
    o += `<path d="${d}" fill="none" stroke="rgba(0,0,0,.2)" stroke-width="${6+alpha*5}" stroke-linecap="round" filter="url(#soft)"/>`;
    o += `<path d="${d}" fill="none" stroke="${dark}" stroke-width="${1.6+alpha*2.6}" stroke-linecap="round" stroke-linejoin="round"/>`;
    o += `<path d="${b1}" fill="none" stroke="${dark}" stroke-width="${1+alpha*1.2}" stroke-linecap="round"/><path d="${b2}" fill="none" stroke="${dark}" stroke-width="${1+alpha*1.2}" stroke-linecap="round"/>`;
    o += `<path d="${d}" transform="translate(1.6,1.8)" fill="none" stroke="${hi}" stroke-width="1"/>`;
  } else if(kind==='kratzer'){
    const lines = [['-100,6','100,-6',1.5+alpha*2],['-78,13','62,6',.8+alpha*.8],['-40,-9','92,-15',.7+alpha*.7]];
    lines.forEach(l=>{
      o += `<line x1="${l[0].split(',')[0]}" y1="${l[0].split(',')[1]}" x2="${l[1].split(',')[0]}" y2="${l[1].split(',')[1]}" stroke="${dark}" stroke-width="${l[2]}" stroke-linecap="round"/>`;
      o += `<line x1="${l[0].split(',')[0]}" y1="${+l[0].split(',')[1]+1.6}" x2="${l[1].split(',')[0]}" y2="${+l[1].split(',')[1]+1.6}" stroke="${hi}" stroke-width=".8"/>`;
    });
  } else if(kind==='pore'){
    for(let i=0;i<6;i++){
      const px = -60+i*22+rnd()*8, py = Math.sin(i)*10, rr = 3+alpha*3;
      o += `<circle cx="${px}" cy="${py}" r="${rr}" fill="rgba(15,10,10,${0.3+alpha*0.55})"/>`;
      o += `<circle cx="${px+.6}" cy="${py+.8}" r="${rr}" fill="none" stroke="${hi}" stroke-width=".9"/>`;
    }
  } else {
    o += `<ellipse cx="0" cy="0" rx="${70+alpha*20}" ry="${34+alpha*10}" fill="url(#rust)" opacity="${0.35+alpha*0.65}"/>`;
    o += `<ellipse cx="-20" cy="8" rx="30" ry="14" fill="rgba(170,60,20,${0.3+alpha*0.4})"/>`;
    for(let i=0;i<9;i++){
      o += `<ellipse cx="${(rnd()-.5)*140}" cy="${(rnd()-.5)*60}" rx="${3+rnd()*7}" ry="${2+rnd()*4}" fill="rgba(120,55,20,${0.25+alpha*0.4})"/>`;
    }
  }
  return o;
}

function osd(x,y,text,anchor){
  const w = text.length*5.7+12;
  const rx = anchor==='end' ? x-w : x;
  return `<rect x="${rx}" y="${y-11}" width="${w}" height="16" rx="3" fill="rgba(0,0,0,.6)"/><text x="${rx+6}" y="${y}" font-family="JetBrains Mono" font-size="9.5" fill="#e9f4f0">${text}</text>`;
}

/* ── Prüfaufbau: direkt ──────────────────────────────────── */
function renderSetupDirect(c){
  const W=600,H=220, sx=40, ex=560, sy=168;
  const a = state.angle, ar = rad(a);
  const hitX = 250, hitY = sy, L = 135;
  const srcX = hitX - Math.cos(ar)*L, srcY = hitY - Math.sin(ar)*L;
  const eyeX = 478, eyeY = 62;
  const grooveDepth = c.isTopo ? (14 + (state.defect==='riss'?10:state.defect==='pore'?4:2)) : 6;
  const grooveW = c.isTopo ? 10 : 26;

  let s = `<defs>${defsCommon()}
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b4bec7"/><stop offset=".25" stop-color="#8793a0"/><stop offset="1" stop-color="#4d5762"/></linearGradient>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(0,0,0,.18)" stroke-width="1.2"/></pattern>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="rgba(120,140,150,.12)" stroke-width="1"/></pattern>
    <linearGradient id="cone" gradientUnits="userSpaceOnUse" x1="${srcX}" y1="${srcY}" x2="${hitX}" y2="${hitY}"><stop offset="0" stop-color="#ffb82e" stop-opacity=".55"/><stop offset="1" stop-color="#ffb82e" stop-opacity=".08"/></linearGradient>
    <radialGradient id="lamp"><stop offset="0" stop-color="#fff6d0"/><stop offset=".5" stop-color="#ffc94d"/><stop offset="1" stop-color="#ffb82e" stop-opacity="0"/></radialGradient>
    <linearGradient id="shad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".7"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
    <linearGradient id="vcone" gradientUnits="userSpaceOnUse" x1="${eyeX}" y1="${eyeY}" x2="${hitX}" y2="${hitY}"><stop offset="0" stop-color="#17c9b0" stop-opacity=".30"/><stop offset="1" stop-color="#17c9b0" stop-opacity=".06"/></linearGradient>
  </defs>`;
  s += `<rect width="${W}" height="${H}" fill="var(--bg-2)"/><rect width="${W}" height="${H}" fill="url(#grid)"/>`;

  // Werkstück
  s += `<rect x="${sx}" y="${sy}" width="${ex-sx}" height="38" rx="3" fill="url(#steel)" stroke="rgba(0,0,0,.35)"/>`;
  s += `<rect x="${sx}" y="${sy}" width="${ex-sx}" height="38" rx="3" fill="url(#hatch)"/>`;
  s += `<line x1="${sx+3}" y1="${sy+1}" x2="${ex-3}" y2="${sy+1}" stroke="rgba(255,255,255,.55)" stroke-width="1.2"/>`;
  s += `<text x="${sx+8}" y="${sy+54}" font-family="JetBrains Mono" font-size="9" fill="var(--text-faint)">Werkstückoberfläche</text>`;

  // Verschmutzung
  if(!state.clean){
    const r2 = rng(5);
    for(let i=0;i<14;i++){ s += `<ellipse cx="${sx+20+r2()*(ex-sx-40)}" cy="${sy+1}" rx="${6+r2()*14}" ry="${1.5+r2()*2.5}" fill="rgba(70,52,24,.55)"/>`; }
  }

  // Defekt im Querschnitt
  if(c.isTopo){
    s += `<path d="M${hitX-grooveW/2},${sy} L${hitX-2},${sy+grooveDepth} L${hitX+2},${sy+grooveDepth} L${hitX+grooveW/2},${sy}" fill="#12161a" stroke="var(--red)" stroke-width="1.5"/>`;
  } else {
    s += `<ellipse cx="${hitX}" cy="${sy+3}" rx="22" ry="5" fill="rgba(160,70,25,.6)" stroke="var(--red)" stroke-width="1.2"/>`;
  }
  s += `<line x1="${hitX}" y1="${sy+(c.isTopo?grooveDepth+4:12)}" x2="${hitX+14}" y2="${sy+34}" stroke="var(--red)" stroke-width="1"/><text x="${hitX+17}" y="${sy+32}" font-family="JetBrains Mono" font-size="9.5" fill="var(--red)">Defekt</text>`;

  // Schatten im Streiflicht
  if(c.isTopo && state.angle<40){
    const shadowLen = Math.min(70, grooveDepth/Math.tan(rad(Math.max(state.angle,3))));
    s += `<rect x="${hitX+2}" y="${sy-4}" width="${shadowLen}" height="4" fill="url(#shad)"/>`;
  }

  // Lichtkegel + Strahl + Reflexion
  s += `<polygon points="${srcX},${srcY} ${hitX-34},${sy} ${hitX+34},${sy}" fill="url(#cone)"/>`;
  s += `<line x1="${srcX}" y1="${srcY}" x2="${hitX}" y2="${hitY}" stroke="#ffb82e" stroke-width="2" stroke-dasharray="5,3"/>`;
  s += `<line x1="${hitX}" y1="${hitY}" x2="${hitX+Math.cos(ar)*120}" y2="${hitY-Math.sin(ar)*120}" stroke="#ffb82e" stroke-width="1" stroke-dasharray="1,4" opacity=".7"/>`;
  s += `<text x="${hitX+Math.cos(ar)*120+4}" y="${hitY-Math.sin(ar)*120}" font-family="JetBrains Mono" font-size="8.5" fill="var(--text-faint)">Reflexion</text>`;
  // Lampe
  s += `<circle cx="${srcX}" cy="${srcY}" r="20" fill="url(#lamp)"/><circle cx="${srcX}" cy="${srcY}" r="7" fill="#fff3c4" stroke="#c98a10" stroke-width="1.5"/>`;
  s += `<text x="${srcX}" y="${srcY-24}" text-anchor="middle" font-family="JetBrains Mono" font-size="10" fill="var(--amber)">Lichtquelle</text>`;

  // Winkelbogen
  const ra = 54;
  s += `<path d="M${hitX-ra},${sy} A${ra},${ra} 0 0 1 ${hitX-ra*Math.cos(ar)},${sy-ra*Math.sin(ar)}" fill="none" stroke="var(--amber)" stroke-width="1.6"/>`;
  s += `<text x="${hitX-ra-6}" y="${sy-8}" text-anchor="end" font-family="JetBrains Mono" font-size="10.5" font-weight="700" fill="var(--amber)">${state.angle}°</text>`;

  // Blickkegel + Auge
  s += `<polygon points="${eyeX},${eyeY} ${hitX-26},${sy} ${hitX+26},${sy}" fill="url(#vcone)"/>`;
  s += `<line x1="${eyeX}" y1="${eyeY}" x2="${hitX}" y2="${hitY}" stroke="var(--cyan)" stroke-width="1.6" stroke-dasharray="3,3"/>`;
  s += `<g transform="translate(${eyeX},${eyeY})"><path d="M-17,0 Q0,-13 17,0 Q0,13 -17,0Z" fill="#fff" stroke="var(--cyan)" stroke-width="2"/><circle r="5.5" fill="var(--cyan)"/><circle r="2.2" fill="#07151a"/></g>`;
  s += `<text x="${eyeX}" y="${eyeY-20}" text-anchor="middle" font-family="JetBrains Mono" font-size="10" fill="var(--cyan)">Prüfer</text>`;
  // Abstand
  const mx = (eyeX+hitX)/2+22, my = (eyeY+hitY)/2-4;
  s += `<rect x="${mx-30}" y="${my-10}" width="60" height="16" rx="8" fill="var(--panel)" stroke="var(--cyan)" stroke-width="1"/><text x="${mx}" y="${my+2}" text-anchor="middle" font-family="JetBrains Mono" font-size="9.5" fill="var(--cyan)">${state.dist} cm</text>`;
  // Lupe
  if(state.mag>1){
    const lx = eyeX+(hitX-eyeX)*0.2, ly = eyeY+(hitY-eyeY)*0.2;
    s += `<line x1="${lx+9}" y1="${ly+9}" x2="${lx+20}" y2="${ly+20}" stroke="var(--cyan)" stroke-width="3" stroke-linecap="round"/><circle cx="${lx}" cy="${ly}" r="13" fill="rgba(23,201,176,.18)" stroke="var(--cyan)" stroke-width="2"/><text x="${lx}" y="${ly+3.5}" text-anchor="middle" font-family="JetBrains Mono" font-size="9" font-weight="700" fill="var(--cyan)">${state.mag.toFixed(1).replace('.0','')}×</text>`;
  }
  // Luxmeter
  const lok = state.lux>=500;
  s += `<g transform="translate(486,148)"><rect width="88" height="36" rx="6" fill="#1b2227" stroke="${lok?'#5fe072':'#ff6f66'}" stroke-width="1.5"/><text x="44" y="14" text-anchor="middle" font-family="JetBrains Mono" font-size="8" fill="#8fa0aa">LUXMETER</text><text x="44" y="29" text-anchor="middle" font-family="JetBrains Mono" font-size="14" font-weight="700" fill="${lok?'#5fe072':'#ff6f66'}">${state.lux} lx</text></g>`;
  svgSetup.innerHTML = s;
}

/* ── Prüfaufbau: Kamera / Boroskop (Längsschnitt) ────────── */
function renderSetupCam(c){
  const W=600,H=220, x0=70, xEnd=540, sz=2.2, cy=108, k=1.5;
  const Rpx = state.bore/2*k;
  const bTop = cy-Rpx, bBot = cy+Rpx;
  const tipX = x0 + state.depth*sz;
  const xd = x0 + DEFECT_Z*sz;
  const pp = Math.max(4, state.probe*k);
  const th = state.view;
  const fovH = state.fov/2;
  const len = 300;
  const spread = Math.tan(rad(fovH))*len;

  let s = `<defs>${defsCommon()}
    <linearGradient id="steel2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#aeb8c1"/><stop offset=".5" stop-color="#7d8995"/><stop offset="1" stop-color="#4d5762"/></linearGradient>
    <pattern id="hatch2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="rgba(0,0,0,.2)" stroke-width="1.2"/></pattern>
    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="rgba(120,140,150,.12)" stroke-width="1"/></pattern>
    <linearGradient id="boreg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2329"/><stop offset=".5" stop-color="#0d1115"/><stop offset="1" stop-color="#1d2329"/></linearGradient>
    <linearGradient id="beam" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="${len}" y2="0"><stop offset="0" stop-color="#ffd36a" stop-opacity="${0.25+0.5*Math.min(1,c.raw)}"/><stop offset="1" stop-color="#ffb82e" stop-opacity=".04"/></linearGradient>
    <radialGradient id="ledg"><stop offset="0" stop-color="#fff6d0"/><stop offset=".5" stop-color="#ffc94d" stop-opacity=".7"/><stop offset="1" stop-color="#ffb82e" stop-opacity="0"/></radialGradient>
    <clipPath id="boreclip"><rect x="${x0}" y="${bTop}" width="${xEnd-x0-20}" height="${bBot-bTop}"/></clipPath>
  </defs>`;
  s += `<rect width="${W}" height="${H}" fill="var(--bg-2)"/><rect width="${W}" height="${H}" fill="url(#grid2)"/>`;

  // Werkstück + Bohrung
  s += `<rect x="${x0}" y="33" width="${xEnd-x0}" height="150" rx="4" fill="url(#steel2)" stroke="rgba(0,0,0,.35)"/><rect x="${x0}" y="33" width="${xEnd-x0}" height="150" rx="4" fill="url(#hatch2)"/>`;
  s += `<rect x="${x0}" y="${bTop}" width="${xEnd-x0-20}" height="${bBot-bTop}" fill="url(#boreg)" stroke="#0a0d10" stroke-width="1"/>`;
  s += `<line x1="${x0}" y1="${bTop}" x2="${xEnd-20}" y2="${bTop}" stroke="rgba(255,255,255,.35)" stroke-width="1"/>`;
  s += `<line x1="${x0}" y1="${cy}" x2="${xEnd-20}" y2="${cy}" stroke="rgba(160,190,200,.25)" stroke-width="1" stroke-dasharray="10,4,2,4"/>`;

  // Defekt an der oberen Bohrungswand
  if(c.isTopo){
    s += `<path d="M${xd-5},${bTop} L${xd-1},${bTop-9} L${xd+1},${bTop-9} L${xd+5},${bTop}" fill="#0a0d10" stroke="var(--red)" stroke-width="1.6"/>`;
  } else {
    s += `<ellipse cx="${xd}" cy="${bTop+1}" rx="14" ry="3.5" fill="rgba(170,70,25,.8)" stroke="var(--red)" stroke-width="1.2"/>`;
  }
  s += `<line x1="${xd}" y1="${bTop-10}" x2="${xd}" y2="22" stroke="var(--red)" stroke-width="1"/><text x="${xd+5}" y="20" font-family="JetBrains Mono" font-size="9.5" fill="var(--red)">Defekt · z = ${DEFECT_Z} mm</text>`;

  // Lichtkegel / Bildfeld (gedreht um die Sondenspitze, begrenzt auf die Bohrung)
  if(c.fits){
    s += `<g clip-path="url(#boreclip)"><g transform="translate(${tipX},${cy}) rotate(${-th})">
      <polygon points="0,0 ${len},${-spread} ${len},${spread}" fill="url(#beam)"/>
      <line x1="0" y1="0" x2="${len}" y2="${-spread}" stroke="var(--cyan)" stroke-width="1.2" stroke-dasharray="4,3" opacity=".9"/>
      <line x1="0" y1="0" x2="${len}" y2="${spread}" stroke="var(--cyan)" stroke-width="1.2" stroke-dasharray="4,3" opacity=".9"/>
      <line x1="0" y1="0" x2="${len}" y2="0" stroke="#ffb82e" stroke-width="1" stroke-dasharray="2,4" opacity=".8"/>
    </g></g>`;
  }
  // Sichtlinie zum Defekt
  const ok = c.inFOV && c.fits;
  s += `<line x1="${tipX}" y1="${cy}" x2="${xd}" y2="${bTop}" stroke="${ok?'var(--cyan)':'var(--text-faint)'}" stroke-width="1.6" ${ok?'':'stroke-dasharray="2,4"'}/>`;

  // Sonde (Schlauch + Griff + Gelenkspitze)
  const pc = c.fits ? '#2c333a' : '#8c2a24';
  s += `<rect x="6" y="${cy-pp/2}" width="${tipX-6}" height="${pp}" rx="${pp/2}" fill="${pc}" stroke="${c.fits?'#10151a':'#ff6f66'}" stroke-width="1"/>`;
  s += `<rect x="6" y="${cy-pp/2+1}" width="${tipX-6}" height="${Math.max(1,pp*0.28)}" rx="1" fill="rgba(255,255,255,.14)"/>`;
  s += `<rect x="0" y="${cy-13}" width="20" height="26" rx="5" fill="#3a434b" stroke="#10151a"/>`;
  s += `<g transform="translate(${tipX},${cy}) rotate(${-th})"><rect x="${-pp*0.2}" y="${-pp/2}" width="${pp*0.9+2}" height="${pp}" rx="${pp/2.4}" fill="#4b565f" stroke="#10151a"/><circle cx="${pp*0.62}" cy="0" r="${Math.max(1.6,pp*0.28)}" fill="url(#ledg)"/></g>`;
  s += `<text x="8" y="${cy-20}" font-family="JetBrains Mono" font-size="9.5" fill="var(--text-dim)">Sonde Ø ${state.probe} mm</text>`;
  if(!c.fits) s += `<text x="${x0+8}" y="${bBot+14}" font-family="JetBrains Mono" font-size="10" font-weight="700" fill="var(--red)">Sonde passt nicht in die Bohrung</text>`;

  // Maßlinien
  s += `<line x1="${x0}" y1="198" x2="${tipX}" y2="198" stroke="var(--amber)" stroke-width="1.2"/><line x1="${x0}" y1="193" x2="${x0}" y2="203" stroke="var(--amber)"/><line x1="${tipX}" y1="193" x2="${tipX}" y2="203" stroke="var(--amber)"/>`;
  s += `<text x="${(x0+tipX)/2}" y="213" text-anchor="middle" font-family="JetBrains Mono" font-size="9.5" fill="var(--amber)">Einführtiefe ${state.depth} mm</text>`;
  s += `<text x="${xEnd-26}" y="${cy+4}" text-anchor="end" font-family="JetBrains Mono" font-size="9" fill="rgba(180,200,210,.7)">Ø ${state.bore} mm</text>`;
  s += `<text x="${W-6}" y="213" text-anchor="end" font-family="JetBrains Mono" font-size="8" fill="var(--text-faint)">Längsschnitt · nicht maßstäblich</text>`;
  svgSetup.innerHTML = s;
}

/* ── Prüferansicht: direkt ───────────────────────────────── */
function renderViewDirect(c){
  const W=600,H=200, rnd = rng(11);
  const bgLum = Math.min(1, c.illumFactor*0.7+0.15);
  const base = Math.round((light?205:75)*bgLum+10);
  const alpha = clamp(c.visibility,0,1);
  const loupe = state.mag>=2;
  const relief = c.isTopo ? c.shadowFactor : 0.3;

  let s = `<defs>${defsCommon()}
    <clipPath id="lp"><circle cx="300" cy="100" r="92"/></clipPath>
    <radialGradient id="spot" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#fff" stop-opacity="${(0.18*bgLum).toFixed(3)}"/><stop offset="1" stop-color="#000" stop-opacity=".38"/></radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".18"/></linearGradient>
  </defs>`;
  s += `<rect width="${W}" height="${H}" fill="#050607"/>`;
  s += loupe ? `<g clip-path="url(#lp)">` : `<g>`;
  s += `<rect width="${W}" height="${H}" fill="rgb(${base},${base},${Math.round(base*1.03)})"/>`;
  s += `<rect width="${W}" height="${H}" filter="url(#brush)" opacity="${(0.45+bgLum*0.4).toFixed(2)}"/>`;
  s += `<rect width="${W}" height="${H}" fill="url(#sheen)"/><rect width="${W}" height="${H}" fill="url(#spot)"/>`;
  const noiseOpacity = Math.max(0, 0.5 - c.sizeFactor*0.22);
  for(let i=0;i<40;i++){
    s += `<circle cx="${rnd()*W}" cy="${rnd()*H}" r="${1+rnd()*1.5}" fill="rgba(120,120,120,${(noiseOpacity*0.4).toFixed(3)})"/>`;
  }
  if(!state.clean){
    const r2 = rng(31);
    for(let i=0;i<16;i++){
      s += `<ellipse cx="${r2()*W}" cy="${r2()*H}" rx="${14+r2()*40}" ry="${8+r2()*22}" fill="rgba(62,46,20,${(0.14+r2()*0.16).toFixed(2)})" filter="url(#soft)"/>`;
    }
  }
  if(c.detected){
    const sc = loupe ? Math.min(2.2, 0.8+state.mag*0.2) : 1;
    s += `<g transform="translate(300,100) scale(${sc})">${defectShapes(state.defect, alpha, relief, rnd)}</g>`;
  } else {
    s += `<text x="300" y="104" text-anchor="middle" font-family="Inter" font-size="12" fill="rgba(150,150,150,0.65)">kein Befund erkennbar</text>`;
  }
  if(c.luxOK===false){
    s += `<rect width="${W}" height="${H}" fill="rgba(0,0,0,0.55)"/>`;
    s += `<text x="${W/2}" y="${H/2}" text-anchor="middle" font-family="JetBrains Mono" font-size="12" fill="#ffb3ac">zu dunkel — Mindestbeleuchtung unterschritten</text>`;
  }
  s += `</g>`;
  if(loupe){
    s += `<circle cx="300" cy="100" r="92" fill="none" stroke="#2a2f34" stroke-width="7"/><circle cx="300" cy="100" r="88.5" fill="none" stroke="rgba(255,255,255,.18)"/>`;
  }
  s += osd(8,20,`Streiflicht ${state.angle}° · ${state.lux} lx`,'start');
  s += osd(W-8,20,`${state.mag.toFixed(1).replace('.0','')}× · ${state.dist} cm`,'end');
  svgView.innerHTML = s;
  el('viewInfo').textContent = `simuliertes Blickfeld · ${Math.round(alpha*100)}% Kontrast`;
}

/* ── Kamerabild (Videoendoskop) ──────────────────────────── */
function renderViewCam(c){
  const W=600,H=200,cx=300,cy=100,R=92, rnd = rng(23);
  const resLabel = {640:'480p',1280:'720p',1920:'1080p'}[state.res];
  const alpha = clamp(c.visibility*1.15,0,1);
  let s = `<rect width="${W}" height="${H}" fill="#040506"/>`;

  if(!c.fits){
    s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="#0a0c0e" stroke="#1a1d20" stroke-width="6"/>`;
    s += `<text x="${cx}" y="${cy-4}" text-anchor="middle" font-family="JetBrains Mono" font-size="12" fill="#ff8a82">KEIN BILD</text><text x="${cx}" y="${cy+14}" text-anchor="middle" font-family="JetBrains Mono" font-size="10" fill="#9aa4ab">Sonde passt nicht in die Bohrung</text>`;
    s += osd(8,20,`Ø ${state.bore} mm Bohrung`,'start') + osd(W-8,20,`Sonde Ø ${state.probe} mm`,'end');
    svgView.innerHTML = s; el('viewInfo').textContent = 'kein Videosignal'; return;
  }

  const lumv = Math.pow(Math.min(1,c.raw),0.55);
  const g = Math.round(26+lumv*150);
  const fine = {640:1.4,1280:0.7,1920:0.3}[state.res];
  const blurStd = (fine+c.blur).toFixed(2);
  const th = rad(state.view);
  const tun = Math.pow(Math.max(0,Math.cos(th)),2), flat = 1-tun;

  s = `<defs>${defsCommon()}
    <clipPath id="vc"><circle cx="${cx}" cy="${cy}" r="${R}"/></clipPath>
    <filter id="fb" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="${blurStd}"/></filter>
    <radialGradient id="vig" cx="50%" cy="50%" r="50%"><stop offset=".65" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient>
    <radialGradient id="ledspot" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="tdark" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#000" stop-opacity=".97"/><stop offset=".65" stop-color="#000" stop-opacity=".15"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs><rect width="${W}" height="${H}" fill="#040506"/>`;
  s += `<g clip-path="url(#vc)"><g filter="url(#fb)">`;
  s += `<rect x="${cx-R-4}" y="${cy-R-4}" width="${2*R+8}" height="${2*R+8}" fill="rgb(${g},${g+2},${g+6})"/>`;

  if(flat>0.02){
    s += `<g opacity="${flat.toFixed(2)}">`;
    for(let i=-14;i<=14;i++){
      const x = cx+i*9;
      s += `<line x1="${x-70}" y1="${cy+R}" x2="${x+70}" y2="${cy-R}" stroke="rgba(0,0,0,.12)" stroke-width=".8"/><line x1="${x+70}" y1="${cy+R}" x2="${x-70}" y2="${cy-R}" stroke="rgba(0,0,0,.10)" stroke-width=".8"/>`;
    }
    s += `<rect x="${cx-R}" y="${cy-R}" width="${2*R}" height="${2*R}" filter="url(#brush)" opacity=".7"/></g>`;
  }
  if(tun>0.02){
    s += `<g opacity="${tun.toFixed(2)}">`;
    for(let i=0;i<9;i++){
      const rr = R*Math.exp(-i*0.33)*1.15;
      s += `<circle cx="${cx}" cy="${cy}" r="${rr.toFixed(1)}" fill="${i%2?'rgba(255,255,255,.05)':'none'}" stroke="rgba(0,0,0,.42)" stroke-width="${(1+(9-i)*0.15).toFixed(2)}"/>`;
    }
    for(let a=0;a<28;a++){
      const an = a/28*Math.PI*2;
      s += `<line x1="${cx+Math.cos(an)*R*0.08}" y1="${cy+Math.sin(an)*R*0.08}" x2="${cx+Math.cos(an)*R*1.2}" y2="${cy+Math.sin(an)*R*1.2}" stroke="rgba(0,0,0,.14)" stroke-width="1"/>`;
    }
    s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="url(#tdark)"/></g>`;
  }
  s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="url(#ledspot)" opacity="${Math.min(1,c.raw).toFixed(2)}"/>`;

  if(!state.clean){
    const r2 = rng(41);
    for(let i=0;i<14;i++){
      s += `<ellipse cx="${cx-R+r2()*2*R}" cy="${cy-R+r2()*2*R}" rx="${8+r2()*26}" ry="${5+r2()*16}" fill="rgba(48,34,12,${(0.25+r2()*0.25).toFixed(2)})" filter="url(#soft)"/>`;
    }
  }
  // Defekt im Bild
  if(c.inFOV && c.detected){
    const yoff = clamp(-(Math.tan(rad(c.delta))/Math.tan(rad(state.fov/2)))*R, -R*0.8, R*0.8);
    const sc = 0.5*(0.5+0.5*Math.min(1,c.sizeFactor)) ;
    const fs = Math.max(0.4, c.sinPhi);
    s += `<g transform="translate(${cx},${(cy+yoff).toFixed(1)}) scale(${sc.toFixed(2)},${(sc*fs).toFixed(2)})">${defectShapes(state.defect, alpha, c.isTopo?Math.min(1,c.contrast*1.3):0.4, rnd)}</g>`;
  }
  s += `</g>`;
  // Sensorrauschen + Überstrahlung + Vignette (nicht unscharf)
  const noiseOp = clamp((0.7-c.raw)*0.8,0,0.5)+0.04;
  s += `<rect x="${cx-R}" y="${cy-R}" width="${2*R}" height="${2*R}" filter="url(#grain)" opacity="${noiseOp.toFixed(2)}"/>`;
  if(c.raw>1.15){
    s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="url(#ledspot)" opacity="${Math.min(1,(c.raw-1.0)*1.4).toFixed(2)}"/><circle cx="${cx}" cy="${cy}" r="${R}" fill="#fff" opacity="${Math.min(0.5,(c.raw-1.15)*0.8).toFixed(2)}"/>`;
  }
  s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="url(#vig)"/>`;
  if(!c.inFOV){
    s += `<text x="${cx}" y="${cy+4}" text-anchor="middle" font-family="JetBrains Mono" font-size="10.5" fill="#cfe3de">Defekt außerhalb Bildfeld</text>`;
  } else if(c.expState==='dark'){
    s += `<text x="${cx}" y="${cy+4}" text-anchor="middle" font-family="JetBrains Mono" font-size="10.5" fill="#ffb3ac">zu dunkel</text>`;
  } else if(!c.detected){
    s += `<text x="${cx}" y="${cy+4}" text-anchor="middle" font-family="JetBrains Mono" font-size="10.5" fill="rgba(210,220,225,.75)">kein Befund erkennbar</text>`;
  }
  s += `</g>`;
  s += `<circle cx="${cx}" cy="${cy}" r="${R+3}" fill="none" stroke="#16191c" stroke-width="7"/><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="rgba(255,255,255,.14)"/>`;
  // Skalen-Ticks
  [[cx,cy-R-6,cx,cy-R+4],[cx,cy+R-4,cx,cy+R+6]].forEach(t=>{ s += `<line x1="${t[0]}" y1="${t[1]}" x2="${t[2]}" y2="${t[3]}" stroke="#5a656d" stroke-width="1.5"/>`; });
  // OSD
  s += `<circle cx="16" cy="16" r="4" fill="#ff4d44"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle><text x="25" y="19.5" font-family="JetBrains Mono" font-size="10" fill="#e9f4f0">REC</text>`;
  s += osd(8,46,`Ø ${state.bore} mm`,'start') + osd(8,66,`z ${state.depth} mm`,'start') + osd(8,86,`θ ${state.view}°`,'start');
  s += osd(W-8,20,`${resLabel} · ${state.res}px`,'end') + osd(W-8,46,`LED ${state.led}%`,'end') + osd(W-8,66,`WD ${c.r.toFixed(0)} mm`,'end');
  svgView.innerHTML = s;
  el('viewInfo').textContent = `Videoendoskop · ${Math.round(alpha*100)}% Kontrast`;
}

/* ── Prüfablauf ──────────────────────────────────────────── */
function buildSteps(c){
  const s = state;
  const detail = c.detected;
  const last = {t:'Befund bewerten & dokumentieren', val: fmtPct(c.visibility),
    d:'Anzeige nach Art, Lage und Größe beschreiben, fotografisch festhalten und mit den Zulässigkeitskriterien vergleichen.',
    st: detail?'ok':'warn', fix: detail?'':'Voraussetzungen der vorigen Schritte erfüllen, bis die Anzeige sicher erkennbar ist.'};
  if(c.mode==='direct'){
    const sweetOK = !c.isTopo || c.shadowFactor>=0.6;
    return [
      {t:'Prüfling vorbereiten', val: s.clean?'sauber':'verschmutzt', d:'Oberfläche reinigen, entfetten, ggf. entzundern – Anzeigen dürfen nicht überdeckt sein.', st:s.clean?'ok':'warn', fix:s.clean?'':'Öl und Schmutz überdecken Anzeigen – erst reinigen.'},
      {t:'Beleuchtung messen', val:`${s.lux} lx`, d:'Luxmeter auf die Prüffläche legen. Richtwert ≥ 500 lx; Blendung und Reflexe vermeiden.', st:c.luxOK?'ok':'warn', fix:c.luxOK?'':'Unter 500 lx ist die Prüfung nicht zulässig – Beleuchtung erhöhen.'},
      {t:'Prüfabstand & Hilfsmittel', val:`${s.dist} cm · ${s.mag.toFixed(1).replace('.0','')}×`, d:'Prüfabstand möglichst ≤ 60 cm; bei kleinen Anzeigen Lupe oder Vergrößerung einsetzen.', st:c.distOK?'ok':'warn', fix:c.distOK?'':'Näher heran oder mit ≥ 3× Vergrößerung prüfen.'},
      {t:'Lichteinfall einstellen', val: c.isTopo?`${s.angle}° (Ziel 8–18°)`:'unkritisch', d:'Bei Rissen, Kratzern und Poren flach anleuchten: der Schattenwurf macht die Kante sichtbar. Flächige Anzeigen wie Korrosion zeigen sich über Farbkontrast.', st:sweetOK?'ok':'warn', fix:sweetOK?'':'Winkel zu steil oder zu flach – Richtung 12° nachstellen.'},
      {t:'Auflösung prüfen', val:`${Math.round(c.apparent_um)} / ${Math.round(c.minResolvable_um)} µm`, d:'Scheinbare Defektgröße (Größe × Vergrößerung) muss die Auflösungsgrenze des Auges bei diesem Abstand erreichen.', st:c.resOK?'ok':'warn', fix:c.resOK?'':'Defekt unter Auflösungsgrenze – Abstand verringern oder vergrößern.'},
      last
    ];
  }
  const viewOK = c.inFOV;
  return [
    {t:'Prüfling & Zugang vorbereiten', val: s.clean?'sauber':'verschmutzt', d:'Bohrung entölen und spülen, Grate prüfen. Schmutz und Bohröl verdecken Anzeigen an der Wand.', st:s.clean?'ok':'warn', fix:s.clean?'':'Bohrung zuerst reinigen.'},
    {t:'Sonde passend wählen', val:`Ø ${s.probe} in Ø ${s.bore} mm`, d:'Sondendurchmesser muss kleiner als die Bohrung sein (min. 1 mm Spiel); der Biegeradius der Gelenkspitze darf nicht überschritten werden.', st:c.fits?'ok':'warn', fix:c.fits?'':'Dünnere Sonde wählen.'},
    {t:'Einführen & Blickrichtung wählen', val:`z ${s.depth} mm · ${s.view}°`, d:'Mit 0° (geradeaus) vorschieben, dann an der Prüfstelle auf Seitenblick (≈ 90°) schwenken, damit die Wand senkrecht im Bild liegt.', st:(c.fits&&viewOK)?'ok':'warn', fix:!c.fits?'Erst Sonde anpassen.':(viewOK?'':`Defekt nicht im Bild – Blick auf ≈ ${Math.round(c.phi)}° stellen oder Sonde nachführen.`)},
    {t:'LED & Belichtung einstellen', val:`${Math.round(c.raw*100)} %`, d:'LED-Helligkeit so wählen, dass die Wand gleichmäßig ausgeleuchtet ist. Zu dunkel: Rauschen. Zu hell: Überstrahlung auf Metall.', st:c.expState==='ok'?'ok':'warn', fix:c.expState==='dark'?'LED erhöhen oder näher an die Wand.':(c.expState==='over'?'LED reduzieren oder Abstand vergrößern.':'')},
    {t:'Schärfe & Auflösung prüfen', val:`${c.r.toFixed(0)} mm · ${Math.round(c.minResolvable_um)} µm`, d:'Arbeitsabstand im Schärfebereich (≈ 4–60 mm) halten. Die Auflösungsgrenze ergibt sich aus Pixelzahl, Bildwinkel und Abstand.', st:(c.resOK&&c.blur<0.8)?'ok':'warn', fix:c.blur>=0.8?'Außerhalb des Schärfebereichs – Abstand ändern.':(c.resOK?'':'Defekt unter Auflösungsgrenze – höhere Auflösung oder näher heran.')},
    last
  ];
}
function renderSteps(c){
  const steps = buildSteps(c);
  const firstWarn = steps.findIndex(x=>x.st==='warn');
  const done = steps.filter(x=>x.st==='ok').length;
  el('stepsCount').textContent = `${done} von ${steps.length} erfüllt`;
  el('steps').innerHTML = steps.map((x,i)=>`
    <div class="step ${x.st}${i===firstWarn?' cur':''}">
      <div class="ic">${x.st==='ok'?'✓':(x.st==='warn'?'!':(i+1))}</div>
      <div><h4><span>${i+1}. ${x.t}</span><span class="val">${x.val}</span></h4>
      <p>${x.d}</p>${x.st==='warn'&&x.fix?`<p class="fix">${x.fix}</p>`:''}</div>
    </div>`).join('');
}

/* ── Gesamt-Rendering ────────────────────────────────────── */
function render(){
  const c = compute();
  const cam = c.mode==='cam';

  // Moduswechsel: Bedienelemente und Texte
  el('ctlDirect').classList.toggle('hidden', cam);
  el('ctlCam').classList.toggle('hidden', !cam);
  el('modeToggle').querySelectorAll('button').forEach(b=>b.classList.toggle('sel', b.dataset.m===state.mode));
  el('eyebrow').textContent = cam ? 'Indirekte Sichtprüfung · Boroskop / Videoendoskop' : 'Sichtprüfung · Streiflicht-Verfahren';
  el('subtitle').textContent = cam ? 'VT · Visual Testing – Kamera im Innenraum, Belichtung, Schärfe & Pixelauflösung' : 'VT · Visual Testing – Streiflicht, Beleuchtungsstärke & Auflösungsvermögen';
  el('setupTitle').textContent = cam ? 'Prüfaufbau (Längsschnitt Bohrung)' : 'Prüfaufbau (Querschnitt)';
  el('viewTitle').textContent = cam ? 'Kamerabild der Sonde' : 'Was der Prüfer sieht';
  el('legend').innerHTML = cam
    ? '<span><i style="background:#ffb82e"></i>LED-Licht</span><span><i style="background:var(--cyan)"></i>Bildfeld</span><span><i style="background:var(--red)"></i>Defekt</span>'
    : '<span><i style="background:var(--amber)"></i>Licht</span><span><i style="background:var(--cyan)"></i>Blickrichtung</span><span><i style="background:var(--red)"></i>Defekt</span>';
  el('hint').innerHTML = cam
    ? 'Indirekte Sichtprüfung mit Videoendoskop (DIN EN 13018, vereinfacht): Sonde muss in die Bohrung passen, Wand im Schärfebereich und ausreichend, aber nicht überstrahlt beleuchtet sein.'
    : 'Norm-Richtwerte (vereinfacht): direkte Sichtprüfung ≥ 500 lx, Prüfabstand ≤ 60 cm bzw. Vergrößerung/Hilfsmittel bei kleineren Fehlern, DIN EN 13018.';
  el('stepsTitle').textContent = cam ? 'Prüfablauf · Kamera' : 'Prüfablauf · Direkt';
  el('kLux').textContent = cam ? 'Belichtung' : 'Beleuchtung';

  if(cam){ renderSetupCam(c); renderViewCam(c); } else { renderSetupDirect(c); renderViewDirect(c); }

  // Kennwerte
  el('sVis').textContent = fmtPct(c.visibility);
  const statusCard = el('statusCard'), statusText = el('sStatus'), callout = el('callout'), badgeStatus = el('badgeStatus');

  if(!cam){
    el('sLux').textContent = c.luxOK ? 'i.O.' : 'zu gering';
    el('sLux').parentElement.className = 'stat ' + (c.luxOK?'ok':'warn');
    el('sRes').textContent = c.resOK ? 'ausreichend' : 'unzureichend';
    el('sRes').parentElement.className = 'stat ' + (c.resOK?'ok':'warn');
    el('sMech').textContent = c.isTopo ? 'Schattenwurf (Streiflicht)' : 'Farb-/Flächenkontrast';
    el('kA').textContent = 'Auflösungsgrenze'; el('sA').textContent = Math.round(c.minResolvable_um)+' µm';
    el('kB').textContent = 'Scheinbare Größe'; el('sB').textContent = Math.round(c.apparent_um)+' µm';
  } else {
    const lbl = {ok:'i.O.', dark:'zu dunkel', over:'überbelichtet'}[c.expState];
    el('sLux').textContent = lbl;
    el('sLux').parentElement.className = 'stat ' + (c.expState==='ok'?'ok':'warn');
    const resTxt = c.blur>=0.8 ? 'unscharf' : (c.resOK ? 'ausreichend' : 'unzureichend');
    el('sRes').textContent = resTxt;
    el('sRes').parentElement.className = 'stat ' + ((c.resOK&&c.blur<0.8)?'ok':'warn');
    el('sMech').textContent = c.isTopo ? 'Koaxial-LED · Kanten-/Schattenkontrast' : 'Farb-/Flächenkontrast';
    el('kA').textContent = 'Arbeitsabstand'; el('sA').textContent = c.r.toFixed(0)+' mm';
    el('kB').textContent = 'Auflösungsgrenze'; el('sB').textContent = Math.round(c.minResolvable_um)+' µm';
  }

  if(!cam){
    if(!c.luxOK){
      statusCard.className='stat full warn'; statusText.textContent='Prüfung ungültig';
      callout.className='callout bad';
      callout.innerHTML = `<b>Mindestbeleuchtungsstärke unterschritten.</b> Bei ${state.lux} lx ist eine direkte Sichtprüfung nach Norm nicht zulässig (Richtwert ≥ 500 lx). Ergebnis nicht verwertbar, unabhängig vom simulierten Befund.`;
      badgeStatus.textContent = '✕ Beleuchtung unzureichend'; badgeStatus.className = 'badge';
    } else if(c.detected){
      statusCard.className='stat full ok'; statusText.textContent='Fehler erkennbar';
      callout.className='callout good';
      callout.innerHTML = `<b>Anzeige unter diesen Bedingungen sichtbar.</b> ${c.isTopo? 'Der Streiflichtwinkel von '+state.angle+'° erzeugt einen Schattenwurf am Defekt.' : 'Der Flächenkontrast ist bei dieser Beleuchtung ausreichend.'} Auflösung: scheinbare Größe ${Math.round(c.apparent_um)} µm vs. Mindestauflösung ${Math.round(c.minResolvable_um)} µm bei ${state.dist} cm Abstand.`;
      badgeStatus.textContent = '✓ Fehler erkennbar'; badgeStatus.className = 'badge active-badge';
    } else {
      statusCard.className='stat full warn'; statusText.textContent='Fehler NICHT erkennbar';
      callout.className='callout bad';
      const reason = [];
      if(c.isTopo && (state.angle<4 || state.angle>35)) reason.push('Lichteinfallswinkel liegt außerhalb des Streiflicht-Sweetspots (~8–18°)');
      if(!c.resOK) reason.push('Defekt liegt unter dem Auflösungsvermögen (Abstand/Vergrößerung anpassen)');
      if(!state.clean) reason.push('Verschmutzung überdeckt die Anzeige');
      if(reason.length===0) reason.push('Kontrast insgesamt zu gering');
      callout.innerHTML = `<b>Unter diesen Bedingungen nicht erkennbar.</b> ${reason.join('; ')}.`;
      badgeStatus.textContent = '✕ nicht erkennbar'; badgeStatus.className = 'badge';
    }
  } else {
    if(!c.fits){
      statusCard.className='stat full warn'; statusText.textContent='Sonde passt nicht';
      callout.className='callout bad';
      callout.innerHTML = `<b>Sonde passt nicht in die Bohrung.</b> Sonde Ø ${state.probe} mm in Bohrung Ø ${state.bore} mm: es braucht mindestens 1 mm Spiel. Dünnere Sonde wählen.`;
      badgeStatus.textContent = '✕ Sonde zu dick'; badgeStatus.className = 'badge';
    } else if(!c.inFOV){
      statusCard.className='stat full warn'; statusText.textContent='Defekt nicht im Bild';
      callout.className='callout bad';
      callout.innerHTML = `<b>Defekt liegt außerhalb des Bildfelds.</b> Von der aktuellen Sondenposition liegt er bei ≈ ${Math.round(c.phi)}° zur Bohrungsachse, die Kamera blickt aber auf ${state.view}° (Bildfeld ±${state.fov/2}°). Blickrichtung auf ≈ ${Math.round(c.phi)}° schwenken oder die Sonde nachführen.`;
      badgeStatus.textContent = '✕ außerhalb Bildfeld'; badgeStatus.className = 'badge';
    } else if(c.expState!=='ok'){
      statusCard.className='stat full warn'; statusText.textContent = c.expState==='dark'?'Zu dunkel':'Überbelichtet';
      callout.className='callout bad';
      callout.innerHTML = c.expState==='dark'
        ? `<b>Bild zu dunkel.</b> Die LED-Leistung reicht bei ${c.r.toFixed(0)} mm Arbeitsabstand nicht aus (Belichtung ${Math.round(c.raw*100)} %). LED erhöhen oder näher an die Wand fahren.`
        : `<b>Bild überbelichtet.</b> Die LED überstrahlt die Metalloberfläche (Belichtung ${Math.round(c.raw*100)} %). LED reduzieren oder Abstand vergrößern.`;
      badgeStatus.textContent = c.expState==='dark'?'✕ zu dunkel':'✕ überbelichtet'; badgeStatus.className = 'badge';
    } else if(c.detected){
      statusCard.className='stat full ok'; statusText.textContent='Fehler erkennbar';
      callout.className='callout good';
      callout.innerHTML = `<b>Anzeige im Kamerabild sichtbar.</b> Arbeitsabstand ${c.r.toFixed(0)} mm, ≈ ${c.pitch_um.toFixed(0)} µm pro Pixel, Auflösungsgrenze ${Math.round(c.minResolvable_um)} µm gegenüber ${state.size} µm Defekt. ${c.isTopo?'Die schräge Sicht (≈ '+Math.round(c.phi)+'°) betont die Kante, verkürzt aber die Ansicht.':'Der Flächenkontrast reicht bei dieser Belichtung aus.'}`;
      badgeStatus.textContent = '✓ Fehler erkennbar'; badgeStatus.className = 'badge active-badge';
    } else {
      statusCard.className='stat full warn'; statusText.textContent='Fehler NICHT erkennbar';
      callout.className='callout bad';
      const reason = [];
      if(!c.resOK) reason.push(`Defekt unter Auflösungsgrenze (${Math.round(c.minResolvable_um)} µm) – höhere Kameraauflösung wählen oder näher an die Wand`);
      if(c.blur>=0.8) reason.push(c.r<4?'Arbeitsabstand zu klein, Bild unscharf':'Arbeitsabstand zu groß, Bild unscharf');
      if(!state.clean) reason.push('Verschmutzung überdeckt die Anzeige');
      if(c.sinPhi<0.5) reason.push('flacher Blick auf die Wand verkürzt die Anzeige – Seitenblick nutzen');
      if(reason.length===0) reason.push('Kontrast insgesamt zu gering');
      callout.innerHTML = `<b>Unter diesen Bedingungen nicht erkennbar.</b> ${reason.join('; ')}.`;
      badgeStatus.textContent = '✕ nicht erkennbar'; badgeStatus.className = 'badge';
    }
  }
  renderSteps(c);
}

document.querySelectorAll('input[type=range]').forEach(fill);
ready = true;
render();
</script>
<script id="fit-js">
window.FIT_CFG={sideGroups:[],maxCols:2};
(function(){
  /* ═══ Kompakt-Dashboard (wie UT) – reines CSS-Pixel-Layout, KEIN Zoom-Eingriff: Browser-Zoom (Strg +/−) wirkt normal ═══ */
  var C=window.FIT_CFG||{};
  var app=document.querySelector('.app'); if(!app) return;
  var container=app.querySelector(':scope > .layout, :scope > .grid'); if(!container) return;
  var SIDEW=C.sideW||280, MINCOL=C.minCol||440, MAXK=C.maxCols||3, MAXS=C.maxSide||3,
      SIDEGROUPS=C.sideGroups===undefined?[0]:C.sideGroups, MANUAL=C.cols||null, TEMPLATE=C.template||null;
  var GAPS=[8,6,5], TIER=0, root=document.documentElement;
  function isItem(c){ return c.classList.contains('panel')||c.classList.contains('stage'); }
  function flat(g){
    var o=[]; [].slice.call(g.children).forEach(function(ch){
      if(ch.tagName==='SCRIPT'||ch.tagName==='STYLE') return;
      if(getComputedStyle(ch).display==='contents'){ o.push.apply(o,flat(ch)); return; }
      var kids=[].slice.call(ch.children);
      if(ch.classList.contains('stagegrid') && kids.length>1 && kids.every(function(k){return k.classList.contains('stage');})){
        var cls=['riss-only','gef-only'].filter(function(q){return ch.classList.contains(q);}), sc=ch.dataset.scn;
        kids.forEach(function(k){ cls.forEach(function(q){k.classList.add(q);}); if(sc) k.dataset.scn=sc; o.push(k); });
      } else o.push(ch);
    }); return o;
  }
  var groups=[].slice.call(container.children).filter(function(c){return c.tagName!=='SCRIPT'&&c.tagName!=='STYLE';})
    .map(function(c){ return isItem(c)?[c]:flat(c); });
  var all=[]; groups.forEach(function(g,gi){ g.forEach(function(el){ all.push({el:el,g:gi,parent:el.parentElement,next:el.nextSibling}); }); });
  var grid=null, cols=[], stash=null, curN=0, curSig='', busy=false;
  function active(){ return window.innerWidth>=1000 && window.innerHeight>=520; }
  function GAP(){ return GAPS[TIER]; }
  function ensure(n){
    if(grid&&curN===n) return;
    if(!grid){ grid=document.createElement('div'); grid.className='fitgrid'; stash=document.createElement('div'); stash.style.display='none'; container.after(grid); container.after(stash); }
    grid.textContent=''; cols=[]; curN=n; curSig='';
    for(var i=0;i<n;i++){ var c=document.createElement('div'); c.className='fcol'; cols.push(c); grid.appendChild(c); }
  }
  function partition(hs,K){            /* zusammenhängende Aufteilung mit minimaler Maximalhöhe */
    var n=hs.length, G=GAP(); if(K<=1||n<=1) return [hs.map(function(_,i){return i;})];
    K=Math.min(K,n); var pre=[0]; hs.forEach(function(h,i){pre.push(pre[i]+h+G);});

    (function rec(start,k,cut){
      if(k===1){ var cuts=cut.concat([n]), mx=0, sq=0; for(var j=0;j<cuts.length;j++){ var a=j?cuts[j-1]:0, h=pre[cuts[j]]-pre[a]; mx=Math.max(mx,h); sq+=h*h; }
        var sc=mx+sq*1e-7; if(sc<bestScore){bestScore=sc;best=cuts;} return; }

  }
  function colH(ix,list){ var t=0; ix.forEach(function(i){t+=list[i].h+GAP();}); return t; }
  function setTier(t){ TIER=t; root.classList.remove('d1','d2'); if(t) root.classList.add('d'+t); }

  function layoutOnce(){
    var W=window.innerWidth, effW=W-26, G=GAP();
    root.classList.add('fit'); container.style.display='none';
    var mwrap=document.createElement('div'); mwrap.className='fitgrid'; mwrap.style.cssText='position:absolute;left:-99999px;top:0;display:block;flex:none;visibility:hidden;';
    var meas=document.createElement('div'); meas.className='fcol'; meas.style.cssText='overflow:visible;height:auto;max-height:none;display:flex;flex-direction:column;';
    mwrap.appendChild(meas); app.appendChild(mwrap);
    ensure(1); grid.style.gridTemplateColumns='1fr';
    var availH=Math.max(300,grid.clientHeight-2), plan, S, K, over=0, tpl;
    function measure(list,w){ meas.style.width=w+'px'; list.forEach(function(a){meas.appendChild(a.el);}); list.forEach(function(a){a.h=a.el.getBoundingClientRect().height;}); }
    if(MANUAL){
      K=MANUAL.length; S=0; ensure(K);
      plan=MANUAL.map(function(idxs){ return idxs.map(function(i){return all[i];}).filter(Boolean); });
      var used={}; MANUAL.forEach(function(ix){ix.forEach(function(i){used[i]=1;});});
      all.forEach(function(a,i){ if(!used[i]) plan[K-1].push(a); });
      tpl=TEMPLATE||('repeat('+K+',minmax(0,1fr))');
      plan.forEach(function(c,i){ var w=Math.floor((effW-G*(K-1))/K); measure(c,w); over=Math.max(over,colH(c.map(function(_,j){return j;}),c)-availH); });
    } else {
      var side=all.filter(function(a){return SIDEGROUPS.indexOf(a.g)>=0;}), rest=all.filter(function(a){return SIDEGROUPS.indexOf(a.g)<0;});
      var best=null, sv=[];
      var sideVis=side.length; if(side.length){ measure(side,SIDEW-6); sideVis=side.filter(function(a){return a.h>1;}).length; }
      for(var s=(sideVis?1:0); s<=(sideVis?Math.min(MAXS,sideVis):0); s++){
        if(effW-s*(SIDEW+G)<MINCOL) break;
        var spart=[], oS=-1e9;
        if(s){ measure(side,SIDEW-6); sv=side.filter(function(a){return a.h>1;}); spart=partition(sv.map(function(a){return a.h;}),s);
          oS=Math.max.apply(null,spart.map(function(ix){return colH(ix,sv)-availH;})); }
        var kmax=Math.max(1,Math.min(MAXK,Math.floor((effW-s*(SIDEW+G)+G)/(MINCOL+G))));
        for(var k=1;k<=kmax;k++){
          var mw=Math.floor((effW-s*(SIDEW+G)-G*(k-1))/k)-6;
          measure(rest,mw);
          var vv=rest.filter(function(a){return a.h>1;}); if(k>Math.max(1,vv.length)) break;
          var pp=partition(vv.map(function(a){return a.h;}),k);
          var hR=pp.map(function(ix){return colH(ix,vv);}), mxR=Math.max.apply(null,hR);
          var solvable=(k===1&&s>=1&&vv.length<=2), ov=Math.max(0,oS,solvable?0:mxR-availH), left=solvable?0:Math.max(0,availH-mxR);
          var score=ov>2?(1e6+ov*10):(left*0.5+s*45+k*4+(solvable?25:0));

        }
      }
      S=best.S; K=best.K; over=best.over;
      ensure(S+K);
      plan=best.spart.map(function(ix){return ix.map(function(i){return best.sv[i];});}).concat(best.pp.map(function(ix){return ix.map(function(i){return best.vv[i];});}));
      if(S) side.filter(function(a){return a.h<=1;}).forEach(function(a){plan[0].push(a);});
      while(plan.length<S+K) plan.push([]);
      var sw=[]; for(var q=0;q<S;q++) sw.push(SIDEW+'px');
      tpl=(S?sw.join(' ')+' ':'')+'repeat('+K+',minmax(0,1fr))';
    }
    var sig=plan.map(function(c){return c.map(function(a){return all.indexOf(a);}).join(',');}).join('|')+'@'+curN;
    var inPlan=new Set(); plan.forEach(function(c){c.forEach(function(a){inPlan.add(a);});});
    if(sig!==curSig){ plan.forEach(function(c,i){ cols[i].replaceChildren.apply(cols[i],c.map(function(a){return a.el;})); }); curSig=sig; }
    else plan.forEach(function(c,i){ c.forEach(function(a){ if(a.el.parentElement!==cols[i]) cols[i].appendChild(a.el); }); });
    all.forEach(function(a){ if(!inPlan.has(a)) stash.appendChild(a.el); });
    mwrap.remove();
    grid.style.gridTemplateColumns=tpl;
    window.__fitDbg={S:S,K:K,tier:TIER,over:Math.round(over),availH:availH};
    return {over:over,S:S,K:K,availH:availH};
  }
  function redraw(){ window.__fitSilent=true; window.dispatchEvent(new Event('resize')); window.__fitSilent=false; }
  function colNat(c){ var t=0,n=0; [].forEach.call(c.children,function(ch){ var h=ch.getBoundingClientRect().height; if(h>0){ t+=h; n++; } }); return t+Math.max(0,n-1)*GAP(); }
  function isGraphicCol(c){
    var els=c.querySelectorAll('canvas,svg'); for(var i=0;i<els.length;i++){ var e=els[i]; if(e.closest('button,.icon,.badge,.toggle,summary')) continue; var r=e.getBoundingClientRect(); if(r.width>150&&r.height>60) return true; } return false;
  }
  var TEXTMIN=C.textMin||300;
  function fitWidths(avail){        /* Grafik-Spalten so breit, dass ihre Höhe die Fensterhöhe füllt (Seitenverhältnis bleibt, nichts verzerrt); Rest geht an Text-Spalten */
    var n=cols.length; if(n<1) return 0;
    var G=GAP(), availW=window.innerWidth-26-G*(n-1), g=cols.map(isGraphicCol), nG=g.filter(Boolean).length, nT=n-nG;
    function tpl(w){ return cols.map(function(_,i){ return g[i]?Math.round(w[i])+'px':'minmax('+TEXTMIN+'px,1fr)'; }).join(' '); }
    if(!nG||n===1){ grid.style.gridTemplateColumns=cols.map(function(){return 'minmax(0,1fr)';}).join(' '); redraw(); }
    else {
      var budget=availW-nT*TEXTMIN, w=cols.map(function(_,i){return g[i]?budget/nG:0;}), lo=MINCOL*0.7;
      for(var it=0; it<7; it++){
        grid.style.gridTemplateColumns=tpl(w); redraw();
        var worst=0, nw=w.slice();
        cols.forEach(function(c,i){ if(!g[i]) return; var h=colNat(c); worst=Math.max(worst,Math.abs(h-avail)/avail); nw[i]=Math.max(lo,Math.min(budget,w[i]*Math.pow(avail/Math.max(150,h),0.95))); });
        var sum=0; cols.forEach(function(_,i){ if(g[i]) sum+=nw[i]; });
        if(sum>budget) cols.forEach(function(_,i){ if(g[i]) nw[i]=Math.max(lo,nw[i]*budget/sum); });
        w=nw; if(worst<0.02) break;
      }
      grid.style.gridTemplateColumns=tpl(w); grid.style.justifyContent=nT?'stretch':'center'; redraw();
    }
    var mx=0; cols.forEach(function(c){ mx=Math.max(mx,colNat(c)-avail); });
    var sw=cols.map(function(c){ var hs=[].slice.call(c.querySelectorAll('.panel,.stage')); return hs.length; });
    /* breite Einstellungsspalten: Regler zweispaltig */
    cols.forEach(function(c){ var wide=c.getBoundingClientRect().width>=430&&!isGraphicCol(c); [].forEach.call(c.querySelectorAll('.panel'),function(pn){ var k=[].filter.call(pn.children,function(e){return e.classList.contains('ctl-row')||e.classList.contains('field');}).length; pn.classList.toggle('fit2',wide&&k>=3); }); });
    return mx-5;
  }
  function relayout(){
    if(busy) return; busy=true;

      for(var t=0;t<3;t++){ setTier(t); r=layoutOnce(); redraw(); mx=fitWidths(r.availH-5); if(mx<=0) break; }

  }

    if(!grid) return; container.style.display='';
    all.forEach(function(a){ if(a.next&&a.next.parentNode===a.parent) a.parent.insertBefore(a.el,a.next); else a.parent.appendChild(a.el); });
    grid.remove(); stash.remove(); grid=null; stash=null; cols=[]; curN=0; curSig='';
  }

  window.addEventListener('resize',function(){ if(window.__fitSilent) return; clearTimeout(window.__fitT); window.__fitT=setTimeout(relayout,90); });
  document.addEventListener('click',function(e){ if(e.target.closest('button,.toggle,.seg,.tabs,label,summary')) again(); },true);
  document.addEventListener('change',function(e){ if(e.target.matches('select,input[type=checkbox],input[type=radio]')) again(); },true);
  window.__fitRelayout=again;
  relayout();
  setTimeout(relayout,350);
})();
