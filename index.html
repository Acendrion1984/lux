ize:9, fill:STAGE_COL[i+1]});\n    }\n    const lp = pt(rr[4]*1.04, q[0]); s += txt(lp[0], lp[1]-4, q[2], {anchor:'middle', size:9.5, fill:'var(--text-dim)'});\n  });\n  return s + '<\/g>';\n}\n\n/* Spitzenwert, Phasenlage und Alarm je Fehler im ger\u00e4tekorrigierten Bild */\nfunction corrStats(C, dir){\n  const F = corrFields(C, dir), b0 = gr(probeRaw(-1e4, -1e4, C, dir));      // Nullabgleich: Abhebungsanteil abziehen\n  return S.corr.map(d => {\n    let best = 0, bz = {re:0, im:0};\n    if(d.on){\n      const R = Math.max(d.ra, d.rb)*1.1;\n      for(let ix=-6; ix<=6; ix++) for(let iy=-6; iy<=6; iy++){\n        const z0 = gr(probeRaw(d.x + ix*R/6, d.y + iy*R/6, C, dir)), z = {re:z0.re-b0.re, im:z0.im-b0.im}, m = Math.hypot(z.re, z.im);\n        if(m > best){ best = m; bz = z; }\n      }\n    }\n    const x = {d, amp:best, phi:Math.atan2(bz.im, bz.re)*180/Math.PI, det:d.on && best > S.threshR, st:corrStage(d)};\n    x.cl = x.det ? corrClassify(x, F) : null;\n    return x;\n  });\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 Schwei\u00dfnaht \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nfunction weldProfile(x){ const hw = Math.max(S.weldW/2, 0.5); return 1/(1+Math.pow(Math.abs(x-S.weldX)/hw, 4)); }\nconst WPORES = [[0.0,0.20,1.0],[1.3,0.42,0.8],[-1.1,0.63,1.2],[0.5,0.82,0.7]];       // dx mm, y-Anteil, \u00d8 mm\nfunction weldSignal(sx, sy, C, dir){\n  let re = 0, im = 0;\n  if(S.weldSeam){\n    const p = weldProfile(sx), kmu = 1 + 0.25*Math.log10(Math.max(C.m.mu,1));\n    const Aw = 0.40*sensTube(C)*kmu*p;                                           // Gef\u00fcge-/Leitf\u00e4higkeits\u00e4nderung der Naht\n    re += Aw*Math.cos(dir.angCrack-0.15); im += Aw*Math.sin(dir.angCrack-0.15);\n    const Ac = 0.10*S.weldCap*p*Math.exp(-1.0*S.liftOff/C.a);                    // Naht\u00fcberh\u00f6hung wirkt wie Abhebung\n    re += Ac*Math.cos(dir.angLift); im += Ac*Math.sin(dir.angLift);\n  }\n  if(S.weldPores){\n    WPORES.forEach(q => {\n      const w = Math.max(0.7, 0.35*C.a) + 0.3*q[2], dx = sx-(S.weldX+q[0]), dy = sy-q[1]*S.plateWidth;\n      const g = Math.exp(-(dx*dx+dy*dy)/(2*w*w)), A = 0.32*sensTube(C)*q[2]*q[2]*Math.exp(-1.6*S.liftOff/C.a)*g;\n      re += A*Math.cos(dir.angCrack-0.25); im += A*Math.sin(dir.angCrack-0.25);\n    });\n  }\n  if(S.crackOn){ const c = crackSignal(sx, sy, C, dir); re += c.re; im += c.im; }\n  return {re, im};\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 Schleifbrand (Anlasszone / Neuh\u00e4rtung) \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nfunction burnProfile(sx, sy){\n  const hw = Math.max(S.burnW/2, 0.4);\n  if(S.burnForm === 'ring') return 1/(1+Math.pow(Math.abs(sy-S.burnY)/hw, 4));    // umlaufend: Streifen in Scanrichtung (die Sonde l\u00e4uft wie am Ring um), Lage quer dazu (y)\n  const px = 1/(1+Math.pow(Math.abs(sx-S.burnX)/hw, 4)), dy = sy-S.burnY; return px*Math.exp(-(dy*dy)/(2*hw*hw*1.0));   // Fleck\n}\nfunction burnAmp(C){\n  const t = 0.06+0.26*S.burnSev, zr = t/Math.max(C.delta, 0.01);                   // d\u00fcnne Schicht (Tiefe in mm) gegen Eindringtiefe\n  const kmu = 1 + 0.25*Math.log10(Math.max(C.m.mu,1));\n  return 0.62*sensTube(C)*kmu*(1-Math.exp(-2.2*zr))*(0.35+S.burnSev)*Math.exp(-0.8*S.liftOff/C.a);\n}\nfunction burnSignal(sx, sy, C, dir){\n  if(!S.burnOn) return {re:0, im:0};\n  const A0 = burnAmp(C)*(S.burnType === 'temper' ? 1 : -0.85), ang = dir.angCrack-0.55;   // Anlasszone und Neuh\u00e4rtung drehen entgegengesetzt\n  if(S.burnForm === 'ring'){   // Streifen in Scanrichtung: beim \u00dcberfahren quer dazu (y) laufen Betrag und Phase durch \u2013 Absolutsonde: geschlossene Schleife, Differenzsonde: saubere 8\n    const hw = Math.max(S.burnW/2, 0.4), h = hw*0.25, g = burnProfile(sx, sy), dg = (burnProfile(sx, sy+h)-burnProfile(sx, sy-h))/(2*h)*hw;\n    return {re:A0*(g*Math.cos(ang)+0.8*dg*Math.cos(ang+Math.PI/2)), im:A0*(g*Math.sin(ang)+0.8*dg*Math.sin(ang+Math.PI/2))};\n  }\n  const A = A0*burnProfile(sx, sy);\n  return {re:A*Math.cos(ang), im:A*Math.sin(ang)};\n}\nfunction burnPeak(C, dir){\n  if(!S.burnOn) return 0;\n  if(S.burnForm === 'ring'){ const xm = S.plateLen/2, yr = S.burnY-6*S.burnW-6 >= 0 ? S.burnY-6*S.burnW-6 : Math.min(S.burnY+6*S.burnW+6, S.plateWidth); const z = gr(probeRaw(xm, S.burnY, C, dir)), z0 = gr(probeRaw(xm, yr, C, dir)); return Math.hypot(z.re-z0.re, z.im-z0.im); }\n  const z = gr(probeRaw(S.burnX, S.burnY, C, dir)), z0 = gr(probeRaw(Math.max(S.burnX-6*S.burnW-6,0), S.burnY, C, dir)); return Math.hypot(z.re-z0.re, z.im-z0.im);\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 Scan entlang der Naht \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nconst alongOn = () => S.mode === 'weld' && S.scanAlong;\nfunction alongBand(){\n  const m = 1.6*S.weldW;\n  return [clamp(Math.floor((S.weldX-m)/S.plateLen*NX), 0, NX-1), clamp(Math.ceil((S.weldX+m)/S.plateLen*NX), 0, NX-1)];\n}\nconst balMag = z => Math.hypot(z.re-S.bal.re, z.im-S.bal.im);\nfunction advanceAlong(C, dir){\n  S.scanAcc += S.scanSpeed*0.55;\n  const band = alongBand(); let n = 0;\n  while(S.scanAcc >= 1 && n < 90){\n    S.scanAcc -= 1; n++;\n    S.alIy += S.alDir;\n    if(S.alIy >= NY){ S.alIy = NY-1; S.alDir = -1; S.alIx++; }\n    else if(S.alIy < 0){ S.alIy = 0; S.alDir = 1; S.alIx++; }\n    if(S.alIx > band[1]){ S.scanning = false; S.alIx = band[1]; updateScanBtn(); stopLoop(); break; }\n    const px = (S.alIx+0.5)*S.plateLen/NX, py = (S.alIy+0.5)*S.plateWidth/NY;\n    S.probeX = px; S.probeY = py;\n    const z = sample(px, py, C, dir);\n    grid[S.alIy][S.alIx] = Math.max(grid[S.alIy][S.alIx], balMag(z));\n    scanned[S.alIy][S.alIx] = 1;\n  }\n}\nfunction weldSet(){\n  resetScan();\n  if(S.scanAlong){ S.probeX = S.weldX; S.probeY = 1; }\n  else { S.probeX = 5; S.probeY = S.plateWidth/2; }\n  const C = rissCtx(), dir = directions(C.fr, C.eta, C.m.mu);\n  S.bal = probeRaw(S.probeX, S.probeY, C, dir);      // Nullabgleich auf der Naht (entlang) bzw. am Grundwerkstoff (quer)\n  S.peak = null; S.impLim = null;\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 Rohrpr\u00fcfung: Das Rohr wird einmal durch die Spule gezogen \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\n/* Referenzrohr (Justierrohr): Bohrungen \u00d8 0,8 \u00b7 1,0 \u00b7 1,2 mm */\nconst TREF = [\n  {id:'B0,8',  kind:'bore',   d:0.8, x:14, ang:0,   loc:'thru', name:'Bohrung \u00d8 0,8 mm',            on:true},\n  {id:'B1,0',  kind:'bore',   d:1.0, x:38, ang:120, loc:'thru', name:'Bohrung \u00d8 1,0 mm',            on:true},\n  {id:'B1,2',  kind:'bore',   d:1.2, x:62, ang:240, loc:'thru', name:'Bohrung \u00d8 1,2 mm',            on:true},\n];\nS.tubeObj = 'ref'; S.tubeLot = []; S.tubeReveal = false; S.tubeRef = TREF;\nconst tdefs = () => S.tubeObj === 'ref' ? TREF : S.tubeLot;\nconst thr = () => S.tubeCoil === 'through' || S.tubeCoil === 'seg';        // Au\u00dfenspule: Rohr l\u00e4uft in L\u00e4ngsrichtung hindurch\nconst nSec = () => S.tubeCoil === 'seg' ? S.tubeSec : 1;                   // 1 = Ringspule, sonst Segmentspulen\nconst angDiff = (a, b) => { const d = Math.abs(a-b) % 360; return d > 180 ? 360-d : d; };\nS.tubeSec = 8; S.tubeSeg = new Array(12).fill(0); S.tubeLive = new Array(12).fill(0); S._sec = null;\nconst tRel = b => b.kind === 'bore' ? b.d >= 0.8 : b.p >= 5;\nconst tExp = b => b.kind !== 'notchT';                                       // mit Au\u00dfenspule erwartbar (Querfehler verlaufen parallel zu den Umfangswirbelstr\u00f6men)                // relevanter Fehler: mindestens so gro\u00df wie der kleinste Referenzfehler\nconst tSize = b => b.kind === 'bore' ? '\u00d8 '+deC(b.d,1)+' mm' : deC(b.p,1)+' % Wand';\n/* Pr\u00fcfrohr aus dem Los: nat\u00fcrliche Fehler unbekannter Gr\u00f6\u00dfe */\nfunction tubeNewLot(){\n  /* Pr\u00fcfrohr aus dem Los: Bohrungen derselben Gr\u00f6\u00dfen wie am Referenzrohr (\u00d8 0,8 \u00b7 1,0 \u00b7 1,2 mm) an zuf\u00e4lliger L\u00e4ngs- und Umfangslage */\n  const sizes = [0.8, 1.0, 1.2];\n  const n = 2+Math.floor(Math.random()*3), defs = [], xs = [];\n  for(let i=0; i<n; i++){\n    let x, g = 0; do { x = 14+Math.round(Math.random()*120); } while(xs.some(v => Math.abs(v-x) < 24) && ++g < 80); xs.push(x);\n    const d = sizes[Math.floor(Math.random()*sizes.length)];\n    defs.push({id:'F'+(i+1), kind:'bore', loc:'thru', d, name:'Bohrung \u00d8 '+deC(d,1)+' mm', x, ang:Math.round(Math.random()*35)*10, on:true});\n  }\n  S.tubeLot = defs; S.tubeReveal = false; S.tubeObj = 'lot';\n}\n/* Permeabilit\u00e4tsrauschen ferromagnetischer Rohre: schwankendes \u00b5 erzeugt ein St\u00f6rsignal.\n   Die Vormagnetisierung s\u00e4ttigt das Rohr, \u00b5_eff \u2192 1 und das Rauschen verschwindet. */\nfunction tubeNoiseA(C){\n  const mu0 = C.m0 ? C.m0.mu : C.m.mu;\n  if(mu0 < 1.5) return 0;\n  return 0.42*(C.m.mu-1)/(mu0-1);\n}\nfunction nzTube(x, y){ return (Math.sin(x*0.83+1.1) + 0.7*Math.sin(x*1.9+0.3) + 0.4*Math.sin(x*4.1+2.0))/2.1; }\n/* Die Fehleranzeige h\u00e4ngt von der Leitf\u00e4higkeit ab, nicht von \u00b5: bezogen auf \u00b5 = 1, damit sie bei S\u00e4ttigung nicht schrumpft */\nfunction sensTube(C){ const m1 = Object.assign({}, C.m, {mu:1}); return sensNorm({fr:C.f/limitFreq(C.a, m1.sigma, 1), eta:C.eta, m:m1}); }\n/* Amplitude eines Fehlers (Ringspule): Bohrung \u221d \u00d8\u00b2, Kerbe \u221d Tiefe; L\u00e4ngsfehler unterbrechen die Umfangswirbelstr\u00f6me, Querkerben verlaufen parallel dazu */\nfunction tdefAmp(b, C){\n  const base = 0.21*sensTube(C)*0.9*Math.min(1.5, 16/S.tubeD)*Math.exp(-1.6*S.liftOff/C.a);\n  if(b.kind === 'bore') return base*b.d*b.d;\n  return base*1.3*(b.p/10)*(b.kind === 'notchL' ? 1 : 0.12);\n}\nconst tdefPhase = b => b.kind === 'bore' ? -0.2 : (b.loc === 'ID' ? 0.15 : -0.5);   // Au\u00dfenfehler laufen in der Phase nach\nfunction tubeSignal(sx, sy, C, dir){\n  let re = 0, im = 0; const n = nSec(), sec = S._sec, hasSec = (sec !== null && sec !== undefined);\n  tdefs().forEach(b => {\n    if(!b.on) return;\n    const dx = sx-b.x, p = dir.angCrack+tdefPhase(b), w = Math.max(1.6, 0.8*C.a) + (b.kind === 'bore' ? 0.3*b.d : 2.0);\n    let g = Math.exp(-(dx*dx)/(2*w*w));                                    // Au\u00dfenspule: L\u00e4ngslage z\u00e4hlt\n    if(hasSec){                                                             // Segmentspule: sieht vor allem den Sektor, in dem der Fehler liegt\n      const da = angDiff(b.ang, sec*360/n), sg = 0.5*360/n+8;\n      g *= Math.exp(-(da*da)/(2*sg*sg))*Math.min(2.2, Math.sqrt(n)/1.2);\n    }\n    const A = tdefAmp(b, C)*g; re += A*Math.cos(p); im += A*Math.sin(p);\n  });\n  const An = tubeNoiseA(C);\n  if(An > 0){ const nz = An*nzTube(sx+(hasSec ? sec*3.7 : 0), sy), pn = dir.angCrack+1.3; re += nz*Math.cos(pn); im += nz*Math.sin(pn); }\n  return {re, im};\n}\n/* St\u00f6rpegel abseits der Fehler im ger\u00e4tekorrigierten Bild */\nfunction tubeNoisePeak(C, dir){\n  let m = 0; const ds = tdefs(), keep = ds.map(b => b.on);\n  ds.forEach(b => { b.on = false; });\n  for(let x=4; x<=S.plateLen-4; x+=1){ const z = gr(probeRaw(x, S.plateWidth/2, C, dir)); m = Math.max(m, Math.hypot(z.re, z.im)); }\n  ds.forEach((b,i) => { b.on = keep[i]; });\n  return m;\n}\n/* Spitzenwert, Sektor und Umfangswinkel je Fehler */\nfunction tubeStats(C, dir, list){\n  const n = nSec(), ds = list || tdefs();\n  return ds.map(b => {\n    let best = 0, bk = null;\n    if(b.on){\n      const secs = n > 1 ? Array.from({length:n}, (_,k) => k) : [null];\n      secs.forEach(k => {\n        S._sec = k; let m0 = 0;\n        for(let ix=-8; ix<=8; ix++){ const z = gr(probeRaw(b.x+ix*0.5, S.plateWidth/2, C, dir)), m = Math.hypot(z.re, z.im); if(m > m0) m0 = m; }\n        if(m0 > best){ best = m0; bk = k; }\n      });\n      S._sec = null;\n    }\n    const angEst = (n > 1 && typeof bk === 'number') ? bk*360/n : null;\n    return {b, on:b.on, amp:best, det:b.on && best > S.threshR, sec:bk, angEst, angErr:angEst === null ? null : Math.round(angDiff(angEst, b.ang)), rel:tRel(b)};\n  });\n}\n/* Auto-Einstellung am Referenzrohr: gr\u00f6\u00dfte Anzeige auf 80 % der Skala, Schwelle auf 50 % der kleinsten Anzeige */\nfunction tubeAuto(){\n  const C = rissCtx(), dir = directions(C.fr, C.eta, C.m.mu), keep = S.gain; S.gain = 24;\n  const amps = tubeStats(C, dir, TREF.filter(b => b.on && tExp(b))).map(x => x.amp).filter(a => a > 0); S.gain = keep;\n  if(!amps.length) return; const FS = 1.6, amax = Math.max(...amps), amin = Math.min(...amps);\n  S.gain = Math.round(clamp(24+20*Math.log10(0.8*FS/amax), 0, 60)); const g = Math.pow(10,(S.gain-24)/20);\n  S.threshR = Math.round(clamp(0.5*amin*g, 0.02, 1.5)*100)/100;\n  const gi = $('gain'), ti = $('threshR'); if(gi) gi.value = S.gain; if(ti) ti.value = S.threshR;\n}\n/* Einmaliger Durchlauf: Das Rohr wird mit konstanter Geschwindigkeit durch die Spule gezogen */\nfunction advanceTube(C, dir){\n  S.scanAcc += S.scanSpeed*0.55; let k = 0; const n = nSec();\n  while(S.scanAcc >= 1 && k < 90){\n    S.scanAcc -= 1; k++;\n    S.probeX = Math.min(S.plateLen, S.probeX+0.3); S.probeY = S.plateWidth/2;\n    let kmax = null;\n    if(n > 1){\n      let bm = -1;\n      for(let s=0; s<n; s++){ S._sec = s; const z = gr(probeRaw(S.probeX, S.probeY, C, dir)), m = Math.hypot(z.re, z.im); S.tubeLive[s] = m; if(m > S.tubeSeg[s]) S.tubeSeg[s] = m; if(m > bm){ bm = m; kmax = s; } }\n      S._sec = kmax;\n    }\n    const z = sample(S.probeX, S.probeY, C, dir); S._sec = null;\n    if(n === 1){ const g2 = gr(z), m = Math.hypot(g2.re, g2.im); S.tubeLive[0] = m; if(m > S.tubeSeg[0]) S.tubeSeg[0] = m; }\n    if(S.probeX >= S.plateLen){ S.scanning = false; updateScanBtn(); stopLoop(); break; }\n  }\n}\n/* Anzeige: Rohrquerschnitt mit der Lage der Anzeigen am Umfang (statt C-Bild) */\nfunction drawTubeCross(){\n  const cv = $('cscan'), c2 = cv.getContext('2d'), dpr = Math.max(1, Math.min(2, window.devicePixelRatio||1)), rect = cv.getBoundingClientRect();\n  const W = Math.max(320, Math.round((rect.width||900)*dpr)), H = Math.round(W*0.56);\n  if(cv.width !== W || cv.height !== H){ cv.width = W; cv.height = H; }\n  c2.setTransform(1,0,0,1,0,0); c2.fillStyle = '#0b1218'; c2.fillRect(0,0,W,H);\n  const n = nSec(), cx = W*0.30, cy = H*0.52, R = H*0.38, wall = R*0.20, g = Math.pow(10,(S.gain-24)/20), u = H/400, lot = S.tubeObj === 'lot', hide = lot && !S.tubeReveal;\n  const pos = (a, r) => [cx+r*Math.sin(a*Math.PI/180), cy-r*Math.cos(a*Math.PI/180)];\n  for(let k=0; k<n; k++){\n    const a0 = (k-0.5)*360/n, a1 = (k+0.5)*360/n, peak = S.tubeSeg[k] || 0, c = ampRGB(clamp(peak*g, 0, 1));\n    c2.beginPath(); c2.arc(cx, cy, R, (a0-90)*Math.PI/180, (a1-90)*Math.PI/180); c2.arc(cx, cy, R-wall, (a1-90)*Math.PI/180, (a0-90)*Math.PI/180, true); c2.closePath();\n    c2.fillStyle = peak > 0 ? 'rgb('+c[0]+','+c[1]+','+c[2]+')' : '#1c2733'; c2.fill();\n    const alarm = peak > S.threshR; c2.lineWidth = (alarm ? 3 : 1)*dpr; c2.strokeStyle = alarm ? '#ff6f66' : 'rgba(255,255,255,.28)'; c2.stroke();\n    if(S.tubeLive[k] > S.threshR && S.scanning){ c2.lineWidth = 3*dpr; c2.strokeStyle = '#ffffff'; c2.stroke(); }\n  }\n  c2.beginPath(); c2.arc(cx, cy, R-wall, 0, Math.PI*2); c2.fillStyle = '#05080c'; c2.fill();\n  c2.fillStyle = 'rgba(255,255,255,.75)'; c2.font = (11*u*dpr/1.4)+'px JetBrains Mono, monospace'; c2.textAlign = 'center';\n  [0,90,180,270].forEach(a => { const p = pos(a, R+16*u); c2.fillText(a+'\u00b0', p[0], p[1]+4*u); });\n  if(!hide) tdefs().forEach(b => {\n    if(!b.on) return; c2.strokeStyle = 'rgba(255,255,255,.95)'; c2.lineWidth = 1.8*dpr; c2.setLineDash([3*dpr,3*dpr]);\n    if(b.kind === 'bore'){ const p = pos(b.ang, R-wall/2), r = Math.max(4*u, b.d*5*u); c2.beginPath(); c2.arc(p[0], p[1], r, 0, Math.PI*2); c2.stroke(); }\n    else if(b.kind === 'notchL'){ const r0 = b.loc === 'OD' ? R : R-wall*0.45, r1 = b.loc === 'OD' ? R-wall*0.45 : R-wall, p0 = pos(b.ang, r0), p1 = pos(b.ang, r1); c2.beginPath(); c2.moveTo(p0[0], p0[1]); c2.lineTo(p1[0], p1[1]); c2.stroke(); }\n    else { const rr = b.loc === 'OD' ? R-wall*0.12 : R-wall*0.88; c2.beginPath(); c2.arc(cx, cy, rr, (b.ang-14-90)*Math.PI/180, (b.ang+14-90)*Math.PI/180); c2.stroke(); }\n    c2.setLineDash([]); const q = pos(b.ang, R-wall-14*u); c2.fillStyle = 'rgba(255,255,255,.85)'; c2.fillText(b.id, q[0], q[1]+4*u);\n  });\n  c2.fillStyle = 'rgba(255,255,255,.8)'; c2.font = (12*u*dpr/1.4)+'px JetBrains Mono, monospace';\n  c2.fillText(n > 1 ? n+' Segmentspulen' : 'Ringspule', cx, cy-4*u); c2.font = (10*u*dpr/1.4)+'px JetBrains Mono, monospace'; c2.fillText((lot ? 'Pr\u00fcfrohr (Los)' : 'Referenzrohr')+' \u2205 '+S.tubeD+' mm', cx, cy+12*u);\n  // rechte Seite: Anzeigen\n  const C = rissCtx(), dir = directions(C.fr, C.eta, C.m.mu), st = tubeStats(C, dir), x0 = W*0.58; let y = H*0.10;\n  c2.textAlign = 'left'; c2.fillStyle = '#ffc94d'; c2.font = 'bold '+(13*u*dpr/1.4)+'px JetBrains Mono, monospace'; c2.fillText(lot ? 'Anzeigen am Pr\u00fcfrohr' : 'Anzeigen am Referenzrohr', x0, y); y += 24*u;\n  c2.font = (10.5*u*dpr/1.4)+'px JetBrains Mono, monospace';\n  st.slice().sort((a,b) => a.b.x-b.b.x).forEach(x => {\n    if(!x.on) return; const passed = S.probeX >= x.b.x-2; if(lot && !passed) return;\n    const label = hide ? 'Anzeige bei x = '+x.b.x+' mm' : x.b.id+' \u00b7 '+tSize(x.b)+' bei x = '+x.b.x+' mm';\n    c2.fillStyle = !passed ? '#9fb0bd' : (x.det ? '#5fe072' : '#ff6f66');\n    c2.fillText(label+': '+(!passed ? 'noch nicht erreicht' : (x.det ? 'ALARM' : 'kein Alarm')), x0, y); y += 16*u;\n    if(passed && x.det){ c2.fillStyle = '#d5dde3'; c2.fillText(n > 1 ? '   Sektor '+(x.sec+1)+' \u2192 \u2248 '+Math.round(x.angEst)+'\u00b0'+(hide ? '' : ' (Soll '+x.b.ang+'\u00b0)') : '   Umfangslage unbekannt (nur L\u00e4ngslage)', x0, y); y += 16*u; } else y += 3*u;\n  });\n  y += 6*u; c2.fillStyle = '#9fb0bd'; c2.font = (10*u*dpr/1.4)+'px JetBrains Mono, monospace';\n  (n > 1 ? ['Jede Spule sieht nur ihren Sektor:','die Lage am Umfang ergibt sich','aus dem ansprechenden Sektor.'] : ['Die Ringspule umfasst das ganze','Rohr: Sie zeigt, dass und wo (L\u00e4nge)','ein Fehler liegt, nicht an welcher','Stelle des Umfangs.']).forEach(l => { c2.fillText(l, x0, y); y += 14*u; });\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 Fokuspunkt, Defektvorhandensein \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nfunction hasDefect(){\n  if(S.mode === 'hole') return S.holeOn.some(Boolean);\n  if(S.mode === 'corr') return S.corr.some(d=>d.on);\n  if(S.mode === 'tube') return tdefs().some(b => b.on);\n  if(S.mode === 'weld') return S.weldSeam || S.weldPores || S.crackOn;\n  if(S.mode === 'burn') return S.burnOn;\n  return S.crackOn;\n}\nfunction focus(){\n  if(S.mode === 'hole'){ const c = HOLE_CR[1]; return {x:holeX(c), y:c.y, nx:1, ny:0, span:6}; }\n  if(S.mode === 'corr'){ const d = S.corr[S.corrSel]; return {x:d.x, y:d.y, nx:1, ny:0, span:Math.max(4*S.coilDia/2, Math.max(d.ra,d.rb)*3)}; }\n  if(S.mode === 'tube'){ const b = tdefs().find(q => q.on) || {x:45}; return {x:b.x, y:S.plateWidth/2, nx:1, ny:0, span:12}; }\n  if(S.mode === 'weld') return {x:S.weldX, y:S.plateWidth*0.5, nx:1, ny:0, span:S.weldW*1.4+8};\n  if(S.mode === 'burn') return S.burnForm === 'ring' ? {x:S.plateLen*0.5, y:S.burnY, nx:0, ny:1, span:S.burnW*1.6+8} : {x:S.burnX, y:S.burnY, nx:1, ny:0, span:S.burnW*1.6+8};\n  const rad = S.crackOrient*Math.PI/180;\n  return {x:S.crackX, y:S.crackY, nx:Math.sin(rad), ny:-Math.cos(rad), span:Math.max(4*S.coilDia/2, 3*S.crackLen)};\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 \u00dcberlagerungen im C-Bild \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nfunction drawScnOverlay(c2, sx, sy, dpr){\n  c2.save();\n  c2.strokeStyle = 'rgba(255,255,255,.55)'; c2.fillStyle = 'rgba(255,255,255,.8)';\n  c2.lineWidth = Math.max(1, 1.2*dpr); c2.setLineDash([5*dpr, 4*dpr]);\n  const crackLine = () => {\n    const rad = S.crackOrient*Math.PI/180, dx = Math.cos(rad)*S.crackLen/2, dy = Math.sin(rad)*S.crackLen/2;\n    c2.beginPath(); c2.moveTo((S.crackX-dx)*sx, (S.crackY-dy)*sy); c2.lineTo((S.crackX+dx)*sx, (S.crackY+dy)*sy); c2.stroke();\n  };\n  if(S.mode === 'riss'){ if(S.crackOn) crackLine(); }\n  else if(S.mode === 'corr'){\n    c2.font = (13*dpr)+'px JetBrains Mono, monospace';\n    S.corr.forEach((d,i) => {\n      if(!d.on) return;\n      const st = corrStage(d); c2.strokeStyle = i === S.corrSel ? 'rgba(255,255,255,.95)' : 'rgba(255,255,255,.5)';\n      corrParts(d).forEach(p => { c2.beginPath(); c2.ellipse(p.cx*sx, p.cy*sy, p.ra*sx, p.rb*sy, p.rot*Math.PI/180, 0, Math.PI*2); c2.stroke(); });\n      c2.fillStyle = 'rgba(255,255,255,.9)'; c2.fillText(d.id, (d.x-1.5)*sx, (d.y-Math.max(d.ra,d.rb)-1.2)*sy);\n    });\n  } else if(S.mode === 'burn'){\n    if(S.burnOn){\n      c2.font = (13*dpr)+'px JetBrains Mono, monospace';\n      if(S.burnForm === 'ring'){ [-1,1].forEach(sg => { c2.beginPath(); c2.moveTo(0, (S.burnY+sg*S.burnW/2)*sy); c2.lineTo(S.plateLen*sx, (S.burnY+sg*S.burnW/2)*sy); c2.stroke(); }); c2.fillText('Schleifbrand (umlaufend)', 8*dpr, Math.max((S.burnY-S.burnW/2)*sy-6*dpr, 14*dpr)); }\n      else { c2.beginPath(); c2.ellipse(S.burnX*sx, S.burnY*sy, Math.max(S.burnW/2,0.5)*sx, Math.max(S.burnW/2,0.5)*sx, 0, 0, Math.PI*2); c2.stroke(); c2.fillText('Schleifbrand', (S.burnX+S.burnW/2+1)*sx, S.burnY*sy); }\n    }\n  } else if(S.mode === 'weld'){\n    if(S.weldSeam){\n      [-1,1].forEach(sg => { c2.beginPath(); c2.moveTo((S.weldX+sg*S.weldW/2)*sx, 0); c2.lineTo((S.weldX+sg*S.weldW/2)*sx, S.plateWidth*sy); c2.stroke(); });\n      c2.font = (13*dpr)+'px JetBrains Mono, monospace'; c2.fillText('Naht', (S.weldX-3)*sx, 30*dpr);\n    }\n    if(S.weldPores){ WPORES.forEach(q => { c2.beginPath(); c2.arc((S.weldX+q[0])*sx, q[1]*S.plateWidth*sy, Math.max(3*dpr, q[2]/2*sx), 0, Math.PI*2); c2.stroke(); }); }\n    if(S.crackOn) crackLine();\n  }\n  if(S.mode === 'hole') holeOverlay(c2, sx, sy, dpr);\n  c2.restore();\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 Schnittbild \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nfunction drawSection(C){\n  const el = $('secSvg'); if(!el) return;\n  const W = 620, H = 230, x0 = 30, x1 = 590, pxmm = (x1-x0)/S.plateLen;\n  const gx = mm => x0 + mm*pxmm;\n  let s = '';\n  const coil = (xc, y, wmm) => {\n    const w = Math.max(14, wmm*pxmm);\n    return `<rect x=\"${(xc-w/2).toFixed(1)}\" y=\"${y-22}\" width=\"${w.toFixed(1)}\" height=\"20\" rx=\"4\" fill=\"var(--panel-2)\" stroke=\"var(--amber)\" stroke-width=\"1.6\"/>`\n         + `<line x1=\"${xc.toFixed(1)}\" y1=\"${y-2}\" x2=\"${xc.toFixed(1)}\" y2=\"${y+6}\" stroke=\"var(--amber)\" stroke-width=\"1.6\"/>`\n         + txt(xc, y-28, 'Sonde', {anchor:'middle', size:9.5, fill:'var(--amber)'});\n  };\n  if(S.mode === 'corr'){\n    const k = Math.min(34, 140/(S.t1+S.t2)), y0 = 62, yI = y0+S.t1*k, yB = yI+S.t2*k, d = C.delta;\n    const stops = []; for(let i=0;i<=12;i++){ const z = (S.t1+S.t2)*i/12; stops.push(`<stop offset=\"${(i/12*100).toFixed(0)}%\" stop-color=\"var(--cyan)\" stop-opacity=\"${(0.7*Math.exp(-z/d)).toFixed(3)}\"/>`); }\n    s += `<defs><linearGradient id=\"eddyG\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">${stops.join('')}<\/linearGradient><\/defs>`;\n    s += `<rect x=\"${x0}\" y=\"${y0}\" width=\"${x1-x0}\" height=\"${(S.t1*k).toFixed(1)}\" fill=\"var(--panel-2)\" stroke=\"var(--border)\" stroke-width=\"1.4\"/>`;\n    s += `<rect x=\"${x0}\" y=\"${yI.toFixed(1)}\" width=\"${x1-x0}\" height=\"${(S.t2*k).toFixed(1)}\" fill=\"var(--panel-2)\" stroke=\"var(--border)\" stroke-width=\"1.4\"/>`;\n    s += `<rect x=\"${x0}\" y=\"${y0}\" width=\"${x1-x0}\" height=\"${((S.t1+S.t2)*k).toFixed(1)}\" fill=\"url(#eddyG)\"/>`;\n    s += `<line x1=\"${x0}\" y1=\"${yI.toFixed(1)}\" x2=\"${x1}\" y2=\"${yI.toFixed(1)}\" stroke=\"var(--text-dim)\" stroke-width=\"1.6\"/>`;\n    S.corr.slice().sort((p,q)=>p.x-q.x).forEach(df => {\n      if(!df.on) return;\n      const st = corrStage(df), w = Math.max(df.ra, 1.2)*pxmm, dep = Math.min(df.loss, S.t2)*k, back = df.layer === 'back', yy = back ? yB : yI;\n      s += `<ellipse cx=\"${gx(df.x).toFixed(1)}\" cy=\"${yy.toFixed(1)}\" rx=\"${w.toFixed(1)}\" ry=\"${Math.max(2,dep).toFixed(1)}\" fill=\"${st.col}\" fill-opacity=\".8\" stroke=\"${st.col}\" stroke-width=\"1.4\"/>`;\n      s += txt(gx(df.x), (back ? yB+Math.max(2,dep)+14 : yI+Math.max(2,dep)+14), df.id+' \u2212'+deC(Math.min(df.loss,S.t2),2), {anchor:'middle', size:9.5, fill:st.col});\n    });\n    const yd = y0 + d*k;\n    s += `<line x1=\"${x0}\" y1=\"${Math.min(yd,yB).toFixed(1)}\" x2=\"${x1}\" y2=\"${Math.min(yd,yB).toFixed(1)}\" stroke=\"var(--violet)\" stroke-width=\"1.3\" stroke-dasharray=\"5,4\"/>`;\n    s += txt(x1-4, Math.min(yd,yB)-4, '\u03b4 = '+deC(d,2)+' mm', {anchor:'end', size:10, fill:'var(--violet)'});\n    s += txt(x0+4, y0+14, 'Deckblech t\u2081 = '+deC(S.t1,1)+' mm', {size:10, fill:'var(--text)'});\n    s += txt(x0+4, yI+14, '2. Platte t\u2082 = '+deC(S.t2,1)+' mm', {size:10, fill:'var(--text)'});\n    s += txt(x0+4, yI-3, 'F\u00fcgefl\u00e4che', {size:9.5, fill:'var(--text-dim)'});\n    s += txt(x0+4, yB+14, 'R\u00fcckseite der 2. Platte', {size:9.5, fill:'var(--text-dim)'});\n    s += coil(gx(S.probeX), y0, S.coilDia);\n    s += txt(W/2, H-6, 'F\u00fcgefl\u00e4chen-Korrosion liegt flach, R\u00fcckseitenkorrosion tief: je tiefer, desto schw\u00e4cher und sp\u00e4ter in der Phase', {anchor:'middle', size:9.5, fill:'var(--text-faint)'});\n  } else if(S.mode === 'burn'){\n    const ringF = S.burnForm === 'ring', pxm = ringF ? (x1-x0)/S.plateWidth : pxmm, gq = mm => x0 + mm*pxm;   // umlaufend: Schnitt quer zur Scanrichtung (\u00fcber die Plattenbreite y)\n    const k = 24, y0 = 100, th = 3*k, hw = Math.max(S.burnW/2,0.4)*pxm, dep = (0.06+0.26*S.burnSev)*k*2.2, col = S.burnType === 'temper' ? 'var(--amber)' : 'var(--red)';\n    s += `<rect x=\"${x0}\" y=\"${y0}\" width=\"${x1-x0}\" height=\"${th}\" fill=\"v eturn out/IACS;\n}\nconst cdNow = () => ({iacs:cdTrue(), T:S.cond.T, t:S.cond.t, lift:S.cond.lift, edge:S.cond.edge, R:S.cond.R, Ra:S.cond.Ra, tcorr:S.cond.tcorr});\nconst cdIdeal = () => ({iacs:cdTrue(), T:20, t:99, lift:0, edge:99, R:999, Ra:0.2, tcorr:S.cond.tcorr});\nfunction condEffects(){\n  const now = cdNow(), id = cdIdeal(), base = condRead(id, false), out = [];\n  const one = (key, label, note) => { const o = Object.assign({}, id); o[key] = now[key]; out.push({label, note, d:condRead(o, false)-base}); };\n  out.push({label:'Kalibrierzustand', note:(S.cond.cal.lo&&S.cond.cal.hi) ? 'zwei Normale (kalibriert)' : 'Ger\u00e4t nicht (zweipunkt-)kalibriert', d:base-cdTrue()});\n  one('lift', 'Abhebung / Lackschicht', S.cond.comp ? 'Kompensation an: Abhebung wird herausgerechnet' : 'ohne Kompensation verf\u00e4lscht jede Schicht den Wert');\n  one('T', 'Temperatur', S.cond.tcorr ? 'Temperaturkorrektur an' : '\u03c3 \u00e4ndert sich um 0,4 %/K gegen\u00fcber 20 \u00b0C');\n  one('t', 'Probendicke', 'mindestens 3 \u00d7 \u03b4 (\u03b4 = '+deC(503/Math.sqrt(S.cond.f*cdTrue()*IACS),2)+' mm)');\n  one('edge', 'Randabstand', 'mindestens \u2248 3 \u00d7 Spulendurchmesser');\n  one('R', 'Kr\u00fcmmung', 'ab R < 40 mm Fehler');\n  one('Ra', 'Rauheit', 'Ra '+deC(S.cond.Ra,1)+' \u00b5m');\n  return out;\n}\nconst cdSeriesStats = () => { const v = S.cond.series; if(!v.length) return {n:0}; const m = v.reduce((a,b)=>a+b,0)/v.length, sd = v.length>1 ? Math.sqrt(v.reduce((a,b)=>a+(b-m)**2,0)/(v.length-1)) : 0; return {n:v.length, m, sd, min:Math.min(...v), max:Math.max(...v)}; };\n\nfunction condHTML(){\n  const alloys = Object.keys(CALLOYS).map(k => [k, CALLOYS[k].name]);\n  const side = `\n  <div class=\"panel gef-only\" data-scn=\"cond\">\n    <h2>Pr\u00fcfobjekt (Lagerstahl)<\/h2>\n    <div class=\"hint\" style=\"margin-top:0\">W\u00e4rmebehandlung und Gef\u00fcge bestimmen die Leitf\u00e4higkeit. Sie dient der Zustandskontrolle und dem Erkennen von W\u00e4rmesch\u00e4den.<\/div>\n    <div class=\"field\"><label for=\"cdAlloy\">Werkstoff<\/label><select class=\"sel\" id=\"cdAlloy\">${selOpts(alloys, S.cond.alloy)}<\/select><\/div>\n    <div class=\"field\"><label for=\"cdSoll\">Soll-Zustand (Zeichnung)<\/label><select class=\"sel\" id=\"cdSoll\"><\/select><\/div>\n    <div class=\"field\"><label for=\"cdPart\">Tats\u00e4chlicher Zustand des Pr\u00fcfteils<\/label><select class=\"sel\" id=\"cdPart\"><\/select><\/div>\n    <div class=\"btnrow\"><button class=\"btn\" id=\"btnCdRiddle\">\ud83c\udfb2 R\u00e4tselteil<\/button><button class=\"btn\" id=\"btnCdReveal\" disabled>Aufl\u00f6sen<\/button><\/div>\n    ${rangeRow('cdT','Temperatur',5,60,1,20,'\u00b0C')}\n    ${rangeRow('cdThick','Wanddicke des Rings',0.5,20,0.5,6,'mm')}\n    ${rangeRow('cdLift','Abhebung / Lackschicht',0,200,5,0,'\u00b5m')}\n    ${rangeRow('cdRa','Rauheit Ra',0.2,6,0.2,0.8,'\u00b5m')}\n    ${rangeRow('cdEdge','Randabstand',1,30,1,25,'mm')}\n    ${rangeRow('cdRad','Kr\u00fcmmungsradius',10,200,5,200,'mm')}\n  <\/div>\n  <div class=\"panel gef-only\" data-scn=\"cond\">\n    <h2>Ger\u00e4t &amp; Kalibrierung<\/h2>\n    <div class=\"field\"><label for=\"cdF\">Pr\u00fcffrequenz<\/label><select class=\"sel\" id=\"cdF\">${selOpts([[30000,'30 kHz'],[60000,'60 kHz (Standard)'],[120000,'120 kHz']], 60000)}<\/select><\/div>\n    <div class=\"row2\">\n      <div class=\"field\"><label for=\"cdStdLo\">Normal niedrig<\/label><select class=\"sel\" id=\"cdStdLo\">${selOpts([[1.8,'1,8 MS/m'],[2.0,'2,0 MS/m'],[2.2,'2,2 MS/m']], 2.0)}<\/select><\/div>\n      <div class=\"field\"><label for=\"cdStdHi\">Normal hoch<\/label><select class=\"sel\" id=\"cdStdHi\">${selOpts([[3.0,'3,0 MS/m'],[3.5,'3,5 MS/m'],[4.0,'4,0 MS/m']], 3.5)}<\/select><\/div>\n    <\/div>\n    <div class=\"btnrow\"><button class=\"btn\" id=\"btnCdLo\">Normal niedrig messen<\/button><button class=\"btn\" id=\"btnCdHi\">Normal hoch messen<\/button><button class=\"btn\" id=\"btnCdClr\">Kalibrierung l\u00f6schen<\/button><\/div>\n    ${toggleRow('tglCdComp','Abhebungskompensation (Phasenlage)',true)}\n    ${toggleRow('tglCdTc','Temperaturkorrektur',true)}\n    <div class=\"hint\">Zwei Normale, die den erwarteten Wert einschlie\u00dfen, kalibrieren das Ger\u00e4t. Wird die Kompensation ge\u00e4ndert, ist neu zu kalibrieren.<\/div>\n  <\/div>\n  <div class=\"panel gef-only\" data-scn=\"cond\">\n    <h2>Messung<\/h2>\n    <div class=\"btnrow\"><button class=\"btn primary\" id=\"btnCdMeas\">\u25b6 Messen<\/button><button class=\"btn\" id=\"btnCdSer\">\u25b6\u25b6 Serie (5 \u00d7)<\/button><button class=\"btn\" id=\"btnCdClrS\">\u21ba Messreihe l\u00f6schen<\/button><\/div>\n  <\/div>`;\n  const main = `\n  <div class=\"stage gef-only\" data-scn=\"cond\">\n    <div class=\"stage-head\"><span class=\"stage-title\">Leitf\u00e4higkeitsmessger\u00e4t<\/span><span class=\"stage-sub\" id=\"cdSub\">\u2014<\/span><\/div>\n    <div id=\"cdDisp\" style=\"display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;padding:14px 18px 4px\"><\/div>\n    <svg class=\"view\" id=\"cdBar\" viewBox=\"0 0 900 190\" role=\"img\" aria-label=\"Leitf\u00e4higkeitsbereiche der Zust\u00e4nde\"><\/svg>\n  <\/div>\n  <div class=\"stagegrid wide gef-only\" data-scn=\"cond\">\n    <div class=\"stage\">\n      <div class=\"stage-head\"><span class=\"stage-title\">Impedanzebene \u00b7 Abhebungskompensation<\/span><\/div>\n      <svg class=\"view\" id=\"cdImp\" viewBox=\"0 0 620 400\" role=\"img\" aria-label=\"Impedanzebene Leitf\u00e4higkeitsmessung\"><\/svg>\n      <div class=\"foot\"><span id=\"cdImpInfo\">\u2014<\/span><\/div>\n    <\/div>\n    <div class=\"stage\">\n      <div class=\"stage-head\"><span class=\"stage-title\">Einflussgr\u00f6\u00dfen auf den Messwert<\/span><\/div>\n      <div id=\"cdFactors\" style=\"padding:6px 14px 12px\"><\/div>\n    <\/div>\n  <\/div>\n  <div class=\"stage gef-only\" data-scn=\"cond\">\n    <div class=\"stage-head\"><span class=\"stage-title\">Messreihe &amp; Beurteilung<\/span><\/div>\n    <div id=\"cdTable\" style=\"padding:0 14px\"><\/div>\n    <div class=\"verdict\" id=\"cdVerdict\" style=\"margin-top:10px\">\u2014<\/div>\n  <\/div>`;\n  return {side, main};\n}\nfunction cdFillStates(){\n  const opts = cdStates().map(s => [s.id, s.name]);\n  if(!cdStates().some(s => s.id === S.cond.part)) S.cond.part = cdStates()[0].id;\n  if(!cdStates().some(s => s.id === S.cond.soll)) S.cond.soll = cdStates()[0].id;\n  $('cdSoll').innerHTML = selOpts(opts, S.cond.soll); $('cdPart').innerHTML = selOpts(opts, S.cond.part);\n}\nfunction cdMeasure(n){ for(let i=0;i<n;i++){ S.cond.series.push(condRead(cdNow(), true)); } if(S.cond.series.length > 15) S.cond.series = S.cond.series.slice(-15); }\nfunction cdCal(which){\n  const c = S.cond, std = which === 'lo' ? c.stdLo : c.stdHi, a = 4;\n  const s = condScalar(condZ(std*IACS, 0, c.f, a), c.comp, c.f, a);\n  c.cal[which] = {std, s, comp:c.comp}; c.series = [];\n}\nfunction initCond(){\n  const h = condHTML();\n  $('moreSide').insertAdjacentHTML('beforeend', h.side); $('moreMain').insertAdjacentHTML('beforeend', h.main);\n  cdFillStates();\n  const c = S.cond;\n  $('cdAlloy').addEventListener('change', () => { c.alloy = $('cdAlloy').value; cdFillStates(); c.series = []; c.hiddenTrue = 0; render(); });\n  $('cdSoll').addEventListener('change', () => { c.soll = $('cdSoll').value; render(); });\n  $('cdPart').addEventListener('change', () => { c.part = $('cdPart').value; c.riddle = false; c.revealed = true; c.hiddenTrue = 0; c.series = []; render(); });\n  bindRow('cdT', c, 'T', '\u00b0C', 0, () => { c.series = []; }); bindRow('cdThick', c, 't', 'mm', 1, () => { c.series = []; }); bindRow('cdLift', c, 'lift', '\u00b5m', 0, () => { c.series = []; });\n  bindRow('cdRa', c, 'Ra', '\u00b5m', 1, () => { c.series = []; }); bindRow('cdEdge', c, 'edge', 'mm', 0, () => { c.series = []; }); bindRow('cdRad', c, 'R', 'mm', 0, () => { c.series = []; });\n  $('cdF').addEventListener('change', () => { c.f = parseInt($('cdF').value,10); c.cal = {lo:null, hi:null}; c.series = []; render(); });\n  $('cdStdLo').addEventListener('change', () => { c.stdLo = parseInt($('cdStdLo').value,10); c.cal.lo = null; render(); });\n  $('cdStdHi').addEventListener('change', () => { c.stdHi = parseInt($('cdStdHi').value,10); c.cal.hi = null; render(); });\n  $('btnCdLo').addEventListener('click', () => { cdCal('lo'); render(); }); $('btnCdHi').addEventListener('click', () => { cdCal('hi'); render(); });\n  $('btnCdClr').addEventListener('click', () => { c.cal = {lo:null, hi:null}; c.series = []; render(); });\n  bindTog('tglCdComp', c, 'comp', () => { c.series = []; }); bindTog('tglCdTc', c, 'tcorr', () => { c.series = []; });\n  $('btnCdMeas').addEventListener('click', () => { cdMeasure(1); render(); }); $('btnCdSer').addEventListener('click', () => { cdMeasure(5); render(); });\n  $('btnCdClrS').addEventListener('click', () => { c.series = []; render(); });\n  $('btnCdRiddle').addEventListener('click', () => { const st = cdStates(), p = st[Math.floor(Math.random()*st.length)]; c.part = p.id; $('cdPart').value = p.id; c.hiddenTrue = (Math.random()-0.5)*0.8; c.riddle = true; c.revealed = false; c.series = []; render(); });\n  $('btnCdReveal').addEventListener('click', () => { c.revealed = true; render(); });\n}\nfunction renderCond(){\n  const c = S.cond, st = cdSeriesStats(), me = cdState(c.part), soll = cdState(c.soll), hid = c.riddle && !c.revealed;\n  const calLo = c.cal.lo && c.cal.lo.comp === c.comp, calHi = c.cal.hi && c.cal.hi.comp === c.comp, cal2 = calLo && calHi;\n  const last = c.series.length ? c.series[c.series.length-1] : null;\n  $('cdPart').disabled = hid; $('btnCdReveal').disabled = !(c.riddle && !c.revealed);\n  $('cdSub').textContent = CALLOYS[c.alloy].name+' \u00b7 '+fmtFreq(c.f)+' \u00b7 '+(cal2 ? 'Ger\u00e4t kalibriert' : (calLo||calHi ? 'Einpunkt-Kalibrierung' : 'nicht kalibriert'));\n  $('cdDisp').innerHTML = `<div style=\"font-family:var(--mono);font-size:54px;font-weight:700;color:${last===null?'var(--text-faint)':'var(--cyan)'};letter-spacing:.02em\">${last===null?'\u2013,\u2013\u2013':deC(last,2)}<\/div><div style=\"font-family:var(--mono);font-size:16px;color:var(--text-dim)\">MS/m<br>Leitf\u00e4higkeit<\/div>`\n    + (st.n > 1 ? `<div style=\"font-family:var(--mono);font-size:12px;color:var(--text-dim);margin-left:auto\">Mittel ${deC(st.m,2)} MS/m \u00b7 s ${deC(st.sd,3)} \u00b7 n ${st.n}<\/div>` : '');\n  // Bereichsleiste\n  const x0 = 40, x1 = 860, lo = 1.9, hi = 3.9, X = v => x0+(v-lo)/(hi-lo)*(x1-x0); let s = '';\n  s += `<rect x=\"${x0}\" y=\"70\" width=\"${x1-x0}\" height=\"34\" fill=\"var(--bg-2)\" stroke=\"var(--border)\"/>`;\n  const cols = ['var(--cyan)','var(--violet)','var(--green)','var(--amber)'];\n  cdStates().forEach((q,i) => {\n    const sel = q.id === c.soll;\n    s += `<rect x=\"${X(q.rng[0]).toFixed(1)}\" y=\"${70+(i%2)*5}\" width=\"${(X(q.rng[1])-X(q.rng[0])).toFixed(1)}\" height=\"${30-(i%2)*5}\" fill=\"${cols[i%4]}\" fill-opacity=\"${sel?0.5:0.22}\" stroke=\"${cols[i%4]}\" stroke-width=\"${sel?2.4:1}\"/>`;\n    s += txt((X(q.rng[0])+X(q.rng[1]))/2, 62-(i%2)*14, q.name.split(' \u00b7 ')[0]+(sel?' (Soll)':''), {anchor:'middle', size:10, fill:cols[i%4]});\n  });\n  for(let v=2.0; v<=3.81; v+=0.2) s += `<line x1=\"${X(v)}\" y1=\"104\" x2=\"${X(v)}\" y2=\"110\" stroke=\"var(--text-faint)\"/>` + txt(X(v), 122, deC(v,1), {anchor:'middle', size:9, fill:'var(--text-faint)'});\n  if(!hid && c.revealed){ s += `<line x1=\"${X(cdTrue()).toFixed(1)}\" y1=\"132\" x2=\"${X(cdTrue()).toFixed(1)}\" y2=\"150\" stroke=\"var(--amber)\" stroke-width=\"2\" stroke-dasharray=\"3,3\"/>` + txt(X(cdTrue()), 164, 'Sollwert des Teils (nur zur Kontrolle)', {anchor:'middle', size:9.5, fill:'var(--amber)'}); }\n  c.series.forEach((v,i) => { s += `<circle cx=\"${X(clamp(v,lo,hi)).toFixed(1)}\" cy=\"${(88+((i%3)-1)*6)}\" r=\"4.5\" fill=\"var(--text)\" stroke=\"var(--bg)\" stroke-width=\"1.5\"/>`; });\n  if(st.n) s += `<line x1=\"${X(st.m).toFixed(1)}\" y1=\"62\" x2=\"${X(st.m).toFixed(1)}\" y2=\"110\" stroke=\"var(--cyan)\" stroke-width=\"2.2\"/>`;\n  s += txt(x0, 20, 'Leitf\u00e4higkeitsbereiche der Zust\u00e4nde ('+CALLOYS[c.alloy].name+') in MS/m', {size:10.5, fill:'var(--text-dim)'});\n  svgE('cdBar', s);\n  // Impedanzebene\n  const f = c.f, a = 4, W = 620, H = 400, L = 40, R = 14, T = 16, B = 30;\n  const sigs = []; for(let i=0;i<=40;i++) sigs.push((1.4+i*0.075)*IACS);\n  const pts = sigs.map(g => condZ(g, 0, f, a));\n  const stdP = [c.stdLo, c.stdHi].map(v => condZ(v*IACS, 0, f, a));\n  const tp = condZ(cdTrue()*IACS, c.lift/1000, f, a), t0 = condZ(cdTrue()*IACS, 0, f, a);\n  const all = pts.concat(stdP, [tp, t0]);\n  let ax0 = Math.min(...all.map(p => p.x)), ax1 = Math.max(...all.map(p => p.x)), ay0 = Math.min(...all.map(p => p.y)), ay1 = Math.max(...all.map(p => p.y));\n  const mx = (ax1-ax0)*0.12+1e-9, my = (ay1-ay0)*0.12+1e-9; ax0 -= mx; ax1 += mx; ay0 -= my; ay1 += my;\n  const sc = Math.min((W-L-R)/(ax1-ax0), (H-T-B)/(ay1-ay0)), ox = L+((W-L-R)-(ax1-ax0)*sc)/2, oy = T+((H-T-B)-(ay1-ay0)*sc)/2;\n  const X2 = x => ox+(x-ax0)*sc, Y2 = y => H-B-oy+T-(y-ay0)*sc;\n  s = `<rect x=\"${L}\" y=\"${T}\" width=\"${W-L-R}\" height=\"${H-T-B}\" fill=\"var(--bg-2)\" stroke=\"var(--border)\"/>`;\n  s += `<polyline fill=\"none\" stroke=\"var(--cyan)\" stroke-width=\"2.2\" points=\"${pts.map(p => X2(p.x).toFixed(1)+','+Y2(p.y).toFixed(1)).join(' ')}\"/>`;\n  [2,2.5,3,3.5].forEach(v => { const p = condZ(v*IACS, 0, f, a); s += `<circle cx=\"${X2(p.x).toFixed(1)}\" cy=\"${Y2(p.y).toFixed(1)}\" r=\"2.6\" fill=\"var(--cyan)\"/>` + txt(X2(p.x)+5, Y2(p.y)+14, deC(v,1), {size:9, fill:'var(--text-faint)'}); });\n  [[c.stdLo, stdP[0], c.cal.lo], [c.stdHi, stdP[1], c.cal.hi]].forEach(q => { s += `<rect x=\"${(X2(q[1].x)-5).toFixed(1)}\" y=\"${(Y2(q[1].y)-5).toFixed(1)}\" width=\"10\" height=\"10\" fill=\"${q[2]?'var(--green)':'none'}\" stroke=\"var(--green)\" stroke-width=\"1.8\"/>` + txt(X2(q[1].x)-6, Y2(q[1].y)-9, 'Normal '+deC(q[0],1), {anchor:'end', size:9.5, fill:'var(--green)'}); });\n  s += `<line x1=\"${X2(t0.x).toFixed(1)}\" y1=\"${Y2(t0.y).toFixed(1)}\" x2=\"${X2(tp.x).toFixed(1)}\" y2=\"${Y2(tp.y).toFixed(1)}\" stroke=\"var(--amber)\" stroke-width=\"2.2\"/><circle cx=\"${X2(tp.x).toFixed(1)}\" cy=\"${Y2(tp.y).toFixed(1)}\" r=\"5.5\" fill=\"var(--amber)\"/>` + txt(X2(tp.x)+8, Y2(tp.y)-6, 'Messpunkt', {size:10, fill:'var(--amber)'});\n  if(c.lift > 0) s += txt(X2(tp.x)+8, Y2(tp.y)+10, 'Abhebung '+c.lift+' \u00b5m', {size:9.5, fill:'var(--amber)'});\n  s += txt(L+6, T+14, c.comp ? 'Kompensation: Auswertung senkrecht zur Abhebungsrichtung' : 'ohne Kompensation: Abhebung wirkt direkt auf den Messwert', {size:9.5, fill:c.comp?'var(--green)':'var(--red)'});\n  svgE('cdImp', s);\n  $('cdImpInfo').textContent = 'Leitf\u00e4higkeitskurve bei '+fmtFreq(f)+' \u00b7 Spule \u2205 8 mm \u00b7 \u03b4 \u2248 '+deC(503/Math.sqrt(f*cdTrue()*IACS),2)+' mm';\n  // Einflussgr\u00f6\u00dfen\n  const eff = condEffects(), tot = eff.reduce((a,x) => a + x.d, 0);\n  $('cdFactors').innerHTML = '<div class=\"factors\">'+eff.map(x => { const ab = Math.abs(x.d), cls = ab < 0.015 ? 'idle' : (ab < 0.08 ? '' : 'warn'); return `<div class=\"frow ${cls}\"><div class=\"dot\"><\/div><div class=\"nm\">${x.label}<small>${esc(x.note)}<\/small><\/div><div class=\"vv\">${ab<0.005?'\u00b10':(x.d>0?'+':'')+deC(x.d,3)} MS/m<\/div><\/div>`; }).join('')\n    + `<div class=\"frow ${Math.abs(tot)<0.08?'':'warn'}\" style=\"border-top:2px solid var(--border)\"><div class=\"dot\"><\/div><div class=\"nm\"><b>Erwartete Gesamtabweichung<\/b><small>systematisch, ohne Streuung<\/small><\/div><div class=\"vv\">${tot>0?'+':''}${deC(tot,3)} MS/m<\/div><\/div><\/div>`;\n  // Tabelle + Urteil\n  $('cdTable').innerHTML = c.series.length ? '<table class=\"res\"><thead><tr><th>Nr<\/th><th>MS/m<\/th><th>Zuordnung<\/th><\/tr><\/thead><tbody>'+c.series.map((v,i) => { const q = cdStates().find(z => v >= z.rng[0] && v <= z.rng[1]); return `<tr><td>${i+1}<\/td><td>${deC(v,3)}<\/td><td style=\"text-align:left\">${q ? esc(q.name) : '\u2014'}<\/td><\/tr>`; }).join('')+'<\/tbody><\/table>' : '<div class=\"hint\">Noch keine Messung.<\/div>';\n  const vd = $('cdVerdict'); let h, cls = 'verdict';\n  if(!st.n){ h = '<b>Noch keine Messung.<\/b> '+(cal2 ? 'Ger\u00e4t kalibriert \u2013 Messreihe aufnehmen.' : 'Zuerst das Ger\u00e4t mit zwei Normalen kalibrieren, die den erwarteten Wert einschlie\u00dfen.'); }\n  else {\n    const cand = cdStates().filter(q => st.m >= q.rng[0] && st.m <= q.rng[1]), inSoll = st.m >= soll.rng[0] && st.m <= soll.rng[1];\n    h = `<b>Mittelwert ${deC(st.m,3)} MS/m.<\/b> `;\n    h += inSoll ? `Liegt im Bereich des Soll-Zustands \u201e${esc(soll.name)}\u201c (${deC(soll.rng[0],2)}\u2013${deC(soll.rng[1],2)}). ` : `Liegt <b>au\u00dferhalb<\/b> des Soll-Zustands \u201e${esc(soll.name)}\u201c (${deC(soll.rng[0],2)}\u2013${deC(soll.rng[1],2)}). `;\n    h += cand.length ? 'Passend zu: '+cand.map(q => esc(q.name)).join(' / ')+(cand.length > 1 ? ' \u2013 <b>Bereiche \u00fcberlappen, Zustand nicht eindeutig<\/b> (z. B. Anlasszone und angelassener Zustand).' : '.') : 'Passt zu keinem hinterlegten Zustand. ';\n    if(!cal2) h += ' <b>Ger\u00e4t nicht (zweipunkt-)kalibriert \u2013 Ergebnis nicht belastbar.<\/b>';\n    if(!hid && c.revealed && Math.abs(st.m - cdTrue()) > 0.08) h += ` Der Messwert weicht um ${deC(st.m-cdTrue(),3)} MS/m vom wahren Wert ab \u2013 Einflussgr\u00f6\u00dfen pr\u00fcfen.`;\n    cls += inSoll && cal2 ? ' ok' : ' bad';\n  }\n  vd.className = cls; vd.innerHTML = h;\n  $('bProbe').textContent = 'Leitf\u00e4higkeitssonde'; $('bProbe').className = 'badge acc'; $('bMat').textContent = hid ? 'R\u00e4tselteil' : CALLOYS[c.alloy].name.split(' ')[0]+' '+me.name.split(' ')[0];\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 Schichtdickenmessung an W\u00e4lzlagerteilen \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nconst CSUB_IDS = ['100cr6','gl100','mnsi','mo7','q42','mn5','x47','m50','alu','brass','v2a'];\nconst CCOATS = {\n  phos: {name:'Manganphosphat (Phosphatierung)', kind:'iso',  spec:[5,12],   std:[3,5,10,20],   rough:1.8, note:'rau, por\u00f6s, nichtleitend'},\n  brun: {name:'Br\u00fcnierung (Schwarzoxid)',        kind:'iso',  spec:[0.5,2],  std:[0.5,1,2,4],   rough:0.3, note:'sehr d\u00fcnn, nichtleitend'},\n  dlc:  {name:'DLC (a-C:H, PVD)',                kind:'iso',  spec:[2,4],    std:[1,2,3,5],     rough:0.3, note:'hart, nichtleitend bis halbleitend'},\n  lack: {name:'Lack / Konservierungsschicht',    kind:'iso',  spec:[40,100], std:[20,40,60,80,100,120,140,160,180,200,220,240,260,280,300],rough:0.5, note:'dick, nichtleitend'},\n  zn:   {name:'Zink galvanisch',                 kind:'cond', spec:[8,15],   std:[5,10,15,25],  sigma:16.7, rough:0.6, note:'leitend, nichtmagnetisch'},\n  zni:  {name:'Zink-Nickel',                     kind:'cond', spec:[8,15],   std:[5,10,15,25],  sigma:6.0,  rough:0.6, note:'leitend, nichtmagnetisch'},\n  cr:   {name:'Hartchrom',                       kind:'cond', spec:[10,30],  std:[10,20,30,50], sigma:7.7,  rough:0.6, note:'leitend, nichtmagnetisch'},\n  elox: {name:'Eloxal (nur auf Aluminium)',      kind:'iso',  spec:[10,25],  std:[10,15,25,40], rough:0.4, note:'nichtleitend, nur K\u00e4fig/Geh\u00e4use aus Alu'},\n};\nS.coat = {sub:'100cr6', coat:'phos', d:8, coil:2, f:5, subT:3, Ra:1.0, R:200, edge:15, scat:0, stdKind:'foil', std1:3, std2:10,\n          nullOK:false, pts:[], series:[], specLo:null, specHi:null, std3:null};\nconst ctSp = c => { const co = CCOATS[c.coat]; return [c.specLo != null ? c.specLo : co.spec[0], c.specHi != null ? c.specHi : co.spec[1]]; };\nconst ctSub = c => matById(c.sub), ctMag = c => ctSub(c).mu > 1.5;\nconst ctLam = c => 0.28*c.coil*1000;                                       // Sensorreichweite in \u00b5m\nconst ctDc = (c, co) => 503/Math.sqrt(c.f*1e6*co.sigma)*1000;                // Eindringtiefe in der leitenden Schicht (\u00b5m)\nconst ctUinf = c => ctMag(c) ? 0.30 : 0.97;                                // nichtmagnetischer Grund: kaum Kontrast\nfunction ctValid(c){\n  const co = CCOATS[c.coat];\n  if(c.coat === 'elox' && c.sub !== 'alu') return 'Eloxal gibt es nur auf Aluminium (K\u00e4fig, Geh\u00e4use).';\n  if(co.kind === 'cond' && !ctMag(c)) return 'Leitende, nichtmagnetische Schichten lassen sich nur auf magnetischem Grundwerkstoff mit dem Phasenverfahren messen \u2013 hier fehlt der Kontrast.';\n  return null;\n}\n/* Messsignal U (blankes Substrat = 1) f\u00fcr wahre Schichtdicke d (\u00b5m) mit allen St\u00f6reinfl\u00fcssen */\nfunction ctSignal(c, o, kindOverride){\n  const co = CCOATS[c.coat], kind = kindOverride || co.kind;\n  let app = o.d + co.rough*o.Ra + 0.5*clamp(30-o.R, 0, 30)*(c.coil/4) + 30*clamp(1-o.edge/(3*c.coil), 0, 1);       // scheinbare Zusatzdicke\n  const dl = 503/Math.sqrt(c.f*1e6*ctSub(c).sigma*Math.max(ctSub(c).mu,1))*1000;                                      // Eindringtiefe im Grundwerkstoff (\u00b5m)\n  const u0 = (1 + 0.0004*o.scat*(ctMag(c) ? 3 : 0.5))*(1 - 0.6*Math.exp(-o.subT*1000/(0.7*Math.max(dl, 5))));      // Chargenstreuung, d\u00fcnne Wand\n  let u;\n  if(kind === 'iso') u = Math.exp(-app/ctLam(c));\n  else { const dc = ctDc(c, co), ui = ctUinf(c); u = ui+(1-ui)*Math.exp(-app/dc); }\n  return u0*u;\n}\nfunction ctDevD(c, u){                                                       // Ger\u00e4tekurve: Kalibrierpunkte (st\u00fcckweise linear), sonst Werkskurve\n  const pts = [[0,1]].concat(c.pts.map(p => [p.d, p.u])).sort((a,b) => a[0]-b[0]);\n  if(c.pts.length === 0) return Math.max(0, -ctLam(c)*1.12*Math.log(Math.min(u, 1.3)));\n  let i = 0; while(i < pts.length-2 && u < pts[i+1][1]) i++;\n  const a = pts[i], b = pts[i+1], sl = (b[0]-a[0])/(b[1]-a[1]);\n  return Math.max(0, a[0]+(u-a[1])*sl);\n}\nfunction ctRead(c, o, noise){\n  let u = ctSignal(c, o)*(noise ? 1+gz()*0.002 : 1);\n  if(!c.nullOK) u *= 1.003;                                                    // ohne Nullabgleich: Offset\n  return ctDevD(c, u);\n}\nconst ctNow = c => ({d:c.d, Ra:c.Ra, R:c.R, edge:c.edge, subT:c.subT, scat:c.scat});\nconst ctIdeal = c => ({d:c.d, Ra:0.2, R:999, edge:99, subT:99, scat:0});\nfunction ctRes(c){ const co = CCOATS[c.coat]; if(co.kind === 'iso') return 0.002*ctLam(c); return 0.002/((1-ctUinf(c))/ctDc(c, co)); }\nfunction ctEffects(c){\n  const id = ctIdeal(c), now = ctNow(c), base = ctRead(c, id, false), out = [];\n  const one = (k, label, note) => { const o = Object.assign({}, id); o[k] = now[k]; out.push({label, note, d:ctRead(c, o, false)-base}); };\n  const cal = c.pts.length ? 'Normale gemessen' + (c.stdKind === 'foil' && CCOATS[c.coat].kind === 'cond' ? ' \u2013 Folie passt nicht zur leitenden Schicht' : '') : 'keine Normale \u2013 Werkskurve mit Toleranz';\n  out.push({label:'Kalibrierung / Ger\u00e4tekurve', note:cal+(c.nullOK ? '' : ' \u00b7 kein Nullabgleich'), d:base-c.d});\n  one('scat', 'Chargenstreuung des Grundwerkstoffs', '\u00b5 und Gef\u00fcge schwanken: '+deC(c.scat,0)+' % (wirkt wie Dicke)');\n  one('Ra', 'Rauheit', 'Ra '+deC(c.Ra,1)+' \u00b5m t\u00e4uscht zus\u00e4tzliche Schicht vor');\n  one('R', 'Kr\u00fcmmung (Laufbahn, Au\u00dfenring)', 'Radius '+(c.R >= 200 ? 'eben' : c.R+' mm')+' \u00b7 ab R < 30 mm Fehler');\n  one('edge', 'Randabstand', 'mindestens 3 \u00d7 Spulendurchmesser');\n  one('subT', 'Wanddicke des Teils', 'd\u00fcnnwandige H\u00fclsen/Ringe beeinflussen das Signal');\n  return out;\n}\nfunction ctHTML(){\n  const subs = CSUB_IDS.map(id => [id, matById(id).name]), coats = Object.keys(CCOATS).map(k => [k, CCOATS[k].name]);\n  const side = `\n  <div class=\"panel gef-only\" data-scn=\"coat\">\n    <h2>Beschichtetes W\u00e4lzlagerteil<\/h2>\n    <div class=\"hint\" style=\"margin-top:0\">Nichtleitende Schichten (Phosphat, Br\u00fcnierung, DLC, Lack) werden \u00fcber die <b>Abhebung<\/b> der Sonde gemessen. Leitende, nichtmag at\">\n    <div class=\"stage\">\n      <div class=\"stage-head\"><span class=\"stage-title\">Ger\u00e4tekennlinie<\/span><\/div>\n      <svg class=\"view\" id=\"ctCurve\" viewBox=\"0 0 620 360\" role=\"img\" aria-label=\"Signal \u00fcber der Schichtdicke\"><\/svg>\n      <div class=\"foot\"><span id=\"ctCurveInfo\">\u2014<\/span><\/div>\n    <\/div>\n    <div class=\"stage\">\n      <div class=\"stage-head\"><span class=\"stage-title\">Einflussgr\u00f6\u00dfen auf den Messwert<\/span><\/div>\n      <div id=\"ctFactors\" style=\"padding:6px 14px 12px\"><\/div>\n    <\/div>\n  <\/div>\n  <div class=\"stage gef-only\" data-scn=\"coat\">\n    <div class=\"stage-head\"><span class=\"stage-title\">Messreihe &amp; Beurteilung gegen Soll<\/span><\/div>\n    <div id=\"ctTable\" style=\"padding:0 14px\"><\/div>\n    <div class=\"verdict\" id=\"ctVerdict\" style=\"margin-top:10px\">\u2014<\/div>\n  <\/div>`;\n  return {side, main};\n}\nfunction ctSyncCoat(){\n  const c = S.coat, co = CCOATS[c.coat], opts = co.std.map(v => [v, deC(v, v < 10 ? 1 : 0)+' \u00b5m']);\n  c.specLo = c.specHi = null; { const sp = ctSp(c); $('ctSpecLo').value = sp[0]; $('ctSpecHi').value = sp[1]; }\n  c.std3 = null; $('ctStd3').innerHTML = selOpts(opts, co.std[Math.floor(co.std.length/2)]);\n  if(co.std.indexOf(c.std1) < 0) c.std1 = co.std[0]; if(co.std.indexOf(c.std2) < 0) c.std2 = co.std[Math.min(2, co.std.length-1)];\n  $('ctStd1').innerHTML = selOpts(opts, c.std1); $('ctStd2').innerHTML = selOpts(opts, c.std2);\n  const mx = Math.max(ctSp(c)[1]*3, 6), r = $('ctD'); r.max = c.coat === 'lack' ? 300 : Math.min(150, Math.round(mx)); r.step = c.coat === 'lack' ? 5 : 0.5; r.min = c.coat === 'lack' ? 5 : 0.5; if(c.d < +r.min) c.d = +r.min; if(c.d > +r.max) c.d = Math.round(+r.max/2*2)/2; r.value = c.d; $('v_ctD').textContent = deC(c.d,1)+' \u00b5m';\n  c.stdKind = co.kind === 'cond' ? 'same' : 'foil'; $('ctStdKind').value = c.stdKind; c.pts = []; c.nullOK = false; c.series = [];\n}\nfunction ctSpecSync()
