t oder Zähigkeit. Umgekehrt gilt: <b>Die Bestimmung einer technologischen Eigenschaft (z. B. der Härte) beschreibt das vorhandene Gefüge nicht.<\/b> Der Nachweis des eingestellten Gefüges gelingt generell nur über die Beurteilung des Schliffbildes mit Mikrohärteprüfung und chemischer Analyse. So sind etwa ein undefiniertes Gefüge aus Ferrit + Perlit und angelassener Martensit durch eine Oberflächenhärteprüfung in der Regel nicht zu unterscheiden – sie haben denselben Schwankungsbereich.<\/p>\n<p>Diese zerstörende Prüfung im Werkstofflabor ist deshalb stets die <b>Referenzprüfung<\/b> zur Bestätigung der Wirbelstromergebnisse. Zu Beginn einer Prüfkampagne bzw. beim Aufbau einer neuen Prüfung sind viele Referenzprüfungen nötig, um das System zu validieren. Mit wachsender Erfahrung kann ihr Umfang schrittweise sinken, ganz entfallen kann die zerstörende Prüfung jedoch nie.<\/p>\n<p>Ungeeignet ist die Wirbelstrom-Gefügeprüfung dafür, einen Werkstoff mit verschiedenen Gefügeausbildungen von einem anderen Werkstoff mit ähnlicher chemischer Zusammensetzung und ebenfalls verschiedenen Gefügen zu unterscheiden. Daher ist eine <b>chargenreine Prüfung<\/b> nötig. Lässt sich Chargenreinheit nicht gewährleisten, sind Kontrollteile mit abweichenden Eigenschaften hilfreich oder notwendig, um die Trennbarkeit von Gut- und Schlechtteilen sicherzustellen.<\/p>\n<h3>8.2.3 Störeinflüsse<\/h3>\n<p>Die Sicherheit der Trennung wird durch Störeinflüsse beeinträchtigt:<\/p>\n<ul><li>Schwankungen der chemischen Analyse (Schmelzchargenunterschiede), wenn Gefügezustände zu analysieren sind,<\/li><li>unterschiedliche Abmessungen der Prüfteile (Geometrieeffekte),<\/li><li>Chargeneinflüsse (Rohmaterial- bzw. Wärmebehandlungscharge),<\/li><li>Schwankungen der Wärmebehandlung oder Kaltverformung bei Eisenwerkstoffen (Permeabilitätseffekte),<\/li><li>Lageabweichung in der Prüfspule (schlechte Prüfmechanik),<\/li><li>Temperaturunterschiede,<\/li><li>Restmagnetismus,<\/li><li>äußere elektrische oder magnetische Störfelder.<\/li><\/ul>\n<p>Selbst wenn die Schwankungen innerhalb der vorgeschriebenen Toleranzen liegen, beeinflussen sie die Prüfsicherheit und müssen bei den Sortiergrenzen berücksichtigt werden. Die Störparameter sind soweit wie möglich zu eliminieren, da sie sich mit den Messgrößen überlagern und die Trennung weniger empfindlich oder unmöglich machen.<\/p>\n\n<h2>8.3 Prüfungsdurchführung<\/h2>\n<h3>8.3.1 Einstellparameter<\/h3>\n<p>Ferromagnetische Prüfgegenstände lassen sich trennen, wenn ihre <b>Wechselstrompermeabilität<\/b> verschieden ist. Diese hängt jedoch von der <b>Feldstärke<\/b> des Erregerfeldes und von der <b>Frequenz<\/b> ab. Durch geeignete Prüfanordnung bzw. Wahl des Erregerstromes lässt sich meist eine Feldstärke einstellen, bei der die Permeabilitäten der zu unterscheidenden Zustände genügend weit auseinanderliegen (Abb. 8.1).<\/p>\n<div data-fig=\"v8_muh\" data-cap=\"Abb. 8.1: Abhängigkeit der Permeabilität von der Feldstärke (Spulenstrom)\"><\/div>\n<p>Auch die Frequenz wirkt: Bei niedriger Frequenz ändert sich die Permeabilität wenig, bei höherer fällt sie erheblich ab. Man nutzt niedrige Frequenzen, um über große Eindringtiefe einen möglichst hohen Anteil des Materialvolumens zu erfassen.<\/p>\n<div data-fig=\"v8_muf\" data-cap=\"Abb. 8.2: Frequenzabhängigkeit der Permeabilität\"><\/div>\n<div class=\"merke\">Jeder Werkstoff/Gefügezustand besitzt eine eigene Magnetisierungskurve und somit eine eigene Permeabilitätskurve.<\/div>\n<p>Bei den <b>induktiven Verfahren<\/b> werden neben der Permeabilität auch die <b>Form der Hysteresekurve<\/b> bzw. die Ummagnetisierungsverluste ausgewertet. Um Abweichungen zweier Hysteresekurven festzustellen, formt man die im Wechselfeld der Prüfspulen erhaltenen Kurven von Vergleichsprobe und Prüfgegenstand elektrisch so um, dass nur ihre Unterschiede verstärkt und auf einem Bildschirm angezeigt werden.<\/p>\n<div data-fig=\"v8_prinz\" data-cap=\"Abb. 8.3: Messprinzip der elektromagnetischen (induktiven) Prüfung\"><\/div>\n<p>Wählt man die Feldstärke willkürlich, kann die Trennung unmöglich werden – nach Abb. 8.4 z. B. bei etwa 1000 A/m für die Werkstoffe 100Cr6 und C45, deren Kurven sich dort schneiden.<\/p>\n<div data-fig=\"v8_stahl\" data-cap=\"Abb. 8.4: Permeabilitätskurven von Stählen bei unterschiedlichen Feldstärken (schematisch)\"><\/div>\n<div data-sim=\"muH\"><\/div>\n<p>In der Praxis kommen die <b>Einfrequenz-<\/b> und die <b>Mehrfrequenz-Technik<\/b> zum Einsatz; die Gerätehersteller bieten je nach Prüfaufgabe unterschiedliche Techniken an.<\/p>\n<h3>8.3.2 Einfrequenz-Technik<\/h3>\n<p>Hier arbeitet man mit nur einer Frequenz, bei der sich ein optimaler Messwert (Amplitude) ergibt. Er dient als Merkmal für eine <b>eindimensionale<\/b> Sortierung bzw. für Sortiergrenzen. Über unterschiedliche Spulenströme (Erregungsfeldstärke) lässt sich der Arbeitspunkt variieren. Einfache Geräte zeigen die Signalamplitude analog, als Zahlenwert oder als Lampenanzeige (z. B. Rot/Grün) an.<\/p>\n<div data-fig=\"v8_mono\" data-cap=\"Abb. 8.5: Monofrequente Anwendung – eindimensionale Sortierung nach der Amplitude\"><\/div>\n<p>Abb. 8.6 zeigt eine kombinierte Verwechslungsprüfung von <b>Achszapfen<\/b>: Mit einem Zweispulensystem wird in der oberen Spule die Einhärtetiefe der Verzahnung des Radzapfens verglichen, die untere Spule prüft auf gleichmäßiges Material bzw. gleiche Wärmebehandlung. Beide Spulen werden über einen Multiplexer abwechselnd angesteuert.<\/p>\n<div data-fig=\"v8_achs\" data-cap=\"Abb. 8.6: Vollautomatische Prüfung von Achszapfen auf Materialeigenschaften (schematisch)\"><\/div>\n<p>Die Einfrequenzprüfung ist unter Umständen nur dann sinnvoll, wenn lediglich zwischen <b>zwei<\/b> Zuständen eines Prüfstücks unterschieden werden soll.<\/p>\n<h3>8.3.3 Mehrfrequenz-Technik<\/h3>\n<p>Bei der Mehrfrequenz-Technik wird nacheinander mit verschiedenen Frequenzen sortiert, üblicherweise mit <b>geringen Feldstärken<\/b> (Magnetisierungsströmen). Das bringt – im Gegensatz zur Hysteresetechnik – eine wesentlich bessere thermische Stabilität. Zudem lassen sich auch <i>unbekannte<\/i> Zustände finden (Materialmix, Wärmebehandlungsfehler usw.).<\/p>\n<div data-fig=\"v8_drei\" data-cap=\"Abb. 8.7: Trennung in drei Prüfgruppen mit einer seriellen Mehrfrequenzprüfung\"><\/div>\n<p>Zur Wärmebehandlungsprüfung ist die Mehrfrequenzprüfung Stand der Technik. Nacheinander werden mehrere, über einen möglichst großen Bereich verteilte Frequenzen angewendet; im Beispiel des Skripts: 25 Hz – 80 Hz – 250 Hz – 630 Hz – 1,60 kHz – 4,00 kHz – 10,0 kHz – 25,0 kHz. Unterschiedliche Wärmebehandlungsfehler (Gefüge, Härte, Ursache) sind nur durch mehrere Frequenzen erkennbar – selbstverständlich nur bei gleicher chemischer Zusammensetzung der Teile; jeder Fehler zeigt dabei sein eigenes Muster im Gerät.<\/p>\n<p>Ein Paradebeispiel ist die <b>Wärmebehandlungsüberwachung<\/b>: Die Wirbelstromprüfung erfasst die Streuung eines Wärmebehandlungsloses. Bei einzelnen ausgesuchten Frequenzen ermittelt man die <b>Extremteile<\/b> (im Skript vier farbige Teile in einer Toleranzellipse) und analysiert sie zerstörend im Werkstofflabor. Zeigen diese ein i.&thinsp;O.-Gefüge, so gilt das für alle Teile innerhalb der Ellipse – das Los kann freigegeben werden.<\/p>\n<div data-fig=\"v8_los\" data-cap=\"Beispiel eines Toleranzbereichs bei einer ausgesuchten Frequenz mit vier Extremteilen\"><\/div>\n<h3>8.3.4 Prüfanordnung<\/h3>\n<p>Für die Sortierprüfung gibt es zwei Spulenanordnungen: das <b>Fremdvergleichsverfahren<\/b> mit zwei Absolutspulen (Zweispulenverfahren) und das <b>Selbstvergleichsverfahren<\/b> mit einer Absolutspule (Einspulenverfahren).<\/p>\n<p>Oft wird das Selbstvergleichsverfahren mit einem Durchlaufsensor genutzt, etwa für eine <b>Zwei-Wege-Sortierung<\/b> (Gut/Schlecht): Zur Nullpunkteinstellung legt man ein Gutteil (Referenzkörper, Standard, Master) ein, danach ein Schlechtteil (Vergleichskörper). Das Gerät zeigt dessen Abweichung zum Gutteil an. Je nach Ausstattung wird um Gut- und Schlechtteile eine <b>Blende<\/b> gelegt. Die nötige Teilezahl hängt von der Software ab: Je mehr Teile, desto genauer die Blenden (Streubereiche), da sie statistisch berechnet werden.<\/p>\n<p>Beim <b>Fremdvergleich<\/b> (meist Mehrfrequenztechnik) arbeitet man gleichzeitig mit zwei baugleichen Sensoren mit je einem Absolutspulensystem (Abb. 8.8). Zum Systemabgleich legt man in eine Spule ein Kompensationsteil mit gleichen Eigenschaften. Zur (meist automatisierten) Empfindlichkeitseinstellung kommt in die Prüfspule ein Prüfteil und wird mit dem Kompensationsteil in der Kompensationsspule verglichen.<\/p>\n<div data-fig=\"v8_fremd\" data-cap=\"Abb. 8.8: Fremdvergleichsanordnung\"><\/div>\n<div class=\"warn\">Örtlich begrenzte Gefügeunterschiede werden von umfassenden Sensoren (integrale Prüfung) nur selten erkannt.<\/div>\n<div data-fig=\"v8_wege\" data-cap=\"Abb. 8.9: Beispielbilder für die Sortierprüfung – Zwei-Wege- und Drei-Wege-Sortierung (Härterei)\"><\/div>\n<h3>8.3.5 Prüfparameter<\/h3>\n<h4>Justierkörper<\/h4>\n<p>Für eine sichere Gefügeprüfung sind bei der Einfrequenzprüfung <b>Justierkörper<\/b> (Gut- und Schlechtteile) unbedingt erforderlich. Die Mehrfrequenzprüfung arbeitet meist nur mit Produktionsteilen, deren Eigenschaften nach technologischer Prüfung ausgesuchter Grenzteile bekannt sind; anschließend korrigiert man die Toleranzbereiche. Grund: In normalen Produktionsprozessen stehen nur Gutteile zur Verfügung, und künstlich hergestellte „Schlechtteile“ entsprechen nie den tatsächlich auftretenden Wärmebehandlungsfehlern. Auch die Verwechslungspartner sind meist unbekannt.<\/p>\n<h4>Sensoren<\/h4>\n<p>Der Sensordurchmesser wird optimal auf das Prüfteil abgestimmt. Der <b>Füllungsgrad<\/b> spielt bei Geometrieschwankungen eine Rolle bzw. wird so gewählt, dass unterschiedliche Prüfteilgeometrien (z. B. verschiedene Übersetzungen bei Zahnrädern) mit gleicher Spulenanordnung und gleichem Kompensationsteil prüfbar sind. Die Lage des Teils in der Spule muss stets gleich sein – dafür sorgen Führungen aus nichtleitendem Werkstoff.<\/p>\n<h4>Prüffrequenz<\/h4>\n<p>Der geeignetste Frequenzbereich für die Gefügeprüfung liegt bei <b>5 Hz bis 250 kHz<\/b>. Je nach Gerät sind eine Frequenz (Einfrequenzgerät) oder mehrere Frequenzen (Mehrfrequenzgerät) auszuwählen und festzulegen.<\/p>\n<div data-vid=\"sortier\"><\/div>\n<h4>Toleranzgrenzen<\/h4>\n<p>Toleranzfelder hängen ab von der tatsächlichen Streuung der Prüfteileigenschaften, der Anzahl der Justierkörper (Definition von Gut- und Schlechtteilen) und der geforderten Trennschärfe. Einfachere oder ältere Geräte besitzen Leucht- oder Zeigeranzeigen (nicht mehr Stand der Technik); moderne Geräte stellen Toleranzfelder auf dem Bildschirm dar – als Impedanzebene, Balkenanzeige oder OK/NOK-Anzeige.<\/p>\n<p><b>Beispiel Impedanzebene:<\/b> Für jede Prüffrequenz kann ein eigenes (elliptisches) Toleranzfeld erzeugt werden. Zur Ergebnisfindung nutzt man die Felder derjenigen Frequenzen, bei denen die zu unterscheidenden Eigenschaften sichtbar werden (das Gerät kann die Auswahl automatisch treffen). Die Felder lassen sich später optimieren: Nach Abb. 8.10 sind Gut- und Schlechtteile zunächst eindeutig trennbar. Werden durch Laboruntersuchung weitere Gutteile außerhalb der ersten Gruppe festgestellt (Abb. 8.11), muss das Feld angepasst werden. <b>Falsch<\/b> wäre es, das Toleranzfeld zu vergrößern, denn dann würden auch Schlechtteile als Gutteile sortiert (Abb. 8.12). <b>Richtig<\/b> ist, das Feld zu <b>drehen<\/b> (Abb. 8.13). Damit gelingt die eindeutige Trennung oft wieder, aber nicht zwingend – deshalb ist die materialchargenreine Prüfung Stand der Technik.<\/p>\n<div data-fig=\"v8_tol\" data-cap=\"Abb. 8.10–8.13: Anpassung des Toleranzfeldes – (8.10) Ausgangslage, (8.11) zusätzliche Gutteile, (8.12) falsch: vergrößert, (8.13) richtig: gedreht\"><\/div>\n<div class=\"merke\">Bei allen Prüfungen auf Materialeigenschaften muss die Einstellung laufend mit technologischen Prüfungen überprüft werden – „es müssen immer Teile geschnitten werden“. Die Wirbelstromprüfung liefert nur <b>vergleichende<\/b> Messungen gegenüber Referenzteilen (Ja/Nein, gleich/ungleich).<\/div>\n<p>Im europäischen Raum gibt es <b>keine Prüfnormen<\/b> für die Wirbelstromprüfung von Materialeigenschaften; da jedes Problem eigene Lösungen verlangt, gab es bisher keine Einigung auf Standards. Die Vereinbarungen zur Prüftechnik trifft man zwischen Lieferant und Kunde. Auf dem amerikanischen Markt existieren zwei ASTM-Normen zur Sortierung: <b>ASTM E 566<\/b> (ferromagnetische) und <b>ASTM E 703<\/b> (nichtferromagnetische Werkstoffe).<\/p>\n<div data-sim=\"sort\"><\/div>\n", "v9": "<h2>9.1 Begriffe, Definitionen<\/h2>\n<p>In der ZfP wird eine Vielzahl von Vorschriften zitiert, insbesondere für Durchführung und Bewertung von Prüfungen. Dabei sind folgende Begriffe zu unterscheiden: <b>Regelwerk, Norm, Spezifikation, Richtlinie, Verfahrensbeschreibung, Prüfanweisung<\/b>.<\/p>\n<p><b>Regelwerke<\/b> dienen der Herstellung und Prüfung von Anlagen. Sie vereinheitlichen die Auslegung von Komponenten und Bauteilen, meist in gesetzlich verbindlicher Form; vorhandene Normen sind oft eingebunden oder zumindest zitiert. Beispiele: ASME-Code (Dampfkessel und Druckbehälter), KTA-Regeln (kerntechnische Anlagen), AD-Regelwerk (Druckbehälter).<\/p>\n<p><b>Normen<\/b> (Standards) sind verfahrens- oder produktbezogene Vorschriften, die den Stand der Technik eines Fachgebiets widerspiegeln. Sie werden von Normungsorganisationen wie dem Deutschen Institut für Normung (DIN) oder der International Organization for Standardization (ISO) herausgegeben. Die wichtigsten Normen zur Wirbelstromprüfung folgen in 9.2 und 9.3.<\/p>\n<p>Eine <b>Spezifikation<\/b> ist meist ein technisches Dokument zur Absicherung kaufmännischer (Zahlungsversprechen) oder juristischer Belange (Haftung, Gewährleistung). Der Auftraggeber verteilt sie auch bei der Angebotsanfrage, damit der Anbieter kalkulieren kann. Sie beschreibt Produkt, System oder Dienstleistung formal und legt Merkmale fest und quantifiziert sie – damit das Werk bei der Übergabe geprüft und abgenommen werden kann und der Auftragnehmer seine Bezahlung fordern darf, wenn die Merkmale erreicht sind. Beispiel: die <b>SEP-Blätter<\/b> (Stahl-Eisen-Prüfblätter) mit produktbezogenen Vorgaben zu Prüfung und Abnahme.<\/p>\n<p>Eine <b>Richtlinie<\/b> ist eine Empfehlung einer Organisation ohne bindenden Charakter. Wird sie jedoch in einer Spezifikation aufgeführt, sind ihre Inhalte genauso zu beachten wie eine Norm.<\/p>\n<p><b>Verfahrensbeschreibung<\/b> und <b>Prüfanweisung<\/b> werden aus technischen Vorschriften abgeleitet, um die Arbeitsprozesse im Betrieb zu erleichtern und transparent zu machen (siehe V10).<\/p>\n<div data-sim=\"normen\"><\/div>\n\n<h2>9.2 Verfahrensbezogene Normen<\/h2>\n<p>Sie beschreiben die normgerechte Anwendung des Prüfverfahrens und legen Mindestanforderungen fest. Für die Wirbelstromprüfung gibt es drei Gruppen:<\/p>\n<ul><li>Terminologie/Begriffe: <b>DIN EN ISO 12718<\/b><\/li><li>Allgemeine Grundlagen: <b>DIN EN ISO 15549<\/b><\/li><li>Technische Ausrüstung: <b>DIN EN ISO 15548-1 bis 3<\/b><\/li><\/ul>\n<h3>9.2.1 Terminologie/Begriffe<\/h3>\n<p>Die DIN EN ISO 12718 definiert und erklärt kurz <b>211 Begriffe<\/b> zur Wirbelstromprüfung in sechs Gruppen, dreisprachig (deutsch, englisch, französisch). Abb. 9.1 nennt je Gruppe typische Beispiele.<\/p>\n<div class=\"tw\"><table class=\"t\"><tr><th>Gruppe<\/th><th>Thema<\/th><th>Beispiele<\/th><\/tr>\n<tr><td>2<\/td><td>Allgemeine Begriffe mit spezieller Bedeutung für die Wirbelstromprüfung<\/td><td>Abgleich, Kompensationssignal, Grenzfrequenz, normierte Impedanzortskurve, Ähnlichkeitsgesetz, Standard-Eindringtiefe<\/td><\/tr>\n<tr><td>3<\/td><td>Messung mit dem Wirbelstromverfahren<\/td><td>Absolutmessung, Fremdvergleich, Doppeldifferenzmessung<\/td><\/tr>\n<tr><td>4<\/td><td>Sensoren<\/td><td>Luftspulensensor, Durchlaufsensor, Wicklungsfüllungsgrad, Fremdvergleichssensor<\/td><\/tr>\n<tr><td>5<\/td><td>Ausrüstung<\/td><td>Y/Y-Darstellung, Mehrkanalgerät, Filter, Prüfkanal, Rotierkopf, Fenster<\/td><\/tr>\n<tr><td>6<\/td><td>Anwendung auf Prüfgegenstände<\/td><td>Wechselwirkungsfläche, dynamische Prüfung, Kanteneffekt, Endeneffekt, Wirkbreite, Abhebeeffekt, Mehrparametertechnik, Sensorabstand, Fernfeldtechnik<\/td><\/tr>\n<tr><td>7<\/td><td>Auswertung von Messungen<\/td><td>Amplitudenauswertung, Komponentenauswertung, Phasenauswertung<\/td><\/tr><\/table><\/div>\n<div class=\"tcap\"><b>Abb. 9.1:<\/b> Typische Begriffe aus DIN EN ISO 12718 (Auszug)<\/div>\n<h3>9.2.2 Allgemeine Grundlagen der Prüftechnik<\/h3>\n<p>Die DIN EN ISO 15549 soll eine definierte und wiederholbare Durchführung der zerstörungsfreien Prüfung von Produkten und Werkstoffen mit dem Wirbelstromverfahren sicherstellen. Aufbau:<\/p>\n<ul><li>Abschnitt 4: signalbeeinflussende Größen; Abschnitt 6: Hinweise zu Prüfgut und Prüfaufgaben,<\/li><li>Abschnitt 7: mögliche Prüftechniken; Abschnitt 8: technische Ausrüstung; Abschnitt 9: deren Vorbereitung,<\/li><li>Abschnitt 10: Funktionskontrolle der Ausrüstung und vorsorgende Geräteüberprüfung (konform mit Tabelle 1 der DIN EN ISO 15548-1 bis 3),<\/li><li>Abschnitt 13.1: Dokumentation besteht aus <b>Prüfanweisung<\/b> und <b>Prüfbericht<\/b>; 13.2 und 13.3 listen deren Inhalte auf.<\/li><\/ul>\n<p>Konkrete Angaben zur Durchführung einer Prüfung macht die Norm nicht – bei der Fülle der Anwendungen ist das nicht möglich. Die meisten Abschnitte sind eher eine <b>Checkliste<\/b>, damit bei Prüfanweisung und Prüfbericht nichts Wichtiges vergessen wird. Substanzielle Angaben, vor allem zu den Prüfparametern, stehen in den objektspezifischen (produktbezogenen) Normen.<\/p>\n<h3>9.2.3 Prüfeinrichtung / Kenngrößen zur Ermittlung<\/h3>\n<p>Die drei Teile der DIN EN ISO 15548 betreffen jeweils einen Bereich der Prüfeinrichtung:<\/p>\n<ul><li>Teil 1: Kenngrößen von <b>Prüfgeräten<\/b> und deren Verifizierung,<\/li><li>Teil 2: Kenngrößen von <b>Sensoren<\/b> und deren Verifizierung,<\/li><li>Teil 3: Kenngrößen des <b>Systems<\/b> und deren Verifizierung.<\/li><\/ul>\n<p>Alle drei Teile definieren den Umfang der Verifizierung in einem <b>dreistufigen System<\/b>:<\/p>\n<div class=\"tw\"><table class=\"t\"><tr><th>Stufe<\/th><th>Wann / durch wen<\/th><th>Zweck<\/th><\/tr>\n<tr><td><b>1<\/b><\/td><td>häufig (z. B. stündlich oder täglich), allgemeine Funktionsprüfung durch den Anwender<\/td><td>Konstanz der Systemleistungsfähigkeit sicherstellen; mit Bezugskörpern<\/td><\/tr>\n<tr><td><b>2<\/b><\/td><td>mindestens einmal jährlich, ausführliche Funktionsprüfung und Kalibrierung durch den Anwender<\/td><td>Konstanz ausgewählter Kennwerte von Prüfgeräten, Sensoren und Zubehör bestätigen (kalibrierte Messgeräte und Bezugskörper)<\/td><\/tr>\n<tr><td><b>3<\/b><\/td><td>Hersteller bzw. Anwender<\/td><td>Bestimmung <i>sämtlicher<\/i> Kennwerte von Prüfgerät, Sensoren und Zubehör mit kalibrierten Messgeräten und Bezugskörpern<\/td><\/tr><\/table><\/div>\n<h4>Durchführung der funktionalen Verifizierung<\/h4>\n<p>Sie darf nicht auf einzelne Systemelemente beschränkt werden, sondern ist am <b>System als Ganzem<\/b> durchzuführen. Sie ist für jede Anwendung spezifisch und erfordert eine im Anwendungsdokument festgelegte Vorschrift mit mindestens:<\/p>\n<ul><li>der Häufigkeit der Verifizierung,<\/li><li>den Bedingungen, die eine Verifizierung auslösen (z. B. Austausch eines Systemelements).<\/li><\/ul>\n<p>Schritte: Einstellung und/oder Kalibrierung für die Verifizierung; Beurteilung der zulässigen Leistungsgrenzen; Verifizierung festgelegter Kenngrößen – <b>mindestens<\/b> Signal-Rausch-Verhältnis für die Referenzsignale, Phasen- und Amplitudenansprechverhalten auf Referenzkörper und Stabilität des Abgleichs; Messverfahren für jede Kenngröße.<\/p>\n<p>Überschreiten die Messergebnisse die zulässigen Grenzen, muss das angegeben werden, und es sind <b>Korrekturmaßnahmen<\/b> nötig: Rekalibrierung des Systems oder Verifizierung eines oder mehrerer Systemelemente nach Stufe 2 oder 3.<\/p>\n<div class=\"warn\">Alle nach der letzten erfolgreichen Verifizierung geprüften Produkte gelten als <b>nicht geprüft<\/b>. Die dazu getroffenen Entscheidungen (z. B. Wiederholungsprüfung oder ein anderes zerstörungsfreies Verfahren) sind aufzuzeichnen.<\/div>\n<div data-vid=\"verif\"><\/div>\n<div data-sim=\"verif\"><\/div>\n\n<h2>9.3 Produktbezogene Normen<\/h2>\n<p>Zurzeit gibt es zwei Produktbereiche mit vollständiger Normung: die <b>Rohrprüfung<\/b> und die <b>Schweißnahtprüfung<\/b>.<\/p>\n<h3>9.3.1 Rohrprüfung<\/h3>\n<p>Stahlrohre behandeln zwei im Aufbau und Inhalt sehr ähnliche Normen:<\/p>\n<ul><li><b>DIN EN ISO 10893-1:<\/b> automatisierte elektromagnetische Prüfung nahtloser und geschweißter (ausgenommen unterpulvergeschweißter) Stahlrohre zum Nachweis der <b>Dichtheit<\/b>,<\/li><li><b>DIN EN ISO 10893-2:<\/b> dieselbe Prüfung zum Nachweis von <b>Unvollkommenheiten<\/b>.<\/li><\/ul>\n<p>Unterschiede gibt es bei der Wahl der Bezugsbohrung bzw. Bezugsnut und der Zulässigkeitsgrenze (Abb. 9.2). Einheitlich ist die <b>Kontrolle der Einstellung<\/b> einmal in vier Stunden, bei Wechsel der Bedienungsmannschaft sowie am Anfang und Ende eines Produktionsloses. Details zu den Prüfparametern folgen in V11.<\/p>\n<div class=\"tw\"><table class=\"t\"><tr><th><\/th><th>DIN EN ISO 10893-1<\/th><th>DIN EN ISO 10893-2<\/th><\/tr>\n<tr><td>Bezugsbohrung<\/td><td>abhängig vom Rohrdurchmesser Radialbohrung 1,2 bis 3,7 mm (Tabelle 1); für strengere Forderungen 1,0 bis 3,7 mm<\/td><td>abhängig vom Rohrdurchmesser und von der Zulässigkeitsklasse EH1–EH4 Radialbohrung 0,6 bis 3,2 mm (Tabelle 2)<\/td><\/tr>\n<tr><td>Bezugsnut (rotierendes Rohr bzw. Sensor)<\/td><td>Streuflussprüfung: 12,5 % der Nennwanddicke, min. 0,5 mm, max. 1,5 mm<\/td><td>je nach Zulässigkeitsklasse E2–E5: 5–15 % der Nennwanddicke, min. 0,3 mm, max. 1,5 mm (Wirbelstromprüfung)<\/td><\/tr>\n<tr><td>Zulässigkeitsgrenze<\/td><td colspan=\"2\">entspricht der Bezugsbohrung bzw. Bezugsnut<\/td><\/tr><\/table><\/div>\n<div class=\"tcap\"><b>Abb. 9.2:<\/b> Unterschiede für Bezugsbohrung bzw. Bezugsnut und Zulässigkeitsgrenze<\/div>\n<h3>9.3.2 Schweißnahtprüfung<\/h3>\n<div data-fig=\"v9_iso17635\" data-cap=\"Abb. 9.3: DIN EN ISO 17635 Anhang B (informativ) – Schnittstelle zwischen Bewertungsgruppen und Zulässigkeitsgrenzen\"><\/div>\n<h4>DIN EN ISO 5817<\/h4>\n<p>Je nach Beanspruchung sind drei <b>Bewertungsgruppen<\/b> möglich: <b>D<\/b> – niedrige, <b>C<\/b> – mittlere, <b>B<\/b> – hohe Beanspruchung. Die Unregelmäßigkeitsgrenzen werden von D nach B anspruchsvoller; alle drei Stufen sind in der Norm bezüglich ihrer Unregelmäßigkeiten definiert. Die Einteilung erfolgt über ein Nummernsystem nach DIN EN ISO 6520-1.<\/p>\n<p>Äußere Unregelmäßigkeiten lassen sich, wenn zugänglich, direkt durch Sichtprüfung beurteilen. <b>Zu beachten:<\/b> Die Grenzwerte der ISO 5817 sind <i>tatsächliche<\/i> Fehlergrößen, die mit zerstörungsfreier Prüfung nur bedingt ermittelt werden können. Andere Oberflächenverfahren wie Eindring-, Magnetpulver- und Wirbelstromprüfung erlauben deshalb keine direkte Beurteilung. Innere Unregelmäßigkeiten bewertet man alternativ über Durchstrahlungsaufnahmen (Röntgenfilm), die Bruchfläche oder eine Ultraschallprüfung.<\/p>\n<h4>ZfP an Schweißverbindungen nach DIN EN ISO 17635<\/h4>\n<p>Auf Grundlage von Qualitätsanforderungen, Werkstoffen, Nahtdicken, Schweißprozessen und Prüfumfang gibt sie eine <b>Anleitung zur Auswahl<\/b> zerstörungsfreier Prüfverfahren und zur <b>Bewertung der Ergebnisse<\/b>. Außerdem legt sie allgemeine Regeln und Normen für die einzelnen Verfahren fest, entweder bezüglich der Prüfklassen oder der Zulässigkeitsgrenzen für metallische Werkstoffe.<\/p>\n<p>Im Allgemeinen wird je nach betrieblichem Beanspruchungsfall eine Bewertungsgruppe nach ISO 5817 (bzw. ISO 10042 für Aluminium) vorgegeben. Die ISO 17635 hat hier eine <b>Übertragungsfunktion<\/b>: Sie ermittelt die fehlenden Angaben und sichert die normgerechte Prüfung.<\/p>\n<div data-fig=\"v9_fluss\" data-cap=\"Abb. 9.4: Prinzipdarstellung ZfP an Schweißverbindungen\"><\/div>\n<p>Für die Wirbelstromprüfung bedeutet das (Tab. 9.1, Tabelle A.4 der ISO 17635):<\/p>\n<div class=\"tw\"><table class=\"t\"><tr><th>Bewertungsgruppe nach ISO 5817 / ISO 10042<\/th><th>Prüftechniken und -klassen nach ISO 17643<\/th><th>Zulässigkeitsgrenzen<\/th><\/tr>\n<tr><td>B<\/td><td rowspan=\"3\">Prüfklasse nicht festgelegt<\/td><td rowspan=\"3\">in einer Vereinbarung zwischen den Vertragspartnern festzulegen<\/td><\/tr><tr><td>C<\/td><\/tr><tr><td>D<\/td><\/tr><\/table><\/div>\n<div class=\"tcap\"><b>Tab. 9.1:<\/b> Tabelle A.4 der DIN EN ISO 17635<\/div>\n<h4>DIN EN ISO 17643<\/h4>\n<p>Gegenüber den klassischen Oberflächenverfahren hat die Wirbelstromprüfung den Vorteil, dass sie auch mit <b>nichtleitenden Beschichtungen bis 2 mm<\/b> noch entsprechend empfindlich ist. Die Beschichtung muss aber homogen sein; die Norm fordert deshalb eine zweigeteilte Prüfung: (1) Messen der Beschichtungsdicke, (2) Schweißnahtprüfung – physikalisch bedingt mit zwei unterschiedlichen Sensortypen.<\/p>\n<p>Die Schweißnahtprüfung selbst läuft mit <b>100 kHz bis 1 MHz<\/b>. Zur Empfindlichkeitsjustierung dient ein Vergleichskörper mit Nuten: Die <b>1-mm-Nut<\/b> wird auf <b>80 % Bildschirmhöhe<\/b> gebracht; zusätzlich kontrolliert man mit einer <b>0,5-mm-Nut<\/b>, dass mindestens <b>50 %<\/b> der 1-mm-Nut erreicht werden. Die Nachweisgrenze dieser Einstellung ist für nicht beschliffene Nähte („wie geschweißt“) auf lineare Oberflächenanzeigen von <b>1 mm Tiefe und 5 mm Länge<\/b> festgelegt. Das ist weniger als die klassischen Verfahren erreichen und erklärt die begrenzte Anwendung nach ISO 17635.<\/p>\n<p>Die Norm enthält viele Abbildungen typischer Abtastungen und Signalverläufe; extrem wichtig ist die <b>Winkeleinstellung<\/b> des Sensors zur Naht. Details zu Prüfparametern und Abtastung folgen in V13.<\/p>\n<h4>DIN EN ISO 6520-1<\/h4>\n<p>Sie beschreibt dreisprachig ein Klassifizierungssystem für Schweißnahtunregelmäßigkeiten mit Skizzen in <b>sechs Gruppen<\/b> und einer 3- bis 4-stelligen Nummer:<\/p>\n<div class=\"tw\"><table class=\"t\"><tr><th>Gruppe<\/th><th>Unregelmäßigkeit<\/th><\/tr><tr><td>1<\/td><td>Risse<\/td><\/tr><tr><td>2<\/td><td>Hohlräume<\/td><\/tr><tr><td>3<\/td><td>Feste Einschlüsse<\/td><\/tr><tr><td>4<\/td><td>Bindefehler und ungenügende Durchschweißung<\/td><\/tr><tr><td>5<\/td><td>Form- und Maßabweichungen<\/td><\/tr><tr><td>6<\/td><td>Sonstige Unregelmäßigkeiten<\/td><\/tr><\/table><\/div>\n<p>Für die Wirbelstromprüfung sind nur die Gruppen <b>1 und 4<\/b> von Belang. Mit der Referenznummer lassen sich Fehlertyp, Geometrie und Lage eindeutig und schnell protokollieren.<\/p>\n", "v10": "<h2>10.1 Einführung<\/h2>\n<p>Die Zertifizierung nach DIN EN ISO 9712 bestätigt die allgemeine Kompetenz des ZfP-Prüfers, für die im Zertifikat ausgewiesenen Verfahren die Qualifizierungsanforderungen zu erfüllen. Sie ist <b>keine betriebliche Autorisierung<\/b> – diese Verantwortung bleibt beim Arbeitgeber. Er verantwortet die arbeitsplatzbezogene Aus- und Weiterbildung, die gesundheitliche Eignung (z. B. Sehfähigkeit) und die zugehörige Nachweisführung, denn der Zertifizierte braucht womöglich zusätzliche Spezialkenntnisse über Geräte, Materialien und Produkte, die für den Arbeitgeber typisch sind.<\/p>\n<p>Weil es bei der zerstörungsfreien Prüfung auf hohe Auffindwahrscheinlichkeit und Reproduzierbarkeit ankommt – und immer dann, wenn nach Regelwerken, Normen oder Spezifikationen geprüft wird –, müssen Durchführung und alle Prüfbedingungen <b>schriftlich festgelegt<\/b> werden. Die DIN EN ISO 9712 kennt dafür zwei Formen mit unterschiedlicher Zielsetzung (Abb. 10.1):<\/p>\n<div class=\"tw\"><table class=\"t\"><tr><th>ZfP-Verfahrensbeschreibung<\/th><th>ZfP-Prüfanweisung<\/th><\/tr><tr><td>Schriftliche Beschreibung aller <b>wesentlichen Parameter und Vorsichtsmaßnahmen<\/b> bei der zerstörungsfreien Prüfung von Produkten nach Norm(en), Regelwerk(en) oder Spezifikation(en).<\/td><td>Schriftliche Beschreibung der <b>exakten Schritte<\/b>, die zu befolgen sind, wenn nach einer bestehenden Norm, einem Regelwerk, einer Spezifikation oder einer ZfP-Verfahrensbeschreibung geprüft wird.<\/td><\/tr><\/table><\/div>\n<div class=\"tcap\"><b>Abb. 10.1:<\/b> Definitionen aus DIN EN ISO 9712 für schriftliche Anweisungen<\/div>\n<p>Beide Formen ergeben sich aus den Aufgaben der Ausbildungsstufen, die ebenfalls in der DIN EN ISO 9712 geregelt sind (Abb. 10.2):<\/p>\n<div class=\"tw\"><table class=\"t\"><tr><th>Stufe<\/th><th>Kompetenz und Autorisierung (durch den Arbeitgeber, im Geltungsbereich des Zertifikats)<\/th><\/tr>\n<tr><td><b>Stufe 1<\/b><\/td><td>Prüft <b>nach Prüfanweisung<\/b> und unter Aufsicht von Stufe 2 oder 3. Darf (a) ZfP-Geräte einstellen, (b) Prüfungen durchführen, (c) Ergebnisse aufzeichnen und nach schriftlichen Kriterien einordnen, (d) über die Ergebnisse berichten.<\/td><\/tr>\n<tr><td><b>Stufe 2<\/b><\/td><td>Prüft nach <b>Verfahrensbeschreibungen<\/b>. Darf (a) die ZfP-Prüftechnik auswählen, (b) Anwendungsgrenzen des Verfahrens festlegen, (c) Regelwerke, Normen, Spezifikationen und Verfahrensbeschreibungen in <b>Prüfanweisungen<\/b> umwandeln, die den realen Arbeitsbedingungen angepasst sind, (d) Geräte einstellen und Einstellungen verifizieren, (e) Prüfungen durchführen und überwachen, (f) Ergebnisse nach Norm, Regelwerk, Spezifikation oder Verfahrensbeschreibung auslegen und bewerten, (g) alle Tätigkeiten in oder unterhalb Stufe 2 durchführen und überwachen, (h) Personal bis Stufe 2 anleiten, (i) Ergebnisse dokumentieren.<\/td><\/tr>\n<tr><td><b>Stufe 3<\/b><\/td><td>Führt ZfP-Tätigkeiten aus und leitet sie. Hat (a) die Kompetenz zur Bewertung und Interpretation von Ergebnissen anhand bestehender Normen, Regelwerke und Spezifikationen, (b) ausreichende praktische Kenntnisse über Materialien, Herstellung, Prozess- und Produkttechnologie, um Verfahren auszuwählen, Techniken zu etablieren und bei Zulassungskriterien mitzuwirken, wenn diese anderweitig nicht verfügbar sind, (c) allgemeine Kenntnisse über andere ZfP-Verfahren.<\/td><\/tr><\/table><\/div>\n<div class=\"tcap\"><b>Abb. 10.2:<\/b> Aufgaben der Stufen 1–3 nach DIN EN ISO 9712<\/div>\n<p>Daraus ergibt sich der Ablauf vor einer Prüfung (Abb. 10.3). Wichtig: Ein <b>Stufe-1-Prüfer kann ohne Prüfanweisung nicht tätig werden<\/b>. Für den Stufe-2-Prüfer ist eine Verfahrensbeschreibung nicht zwingend, da er unmittelbar nach den Vorgaben arbeiten und diese in einer Prüfanweisung festhalten darf. Eine Verfahrensbeschreibung als Basis ist aber sinnvoll, sonst wiederholen sich in jeder Prüfanweisung Angaben zu Prüfpersonal, Geräte- und Sensorkontrollen, Dokumentation, Sicherheit und Umweltschutz. Diese könnten auch in eigenständigen Anweisungen stehen, auf die dann verwiesen wird.<\/p>\n<div data-fig=\"v10_ablauf\" data-cap=\"Abb. 10.3: Schematischer Ablauf von der Vorgabe bis zum Prüfen\"><\/div>\n<div data-vid=\"pruefkette\"><\/div><div data-sim=\"roles\"><\/div>\n\n<h2>10.2 Inhalt einer Prüfanweisung<\/h2>\n<p>Als Hilfe für eine ausführliche, eigenständige Prüfanweisung (ohne Verfahrensbeschreibung) dient der Leitfaden mit <b>13 Unterpunkten<\/b> (Abb. 10.4). Ist eine Verfahrensbeschreibung vorhanden, genügt die <b>Kurzform<\/b> (Abb. 10.5) – sie wird auch in der Qualifizierungsprüfung angewendet.<\/p>\n<div class=\"tw\"><table class=\"t\"><tr><th>Nr.<\/th><th>Punkt<\/th><th>Inhalt<\/th><\/tr>\n<tr><td>1<\/td><td>Titel<\/td><td>Nummer, Kurzbezeichnung, Prüfverfahren, Erzeugnisform<\/td><\/tr>\n<tr><td>2<\/td><td>Geltungsbereich<\/td><td>Angaben zum Prüfgegenstand: Werkstoff (auch Leitfähigkeit und Permeabilität), Wärmebehandlungszustand, Herstellungsverfahren, Abmessungen usw.<\/td><\/tr>\n<tr><td>3<\/td><td>Mitgeltende Regelwerke, Bezugsdokumente<\/td><td>Aufzählung der tatsächlich verwendeten Unterlagen <b>mit Ausgabedatum<\/b> (ohne Angabe = undatiert, d. h. automatische Übernahme der neuesten Ausgabe!)<\/td><\/tr>\n<tr><td>4<\/td><td>Zeitpunkt und Ziel der Prüfung<\/td><td>vor/nach Wärmebehandlung, vor Volumenprüfung, vor/nach Druckprüfung usw.; Fertigungsprüfung, Revisionsprüfung usw.<\/td><\/tr>\n<tr><td>5<\/td><td>Prüfumfang, Prüfbereiche<\/td><td>erfasste Oberfläche/Volumen, Zugänglichkeit, ungeprüfte Bereiche (z. B. Rohrenden), Maßbezugssystem zur Kennzeichnung von Anzeigen mit Verweis auf Zeichnung; Teilezahl, Losgröße, Prozentwert<\/td><\/tr>\n<tr><td>6<\/td><td>Prüfmerkmale und Bewertungskriterien<\/td><td>Merkmale mit Registriergrenze und Zulässigkeitsgrenze (Lage, Größe, Häufigkeit)<\/td><\/tr>\n<tr><td>7<\/td><td>Prüftechnik(en), Prüfbedingungen<\/td><td>Gerät, Sensor, Signaldarstellung, Hilfsmittel (Mechanik, Führungen); Prüfparameter wie Frequenz, Stromstärke, Vorverstärker, Phase, Filter; Vergleichs- und Kalibrierkörper mit Testfehlerabmessungen, Werkstoff, Bezeichnung, Nr.<\/td><\/tr>\n<tr><td>8<\/td><td>Durchführung<\/td><td>Justiervorgang mit allen Einstellparametern, einschließlich regelmäßiger Kontrolle der Justierung<\/td><\/tr>\n<tr><td>9<\/td><td>Maßnahmen bei Abweichungen<\/td><td>Vorgehen bei unzulässigen Befunden: Sperren, Verschrotten, Ausschleifen, Reparatur, Information an die Prüfaufsicht usw.<\/td><\/tr>\n<tr><td>10<\/td><td>Protokollierung, Dokumentation<\/td><td>Formblatt, weitere Aufzeichnungen, Fotos usw.<\/td><\/tr>\n<tr><td>11<\/td><td>Anforderungen an das Prüfpersonal<\/td><td>Ausbildungsstufe, Qualifizierung, Zusatzqualifikation, Zertifizierung, Industriesektor, Erfahrungszeiten, Geräteunterweisungen<\/td><\/tr>\n<tr><td>12<\/td><td>Weiteres<\/td><td>Anlagen, Sicherheitshinweise, Bedienungsanleitungen usw.<\/td><\/tr>\n<tr><td>13<\/td><td>Formalien<\/td><td>Name (erstellt, genehmigt, freigegeben), Datum, Unterschrift, Revisionsnummer<\/td><\/tr><\/table><\/div>\n<div class=\"tcap\"><b>Abb. 10.4:<\/b> Leitfaden zur Prüfanweisung<\/div>\n<p>Dieser Leitfaden ist ein allgemeines Hilfsmittel für viele Anwendungen. Man muss aber stets die für die Prüfung nötigen Regelwerke, Normen und Spezifikationen beachten (z. B. DIN EN ISO 15549, Abschn. 13.2). Vereinbarungen mit dem Kunden müssen in den Prüfanweisungen genauso erfüllt werden wie Forderungen aus Regelwerken und Normen; Normen können zusätzliche Angaben verlangen.<\/p>\n<div class=\"def\"><b>Beispiel Schweißnahtprüfung nach DIN EN ISO 17635<\/b> (Oberflächenrissprüfung mit Wirbelstrom): Tabelle A.4 verweist für Prüftechniken und -klassen auf ISO 17643, nennt aber keine Prüfklasse; auch ein Verweis auf eine Norm mit Zulässigkeitsgrenzen fehlt – sie sind zwischen den Vertragspartnern zu vereinbaren.<\/div>\n<p>Solche Festlegungen müssen also vorab mit dem Auftraggeber abgestimmt und verbindlich in der Prüfanweisung festgeschrieben werden. Dasselbe gilt für firmeninterne Anweisungen; die nötigen Angaben ergeben sich dort aus Berechnungen, konstruktiver Auslegung, Betriebserfahrungen u. Ä. Die Vergleichskörper sind in der Prüfanweisung zu beschreiben bzw. zu hinterlegen, und die Kalibrierfehler für Registrier- und Zulässigkeitsgrenzen sowie die Geräteüberprüfung sind zu benennen.<\/p>\n<div class=\"warn\">Punkt 9 „Maßnahmen bei Abweichungen“ ist sehr sorgfältig zu beschreiben. Die Prüfaufsicht kann meist nicht selbst weitere Schritte festlegen. Mechanische Arbeiten wie „Ausschleifen“ dürfen nur nach Absprache mit dem Auftraggeber bzw. bei innerbetrieblichen Anweisungen in Übereinstimmung mit den technologischen Abläufen vorgesehen werden. Meist genügen: Unzulässigkeit dokumentieren, Prüfkörper sperren und sichern, übergeordnete Stelle (Prüfaufsicht, Stufe-3-Prüfer) verständigen.<\/div>\n<p>Wichtiger Bestandteil ist der <b>Prüfbericht<\/b> als Dokumentation der Prüfung. Seine Angaben sollten in der Prüfanweisung beschrieben sein, besser noch: ein Musterexemplar liegt als Anlage bei. Auch hier gelten die Normforderungen (z. B. DIN EN ISO 15549, Abschn. 13.3); in verschiedenen Produktsektoren können die Berichtsinhalte unterschiedlich sein.<\/p>\n<h3>Kurzform einer Prüfanweisung (Beispiel Rohr)<\/h3>\n<div class=\"tw\"><table class=\"t\"><tr><th>Abschnitt<\/th><th>Angaben (Beispiel)<\/th><\/tr>\n<tr><td>Prüfgegenstand<\/td><td>Rohr S 235 JRH; Nr. und Hauptabmessungen dokumentieren<\/td><\/tr>\n<tr><td>Prüftechnik<\/td><td>Prüfung und Beurteilung nach ISO 10893-2, Tabelle 1, E3H; Personal: mindestens ET 1 (zertifiziert nach ISO 9712); Prüfziel: Fehlerprüfung; Prüfumfang: 100 % innen &amp; außen, ausgenommen ungeprüfte Enden (150 mm)<\/td><\/tr>\n<tr><td>Prüfsystem<\/td><td>Universalgerät; Sensor: Hersteller und Seriennummer dokumentieren; Justierkörper: Referenzrohr, Nr. dokumentieren; Referenz: 3 Bohrungen Ø 1,3 mm; Schaltung: Differenz; Anordnung: Außendurchlaufsensor<\/td><\/tr>\n<tr><td>Prüf-/Einstellparameter<\/td><td>Prüffrequenz 10 kHz; X/Y-Darstellung, Nullpunkt Mitte, Phase dokumentieren, Schwelle 30 % (polar); Vorverstärker/Verstärkung dokumentieren, keine Achsenspreizung; Filter: Tiefpass 50 Hz, kein Hochpass<\/td><\/tr>\n<tr><td>Voreinstellungen<\/td><td>Nullpunkt einstellen, Filter setzen, Vormagnetisierung mit maximalem Spulenstrom; Signal der 1,3-mm-Bohrung<\/td><\/tr>\n<tr><td>Justierung<\/td><td>1. Frequenz einstellen · 2. Abgleich auf fehlerfreiem Material · 3. kleinstes Signal löst Alarm aus · 4. Signal senkrecht stellen<\/td><\/tr>\n<tr><td>Prüfung<\/td><td>gleichmäßige Geschwindigkeit, maximal 150 mm/s<\/td><\/tr>\n<tr><td>Zulässigkeit<\/td><td>Signale über der Signalgeber-Ansprechschwelle sind unzulässig<\/td><\/tr>\n<tr><td>Kontrolle der Justierung<\/td><td>am Ende der Prüfung (max. Abweichung 2 dB, 5°)<\/td><\/tr>\n<tr><td>Formalien<\/td><td>Ort, Datum, Name, Unterschrift<\/td><\/tr><\/table><\/div>\n<div class=\"tcap\"><b>Abb. 10.5:<\/b> Formblatt zur Prüfanweisung (Kurzform)<\/div>\n<h3>Prüfbericht<\/h3>\n<p>Das Formblatt des Prüfberichts (Wirbelstromprüfung) enthält dieselben Kopfangaben wie die Prüfanweisung, aber ausgefüllt mit den tatsächlichen Werten: Angaben zum Prüfgegenstand (Werkstoff/Nr., Hauptabmessungen), zur Prüftechnik (Norm, Prüfziel, Prüfumfang), zum Prüfsystem (Gerät, Sensor, Justierkörper mit Bezeichnung/Nr., Schaltung, Referenz, Anordnung) und zu den Prüf-/Einstellparametern (Frequenz, Signaldarstellung/Nullpunkt/Phase/Schwelle, Verstärkung, Filter). Hinzu kommen eine <b>Skizze des Prüfgegenstandes<\/b> mit Nummer und Lage der Anzeigen, eine Tabelle der Befunde (Bauteil/Anzeigen-Nr., Amplitude, Phase, i.&thinsp;O./n.&thinsp;i.&thinsp;O.), die <b>Gesamtbeurteilung<\/b> mit weiteren Maßnahmen sowie Ort, Datum, Name und Unterschrift.<\/p>\n<div data-sim=\"pabuilder\"><\/div>\n", "v11": "<h2>11.1 Einleitung<\/h2>\n<p>Wirbelstromprüfungen an metallischen Rohren, Rohrprofilen, Stangen und Drähten (zusammen „Erzeugnisformen“) erfolgen bei der Herstellung im Produktionsfluss – zur Kontrolle einzelner Fertigungsschritte – und als Abnahmeprüfung zur Qualitätssicherung. Geprüft wird:<\/p>\n<ul><li>zum Nachweis der <b>Dichtheit<\/b> von Rohren,<\/li><li>zum Nachweis von <b>Fehlern<\/b>,<\/li><li>zum Nachweis von <b>Materialverwechslungen<\/b>,<\/li><li>zur <b>Dimensionskontrolle<\/b>.<\/li><\/ul>\n<p>Erregerfeld und Abtastung der Prüffläche koppeln berührungslos über einen Luftspalt. Das bringt Vorteile:<\/p>\n<ul><li>trockenes Verfahren, kein Koppelmittel nötig,<\/li><li>gute Automatisierbarkeit,<\/li><li>große Prüfgeschwindigkeit, hohe Prüfleistung,<\/li><li>Prüfung heißen Prüfguts mit wassergekühlten Spulen möglich – z. B. in Walzstraßen nach der letzten Warmformgebung oder hinter Schweißmaschinen.<\/li><\/ul>\n<p>Wegen der durch den Skin-Effekt begrenzten Eindringtiefe gilt die Wirbelstromprüfung als <b>Oberflächenprüfverfahren<\/b>. Bei entsprechend dünnwandigen Rohren, im Bereich der Standard-Eindringtiefe, wird sie jedoch auch als Volumenprüfung definiert.<\/p>\n\n<h2>11.2 Wirbelstromprüfsysteme<\/h2>\n<p>Ein Prüfsystem für Erzeugnisformen kombiniert <b>Prüfgerät, Spulensystem, Verbindungskabel und mechanische Führung<\/b>. Treten im Prüfgut Permeabilitätsschwankungen auf, gehört außerdem eine <b>Aufmagnetisierungseinrichtung<\/b> dazu.<\/p>\n<h3>11.2.1 Wirbelstromprüfgeräte<\/h3>\n<p>Ein Prüfgerät besteht mindestens aus vier Einheiten:<\/p>\n<ul><li><b>Generatoreinheit:<\/b> erzeugt den Erregerstrom I<sub>Pr<\/sub> und passt dessen Stärke an die Impedanz der Erregerspule an.<\/li><li><b>Messeinheit:<\/b> verstärkt die Signale der Sekundärspulen und bereitet sie durch Demodulation und Gleichrichtung so auf, dass sie als Punkt-Anzeige (x-y) oder zeitlinear (y-t) darstellbar sind.<\/li><li><b>Anzeigeeinheit:<\/b> Bildschirm; bei Spezialgeräten (Verwechslungsprüfung, Dimensionskontrolle) auch Digital- oder Zeigeranzeigen.<\/li><li><b>Auswerteeinheit:<\/b> wertet die Anzeigen nach vorgegebenen Kriterien (Auswertearten) aus und kann die Sortierung des Prüfguts (z. B. gut/schlecht) ansteuern.<\/li><\/ul>\n<p>Abb. 11.1 zeigt typische Geräte (Förster Defectomat EP und DS, Rohmann Elotest PLE mit Netzteil für Aufmagnetisierungseinrichtung, Prüftechnik EDDYCHEK 5). Abb. 11.2 gibt das Blockschaltbild eines Rohrprüfsystems:<\/p>\n<div data-fig=\"v11_blk\" data-cap=\"Abb. 11.2: Blockschaltbild eines Wirbelstromprüfsystems für die Rohrprüfung (1 Gleichfeldmagnetisierung · 2 Gleichfeldspulen · 3 Frequenzgenerator · 4 Prüfspuleneinsatz · 5 Vorverstärker · 6 phasenselektiver Gleichrichter · 7 Verstärker · 8 Filter · 9 Phasensteller · 10 Bildschirm · 11 Amplitudendiskriminator · 12 Taktgeber · 13 Schieberegister · 14 Markiersteuerung · 15 Sortiersteuerung)\"><\/div>\n<h3>11.2.2 Spulensysteme<\/h3>\n<p>Erzeugnisform und aufzufindende Fehler bestimmen das Spulensystem. Eingesetzt werden <b>Außendurchlaufsensoren<\/b> (umfassen das Prüfgut), <b>Innendurchlaufsensoren<\/b> (prüfen von innen) sowie <b>Tast- und Segmentsensoren<\/b> (erfassen nur einen begrenzten Oberflächenbereich).<\/p>\n<div data-fig=\"v11_sens\" data-cap=\"Übersicht der Spulensysteme: Außendurchlauf-, Innendurchlauf-, Tast- und Segmentsensor\"><\/div>\n<h4>11.2.2.1 Außendurchlaufsensoren<\/h4>\n<p>Außen- und Innendurchlaufsensoren erfassen den <b>gesamten Umfang<\/b>. Außendurchlaufsensoren erlauben hohe Prüfgeschwindigkeiten (bis zu 100 m/s). Ab etwa 100 mm Außendurchmesser ist die Aussagefähigkeit wegen des großen Wechselwirkungsvolumens eingeschränkt (DIN EN ISO 10893-2); die DIN EN 10246 beschreibt die Prüfung mit Außendurchlaufspulen bis maximal <b>250 mm<\/b> Durchmesser. Passende Sensoren und Magnetisierungseinrichtungen sind lieferbar (Abb. 11.3).<\/p>\n<p>Durchlaufsensoren finden sicher <b>punktförmige Fehler<\/b>, <b>Querfehler<\/b> und <b>kurze Längsfehler<\/b> im Bereich der Eindringtiefe; sie gelten als sichere und wirtschaftliche Methode zur <b>Dichtheitsprüfung<\/b>. Sie lassen sich an nichtrunde Querschnitte anpassen und wassergekühlt für die Heißprüfung nutzen.<\/p>\n<p>Nachteile: Längsfehler laufen in der Praxis oft flach ein und sind wegen der Spulenschaltung ab einer bestimmten Länge (Spulenwirkbreite) mit Durchlaufsensoren kaum nachweisbar. Außerdem entsteht bei der Einzelstückprüfung durch den <b>Endeneffekt<\/b> immer ein ungeprüftes Ende; bei Endlosprüfung (z. B. Draht) spielt das keine Rolle.<\/p>\n<div data-fig=\"v11_durch\" data-cap=\"Abb. 11.4: Durchlaufsensor mit Erreger- und Sekundärspule in Differenzschaltung (links) und Signalentstehung bei einem einlaufenden Riss (rechts)\"><\/div>\n<h4>11.2.2.2 Innendurchlaufsensoren<\/h4>\n<p>Sie dienen der manuellen Prüfung eingebauter Rohre und Einzelrohrprüfungen außerhalb automatischer Anlagen. Die Prüfgeschwindigkeiten sind niedrig, die Prüfleistung gering – typisch für manuelle Prüfung in Service und Wartung. <b>Führungspuffer<\/b> links und rechts zentrieren den Sensor und helfen, Wackeleffekte zu vermeiden (Abb. 11.5, 11.6). Mit <b>Magnetisierung<\/b> lassen sich geringe Permeabilitätsstörungen unterdrücken – z. B. bei Duplexstahlrohren in Wärmetauschern (Abb. 11.7).<\/p>\n<h4>11.2.2.3 Tastsensoren<\/h4>\n<p>Sie kommen immer dann zum Einsatz, wenn empfindlich auf <b>Längsfehler<\/b> geprüft werden soll; ihre Fehlerauflösung ist wesentlich größer als bei Durchlaufsensoren. Üblicherweise sind sie in <b>Rotiereinrichtungen<\/b> eingebaut und tasten das Prüfgut beim Längsdurchlauf in Umfangsrichtung ab. Vorschub und Rotation müssen so abgestimmt sein, dass die gesamte Fläche erfasst wird; die Geschwindigkeit der Außendurchlaufsensoren erreicht man so nicht. Wegen der meist hohen Frequenzen arbeitet man ohne magnetische Sättigung. Fest eingebaut dienen Tastsensoren als „Schweißnahttaster“ in Rohrschweißlinien (Abb. 11.8–11.10).<\/p>\n<div data-fig=\"v11_rot\" data-cap=\"Abb. 11.10: Prüfung mit rotierenden Tastsensoren (links) und Signalentstehung über einen Längsfehler (rechts)\"><\/div>\n<div data-vid=\"rotier\"><\/div>\n<h4>11.2.2.4 Segmentsensoren<\/h4>\n<p>Segmentsensoren (Sattelspulen) prüfen die <b>Schweißnaht<\/b> geschweißter (außer unterpulvergeschweißter) Rohre, arbeiten bei rotierenden Prüfungen mit schraubenförmiger Erfassung der gesamten Oberfläche zum Dichtheitsnachweis oder erfassen als Spulenkranz den gesamten Rohrumfang. Sie arbeiten aufgrund ihres Aufbaus <b>selbstabgleichend<\/b>: Materialstörungen im Spulenbereich verzerren das Feld und erzeugen Signale. Vorteil: Auch bei größeren Rohrdurchmessern bleibt das Wechselwirkungsvolumen klein, die Fehlerauflösung ist besser als bei Durchlaufsensoren. Abb. 11.11 zeigt eine Anlage für austenitische Rohre bis 508 mm mit vier Segmentsensoren zu je 100° des Umfangs und einer separaten Einheit zur Nahtprüfung; Abb. 11.12 Segmentsensoren verschiedener Durchmesser in einer Schweißlinie.<\/p>\n\n<h2>11.3 Rohrprüfstrecke und Prüfspulenaufbau<\/h2>\n<div data-vid=\"strecke\"><\/div>\n\n<p>Eine vollständige Prüfstrecke für <b>ferromagnetische<\/b> Werkstoffe enthält neben den Prüfspulen weitere Spulen zur <b>magnetischen Sättigung<\/b> und zur <b>Entmagnetisierung<\/b>. Bei Nichteisenwerkstoffen entfallen sie.<\/p>\n<div data-fig=\"v11_strecke\" data-cap=\"Abb. 11.13: Spulenanordnung einer Prüfstrecke, schematisch (A Aufmagnetisierung · B Prüfspulen · C Erregerspulen · D Gleich-Gegenfeld-Entmagnetisierung · E Wechselfeld-Entmagnetisierung)\"><\/div>\n<p>Abb. 11.14/11.15 zeigen eine Prüfstrecke im Rohrwerk: Magnetisierungseinheit mit Prüfspuleneinsatz und Treibern sowie die Entmagnetisierungseinheiten. Ein typischer <b>Prüfspulensatz<\/b> besteht aus zwei Spulenkombinationen mit je einer Erregerspule, zwei Absolutspulen und einer Mehrfachdifferenzspule; Erreger- und Prüfspulen sind transformatorisch angeordnet. Nach Förster heißen sie <b>LMD-Korrelationsspulen<\/b> (L = Low frequency, MD = Mehrfachdifferenz), die Fa. Prüftechnik nennt den Satz einfach LM (Abb. 11.16).<\/p>\n\n<h2>11.4 Prüfspulenschaltungen und Signalentstehung<\/h2>\n<h3>11.4.1 Absolutsystem<\/h3>\n<p>Für die <b>Fehlerprüfung<\/b> an Erzeugnisformen sind Absolutspulen ungeeignet, weil der für eine aussagefähige Prüfung nötige Stör-Nutz-Abstand von <b>1 : 3 bzw. 10 dB<\/b> nicht erreichbar ist. In Prüfspuleneinsätzen sind sie dennoch oft eingebaut – als <i>Signalgeber<\/i>, <i>Schlitzwächter<\/i> oder zur Dimensionskontrolle. Absolutspulen werden eingesetzt bei Prüfungen auf <b>Materialverwechslung<\/b>, zur <b>Dimensionskontrolle<\/b> und zur Detektion <b>offener Schweißnähte<\/b> über die gesamte Länge des ungeschweißten Bereichs.<\/p>\n<div data-fig=\"v11_abs\" data-cap=\"Abb. 11.17/11.18: Absolutspulenschaltung – Signalentstehung bei einem kurzen und einem langen Fehler\"><\/div>\n<h3>11.4.2 Differenzsystem<\/h3>\n<p>Zum Nachweis von Fehlern an Erzeugnisformen und von Rohren zum Dichtheitsnachweis setzt man <b>Differenzsysteme<\/b> ein, weil nur sie ausreichende Stör-Nutz-Abstände gegenüber anderen Einflussgrößen liefern. Zur Unterdrückung des <b>Wackeleffekts<\/b> bei Durchlaufspulen dienen neben der Differenz- auch Doppel- und Mehrfachdifferenzschaltungen.<\/p>\n<div data-fig=\"v11_diffs\" data-cap=\"Abb. 11.19/11.20: Differenzspulenschaltung – Signalentstehung bei einem kurzen und einem langen Fehler\"><\/div>\n<h3>11.4.3 Doppeldifferenzsystem<\/h3>\n<p>Zwei gegeneinander geschaltete Differenzanordnungen; Abb. 11.21 zeigt die typische Signalentstehung bei einem kurzen Fehler.<\/p>\n<h3>11.4.4 Mehrfachdifferenzsystem<\/h3>\n<p>Mehrere Differenzstufen hintereinander; Abb. 11.22 zeigt die Signalentstehung bei einem kurzen Fehler. Beide Systeme unterdrücken Wackeleffekte noch besser als die einfache Differenz.<\/p>\n<h3>11.4.5 Gegenüberstellung von Differenz- und Absolutsystem<\/h3>\n<p>Differenzspulen reagieren auf <b>kurze<\/b> Fehler, Absolutspulen liefern bei <b>längeren<\/b> Fehlern ein Dauersignal (Abb. 11.23).<\/p>\n<div data-fig=\"v11_vgl\" data-cap=\"Abb. 11.23: Signalformen von Differenz- und Absolutsystem\"><\/div>\n<p>Vorteile des Differenzsystems: <b>kein Wackeleffekt, keine Temperaturdrift, kein Abhebeeffekt<\/b>. Bei Absolutspulen beeinflussen Temperaturänderungen des Prüfguts das Spulensignal; deshalb braucht das Gerät dort einen automatischen Abgleich gegen Temperaturdrift.<\/p>\n<div data-vid=\"diff\"><\/div><div data-sim=\"diff\"><\/div><div data-sim=\"tube\"><\/div>\n\n<h2>11.5 Mechanische Führung zwischen Prüfgut und Spule<\/h2>\n<p>Der Abstand zwischen Prüffläche und Spule misst die Qualität der magnetischen Einkopplung. Schon geringe Abstandsänderungen verursachen große Empfindlichkeitsschwankungen. Eine einwandfreie <b>Führung<\/b> ist deshalb zwingend nötig, um gleichmäßig und reproduzierbar zu prüfen.<\/p>\n<h3>11.5.1 Wicklungsfüllungsgrad für Durchlaufsensoren<\/h3>\n<p>Bei Durchlaufspulen braucht man erstens eine <b>zentrale Führung<\/b>, damit überall am Umfang mit gleicher Empfindlichkeit geprüft wird, und zweitens einen hohen <b>Wicklungsfüllungsgrad<\/b> als Maß für die magnetische Einkopplung. Er ergibt sich aus den Querschnittsflächen von Prüfgut und Spule:<\/p>\n<div class=\"fm\">A<sub>Spule<\/sub> = <span class=\"fr\"><span>π · D<sub>S<\/sub><sup>2<\/sup><\/span><span>4<\/span><\/span>&nbsp;&nbsp;und&nbsp;&nbsp;A<sub>Prüfstück<\/sub> = <span class=\"fr\"><span>π · D<sub>P<\/sub><sup>2<\/sup><\/span><span>4<\/span><\/span><\/div>\n<p>D<sub>S<\/sub> ist der Nenndurchmesser der Spule, D<sub>P<\/sub> bei Außendurchlaufsensoren der <b>Außendurchmesser<\/b> des Prüfstücks, bei Innendurchlaufsensoren dessen <b>Innendurchmesser<\/b>. Der Füllungsgrad ist das Flächenverhältnis:<\/p>\n<div class=\"fm\">η = <span class=\"fr\"><span>A<sub>Prüfstück<\/sub><\/span><span>A<sub>Spule<\/sub><\/span><\/span> = <span class=\"fr\"><span>D<sub>P<\/sub><sup>2<\/sup><\/span><span>D<sub>S<\/sub><sup>2<\/sup><\/span><\/span>&nbsp;&nbsp;(Außendurchlauf);&nbsp;&nbsp;&nbsp;η = <span class=\"fr\"><span>D<sub>S<\/sub><sup>2<\/sup><\/span><span>D<sub>P<\/sub><sup>2<\/sup><\/span><\/span>&nbsp;&nbsp;(Innendurchlauf)<\/div>\n<div data-fig=\"v11_fuell\" data-cap=\"Abb. 11.24: Unterschiede in der Berechnung des Füllungsgrades zwischen Außen- und Innendurchlaufsensoren\"><\/div>\n<p>Große Füllungsgrade sind anzustreben. Bei <b>Innendurchlaufsensoren<\/b> sind mindestens <b>η = 0,9<\/b> erwünscht; wegen Ovalität, Schweißnahtkonturen und Maßabweichungen innerhalb der Fertigungstoleranzen geht das nicht immer, doch <b>0,8<\/b> sollte nicht unterschritten werden. Bei <b>Außendurchlaufsensoren<\/b> erreicht man für die Fehlerprüfung je nach Prüfgut und Durchmesser <b>η = 0,5 bis 0,95<\/b>; bei Materialverwechslung sind wesentlich kleinere Füllungsgrade möglich.<\/p>\n<div class=\"merke\">Großer Füllungsgrad → geringe Wackeleffekte · gleichmäßige Prüfempfindlichkeit am Umfang · hohe Prüfempfindlichkeit · großer Stör-Nutz-Abstand.<\/div>\n<div data-sim=\"fill\"><\/div>\n<h3>11.5.2 Segment- und Tastsensor<\/h3>\n<p>Segment- (Sattel-) und Tastsensoren werden speziell zur <b>Nahtprüfung<\/b> eingesetzt. Sie prüfen in einer Rohrschweißlinie nur den Nahtbereich – bei Segmentspulen auch die angrenzende Wärmeeinflusszone (WEZ). Wegen des kleineren Wechselwirkungsvolumens ist die Fehlererkennung <b>empfindlicher<\/b> als mit Außendurchlaufsensoren. Zwei mechanische Größen sind maßgeblich:<\/p>\n<ul><li>der <b>Luftspalt<\/b> zwischen Rohroberfläche und Sensor,<\/li><li>die <b>Winkelausrichtung<\/b> genau über der Naht.<\/li><\/ul>\n<p>Zur Luftspalteinstellung sind justierbare Stützrollen vorteilhaft; die Führung muss bei einer Havarie unnötige Zerstörung vermeiden. Als Zwirn- oder V-Rollen zentrieren sie den Sensor automatisch auf das Prüfgut. Typische Abstände: <b>0,5 mm<\/b> (Taster bei Edelstahl) bis <b>3 mm<\/b> (Segmentsensoren in Linien für ferromagnetische Rohre) – stets ein Kompromiss zwischen Empfindlichkeit und Verschleiß, denn Schlitzrohre mit größerem Außendurchmesser und scharfen Bandkanten können Spulen beschädigen.<\/p>\n<p>Bei <b>Nahtwanderung<\/b> sind Segmentsensoren sinnvoll: Sie halten die Empfindlichkeit typisch auf <b>±25°<\/b> vom Zentrum (12-Uhr-Position) konstant. Bei <b>Spiralvorschub oder Rotiersensoren<\/b> entscheidet nur der Luftspalt; die Transportmechanik muss reproduzierbare Bedingungen sichern.<\/p>\n\n<h2>11.6 Einstellungen von Wirbelstromprüfgeräten und Prüfparameter<\/h2>\n<p>Für alle Spulensysteme gelten die Parameter <b>Frequenz, Filter, Phase, Verstärkung/Empfindlichkeit<\/b>. Bei der Installation werden einmalig weitere Signale verkabelt und Parameter eingestellt:<\/p>\n<ul><li><b>Steuersignale von der Produktionslinie:<\/b> Linie läuft, Prüfung aktiv, Geschwindigkeitsspannung bzw. Messradimpulse oder Lichtschranken, Prüflosende, Kalibrierfahrt/Einrichtbetrieb (besonders offline) oder Automatikbetrieb, Absolutabgleich;<\/li><li><b>Signale an die Produktionslinie:<\/b> Gerät prüfbereit, Fehlersignal (unverzögert/verzögert), Sortiersignale einschließlich Sortierschlange/Rohrverfolgung, Prozessüberwachung/Fehlerdichte.<\/li><\/ul>\n<p>Moderne Geräte senden vernetzt Protokolle an einen Zentralrechner und bekommen artikelbezogene Prüfparameter zentral bereitgestellt. Im Extremfall wählt der Bediener nur noch zwischen Parametersätzen und kann nichts verändern; zusätzlich werden Auftrags-, Artikel- und Kundennummer erfasst. Frequenz, Filter, Verstärkung und Phase stellt man nach <b>Prüfanweisung bzw. produktbezogener Norm<\/b> ein.<\/p>\n<p>Bei Durchlaufsensoren wählt man die Spule so, dass der nötige Füllungsgrad erreicht wird. Bei <b>Tastsensoren<\/b> muss die aktive Frontfläche zu Nahtbreite, WEZ-Breite und Rohrdurchmesser passen. <i>Beispiel:<\/i> gute Anpassung bei 8 mm Sensordurchmesser (Frontfläche) auf einem Rohr mit 50 mm Durchmesser; schlechte bei 35 mm Sensordurchmesser auf einem 33-mm-Rohr – die Außenbereiche des Sensors liegen wegen der Rohrkrümmung zu weit von der Oberfläche entfernt, Empfindlichkeit geht verloren.<\/p>\n<div data-fig=\"v11_tast\" data-cap=\"Anpassung der Tastsensor-Frontfläche an das Rohr: gut (8 mm auf Ø 50 mm) und schlecht (35 mm auf Ø 33 mm)\"><\/div>\n<p><b>Filter:<\/b> Die Einstellung erfolgt meist direkt in einer Skala der Produktionsgeschwindigkeit (der Hersteller ermittelt sie aus der Spulenwirkbreite). Als Faustregel gilt ein <b>Bandpass mit Faktor 4 Breite<\/b>, von <b>0,5 × Liniengeschwindigkeit bis 2 × Liniengeschwindigkeit<\/b>.<\/p>\n<p><b>Verstärkung/Empfindlichkeit:<\/b> Das Signal der Bezugsbohrung bzw. Bezugsnut muss die Schwelle sicher überschreiten. Eine Alarmschwelle bei 100 % ist ungeschickt, weil dann keine Aussage über die tatsächliche Signalhöhe mehr möglich ist. Empfohlen: <b>25 bis 50 % Skalenanzeige<\/b>; sie bleibt fest, alle Anpassungen erfolgen über die Verstärkung.<\/p>\n<p>Ist die Verwendung von Bezugsreflektoren nicht möglich oder nicht vorgeschrieben, kann das <b>Grundrauschen<\/b> dienen: Verstärkung und Filter so wählen, dass das Rauschen <b>10 %<\/b> erreicht, und die Alarmschwelle auf <b>30 %<\/b> setzen. Das garantiert, dass nur Anzeigen mit einem Signal-Rausch-Abstand von <b>mindestens 3 : 1<\/b> erfasst werden; bei kleinerem Abstand sind zu viele Pseudosignale zu erwarten.<\/p>\n<p>Meist genügt die <b>Amplitudenauswertung<\/b>: In der Impedanzebene spielt die Phasenlage keine Rolle, die Alarmschwelle ist ein <b>Kreis<\/b>. Fehlersignale sollen immer größer sein als das Grundrauschen.<\/p>\n<div data-sim=\"setup\"><\/div>\n<h3>11.6.1 Wahl der Prüffrequenz<\/h3>\n<p>Die Frequenz ist der entscheidende Parameter für eine sinnvolle und empfindliche Prüfung. Die Erregerspule induziert im Prüfgut Wirbelströme gleicher Frequenz, deren Durchdringung vom <b>Skin-Effekt<\/b> beherrscht wird: Je höher die Frequenz, desto geringer die Eindringtiefe. Bei 50 Hz Netzspannung spielt das noch keine Rolle, im typischen Arbeitsbereich der Wirbelstromprüfung von <b>1 kHz bis 1 MHz<\/b> aber schon (daher sind HF-Kabel als Litzen ausgeführt: der Strom fließt nur in der Oberfläche).<\/p>\n<ul><li><b>Empfindliche Oberflächenprüfung:<\/b> hohe Frequenzen, typisch <b>250 kHz bis 1 MHz<\/b>.<\/li><li><b>Nahtprüfung:<\/b> typisch <b>5 bis 10 kHz<\/b>, um die Wandstärke voll zu durchdringen. Die praktische Grenze einseitiger Anwendung liegt bei etwa <b>6 mm Wandstärke<\/b>.<\/li><li><b>Leitfähigkeit:<\/b> Sie beeinflusst die Eindringtiefe entscheidend – bei gleicher Frequenz ist sie in Austenit viel größer als in Aluminium oder Kupfer.<\/li><li><b>Permeabilität<\/b> ferromagnetischer Werkstoffe: Werte zwischen 100 und 10 000, lokal stark schwankend. Ohne zusätzliche Maßnahmen ergibt sich immer eine reine Oberflächenprüfung; zur Erhöhung der Eindringtiefe magnetisiert man mit <b>Gleichstrom vor<\/b>.<\/li><\/ul>\n<p>Manche Normen schreiben die Prüffrequenz in Abhängigkeit der Wandstärke vor. Bei Stabstahl oder schwarzen nahtlosen Rohren findet immer eine Oberflächenprüfung statt; die komplette Rohrwand ist nur mit Magnetisierung und nur bis ca. 6 mm sinnvoll prüfbar.<\/p>\n<div class=\"merke\"><b>Faustregel:<\/b> mindestens <b>1 kHz pro 1 m/s<\/b> Vorschubgeschwindigkeit. Wegen der Amplitudenmodulation des Trägersignals ist eine gewisse Zahl von Schwingungen nötig, sonst liefert die Demodulation keine auswertbaren, reproduzierbaren Signale.<\/div>\n\n<h2>11.7 Störeffekte und deren Unterdrückung<\/h2>\n<h3>11.7.1 Permeabilität<\/h3>\n<p>In ferromagnetischen Werkstoffen erzeugt der Induktionsstoß der Elementarmagnete (Weiß’sche Bezirke) einen Spannungsstoß – ein hohes Grundrauschen. Eine <b>Gleichstromvormagnetisierung bis zur Sättigung<\/b> richtet alle Bezirke in eine Richtung aus, sodass sich beim Durchlaufen der Spule nichts mehr ändert; das Grundrauschen sinkt deutlich. Außerdem steigt die Eindringtiefe, weil μ nur noch typisch <b>2 bis 4<\/b> beträgt. Nur so ist bei Ferromagnetika überhaupt eine Volumenprüfung bis 6 mm Wanddicke möglich.<\/p>\n<h3>11.7.2 Leitfähigkeit<\/h3>\n<p>Die Leitfähigkeit kann z. B. durch geänderte Härte nach dem Ziehen variieren. Um die Störeffekte zu vermeiden, muss das Prüfgut vor der Prüfung <b>geeignet geglüht<\/b> werden.<\/p>\n<h3>11.7.3 Wackeleffekte<\/h3>\n<p>Sie zu unterdrücken ist Hauptaufgabe der <b>Führungsmechanik<\/b> (neben Differenzschaltungen und hohem Füllungsgrad).<\/p>\n<h3>11.7.4 Rohrendensignal<\/h3>\n<p>Es spielt nur bei <b>Einzelprüfungen<\/b> eine Rolle und entsteht, weil beim Ein- bzw. Austritt des Rohranfangs/-endes die größtmögliche Differenz zwischen den beiden Differenzempfängern auftritt. Ein externer Sensor verfolgt deshalb die Position des Rohranfangs und schaltet die Auswertung erst ein, wenn dieser die Spule passiert hat. Es bleiben ein <b>ungeprüfter Anfang<\/b> und ein <b>ungeprüftes Ende<\/b>. Faustregel: Das ungeprüfte Ende entspricht etwa dem <b>Rohrdurchmesser<\/b> – bei ferromagnetischen Werkstoffen oft mehr.<\/p>\n<h3>11.7.5 Geschwindigkeit<\/h3>\n<p>Die Prüfeinrichtung muss so ausgelegt sein, dass die mechanisch mögliche Produktionsgeschwindigkeit nicht sinkt – alle anderen Vorteile (berührungslos usw.) sind uninteressant, wenn die Prüfung unverhältnismäßige Kosten verursacht. Das Gerät braucht daher eine gewisse Bandbreite in der Signalverarbeitung (Datenblatt des Herstellers). Typische Geschwindigkeiten:<\/p>\n<div class=\"tw\"><table class=\"t\"><tr><th>Anlage / Prüfung<\/th><th>Geschwindigkeit<\/th><\/tr>\n<tr><td>Rostfreie Edelstahlrohre, TIG-Schweißung<\/td><td>0,5 bis 4 m/min<\/td><\/tr>\n<tr><td>Rostfreie Edelstahlrohre, Laserschweißung<\/td><td>bis 12 m/min<\/td><\/tr>\n<tr><td>Ferromagnetische Rohre, HF-Induktionsschweißung<\/td><td>bis 120 m/min<\/td><\/tr>\n<tr><td>Einzelrohrprüfung, Endkontrolle<\/td><td>bis 240 m/min<\/td><\/tr>\n<tr><td>Umspulanlagen für aufgespulte Rohre<\/td><td>bis 360 m/min<\/td><\/tr><\/table><\/div>\n<p>Bei Rohren, die <b>spiralig<\/b> an einer Spule vorbeibewegt werden, muss die <b>Ganghöhe kleiner<\/b> sein als die Abtastbreite der Spule – sonst ist keine überlappende Prüfung möglich; dann einigt man sich auf eine <b>Mindestfehlerlänge<\/b>.<\/p>\n<p>Bei schwankenden Geschwindigkeiten (meist Umspulanlagen beim Anfahren und Abbremsen) ist eine <b>automatische Filternachführung<\/b> sinnvoll: Das Gerät erhält die reale Geschwindigkeit über Messradpulse und führt Hoch- und/oder Tiefpass entsprechend einer einstellbaren Bandbreite nach – die Prüfung wird geschwindigkeitsunabhängig, der Bediener muss nicht nachregeln. Bei Schweißmaschinen sind die Schwankungen gering, die Nachführung ist nicht zwingend. Bei Durchmesser- oder Wandstärkewechsel kann sich die Liniengeschwindigkeit bedeutend ändern; dafür lädt man <b>gespeicherte Prüfparametersätze<\/b> je nach Produkt.<\/p>\n<div data-sim=\"spiral\"><\/div>\n", "v12": "<h2>12.1 Einleitung<\/h2>\n<p>Viele Bauteile werden zum Schutz vor Korrosion, chemischer Beanspruchung, Verschleiß oder auch nur aus optischen Gründen beschichtet – etwa durch Lackieren, Emaillieren oder Galvanisieren. Jede Beschichtung braucht eine <b>Mindestschichtdicke<\/b>, um ihre Aufgabe zu erfüllen. Die zerstörungsfreie Prüfung soll diese Dicke aussagekräftig messen.<\/p>\n<p>Je nach Aufgabe und Beschichtungsverfahren liegen die Schichtdicken zwischen etwa <b>3 µm und 1500 µm<\/b> (1000 µm = 1 mm). In den USA verwendet man wegen des Inch-Systems die Einheit „mil“: 1 mil = 1000 µinch = 25,4 µm.<\/p>\n<p>Neben anderen Verfahren bieten sich vor allem <b>elektromagnetische Verfahren<\/b> als leistungsfähige, preiswerte Lösung mit entsprechenden Spezialgeräten an (Abb. 12.1, z. B. Surfix® der Fa. PHYNIX). Je nach Beschichtung und Grundwerkstoff gilt:<\/p>\n<div class=\"tw\"><table class=\"t\"><tr><th>Verfahren<\/th><th>Grundwerkstoff (Untergrund)<\/th><th>Beschichtung<\/th><\/tr>\n<tr><td><b>Magnetverfahren<\/b><\/td><td>ferromagnetisch<\/td><td>nichtferromagnetisch<\/td><\/tr>\n<tr><td><b>Wirbelstromverfahren<\/b><\/td><td>nichtferromagnetisch, aber elektrisch leitfähig<\/td><td>elektrisch nichtleitfähig<\/td><\/tr><\/table><\/div>\n\n<h2>12.2 Messverfahren<\/h2>\n<div data-vid=\"schicht\"><\/div>\n\n<h3>12.2.1 Magnetverfahren<\/h3>\n<p>Auf ferromagnetischem Stahl müssen die Schichtwerkstoffe unbedingt <b>nichtferromagnetisch<\/b> sein. Typisch sind Lacke, Farben, Emaille, Kunststoffe, Glas oder Metalle wie Chrom, Messing, Zink und Zinn. Enthalten die Schichten Eisen, Eisenoxid („Eisenglimmer“), Nickel oder Kobalt, ist die Messung nicht oder nur bedingt möglich; sie funktioniert nur, wenn sich die Permeabilitäten von Schicht und Grundwerkstoff ausreichend unterscheiden.<\/p>\n<p>Man nutzt eine um einen <b>Eisenkern<\/b> gewickelte Erregerspule mit niederfrequentem Wechselstrom (üblich <b>100 Hz bis 1 kHz<\/b>). Sie erzeugt im Luftraum um die Pole des Kerns ein magnetisches Wechselfeld. Nähert sich der komplette Sensor (Kern, Erreger- und Messspule) der Oberfläche, verstärkt der ferromagnetische Prüfgegenstand das Feld – abhängig vom Abstand ändert sich die <b>Spannung der Messspule<\/b>. Sie wird elektronisch ausgewertet und nach vorheriger Justierung als Schichtdicke angezeigt.<\/p>\n<div data-fig=\"v12_mag\" data-cap=\"Abb. 12.2: Sensoraufbau und Messprinzip beim Magnetverfahren\"><\/div>\n<h3>12.2.2 Wirbelstromverfahren<\/h3>\n<p>Für <b>nichtleitfähige<\/b> Beschichtungen auf Nichteisen-Metallen. Bedingt sind auch elektrisch leitfähige Beschichtungen messbar, sofern sich die Leitfähigkeiten beider Werkstoffe ausreichend unterscheiden.<\/p>\n<p>Anders als beim Magnetverfahren dient eine <b>Luftspule<\/b> mit hochfrequentem Strom (üblich <b>100 kHz bis in den MHz-Bereich<\/b>). Nähert man sie der Oberfläche, entsteht im Prüfgegenstand ein Wirbelstrom, dessen entgegengerichtetes Feld das ursprüngliche schwächt. Die Spuleninduktivität ändert sich abhängig vom Abstand zum Metall; diese Änderung wird ausgewertet und nach Justierung als Schichtdicke angezeigt. Die Nutzgröße ist hier der <b>Abhebeeffekt<\/b>.<\/p>\n<div data-fig=\"v12_wb\" data-cap=\"Abb. 12.3: Sensoraufbau und Messprinzip beim Wirbelstromverfahren\"><\/div>\n<div data-sim=\"layer\"><\/div>\n\n<h2>12.3 Gerätejustierung<\/h2>\n<h3>12.3.1 Genauigkeit der Messung<\/h3>\n<p>Die Normen (12.5.5) fordern eine Genauigkeit von <b>±10 % bzw. ±1,5 µm bzw. 3 µm<\/b>, je nachdem, welcher Wert größer ist. Heutige Geräte erfüllen das leicht; teils liegen sie bei nur ±1 %.<\/p>\n<h3>12.3.2 Referenzproben<\/h3>\n<p>Zur Justierung dienen „<b>Kalibrierfolien<\/b>“, meist Kunststofffolien bekannter Dicke, die eine Beschichtung simulieren. Für gute Ergebnisse braucht es guten Kontakt zwischen Folie und Grundwerkstoff. Folien verschleißen durch zu großen Anpressdruck (Dickenreduzierung), mechanische Belastung (Einreißen) oder Alterung und sollten regelmäßig erneuert werden. Der Begriff „Folie“ wird für nichtferromagnetische metallische wie für nichtmetallische Unterlagen verwendet. Statt Folien lassen sich auch <b>beschichtete Referenzproben<\/b> mit dauerhaft verbundenen Überzügen bekannter, gleichmäßiger Dicke einsetzen.<\/p>\n<h3>12.3.3 Justieren mit Spezialgeräten<\/h3>\n<p>Die meisten Spezialgeräte haben für Standardanwendungen eine interne Justierung (Werkskalibrierung), sodass theoretisch direkt gemessen werden kann – übliche Genauigkeit besser als <b>5 µm bzw. ca. 3 %<\/b> des Messwerts. Aus der Bedienungsanleitung ist vorab zu klären, wie der Standard definiert ist und ob die Bedingungen zutreffen. Er gilt je nach Verfahren, Frequenz und Sensorgröße nur für bestimmte Geometrien. Zu beachten sind:<\/p>\n<ul><li>ausreichend große Messfläche,<\/li><li>ausreichend großer Durchmesser bei konvex oder konkav gekrümmten Bauteilen,<\/li><li>ausreichend große Wanddicke des Grundwerkstoffs.<\/li><\/ul>\n<p>Sind die Grenzwerte unbekannt oder die Bauteile kleiner als der Standard, sollte je nach geforderter Genauigkeit eine <b>Einpunkt-<\/b> oder <b>Zweipunktjustierung<\/b> erfolgen:<\/p>\n<div class=\"tw\"><table class=\"t\"><tr><th>Justierung<\/th><th>Vorgehen<\/th><th>Messunsicherheit<\/th><\/tr>\n<tr><td><b>Einpunkt<\/b><\/td><td>ohne Folie; nur Nulleinstellung an der unbeschichteten Oberfläche<\/td><td>ca. 2 % vom Messwert<\/td><\/tr>\n<tr><td><b>Zweipunkt<\/b><\/td><td>Nulleinstellung plus eine Folie, deren Dicke im erwarteten Schichtdickenbereich liegt<\/td><td>ca. 1 % vom Messwert<\/td><\/tr><\/table><\/div>\n<p>Unabhängig davon sollte vor der Messung die Justierung mit mehreren Folien unterschiedlicher Dicke <b>kontrolliert<\/b> werden.<\/p>\n<h3>12.3.4 Justierung mit Universal-Wirbelstromgeräten<\/h3>\n<p>Auch Universalgeräte (Bildschirmgeräte) sind nutzbar. Man legt den <b>Abhebeeffekt<\/b> als Messgröße in die senkrechte Bildschirmachse und nimmt an Schichten verschiedener Dicke in der erwarteten Größenordnung eine <b>Mehrpunkt-Kalibrierkurve<\/b> auf. Im Beispiel (Abb. 12.4) wurden fünf Schichtdicken und die Nullmessung (ohne Beschichtung) verwendet. Ohne weitere Bildschirmunterteilung erreicht man <b>5 % Bildschirmhöhe<\/b>, im Beispiel etwa <b>5 µm<\/b>. Fragt man nur nach einer <b>Mindestschichtdicke<\/b>, setzt man auf diesen Wert eine Alarmschwelle (im Beispiel 53 % Bildschirmhöhe für 40 µm).<\/p>\n<div data-fig=\"v12_kal4\" data-cap=\"Abb. 12.4: Kalibrierkurve für die Messung mit Universalgeräten (Mehrpunktjustierung; Schichtdicken 0, 18, 32, 48, 62 und 74 µm; Verlauf schematisch)\"><\/div>\n<p>Für höhere Genauigkeit überträgt man die Kalibrierpunkte in ein Diagramm mit geeignetem Maßstab (Abb. 12.5) und liest daraus die Schichtdicke zur Bildschirmhöhe ab.<\/p>\n<div data-fig=\"v12_kal5\" data-cap=\"Abb. 12.5: Übertragung der Kalibrierkurve in ein Diagramm (Bildschirmhöhe in % über Schichtdicke in µm)\"><\/div>\n<div data-sim=\"mcal\"><\/div>\n\n<h2>12.4 Einflüsse auf die Messung<\/h2>\n<h3>12.4.1 Geometrie<\/h3>\n<p>Die Messfläche muss ausreichend groß sein, darf keine oder nur geringe Krümmung haben, und der Grundwerkstoff darf nicht zu dünn sein (Dicke größer als die <b>3-fache Standard-Eindringtiefe<\/b>).<\/p>\n<p>Bei kleinen Messflächen, in Kantennähe, auf konvexen Oberflächen oder zu dünnem Grundwerkstoff wächst der „Luftanteil“: <b>positiver Messfehler<\/b> – es wird eine zu große Schichtdicke gemessen, wenn zuvor auf großer Fläche bzw. dickem Material justiert wurde. Umgekehrt verhält es sich auf konkaven Oberflächen, in Vertiefungen (z. B. Bohrungen) oder nahe senkrechten Blechen an einer Kante (z. B. Flansch): Der Luftanteil sinkt, es entsteht ein <b>negativer Messfehler<\/b> (zu geringe Schichtdicke).<\/p>\n<div data-fig=\"v12_geo\" data-cap=\"Abb. 12.6: Typische Geometrieeffekte – positiver Messfehler (links) und negativer Messfehler (rechts)\"><\/div>\n<h3>12.4.2 Leitfähigkeit<\/h3>\n<p>Beim Wirbelstromverfahren hängt das Signal nicht nur vom Abstand (der Schichtdicke), sondern auch von der <b>Leitfähigkeit<\/b> des Grundmetalls ab. Höhere Leitfähigkeit erzeugt mehr Wirbelströme und verringert scheinbar den Abstand – es wird eine <b>kleinere<\/b> Schichtdicke angezeigt. Viele Spezialgeräte kompensieren das elektronisch durch Erkennen des Grundmaterials; den kompensierbaren Bereich nennt die Bedienungsanleitung. Ist er unbekannt, muss auf einem Material <b>gleicher Leitfähigkeit<\/b> justiert werden.<\/p>\n<h3>12.4.3 Permeabilität<\/h3>\n<p>Beim Magnetverfahren wirkt die Permeabilität ähnlich wie beim Wirbelstromverfahren die Leitfähigkeit. Die Werkseinstellung gilt meist für Grundwerkstoffe mit <b>hoher Permeabilität<\/b> (unlegierter Stahl, Baustahl). Bei höher legierten Stählen mit geringerer Permeabilität wird deshalb eine <b>zu große<\/b> Schichtdicke angezeigt. Je nach Genauigkeit ist eine Ein- oder Zweipunktjustierung (Nullmessung auf dem unbeschichteten Grundwerkstoff) nötig. Bei örtlichen Permeabilitätsschwankungen (z. B. Restmagnetismus) hilft sachgerechtes <b>Entmagnetisieren<\/b>.<\/p>\n<h3>12.4.4 Rauheit<\/h3>\n<p>Schichten auf rauen Oberflächen werden physikalisch bedingt ohne besondere Vorkehrungen <b>immer zu dick<\/b> gemessen. Für die Beurteilung zählt aber die Schichtdicke <b>über den Spitzen<\/b> (minimale Beschichtungsdicke).<\/p>\n<div data-fig=\"v12_rau\" data-cap=\"Abb. 12.7: Veränderung der Feldgeometrie durch die Rauheit\"><\/div>\n<p>Beim Justieren kompensiert man die Rauheit durch Mittelwertbildung aus ca. <b>10 Einzelmessungen<\/b> an einer unbeschichteten Stelle; beim Messen der Beschichtung mittelt man ebenfalls etwa 10 Messungen. Die <b>Differenz der beiden Mittelwerte<\/b> ist die mittlere Schichtdicke über den Spitzen. Problem: Man braucht ein unbeschichtetes Justierstück mit gleicher Rauheit; bis heute gibt es keine praktikablere Methode.<\/p>\n<h3>12.4.5 Temperatur<\/h3>\n<p>Alle elektronischen Bauteile ändern ihre Werte mit der Temperatur; je kleiner die zu verstärkenden Signale, desto stärker wirkt sich die <b>Temperaturdrift<\/b> aus. Zur Kompensation prüft man die Justierung regelmäßig mit geeigneten Folien; manche Geräte haben eine interne Selbstkompensation. Zulässige Umgebungs- und Oberflächentemperaturen stehen in der Bedienungsanleitung – im Extremfall kann zu hohe Oberflächentemperatur den <b>Sensor zerstören<\/b>.<\/p>\n<h3>12.4.6 Äußere Störfelder<\/h3>\n<p>Die Spulensysteme sind zugleich magnetische und elektromagnetische Antennen und damit empfindlich gegen Störfelder von Transformatoren, Bildschirmen, Hochspannungsleitungen, Sendeantennen, Mobiltelefonen usw. Die Messwerte können erheblich verfälscht werden: Beim <b>Magnetverfahren<\/b> stören eher <b>niederfrequente<\/b> Felder (Transformatoren, Bildschirme), beim <b>Wirbelstromverfahren<\/b> <b>hochfrequente<\/b> (Sendeantennen, Mobiltelefone). Abhilfe: außerhalb des Einflussbereichs messen.<\/p>\n\n<h2>12.5 Sonderfälle<\/h2>\n<h3>12.5.1 Kleine Abmessungen des Prüfgegenstandes<\/h3>\n<p>Besonders beim Magnetverfahren an Kleinteilen sollte man die „<b>magnetische Masse<\/b>“ im Umfeld vergrößern, um Messfehler zu minimieren und die Reproduzierbarkeit zu steigern – indem man das Teil mit einem größeren Eisenteil hinterlegt oder einbettet.<\/p>\n<div data-fig=\"v12_masse\" data-cap=\"Abb. 12.8: Vergrößern der „magnetischen Masse“ durch Hinterlegen mit einem Eisenteil\"><\/div>\n<h3>12.5.2 Dünne Schichten<\/h3>\n<p>Bei sehr dünnen Beschichtungen steht die untere Grenze in der Bedienungsanleitung. Je dünner die Schicht, desto stärker wirken Messunsicherheiten; ausreichende Genauigkeit erreicht man gegebenenfalls durch <b>Mittelwertbildung<\/b> mehrerer Einzelmessungen.<\/p>\n<h3>12.5.3 Weiche Schichten<\/h3>\n<p>Bei sehr weichen oder Phosphatschichten kann die Auflagekraft des Sensors eine zu kleine Dicke ergeben oder die Schicht zerstören. Abhilfe: eine zusätzliche <b>harte Folie<\/b> bekannter Dicke als Schutzschicht beim Justieren und Messen; der Messwert minus Foliendicke ist die tatsächliche Schichtdicke.<\/p>\n<h3>12.5.4 Messen von Mehrfachschichten<\/h3>\n<p>Bei Mehrlacksystemen interessiert oft nur die oberste Schicht. Da beide Verfahren die Schichten nicht trennen können, verschiebt man den Nullpunkt („<b>Zero-Offset<\/b>“) um den Betrag der unteren Schicht – möglich nur, wenn diese hinreichend gleichmäßig dick ist.<\/p>\n<h3>12.5.5 Normung zur Schichtdickenmessung<\/h3>\n<div class=\"tw\"><table class=\"t\"><tr><th>Norm<\/th><th>Inhalt<\/th><\/tr>\n<tr><td>ISO 2064<\/td><td>Definitionen und Festlegungen für die Messung von Schichtdicken an metallischen und anderen anorganischen Schichten<\/td><\/tr>\n<tr><td>ISO 3882<\/td><td>Übersicht über Verfahren der Schichtdickenmessung an metallischen und anderen anorganischen Schichten<\/td><\/tr>\n<tr><td>ISO 2178<\/td><td>Magnetverfahren an nichtmagnetischen Überzügen auf magnetischen Grundmetallen<\/td><\/tr>\n<tr><td>ISO 2360<\/td><td>Wirbelstromverfahren an nichtleitenden Überzügen auf nichtmagnetischen Grundmetallen<\/td><\/tr>\n<tr><td>ISO 2361<\/td><td>Magnetverfahren an elektrolytisch erzeugten Nickelschichten auf magnetischen und nichtmagnetischen Grundmetallen<\/td><\/tr><\/table><\/div>\n<p style=\"font-size:.85em;opacity:.7\">Quelle des Vortragsinhalts: PHYNIX GmbH &amp; Co. KG, Köln (2001): Schichtdicken-Messung, Wissenswertes und Hinweise für besondere Fälle.<\/p>\n", "v13": "<h2>13.1 Grundlagen zur manuellen Schweißnahtprüfung<\/h2>\n<h3>13.1.1 Einleitung<\/h3>\n<p>Die zerstörungsfreie Prüfung von Schweißverbindungen erfolgt üblicherweise „normgerecht“: Verfahrens- und Prüfanweisungen stützen sich meist auf Normen, die folgende Prüfanforderungen festlegen:<\/p>\n<ul><li>Prüfumfänge für Oberflächen- und Volumenprüfungen,<\/li><li>„Güte“ der Schweißverbindung (Bewertungsgruppe nach DIN EN ISO 5817),<\/li><li>Qualifikation des Prüfpersonals,<\/li><li>Prüfzeitpunkt,<\/li><li>Prüfdurchführung und Befundbewertung nach DIN EN ISO 17635,<\/li><li>Umgang mit Befunden und mit Reparaturen,<\/li><li>Protokollierung.<\/li><\/ul>\n<p>Vier Normen decken einen Großteil industrieller Anwendungen ab:<\/p>\n<ul><li><b>DIN EN 13445-5<\/b> Unbefeuerte Druckbehälter – Inspektion und Prüfung,<\/li><li><b>DIN EN 13480-5<\/b> Metallische industrielle Rohrleitungen – Prüfung,<\/li><li><b>DIN EN 1090-2<\/b> Stahlbau – Technische Regeln für die Ausführung,<\/li><li><b>DIN EN 15085-5<\/b> Schweißen von Schienenfahrzeugen – Prüfung.<\/li><\/ul>\n<p>Sie treffen Festlegungen zu den obigen Anforderungen, verweisen aber für die Details der zerstörungsfreien Prüfung lediglich auf die <b>DIN EN ISO 17635<\/b> („Zerstörungsfreie Prüfung von Schweißverbindungen – Allgemeine Regeln für metallische Werkstoffe“) – heute die weltweit wichtigste Norm zur ZfP an Schweißverbindungen. Sie gibt auf Grundlage von Qualitätsanforderungen, Werkstoffen, Nahtdicken, Schweißprozessen und Prüfumfang eine Anleitung zur Auswahl der Prüfverfahren und zur Bewertung der Ergebnisse zum Zweck der Qualitätskontrolle.<\/p>\n<p>Die Auswahl des Verfahrens zur Prüfung auf zugängliche Oberflächeninhomogenitäten erfolgt nach Tabelle 1 dieser Norm:<\/p>\n<div class=\"tw\"><table class=\"t\"><tr><th>Werkstoffe<\/th><th>Prüfverfahren<\/th><\/tr>\n<tr><td>Ferritischer Stahl<\/td><td>VT · VT und MT · VT und PT · VT und (ET)<\/td><\/tr>\n<tr><td>Austenitischer Stahl, Aluminium, Nickel, Kupfer und Titan<\/td><td>VT · VT und PT · VT und (ET)<\/td><\/tr><\/table><\/div>\n<div class=\"tcap\"><b>Tab. 13.1:<\/b> Allgemein anerkannte Verfahren für den Nachweis zugänglicher Oberflächeninhomogenitäten an allen Schweißnähten, einschließlich Kehlnähten. VT Sichtprüfung, MT Magnetpulver, PT Eindringprüfung, ET Wirbelstrom; Klammern () bedeuten: Verfahren nur begrenzt anwendbar.<\/div>\n<p>Die manuelle Schweißnahtprüfung mit Wirbelstrom ist also <b>begrenzt anwendbar<\/b>. Vorteilhaft ist, dass sie Oberflächenfehler und oberflächennahe rissartige Unregelmäßigkeiten <b>unter Beschichtungen<\/b> nachweist. Die kleinste nachweisbare Unregelmäßigkeit in einer ferritischen Naht im Zustand „wie geschweißt“ ist <b>1 mm tief und 5 mm lang<\/b>. Registrier- und Zulässigkeitsgrenzen werden zwischen den Vertragspartnern vereinbart; eine geforderte schriftliche Anweisung sollte nach DIN EN ISO 15549 oder DIN EN ISO 17643 angefertigt werden.<\/p>\n<h3>13.1.2 Zielsetzung und Einflussgrößen<\/h3>\n<p>Die manuelle Schweißnahtprüfung mit Wirbelstrom zielt auf:<\/p>\n<ul><li>schnelle, reproduzierbare Prüfung auf <b>Werkstofftrennungen, die zur zugänglichen Oberfläche offen sind<\/b>,<\/li><li>Prüfung auf <b>oberflächennahe rissartige Unregelmäßigkeiten<\/b> – „oberflächennah“ gilt als ≤ 3 Standard-Eindringtiefen,<\/li><li>Prüfung auf Oberflächenfehler unter bis zu <b>2 mm<\/b> dicken nichtmetallischen Schichten (bei größerer Schichtdicke ist die erforderliche Empfindlichkeit nachzuweisen),<\/li><li>Prüfung solcher Fehler an Schweißungen mit <b>unterschiedlichen Werkstoffen<\/b>.<\/li><\/ul>\n<p>Abb. 13.1 und Tab. 13.2 zeigen den Aufbau einer Naht mit den wirbelstromrelevanten Eigenschaften: Jeder Bereich hat eigene μ<sub>rel<\/sub>, σ und Geometrie.<\/p>\n<div data-fig=\"v13_naht\" data-cap=\"Abb. 13.1: Schweißnahtaufbau und wirbelstromrelevante Daten\"><\/div>\n<div class=\"tw\"><table class=\"t\"><tr><th>Bereich / Übergang<\/th><th>Unterschied<\/th><th>dominierende Einflussgröße<\/th><th>weitere Einflussgrößen<\/th><\/tr>\n<tr><td>Grundmaterial 1 / Grundmaterial 2<\/td><td>unterschiedliche Werkstoffe<\/td><td>μ<sub>rel<\/sub><\/td><td>σ<\/td><\/tr>\n<tr><td>Grundmaterial / Wärmeeinflusszone<\/td><td>Gefügeänderung<\/td><td>μ<sub>rel<\/sub><\/td><td>σ<\/td><\/tr>\n<tr><td>Grenzschicht Grundmaterial / Schmelzgut<\/td><td>Mischung von Schmelzgut und Grundmaterial<\/td><td>Geometrie, μ<sub>rel<\/sub><\/td><td>σ<\/td><\/tr>\n<tr><td>Schweißgut, Raupe<\/td><td>unebene Oberfläche, Werkstoff Schmelzgut<\/td><td>Geometrie, μ<sub>rel<\/sub>, σ<\/td><td>–<\/td><\/tr><\/table><\/div>\n<div class=\"tcap\"><b>Tab. 13.2:<\/b> Einflussgrößen auf das Wirbelstromsignal<\/div>\n<p>Daraus folgen die Anforderungen an das Prüfsystem. Zu <b>unterdrückende Störfaktoren<\/b> sind:<\/p>\n<ul><li>örtliche Änderungen von μ<sub>rel<\/sub> (Permeabilitätsschwankungen),<\/li><li>örtliche Änderungen von σ (Leitfähigkeitsschwankungen),<\/li><li>Nahtgeometrie im Übergang Grundmaterial/
