ion holeCards(C, dir){\n  const st = holeStats(C, dir), on = st.filter(x => x.on), n = st.filter(x => x.det).length;\n  const small = on.filter(x => x.det).map(x => x.c.len).sort((a,b) => a-b)[0];\n  return [['Bohrung \u2205', S.holeD+' <small>mm<\/small>'], ['Risse erkannt', n+' <small>von '+on.length+'<\/small>', n===on.length&&on.length>0?'ok':'bad'], ['Kleinster erkannt', small !== undefined ? deC(small,1)+' <small>mm<\/small>' : '\u2013', small !== undefined && small <= 0.5 ? 'ok' : 'hl'], ['Spulen-\u2205', deC(S.coilDia,1)+' <small>mm<\/small>']];\n}\nfunction holeVerdict(C, dir){\n  const st = holeStats(C, dir), on = st.filter(x => x.on), n = st.filter(x => x.det).length;\n  if(!on.length) return {cls:'verdict', html:'Keine Risse eingeschaltet.'};\n  const rows = st.map(x => `<tr><td>${deC(x.c.len,1)} mm<\/td><td>${Math.round(x.c.ang)}\u00b0<\/td><td>${deC(x.c.y,0)} mm<\/td><td>${x.on ? Math.round(x.amp*100/1.6)+' %' : '\u2013'}<\/td><td class=\"${x.det?'v-ok':(x.on?'v-bad':'')}\">${x.on ? (x.det?'erkannt':'\u00fcbersehen') : 'aus'}<\/td><\/tr>`).join('');\n  let h = `<b>${n} von ${on.length} Eckrissen erkannt.<\/b> `;\n  if(S.coilDia > 3.5) h += `Die Spule (\u2205 ${deC(S.coilDia,1)} mm) ist f\u00fcr kurze Risse zu gro\u00df \u2013 <b>kleinere Spule<\/b> w\u00e4hlen (\u2264 3 mm). `;\n  const miss = st.filter(x => x.on && !x.det);\n  if(miss.length) h += `Nicht angezeigt: ${miss.map(x => deC(x.c.len,1)+' mm').join(', ')} \u2013 Schwelle oder Verst\u00e4rkung anpassen. `;\n  h += `Die Sonde rotiert und f\u00e4hrt axial vor; Risse parallel zur Bohrungsachse werden vom Umfangsschnitt der Sonde gekreuzt und sind gut zu finden. `;\n  h += `<table class=\"res\" style=\"margin-top:8px\"><thead><tr><th>L\u00e4nge<\/th><th>Winkel<\/th><th>Tiefe<\/th><th>Spitze<\/th><th>Alarm<\/th><\/tr><\/thead><tbody>${rows}<\/tbody><\/table>`;\n  return {cls: n === on.length ? 'verdict ok' : (n === 0 ? 'verdict bad' : 'verdict'), html:h};\n}\nfunction holePanelHTML(){\n  return `<div class=\"panel riss-only\" data-scn=\"hole\">\n    <h2>Bolzenloch mit Eckrissen<\/h2>\n    ${rangeRow('holeD','Bohrungsdurchmesser',6,16,1,10,'mm')}\n    ${toggleRow('tglH1','Riss 0,5 mm (Eckriss)',true)}${toggleRow('tglH2','Riss 1,0 mm',true)}${toggleRow('tglH3','Riss 2,0 mm',true)}\n    <div class=\"hint\">Rotierende Sonden pr\u00fcfen Befestigungsbohrungen (z. B. Flugzeugstruktur) auf Eckrisse. F\u00fcr den kleinsten Riss braucht man eine <b>kleine Spule<\/b> und eine passend niedrige Schwelle.<\/div>\n  <\/div>`;\n}\nfunction initHole(){\n  $('moreHole').insertAdjacentHTML('beforeend', holePanelHTML());\n  $('holeD').addEventListener('input', () => { S.holeD = parseInt($('holeD').value,10); S.plateLen = Math.max(20, Math.round(Math.PI*S.holeD)); S.plateWidth = 20; $('v_holeD').textContent = S.holeD+' mm'; resetScan(); render(); });\n  [['tglH1',0],['tglH2',1],['tglH3',2]].forEach(q => $(q[0]).addEventListener('click', () => { S.holeOn[q[1]] = !S.holeOn[q[1]]; $(q[0]).classList.toggle('on', S.holeOn[q[1]]); resetScan(); render(); }));\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 Gepulster Wirbelstrom: Wanddicke unter Isolierung (PEC) \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nconst MU0 = 4e-7*Math.PI;\nS.pec = {mat:'q42', tn:12, murAct:90, mur:78, sigma:3.1, lift:60, probe:50, px:50, kappaCal:null, scan:{run:false, pts:[], i:0}, reveal:false, patches:[{x:150, w:70, loss:0.25}, {x:330, w:160, loss:0.40}, {x:500, w:30, loss:0.55}], len:600};\nconst pecKappa = (mur, sg) => MU0*mur*sg*1e6/(Math.PI*Math.PI)*1e-6;           // s/mm\u00b2 (\u03c4 = \u03ba t\u00b2)\nconst pecKNom = () => pecKappa(S.pec.mur, S.pec.sigma);\nfunction pecT(x){ const p = S.pec; let loss = 0; p.patches.forEach(q => { loss += q.loss*Math.exp(-Math.pow((x-q.x)/(q.w/2), 4)); }); return p.tn*(1-Math.min(loss, 0.9)); }\nfunction pecTeff(x){                                                          // Mittelung \u00fcber die Sondenfl\u00e4che\n  const p = S.pec, sg = 0.35*(p.lift + p.probe/2); let sw = 0, sv = 0;\n  for(let dx=-3*sg; dx<=3*sg+1e-6; dx += sg/3){ const w = Math.exp(-dx*dx/(2*sg*sg)), t = pecT(clamp(x+dx, 0, p.len)); sw += w; sv += w*t*t; }\n  return Math.sqrt(sv/sw);\n}\nfunction pecMeasure(x, noise){\n  const p = S.pec, teff = pecTeff(x), tau = pecKappa(p.murAct, p.sigma)*teff*teff, A = Math.exp(-p.lift/50), sn = 8e-4;\n  const ts = [], vs = [];\n  for(let i=0;i<90;i++){ const t = 1e-4*Math.pow(2000, i/89), v = A*Math.exp(-t/tau)*(1-Math.exp(-t/(0.12*tau))) + (noise ? sn*gz() : 0); ts.push(t); vs.push(v); }\n  // Auswertung: sp\u00e4tzeitiger exponentieller Abfall\n  const vmax = Math.max(...vs), idx = vs.indexOf(vmax), pts = [];\n  for(let i=idx+1;i<ts.length;i++){ if(vs[i] > 6*sn && vs[i] < 0.5*vmax) pts.push([ts[i], Math.log(vs[i])]); }\n  let est = null, snr = vmax/sn;\n  if(pts.length >= 5){\n    const n = pts.length, mx = pts.reduce((a,q)=>a+q[0],0)/n, my = pts.reduce((a,q)=>a+q[1],0)/n;\n    let sxx = 0, sxy = 0; pts.forEach(q => { sxx += (q[0]-mx)*(q[0]-mx); sxy += (q[0]-mx)*(q[1]-my); });\n    const slope = sxy/sxx; if(slope < 0){ const tauE = -1/slope, kappa = p.kappaCal !== null ? p.kappaCal : pecKNom(); est = {tau:tauE, t:Math.sqrt(tauE/kappa), n}; }\n  }\n  return {ts, vs, est, snr, A, tau, teff, sn};\n}\nfunction pecHTML(){\n  const side = `\n  <div class=\"panel gef-only\" data-scn=\"pec\">\n    <h2>Gro\u00dflagerring unter Beschichtung<\/h2>\n    <div class=\"hint\" style=\"margin-top:0\">Gepulster Wirbelstrom (PEC) misst die Wandst\u00e4rke gro\u00dfer Lagerringe (z. B. Windkraft- oder Drehverbindungen) <b>durch Beschichtung, Korrosionsschutz oder Isolierung<\/b>: Die Abklingzeit w\u00e4chst mit dem Quadrat der Wanddicke und h\u00e4ngt kaum vom Abstand ab.<\/div>\n    <div class=\"field\"><label for=\"pcMat\">Werkstoff des Rings<\/label><select class=\"sel\" id=\"pcMat\">${selOpts(['q42','gl100','100cr6','mnsi','mo7','mn5'].map(id => [id, matById(id).name]), 'q42')}<\/select><\/div>\n    ${rangeRow('pcTn','Nennwanddicke',6,25,1,12,'mm')}\n    ${rangeRow('pcLift','Beschichtung + Isolierung (Abstand)',0,150,5,60,'mm')}\n    ${rangeRow('pcProbe','Sondendurchmesser',10,100,1,50,'mm')}\n    <div class=\"hint\">Die Permeabilit\u00e4t des Rings weicht von der Normangabe ab (Charge, W\u00e4rmebehandlung) \u2013 deshalb muss an einer intakten Stelle mit bekannter Wanddicke <b>kalibriert<\/b> werden.<\/div>\n  <\/div>\n  <div class=\"panel gef-only\" data-scn=\"pec\">\n    <h2>Messung<\/h2>\n    ${rangeRow('pcX','Messposition',0,600,5,50,'mm')}\n    <div class=\"btnrow\"><button class=\"btn\" id=\"btnPcCal\">Kalibrieren (intakte Stelle bei 50 mm)<\/button><button class=\"btn\" id=\"btnPcClr\">Kalibrierung l\u00f6schen<\/button><\/div>\n    <div class=\"btnrow\"><button class=\"btn primary\" id=\"btnPcScan\">\u25b6 Profil scannen<\/button><button class=\"btn tog\" id=\"btnPcReveal\" aria-pressed=\"false\">Wahre Wand zeigen<\/button><\/div>\n  <\/div>`;\n  const main = `\n  <div class=\"stage gef-only\" data-scn=\"pec\">\n    <div class=\"stage-head\"><span class=\"stage-title\">Gepulster Wirbelstrom \u00b7 Abklingkurve<\/span><span class=\"stage-sub\" id=\"pcSub\">\u2014<\/span><\/div>\n    <svg class=\"view\" id=\"pcDecay\" viewBox=\"0 0 900 340\" role=\"img\" aria-label=\"Abklingkurve des gepulsten Wirbelstroms\"><\/svg>\n    <div class=\"stats\" id=\"pcStats\"><\/div>\n  <\/div>\n  <div class=\"stage gef-only\" data-scn=\"pec\">\n    <div class=\"stage-head\"><span class=\"stage-title\">Wanddickenprofil entlang des Rings<\/span><\/div>\n    <svg class=\"view\" id=\"pcProfile\" viewBox=\"0 0 900 300\" role=\"img\" aria-label=\"Wanddickenprofil\"><\/svg>\n    <div class=\"verdict\" id=\"pcVerdict\" style=\"margin-top:10px\">\u2014<\/div>\n  <\/div>`;\n  return {side, main};\n}\nfunction initPec(){\n  const h = pecHTML(); $('moreSide').insertAdjacentHTML('beforeend', h.side); $('moreMain').insertAdjacentHTML('beforeend', h.main);\n  const p = S.pec, reset = () => { p.scan.pts = []; p.scan.run = false; };\n  $('pcMat').addEventListener('change', () => { const mt = matById($('pcMat').value); p.mat = mt.id; p.sigma = mt.sigma; p.mur = mt.mu; p.murAct = Math.round(mt.mu*1.17); p.kappaCal = null; reset(); render(); });\n  bindRow('pcTn', p, 'tn', 'mm', 0, () => { p.kappaCal = null; reset(); });\n  bindRow('pcLift', p, 'lift', 'mm', 0, reset); bindRow('pcProbe', p, 'probe', 'mm', 0, reset);\n  bindRow('pcX', p, 'px', 'mm', 0);\n  $('btnPcCal').addEventListener('click', () => { const m = pecMeasure(50, true); if(m.est){ p.kappaCal = m.est.tau/(p.tn*p.tn); } render(); });\n  $('btnPcClr').addEventListener('click', () => { p.kappaCal = null; reset(); render(); });\n  $('btnPcReveal').addEventListener('click', () => { p.reveal = !p.reveal; $('btnPcReveal').classList.toggle('on', p.reveal); $('btnPcReveal').setAttribute('aria-pressed', p.reveal); $('btnPcReveal').textContent = p.reveal ? 'Wahre Wand verbergen' : 'Wahre Wand zeigen'; render(); });\n  $('btnPcScan').addEventListener('click', () => {\n    if(p.scan.run) return; p.scan.pts = []; p.scan.i = 0; p.scan.run = true;\n    const step = () => { if(!p.scan.run) return; const x = p.scan.i*10, m = pecMeasure(x, true); p.scan.pts.push({x, t:m.est ? m.est.t : null, snr:m.snr}); p.scan.i++; render(); if(x >= p.len){ p.scan.run = false; render(); } else setTimeout(step, 45); };\n    step();\n  });\n}\nfunction renderPec(){\n  const p = S.pec, m = pecMeasure(p.px, false), mn = pecMeasure(p.px, true), cal = p.kappaCal !== null;\n  const W = 900, H = 340, L = 56, R = 20, T = 18, B = 40, X = t => L+Math.log10(t/1e-4)/Math.log10(2000)*(W-L-R), lo = -5.5, hi = 0.2, Y = v => T+(1-(Math.log10(Math.max(v,1e-7))-lo)/(hi-lo))*(H-T-B);\n  let s = `<rect x=\"${L}\" y=\"${T}\" width=\"${W-L-R}\" height=\"${H-T-B}\" fill=\"var(--bg-2)\" stroke=\"var(--border)\"/>`;\n  [1e-4,1e-3,1e-2,1e-1].forEach(t => { s += `<line x1=\"${X(t).toFixed(1)}\" y1=\"${T}\" x2=\"${X(t).toFixed(1)}\" y2=\"${H-B}\" stroke=\"var(--border-soft)\"/>` + txt(X(t), H-B+16, (t*1000 < 1 ? deC(t*1000,1) : deC(t*1000,0))+' ms', {anchor:'middle', size:9.5, fill:'var(--text-faint)'}); });\n  s += txt(X(0.19), H-B+16, '0,2 s', {anchor:'middle', size:9.5, fill:'var(--text-faint)'});\n  [0,-1,-2,-3,-4,-5].forEach(e => { s += `<line x1=\"${L}\" y1=\"${Y(Math.pow(10,e)).toFixed(1)}\" x2=\"${W-R}\" y2=\"${Y(Math.pow(10,e)).toFixed(1)}\" stroke=\"var(--border-soft)\"/>` + txt(L-6, Y(Math.pow(10,e))+3, '10^'+e, {anchor:'end', size:9, fill:'var(--text-faint)'}); });\n  const refN = pecMeasure(50, false);                // Referenz: intakte Nennwand bei 50 mm\n  const poly = (mm, col, dash) => `<polyline fill=\"none\" stroke=\"${col}\" stroke-width=\"2\" ${dash?'stroke-dasharray=\"6,4\"':''} points=\"${mm.ts.map((t,i) => X(t).toFixed(1)+','+Y(mm.vs[i]).toFixed(1)).join(' ')}\"/>`;\n  s += poly(refN, 'var(--green)', true);\n  { const seg = []; mn.ts.forEach((t,i) => { if(mn.vs[i] > Math.pow(10, lo)) seg.push(X(t).toFixed(1)+','+clamp(Y(mn.vs[i]), T, H-B).toFixed(1)); }); if(seg.length > 1) s += `<polyline fill=\"none\" stroke=\"var(--amber)\" stroke-width=\"1.4\" opacity=\".75\" points=\"${seg.join(' ')}\"/>`; }\n  s += poly(m, 'var(--cyan)', false);\n  s += `<line x1=\"${L}\" y1=\"${Y(mn.sn*6).toFixed(1)}\" x2=\"${W-R}\" y2=\"${Y(mn.sn*6).toFixed(1)}\" stroke=\"var(--red)\" stroke-dasharray=\"3,4\"/>` + txt(W-R-4, Y(mn.sn*6)-4, 'Auswertegrenze (6 \u00d7 Rauschen)', {anchor:'end', size:9.5, fill:'var(--red)'});\n  if(mn.est){ const tauE = mn.est.tau; s += `<line x1=\"${X(tauE).toFixed(1)}\" y1=\"${T}\" x2=\"${X(tauE).toFixed(1)}\" y2=\"${H-B}\" stroke=\"var(--violet)\" stroke-width=\"1.4\" stroke-dasharray=\"5,4\"/>` + txt(X(tauE)+5, T+14, '\u03c4 = '+deC(tauE*1000,1)+' ms', {size:10, fill:'var(--violet)'}); }\n  s += txt(L+8, T+14, 'cyan: Messung \u00b7 gr\u00fcn gestrichelt: Referenz (Nennwand) \u00b7 orange: verrauschtes Signal', {size:9.5, fill:'var(--text-faint)'}) + txt(14, H/2, 'Signal', {size:9.5, fill:'var(--text-faint)'});\n  svgE('pcDecay', s);\n  const tTrue = pecT(p.px);\n  $('pcSub').textContent = 'Position '+p.px+' mm \u00b7 '+(cal ? 'kalibriert' : 'nicht kalibriert (Nenn-\u00b5r = '+p.mur+' angenommen)');\n  const tEst = mn.est ? mn.est.t : null, loss = tEst !== null ? (1-tEst/p.tn)*100 : null;\n  $('pcStats').innerHTML = [\n    ['Abklingzeit \u03c4', mn.est ? deC(mn.est.tau*1000,1)+' <small>ms<\/small>' : '\u2013', ''], ['Wanddicke (gemessen)', tEst !== null ? deC(tEst,1)+' <small>mm<\/small>' : '\u2013', ''],\n    ['Wandverlust', loss !== null ? deC(loss,0)+' <small>%<\/small>' : '\u2013', loss !== null && loss > 25 ? 'bad' : 'ok'], ['Signal/Rauschen', Math.round(mn.snr)+'', mn.snr > 80 ? 'ok' : 'bad'],\n    ['Wahre Wanddicke', p.reveal ? deC(tTrue,1)+' <small>mm<\/small>' : '(verdeckt)', ''], ['Sondenfl\u00e4che \u00b1', deC(0.35*(p.lift+p.probe/2),0)+' <small>mm<\/small>', ''],\n  ].map(c => `<div class=\"stat ${c[2]}\"><div class=\"k\">${c[0]}<\/div><div class=\"v\">${c[1]}<\/div><\/div>`).join('');\n  // Profil\n  const PW = 900, PH = 300, PL = 56, PR = 20, PT = 18, PB = 36, tmax = p.tn*1.2, XP = x => PL+x/p.len*(PW-PL-PR), YP = t => PT+(1-t/tmax)*(PH-PT-PB);\n  s = `<rect x=\"${PL}\" y=\"${PT}\" width=\"${PW-PL-PR}\" height=\"${PH-PT-PB}\" fill=\"var(--bg-2)\" stroke=\"var(--border)\"/>`;\n  [0.8,0.6].forEach((f,i) => { s += `<line x1=\"${PL}\" y1=\"${YP(p.tn*f).toFixed(1)}\" x2=\"${PW-PR}\" y2=\"${YP(p.tn*f).toFixed(1)}\" stroke=\"${i?'var(--red)':'var(--amber)'}\" stroke-dasharray=\"4,4\" opacity=\".7\"/>` + txt(PW-PR-4, YP(p.tn*f)-4, (f*100)+' % Nennwand', {anchor:'end', size:9, fill:i?'var(--red)':'var(--amber)'}); });\n  s += `<line x1=\"${PL}\" y1=\"${YP(p.tn).toFixed(1)}\" x2=\"${PW-PR}\" y2=\"${YP(p.tn).toFixed(1)}\" stroke=\"var(--green)\" stroke-dasharray=\"6,4\"/>` + txt(PL+4, YP(p.tn)-5, 'Nennwand '+p.tn+' mm', {size:9.5, fill:'var(--green)'});\n  if(p.reveal){ const pts = []; for(let x=0;x<=p.len;x+=5) pts.push(XP(x).toFixed(1)+','+YP(pecT(x)).toFixed(1)); s += `<polyline fill=\"none\" stroke=\"var(--text-dim)\" stroke-width=\"2\" points=\"${pts.join(' ')}\"/>` + txt(PL+4, PH-PB-6, 'wahre Wand', {size:9.5, fill:'var(--text-dim)'}); }\n  const good = p.scan.pts.filter(q => q.t !== null);\n  if(good.length) s += `<polyline fill=\"none\" stroke=\"var(--cyan)\" stroke-width=\"2.4\" points=\"${good.map(q => XP(q.x).toFixed(1)+','+YP(q.t).toFixed(1)).join(' ')}\"/>` + good.map(q => `<circle cx=\"${XP(q.x).toFixed(1)}\" cy=\"${YP(q.t).toFixed(1)}\" r=\"3.4\" fill=\"var(--cyan)\"/>`).join('');\n  p.scan.pts.filter(q => q.t === null).forEach(q => { s += `<circle cx=\"${XP(q.x).toFixed(1)}\" cy=\"${YP(0.4*p.tn).toFixed(1)}\" r=\"4\" fill=\"none\" stroke=\"var(--red)\"/>`; });\n  s += `<line x1=\"${XP(p.px).toFixed(1)}\" y1=\"${PT}\" x2=\"${XP(p.px).toFixed(1)}\" y2=\"${PH-PB}\" stroke=\"var(--amber)\" stroke-width=\"1.6\"/>`;\n  for(let x=0;x<=p.len;x+=100) s += txt(XP(x), PH-PB+16, x+' mm', {anchor:'middle', size:9, fill:'var(--text-faint)'});\n  s += txt(14, PH/2, 'Wand mm', {size:9.5, fill:'var(--text-faint)'});\n  svgE('pcProfile', s);\n  const vd = $('pcVerdict'); let h, cls = 'verdict';\n  const minT = good.length ? Math.min(...good.map(q => q.t)) : null, trueMin = Math.min(...p.patches.map(q => p.tn*(1-q.loss)));\n  if(!cal){ h = '<b>Nicht kalibriert.<\/b> Die Permeabilit\u00e4t des Werkstoffs ist unbekannt (\u00b5r \u2248 '+p.murAct+' statt '+p.mur+'): Die Wanddicke wird um \u2248 +'+Math.round((Math.sqrt(p.murAct/p.mur)-1)*100)+' % verf\u00e4lscht. An der intakten Stelle bei 50 mm kalibrieren. '; cls += ' bad'; }\n  else h = '<b>Kalibriert.<\/b> ';\n  h += `Bei ${p.lift} mm Abstand ist die Amplitude auf ${Math.round(mn.A*100)} % abgesunken (Signal/Rauschen ${Math.round(mn.snr)}); die Abklingzeit selbst bleibt abstandsunabh\u00e4ngig. `;\n  if(mn.snr < 80) h += '<b>Zu wenig Signal \u2013 Abstand verringern oder gr\u00f6\u00dfere Sonde w\u00e4hlen.<\/b> ';\n  if(good.length > 5 && minT !== null){\n    h += `Das Profil zeigt eine Mindestwand von \u2248 ${deC(minT,1)} mm`; h += p.reveal ? ` (wahr: ${deC(trueMin,1)} mm).` : '.';\n    h += ` Wegen der Sondenfl\u00e4che (\u00b1 ${deC(0.35*(p.lift+p.probe/2),0)} mm) werden kleine Anfressungen verschmiert und zu flach angezeigt.`;\n    if(cal) cls += ' ok';\n  } else if(cal) h += 'Profil scannen, um Anfressungen unter der Isolierung zu finden.';\n  vd.className = cls; vd.innerHTML = h;\n  $('bProbe').textContent = 'PEC-Sonde'; $('bProbe').className = 'badge acc'; $('bMat').textContent = matById(p.mat).short;\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 Verteilung \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nfunction renderMeas(){\n  if(S.mode === 'cond') renderCond(); else if(S.mode === 'coat') renderCoat(); else if(S.mode === 'mfm') renderMfm(); else renderPec();\n}\nfunction initMore(){ initCond(); initCoat(); initPec(); initMfm(); initHole(); }\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 Mehrfrequenz-Mischtechnik: Lagerh\u00fclse mit St\u00fctzring \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nconst MFM_MATS = {'100cr6':{name:'100Cr6 (ges\u00e4ttigt)', sigma:2.35}, mnsi:{name:'100CrMnSi6-4 (ges\u00e4ttigt)', sigma:2.2}, x47:{name:'X47Cr14 (rostfrei)', sigma:1.7}, v2a:{name:'Edelstahl 1.4301', sigma:1.4}};\nS.mfm = {mat:'100cr6', wall:1.1, plate:true, f1:100, f2:400, mixF:0, mixA:0, thr:0.12, tol:25, calMix:false, calRef:false, ref:null,\n         pos:0, run:false, speed:1,\n         defs:[{id:'D1', x:55,  kind:'OD', dep:0.40, on:true, name:'Au\u00dfen-Anfressung 40 % (frei)'},\n               {id:'D2', x:140, kind:'ID', dep:0.30, on:true, name:'Innen-Fehler 30 % (frei)'},\n               {id:'D3', x:90,  kind:'OD', dep:0.45, on:true, name:'Au\u00dfen-Anfressung 45 % unter dem Ring'}]};\nconst MFM_L = 200, PLATE_X0 = 80, PLATE_X1 = 100;\nconst mfmDelta = f => 503/Math.sqrt(f*1e3*MFM_MATS[S.mfm.mat].sigma);                // mm\nconst mfmPlateP = x => 1/(1+Math.exp(-(x-PLATE_X0)/1.4))/(1+Math.exp((x-PLATE_X1)/1.4));\nconst cpx = (a, p) => ({re:a*Math.cos(p), im:a*Math.sin(p)});\nconst mfNz = (x, s) => { const v = Math.sin(x*127.1+s*311.7)*43758.5453; return v-Math.floor(v)-0.5; };   // ortsfestes, flackerfreies Rauschen\nfunction mfmPlateVec(f){ const k = S.mfm.wall/mfmDelta(f); return cpx(4.0*Math.exp(-1.1*k), 1.25-0.55*k); }\nfunction mfmDefVec(d, f){\n  const k = S.mfm.wall/mfmDelta(f), A = 1.1*d.dep*(0.2+0.8*(1-Math.exp(-k)))*(d.kind === 'ID' ? 1.15 : 1);\n  return cpx(A, 0.15+(d.kind === 'OD' ? 1.10 : 0.30)*k);                    // Au\u00dfenfehler drehen mit der Frequenz deutlich st\u00e4rker\n}\nfunction mfmChannel(x, f, seed){\n  const m = S.mfm; let re = 0, im = 0;\n  if(m.plate){ const v = mfmPlateVec(f), p = mfmPlateP(x); re += v.re*p; im += v.im*p; }\n  m.defs.forEach(d => { if(!d.on) return; const g = Math.exp(-Math.pow((x-d.x)/3, 2)/2), v = mfmDefVec(d, f); re += v.re*g; im += v.im*g; });\n  return {re:re+0.03*mfNz(x, seed), im:im+0.03*mfNz(x, seed+1)};\n}\nconst mfmR = () => cpx(S.mfm.mixF, S.mfm.mixA*Math.PI/180);\nfunction mfmMixOf(a, b){ const r = mfmR(); return {re:a.re-(r.re*b.re-r.im*b.im), im:a.im-(r.re*b.im+r.im*b.re)}; }\nconst mfmMixAt = x => mfmMixOf(mfmChannel(x, S.mfm.f2, 3), mfmChannel(x, S.mfm.f1, 7));\nfunction mfmInvalidate(all){ const m = S.mfm; m.calRef = false; m.ref = null; if(all) m.calMix = false; }\nfunction mfmCalPlate(){                                                   // Referenz-St\u00fctzring (ohne Fehler) messen \u2192 Mischkoeffizient\n  const m = S.mfm, a = mfmPlateVec(m.f2), b = mfmPlateVec(m.f1);\n  const na = {re:a.re*(1+0.02*gz()), im:a.im*(1+0.02*gz())}, nb = {re:b.re*(1+0.02*gz()), im:b.im*(1+0.02*gz())};\n  const den = nb.re*nb.re+nb.im*nb.im, rr = (na.re*nb.re+na.im*nb.im)/den, ri = (na.im*nb.re-na.re*nb.im)/den;\n  m.mixF = clamp(Math.round(Math.hypot(rr, ri)*100)/100, 0, 3); m.mixA = Math.round(Math.atan2(ri, rr)*180/Math.PI); m.calMix = true; m.calRef = false; m.ref = null;\n  $('mfMixF').value = m.mixF; $('mfMixA').value = m.mixA; $('v_mfMixF').textContent = deC(m.mixF,2)+' '; $('v_mfMixA').textContent = m.mixA+' \u00b0';\n}\nfunction mfmCalRef(){                                                     // Kalibrierrohr mit ID- und OD-Referenzfehler (30 %) \u2192 Phasenfelder im Mischkanal\n  const m = S.mfm, refs = {};\n  ['ID','OD'].forEach(k => { const d = {kind:k, dep:0.3}, v = mfmMixOf(mfmDefVec(d, m.f2), mfmDefVec(d, m.f1)); refs[k] = {a:Math.hypot(v.re, v.im), ph:Math.atan2(v.im, v.re)*180/Math.PI}; });\n  m.ref = refs; m.calRef = true;\n}\nfunction mfmStats(){\n  const m = S.mfm, out = [], a2 = mfmPlateVec(m.f2), a1 = mfmPlateVec(m.f1), pm = mfmMixOf(a2, a1);\n  m.defs.forEach(d => {\n    let pk = 0, pk2 = 0, pkDef = 0, bg = 0, bv = {re:0, im:0};\n    for(let x = d.x-6; x <= d.x+6; x += 0.5){\n      const z = mfmMixAt(x), b = mfmChannel(x, m.f2, 3), p = m.plate ? mfmPlateP(x) : 0;\n      const mg = Math.hypot(z.re, z.im); if(mg > pk){ pk = mg; bv = z; }\n      pk2 = Math.max(pk2, Math.hypot(b.re, b.im));\n      const zd = mfmMixOf(mfmDefOnly(x, m.f2), mfmDefOnly(x, m.f1)); pkDef = Math.max(pkDef, Math.hypot(zd.re, zd.im)); bg = Math.max(bg, Math.hypot(pm.re*p, pm.im*p));\n    }\n    const under = d.x >= PLATE_X0-2 && d.x <= PLATE_X1+2, det = d.on && pkDef > m.thr && pk > m.thr && pkDef > 1.2*bg;\n    let cls = null;\n    if(det && m.calRef && m.ref){\n      const ph = Math.atan2(bv.im, bv.re)*180/Math.PI, dI = angDiff(ph, m.ref.ID.ph), dO = angDiff(ph, m.ref.OD.ph);\n      cls = {ph, kind:(Math.min(dI, dO) <= m.tol) ? (dI < dO ? 'ID' : 'OD') : null, depth:Math.round(30*pk/m.ref[dI < dO ? 'ID' : 'OD'].a)};\n      cls.ok = cls.kind === d.kind;\n    }\n    out.push({d, pk, pk2, pkDef, bg, det, under, cls, ph:Math.atan2(bv.im, bv.re)*180/Math.PI});\n  });\n  return out;\n}\nfunction mfmDefOnly(x, f){ let re = 0, im = 0; S.mfm.defs.forEach(d => { if(!d.on) return; const g = Math.exp(-Math.pow((x-d.x)/3, 2)/2), v = mfmDefVec(d, f); re += v.re*g; im += v.im*g; }); return {re, im}; }\n\nfunction mfmHTML(){\n  const mats = Object.keys(MFM_MATS).map(k => [k, MFM_MATS[k].name]);\n  const side = `\n  <div class=\"panel gef-only\" data-scn=\"mfm\">\n    <h2>Lagerh\u00fclse mit St\u00fctzring<\/h2>\n    <div class=\"hint\" style=\"margin-top:0\">Eine Bobbin-Sonde wird einmal durch die hohle Lagerh\u00fclse (Hohlrolle, Rohrabschnitt, ges\u00e4ttigt magnetisiert) gezogen. Der aufgepresste St\u00fctzring liefert ein Signal, das viel gr\u00f6\u00dfer ist als die Fehler. Die <b>Mehrfrequenz-Mischtechnik<\/b> subtrahiert einen zweiten, skalierten und gedrehten Frequenzkanal und unterdr\u00fcckt so den St\u00fctzring.<\/div>\n    <div class=\"row2\">\n      <div class=\"field\"><label for=\"mfMat\">Werkstoff der H\u00fclse<\/label><select class=\"sel\" id=\"mfMat\">${selOpts(mats, '100cr6')}<\/select><\/div>\n      ${rangeRow('mfWall','Wanddicke',0.7,1.6,0.05,1.1,'mm')}\n    <\/div>\n    ${toggleRow('tglMfPlate','St\u00fctzring bei 80\u2013100 mm',true)}\n    ${toggleRow('tglMfD1','D1 \u00b7 Au\u00dfen-Anfressung 40 %, frei',true)}\n    ${toggleRow('tglMfD2','D2 \u00b7 Innen-Fehler 30 %, frei',true)}\n    ${toggleRow('tglMfD3','D3 \u00b7 Au\u00dfen-Anfressung 45 % unter dem Ring',true)}\n  <\/div>\n  <div class=\"panel gef-only\" data-scn=\"mfm\">\n    <h2>Pr\u00fcflauf<\/h2>\n    <div class=\"btnrow\"><button class=\"btn primary\" id=\"btnMfRun\">\u25b6 H\u00fclse durchziehen<\/button><button class=\"btn\" id=\"btnMfAll\">Ganzes Rohr<\/button><button class=\"btn\" id=\"btnMfReset\">\u21ba Zur\u00fcck<\/button><\/div>\n    <div class=\"seg\" id=\"mfSpeed\" style=\"grid-template-columns:repeat(3,1fr);margin-top:6px\"><button data-s=\"1\" class=\"sel\">1\u00d7<\/button><button data-s=\"2\">2\u00d7<\/button><button data-s=\"4\">4\u00d7<\/button><\/div>\n    ${rangeRow('mfPos','Position der Sonde',0,200,1,0,'mm')}\n  <\/div>\n  <div class=\"panel gef-only\" data-scn=\"mfm\">\n    <h2>Frequenzen, Mischung &amp; Kalibrierung<\/h2>\n    <div class=\"row2\">${rangeRow('mfF1','Frequenz 1 (niedrig)',20,300,10,100,'kHz')}${rangeRow('mfF2','Frequenz 2 (hoch)',150,900,10,400,'kHz')}<\/div>\n    <div class=\"row2\">${rangeRow('mfMixF','Mischfaktor',0,3,0.01,0,'')}${rangeRow('mfMixA','Mischwinkel',-180,180,1,0,'\u00b0')}<\/div>\n    <div class=\"btnrow\"><button class=\"btn\" id=\"btnMfCalPlate\">\u2460 Referenz-St\u00fctzring messen \u2192 Mischung<\/button><button class=\"btn\" id=\"btnMfCalRef\">\u2461 Kalibrierh\u00fclse ID/OD messen \u2192 Phasenfelder<\/button><\/div>\n    <div class=\"row2\">${rangeRow('mfThr','Alarmschwelle',0.03,0.5,0.01,0.12,'')}${rangeRow('mfTol','Phasentoleranz \u00b1',8,45,1,25,'\u00b0')}<\/div>\n    <div class=\"hint\" id=\"mfCalState\">\u2014<\/div>\n  <\/div>`;\n  const main = `\n  <div class=\"stage gef-only\" data-scn=\"mfm\">\n    <div class=\"stage-head\"><span class=\"stage-title\">Mehrfrequenz-Pr\u00fcfbild \u00b7 H\u00fclse wird durchgezogen<\/span><span class=\"stage-sub\" id=\"mfSub\">\u2014<\/span><\/div>\n    <svg class=\"view\" id=\"mfWin\" viewBox=\"0 0 1200 640\" role=\"img\" aria-label=\"Rohr, drei Kan\u00e4le mit Impedanzebene und Streifenschreiber\"><\/svg>\n  <\/div>\n  <div class=\"stagegrid wide gef-only\" data-scn=\"mfm\">\n    <div class=\"stage\"><div class=\"stage-head\"><span class=\"stage-title\">Auswertung der Fehler<\/span><\/div><div id=\"mfTable\" style=\"padding:0 14px 8px\"><\/div><\/div>\n    <div class=\"stage\"><div class=\"stage-head\"><span class=\"stage-title\">Beurteilung<\/span><\/div><div class=\"verdict\" id=\"mfVerdict\" style=\"margin:6px 12px 12px\">\u2014<\/div><\/div>\n  <\/div>`;\n  return {side, main};\n}\nlet mfRaf = null, mfLast = 0;\nfunction mfmLoop(t){\n  const m = S.mfm;\n  if(!m.run || S.mode !== 'mfm'){ m.run = false; mfRaf = null; return; }\n  const dt = Math.min(0.1, (t-mfLast)/1000); mfLast = t;\n  m.pos = Math.min(MFM_L, m.pos+m.speed*40*dt); if(m.pos >= MFM_L) m.run = false;\n  $('mfPos').value = m.pos; render();\n  mfRaf = m.run ? requestAnimationFrame(mfmLoop) : null;\n}\nfunction mfmStart(){ const m = S.mfm; if(m.pos >= MFM_L-0.5) m.pos = 0; m.run = true; mfLast = performance.now(); if(!mfRaf) mfRaf = requestAnimationFrame(mfmLoop); }\nfunction initMfm(){\n  const h = mfmHTML(); $('moreSide').insertAdjacentHTML('beforeend', h.side); $('moreMain').insertAdjacentHTML('beforeend', h.main);\n  const m = S.mfm, inv = () => mfmInvalidate(true), invRef = () => { m.calMix = false; mfmInvalidate(false); };\n  $('mfMat').addEventListener('change', () => { m.mat = $('mfMat').value; inv(); render(); });\n  bindRow('mfWall', m, 'wall', 'mm', 2, inv); bindRow('mfF1', m, 'f1', 'kHz', 0, inv); bindRow('mfF2', m, 'f2', 'kHz', 0, inv);\n  bindRow('mfMixF', m, 'mixF', '', 2, invRef); bindRow('mfMixA', m, 'mixA', '\u00b0', 0, invRef); bindRow('mfThr', m, 'thr', '', 2); bindRow('mfTol', m, 'tol', '\u00b0', 0);\n  bindRow('mfPos', m, 'pos', 'mm', 0, () => { m.run = false; });\n  bindTog('tglMfPlate', m, 'plate', inv); m.defs.forEach((d,i) => bindTog('tglMfD'+(i+1), d, 'on'));\n  $('btnMfRun').addEventListener('click', () => { if(m.run){ m.run = false; render(); } else { mfmStart(); } });\n  $('btnMfAll').addEventListener('click', () => { m.run = false; m.pos = MFM_L; $('mfPos').value = MFM_L; render(); });\n  $('btnMfReset').addEventListener('click', () => { m.run = false; m.pos = 0; $('mfPos').value = 0; render(); });\n  $('mfSpeed').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; m.speed = parseInt(b.dataset.s,10); document.querySelectorAll('#mfSpeed button').forEach(x => x.classList.toggle('sel', x === b)); });\n  $('btnMfCalPlate').addEventListener('click', () => { mfmCalPlate(); render(); });\n  $('btnMfCalRef').addEventListener('click', () => { mfmCalRef(); render(); });\n}\nfunction renderMfm(){\n  const m = S.mfm, st = mfmStats(), W = 1200, H = 640, pass = d => m.pos >= d.x-2; let s = '';\n  $('v_mfPos').textContent = Math.round(m.pos)+' mm'; $('mfPos').value = m.pos;\n  $('btnMfRun').textContent = m.run ? '\u23f8 Pause' : (m.pos >= MFM_L-0.5 ? '\u21bb Noch einmal durchziehen' : (m.pos > 0 ? '\u25b6 Weiterziehen' : '\u25b6 H\u00fclse durchziehen'));\n  // \u2500\u2500 Rohrschema \u2500\u2500\n  const TX0 = 60, TX1 = 1140, TX = x => TX0+x/MFM_L*(TX1-TX0), ty = 72, th = 44, wl = 9;\n  s += `<rect x=\"${TX0}\" y=\"${ty-th/2}\" width=\"${TX1-TX0}\" height=\"${th}\" rx=\"4\" fill=\"var(--panel-2)\" stroke=\"var(--border)\" stroke-width=\"1.6\"/><rect x=\"${TX0}\" y=\"${ty-th/2+wl}\" width=\"${TX1-TX0}\" height=\"${th-2*wl}\" fill=\"var(--bg-2)\" stroke=\"var(--border)\"/>`;\n  if(m.plate) s += `<rect x=\"${TX(PLATE_X0)}\" y=\"${ty-th/2-16}\" width=\"${TX(PLATE_X1)-TX(PLATE_X0)}\" height=\"${th+32}\" fill=\"var(--text-faint)\" fill-opacity=\".35\" stroke=\"var(--text-dim)\" stroke-width=\"1.4\"/>` + txt(TX(90), ty-th/2-22, 'St\u00fctzring', {anchor:'middle', size:11, fill:'var(--text-dim)'});\n  m.defs.forEach(d => { if(!d.on) return; const od = d.kind === 'OD', cy = od ? ty-th/2+wl/2 : ty+th/2-wl/2, c = pass(d) ? 'var(--red)' : 'var(--text-faint)';\n    s += `<circle cx=\"${TX(d.x)}\" cy=\"${cy}\" r=\"${(3+d.dep*9).toFixed(1)}\" fill=\"${c}\" fill-opacity=\".85\"/>` + txt(TX(d.x), od ? ty-th/2-6 : ty+th/2+16, d.id+(od ? ' au\u00dfen' : ' innen'), {anchor:'middle', size:10.5, fill:c}); });\n  s += `<g><rect x=\"${(TX(m.pos)-17).toFixed(1)}\" y=\"${ty-9}\" width=\"34\" height=\"18\" rx=\"9\" fill=\"var(--amber)\" fill-opacity=\".85\" stroke=\"var(--amber)\"/><circle cx=\"${(TX(m.pos)-8).toFixed(1)}\" cy=\"${ty}\" r=\"4\" fill=\"var(--bg)\"/><circle cx=\"${(TX(m.pos)+8).toFixed(1)}\" cy=\"${ty}\" r=\"4\" fill=\"var(--bg)\"/><\/g>`;\n  s += txt(TX(m.pos), ty+th/2+34, 'Bobbin '+Math.round(m.pos)+' mm', {anchor:'middle', size:10.5, fill:'var(--amber)'});\n  s += txt(W-60, 22, '\u2190 Sonde wird durch die H\u00fclse gezogen', {anchor:'end', size:10, fill:'var(--text-faint)'});\n  // \u2500\u2500 drei Fenster \u2500\u2500\n  const rotP = f => -mfmPlateVec(f).im*0 + -Math.atan2(mfmPlateVec(f).im, mfmPlateVec(f).re);\n  const WIN = [{x0:10, ttl:'Kanal 1 \u00b7 '+m.f1+' kHz', f:m.f1, rng:2.6, rot:rotP(m.f1), col:'var(--violet)', kind:'ch'},\n               {x0:405, ttl:'Kanal 2 \u00b7 '+m.f2+' kHz', f:m.f2, rng:1.3, rot:rotP(m.f2), col:'var(--cyan)', kind:'ch'},\n               {x0:800, ttl:'Mischkanal = Kanal 2 \u2212 '+deC(m.mixF,2)+' \u2220 '+m.mixA+'\u00b0 \u00d7 Kanal 1', f:0, rng:1.0, rot:0, col:'var(--amber)', kind:'mix'}];\n  const gy = 150, R = 105, sw = 385;\n  WIN.forEach(w => {\n    const cx = w.x0+sw/2, cy = gy+30+R+6, vec = x => w.kind === 'mix' ? mfmMixAt(x) : mfmChannel(x, w.f, w.f === m.f1 ? 7 : 3);\n    const rot = v => { const c = Math.cos(w.rot), sn = Math.sin(w.rot); return {re:v.re*c-v.im*sn, im:v.re*sn+v.im*c}; };\n    s += `<rect x=\"${w.x0}\" y=\"${gy}\" width=\"${sw}\" height=\"${H-gy-6}\" rx=\"8\" fill=\"var(--panel-2)\" stroke=\"var(--border-soft)\"/>` + txt(w.x0+10, gy+17, w.ttl, {size:11, fill:w.col});\n    // Impedanzebene\n    s += `<rect x=\"${cx-R}\" y=\"${cy-R}\" width=\"${2*R}\" height=\"${2*R}\" fill=\"var(--bg-2)\" stroke=\"var(--border)\"/><line x1=\"${cx-R}\" y1=\"${cy}\" x2=\"${cx+R}\" y2=\"${cy}\" stroke=\"var(--border-soft)\"/><line x1=\"${cx}\" y1=\"${cy-R}\" x2=\"${cx}\" y2=\"${cy+R}\" stroke=\"var(--border-soft)\"/>`;\n    if(w.kind === 'mix' && m.calRef && m.ref){                                   // Phasenfelder (Toleranzfelder) aus dem Kalibrierrohr\n      ['ID','OD'].forEach(k => { const ph = m.ref[k].ph, a0 = ph-m.tol, a1 = ph+m.tol, r1 = R, pt = (r, a) => [cx+r*Math.cos(a*Math.PI/180), cy-r*Math.sin(a*Math.PI/180)], p0 = pt(r1, a0), p1 = pt(r1, a1);\n        s += `<path d=\"M${cx},${ bi]), {anchor:'middle', size:9.5, fill:'var(--green)'});\n  s += txt(14, H/2, 'Abstand', {size:9.5, fill:'var(--text-faint)'}) + txt((L+W-R)/2, H-4, 'Frequenz', {anchor:'middle', size:9.5, fill:'var(--text-faint)'});\n  patchSvg(el, s);\n  $('gFreqInfo').textContent = ds[bi] > 1.2 ? 'Abstand des Pr\u00fcfteils vom Soll-Toleranzfeld \u00b7 beste Frequenz \u2248 '+fmtFreqShort(fs[bi]) : 'Das Pr\u00fcfteil liegt bei jeder Frequenz im Toleranzfeld des Solls \u2013 Gef\u00fcge entspricht dem Soll.';\n}\nfunction renderGef(){\n  const A = gefAnalyse(), st = A.st, hid = gHidden(), soll = gSoll(), top = A.rank[0], sec = A.rank[1];\n  const ptop = top.p, psec = (sec && sec !== top) ? sec.p : 0;\n  drawMicro(); drawGefMap(A); drawGefFreq(A);\n  // Kennwerte\n  $('vGTa').textContent = hid ? '?' : S.gef.ta+' \u00b0C'; $('vGTt').textContent = hid ? '?' : S.gef.tt+' \u00b0C'; $('gCool').disabled = hid; $('gTa').disabled = hid; $('vGFreq').textContent = fmtFreq(A.f); $('vGDia').textContent = S.partDia+' mm'; $('vGFill').textContent = deC(S.fill,2);\n  $('gTt').disabled = hid || (S.gef.cool === 'luft' || S.gef.cool === 'ofen');\n  $('gkS').textContent = hid ? '? (verdeckt)' : st.name;\n  $('gkH').textContent = hid ? '?' : '\u2248 '+Math.round(st.hv)+' HV';\n  $('gkSig').textContent = hid ? '?' : deC(st.sigma,2)+' MS/m';\n  $('gkMu').textContent = hid ? '?' : deC(st.mu,0);\n  $('gDecide').style.display = hid ? '' : 'none';\n  $('gMicroInfo').textContent = hid ? 'Teil aus dem Los \u2013 Gef\u00fcge verdeckt' : st.name;\n  $('gConstit').innerHTML = hid ? 'Gef\u00fcgeanteile des Pr\u00fcfteils unbekannt \u2013 bestimmen Sie das Gef\u00fcge \u00fcber Landkarte und Frequenzgang.'\n    : '<b>Pr\u00fcfteil:<\/b> '+st.comp.map(c => c[0]+' '+c[1]+' %').join(' \u00b7 ')+' &nbsp;|&nbsp; <b>Referenz:<\/b> '+gsById(S.gef.view).comp.map(c => c[0]+' '+c[1]+' %').join(' \u00b7 ');\n  // Karten\n  const conf = Math.round(ptop*100), danger = psec > 0.25, ok = A.inTol;\n  $('statsGef').innerHTML = [\n :'#4a90e2', gperlit:'#8a6fe0', gl:'#c06fcb', rest:'#9aa6b1'};\nfunction gStatesUI(){\n  const box = $('gefStates'); if(!box) return;\n  box.innerHTML = GS.map(r => { const on = gActive(r.id), lock = r.id === S.gef.soll;\n    return `<div class=\"toggle${on?' on':''}\" data-gs=\"${r.id}\" role=\"switch\" aria-checked=\"${on}\" title=\"${lock?'Soll-Zustand bleibt aktiv':''}\" style=\"${lock?'opacity:.75':''}\"><span><i style=\"display:inline-block;width:9px;height:9px;border-radius:50%;background:${GS_COL[r.id]};margin-right:7px\"><\/i>${esc(r.name.split(',')[0].split(' (')[0].replace('Martensit + viel Restaustenit','Restaustenit-reich'))}${lock?' (Soll)':''}<\/span><div class=\"switch\"><\/div><\/div>`; }).join('');\n}\nfunction gSetAct(fn){ GS.forEach(r => { S.gef.act[r.id] = fn(r); }); S.gef.act[S.gef.soll] = true; gStatesUI(); render(); }\nfunction initGef(){\n  gStatesUI();\n  $('gefStates').addEventListener('click', e => { const t = e.target.closest('[data-gs]'); if(!t) return; const id = t.dataset.gs; if(id === S.gef.soll) return; S.gef.act[id] = !gActive(id); gStatesUI(); render(); });\n  $('gsAll').addEventListener('click', () => gSetAct(() => true));\n  $('gsMart').addEventListener('click', () => gSetAct(r => ['mart','mart200','trost','sorbit','rest'].indexOf(r.id) >= 0));\n  $('gsPerl').addEventListener('click', () => gSetAct(r => ['fperlit','gperlit','gl','sorbit'].indexOf(r.id) >= 0));\n  $('gsSoll').addEventListener('click', () => gSetAct(() => false));\n  $('gSoll').innerHTML = GS.map(r => `<option value=\"${r.id}\">${esc(r.name)}<\/option>`).join('');\n  $('gSoll').value = S.gef.soll;\n  $('gCool').addEventListener('change', () => { S.gef.cool = $('gCool').value; S.gef.riddle = false; S.gef.revealed = true; microKey = ''; render(); });\n  $('gTa').addEventListener('input', () => { S.gef.ta = parseInt($('gTa').value,10); S.gef.riddle = false; S.gef.revealed = true; microKey = ''; render(); });\n  $('gTt').addEventListener('input', () => { S.gef.tt = parseInt($('gTt').value,10); S.gef.riddle = false; S.gef.revealed = true; microKey = ''; render(); });\n  $('gFreq').addEventListener('input', () => { S.gef.fpos = parseInt($('gFreq').value,10); render(); });\n  $('gSoll').addEventListener('change', () => { S.gef.soll = $('gSoll').value; S.gef.act[S.gef.soll] = true; S.gef.view = S.gef.soll; microKey = ''; gStatesUI(); render(); });\n  $('gDia').addEventListener('input', () => { S.partDia = parseFloat($('gDia').value); render(); });\n  $('gFill').addEventListener('input', () => { S.fill = parseFloat($('gFill').value); render(); });\n  $('btnGRiddle').addEventListener('click', () => {\n    const rr = Math.random;\n    if(rr() < 0.4){ S.gef.cool = rr() < 0.7 ? 'wasser' : 'oel'; S.gef.ta = 830+10*Math.floor(rr()*3); S.gef.tt = 190+10*Math.floor(rr()*3); }   // Gutteil\n    else { const cools = ['wasser','oel','luft','ofen','wasser','oel','wasser']; S.gef.cool = cools[Math.floor(rr()*cools.length)]; S.gef.ta = 800+10*Math.floor(rr()*14); S.gef.tt = 20+10*Math.floor(rr()*69); }\n    S.gef.decision = null; S.gef.riddle = true; S.gef.revealed = false; $('gCool').value = S.gef.cool; $('gTa').value = S.gef.ta; $('gTt').value = S.gef.tt; microKey = ''; render();\n  });\n  const gDecide = d => { S.gef.decision = d; S.gef.revealed = true; microKey = ''; render(); };\n  $('btnGOk').addEventListener('click', () => gDecide('io')); $('btnGNok').addEventListener('click', () => gDecide('nio'));\n  $('gefAtlas').addEventListener('click', e => { const tr = e.target.closest('tr[data-g]'); if(!tr) return; S.gef.view = tr.dataset.g; microKey = ''; render(); });\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 Risspr\u00fcfung \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nfunction rissCtx(){\n  const m0 = matById(S.material);\n  const m = (S.mode === 'tube' && m0.mu > 1.5) ? Object.assign({}, m0, {mu:1+(m0.mu-1)*Math.pow(1-S.sat/100, 2)}) : m0;   // Vormagnetisierung \u2192 \u00b5_eff\n  const f = freqHz(), a = S.coilDia/2;\n  const delta = skinDepth(f, m.sigma, m.mu);\n  const fg = limitFreq(a, m.sigma, m.mu);\n  return {m, m0, f, a, delta, fg, fr:f/fg, eta:0.9*Math.exp(-2.0*S.liftOff/a)};\n}\nfunction directions(fr, eta, mu){\n  const h = 1e-3;\n  const z0 = Zn(fr, eta, mu);\n  const ze = Zn(fr, eta*(1-h), mu);\n  const zs = Zn(fr*(1-h), eta, mu);\n  let lift = {x:ze.x-z0.x, y:ze.y-z0.y}, crack = {x:zs.x-z0.x, y:zs.y-z0.y};\n  const nl = Math.hypot(lift.x,lift.y)||1, nc = Math.hypot(crack.x,crack.y)||1;\n  lift = {x:lift.x/nl, y:lift.y/nl}; crack = {x:crack.x/nc, y:crack.y/nc};\n  const aL = Math.atan2(lift.y,lift.x), aC = Math.atan2(crack.y,crack.x);\n  let sep = (aC-aL)*180/Math.PI;\n  while(sep>180) sep-=360; while(sep<-180) sep+=360;\n  return {z0, angLift:aL, angCrack:aC, sep};\n}\nfunction overThreshold(re, im){\n  if(S.threshType === 'line'){\n    const a = S.threshAngle*Math.PI/180;\n    const proj = re*Math.cos(a) + im*Math.sin(a);\n    return Math.abs(proj) > S.threshR;\n  }\n  return Math.hypot(re, im) > S.threshR;\n}\nfunction crackProfile(sx, sy, w){\n  if(!S.crackOn) return 0;\n  const rad = S.crackOrient*Math.PI/180;\n  const dx = Math.cos(rad)*S.crackLen/2, dy = Math.sin(rad)*S.crackLen/2;\n  const ax = S.crackX-dx, ay = S.crackY-dy, bx = S.crackX+dx, by = S.crackY+dy;\n  const abx = bx-ax, aby = by-ay, len2 = abx*abx+aby*aby || 1;\n  const t = clamp(((sx-ax)*abx + (sy-ay)*aby)/len2, 0, 1);\n  const d = Math.hypot(sx-(ax+t*abx), sy-(ay+t*aby));\n  return Math.exp(-(d*d)/(2*w*w));\n}\nfunction coilSignal(sx, sy, C, dir){\n  if(S.mode === 'corr') return corrSignal(sx, sy, C, dir);\n  if(S.mode === 'weld') return weldSignal(sx, sy, C, dir);\n  if(S.mode === 'burn') return burnSignal(sx, sy, C, dir);\n  if(S.mode === 'tube') return tubeSignal(sx, sy, C, dir);\n  if(S.mode === 'hole') return holeCrackSignal(sx, sy, C, dir);\n  return crackSignal(sx, sy, C, dir);\n}\nfunction crackSignal(sx, sy, C, dir){\n  const w1 = Math.max(0.9, C.a*0.95), w2 = w1*0.62;\n  const zr = S.crackDepth/C.delta;\n  const A = (1-Math.exp(-1.6*zr))\n          * (0.12 + 0.88*Math.sin(S.crackOrient*Math.PI/180))\n          * Math.exp(-1.6*S.liftOff/C.a);\n  const p1 = dir.angCrack - clamp(zr, 0, Math.PI*0.95), p2 = dir.angLift;\n  /* Kopplungsanteil \u00fcber der Riss\u00f6ffnung: wirkt wie eine \u00f6rtliche Abhebung.\n     Bei einem engen Erm\u00fcdungsriss ist er klein, bei weiter \u00d6ffnung w\u00e4chst er. */\n  const c2 = 0.20*clamp(S.crackOpen/0.05, 0.3, 2.2);\n  const g1 = crackProfile(sx,sy,w1), g2 = crackProfile(sx,sy,w2);\n  return {re:A*(g1*Math.cos(p1) + c2*g2*Math.cos(p2)),\n          im:A*(g1*Math.sin(p1) + c2*g2*Math.sin(p2))};\n}\n/* Rohsignal der Sonde, noch ohne Verst\u00e4rkung und Phasendrehung */\nfunction probeRaw(sx, sy, C, dir){\n  let z;\n  if(S.probe === 'diff'){\n    const s = C.a*1.8, quer = S.mode === 'burn' && S.burnForm === 'ring';   // Schleifbrand-Streifen l\u00e4uft in Scanrichtung: die Spulenpaarung liegt quer dazu (sonst s\u00e4he die Differenzsonde ihn nicht)\n    const p = quer ? coilSignal(sx, sy-s/2, C, dir) : coilSignal(sx-s/2, sy, C, dir), q = quer ? coilSignal(sx, sy+s/2, C, dir) : coilSignal(sx+s/2, sy, C, dir);\n    z = {re:(p.re-q.re)*1.35, im:(p.im-q.im)*1.35};\n  } else {\n    z = coilSignal(sx, sy, C, dir);\n    const lo = clamp(S.liftOff/0.6,0,1)*0.55;\n    z = {re:z.re + lo*Math.cos(dir.angLift), im:z.im + lo*Math.sin(dir.angLift)};\n  }\n  return z;\n}\n/* Verst\u00e4rkung und Phasendrehung des Ger\u00e4ts. Gespeichert wird das Rohsignal,\n   damit Regler\u00e4nderungen auch bereits geschriebene Spur, Streifen und C-Bild\n   sofort richtig darstellen. */\nfunction gr(z0){\n  const z = {re:z0.re-S.bal.re, im:z0.im-S.bal.im};\n  const g = Math.pow(10,(S.gain-24)/20), rot = -S.phaseRot*Math.PI/180;\n  const cr = Math.cos(rot), sr = Math.sin(rot);\n  return {re:(z.re*cr - z.im*sr)*g, im:(z.re*sr + z.im*cr)*g};\n}\nconst probeSignal = (sx, sy, C, dir) => gr(probeRaw(sx, sy, C, dir));\n/* Richtung der tats\u00e4chlichen Rissanzeige im Ger\u00e4tebild.\n   Die reine Ortskurventangente reicht nicht: zur Leitf\u00e4higkeits\u00e4nderung kommt\n   die Phasennacheilung \u00fcber die Risstiefe und der Kopplungsanteil \u00fcber der\n   Riss\u00f6ffnung. Statt diese Beitr\u00e4ge einzeln zu addieren, wird die Sonde\n   rechnerisch \u00fcber den Riss gefahren und die Richtung der gr\u00f6\u00dften Auslenkung\n   gegen\u00fcber dem Abgleichpunkt genommen \u2014 genau das, was am Bildschirm steht. */\nfunction crackAxis(C, dir){\n  if(!hasDefect()) return null;\n  const base = probeSignal(-1e4, -1e4, C, dir);       // Abgleich weit weg vom Fehler\n  const fc = focus(), nx = fc.nx, ny = fc.ny;         // quer zum Fehler\n  const span = fc.span;\n  let best = 0, bx = 0, by = 0;\n  for(let i=0;i<=160;i++){\n    const t = (i/160 - 0.5)*2*span;\n    const z = probeSignal(fc.x + nx*t, fc.y + ny*t, C, dir);\n    const dx = z.re - base.re, dy = z.im - base.im;\n    const m = dx*dx + dy*dy;\n    if(m > best){ best = m; bx = dx; by = dy; }\n  }\n  if(best < 1e-12) return null;\n  return Math.atan2(by, bx);\n}\nconst liftAxis = dir => {\n  const rot = -S.phaseRot*Math.PI/180;\n  return {a:dir.angLift+rot, c:dir.angCrack+rot};\n};\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 Sortierpr\u00fcfung \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\n/* Werkstoffstreuung wirkt auf \u03c3 und \u00b5\u1d63 gemeinsam \u2014 beides stammt aus derselben\n   W\u00e4rmebehandlung. Unabh\u00e4ngig davon streuen Lage und F\u00fcllfaktor des Teils in der\n   Spule. Beide Achsen zusammen spannen das Toleranzfeld auf. */\nfunction tolCloud(cls, fHz){\n  const pts = [];\n  for(let i=0;i<48;i++){\n    const th = 2*Math.PI*i/48, cs = Math.cos(th), sn = Math.sin(th);\n    pts.push(znAt(fHz, S.partDia,\n      cls.sigma*(1 + cls.tolS/100*cs),\n      cls.mu   *(1 + cls.tolM/100*cs),\n      S.fill   *(1 + cls.tolE/100*sn)));\n  }\n  return pts;\n}\n/* Grundrauschen des Ger\u00e4ts in Einheiten der normierten Impedanz. Fester Pegel \u2014\n   deshalb wird die Trennung zu hohen Frequenzen hin schlechter. */\nfunction noiseR(){\n  const h = CLASSES[0];\n  const z = znAt(sliderHz(S.fS[0]), S.partDia, h.sigma, h.mu, S.fill);\n  return S.noise/100 * Math.hypot(z.x, z.y);\n}\n/* Toleranzellipse: Werkstoff- und Lagestreuung, aufgeweitet um das Rauschen */\nfunction tolEllipse(cls, fHz){\n  const e = fitEllipse(tolCloud(cls, fHz));\n  const rn = noiseR();\n  e.ra = Math.sqrt(e.ra*e.ra + rn*rn);\n  e.rb = Math.sqrt(e.rb*e.rb + rn*rn);\n  return e;\n}\nfunction fitEllipse(pts){\n  const n = pts.length;\n  const mx = pts.reduce((s,p)=>s+p.x,0)/n, my = pts.reduce((s,p)=>s+p.y,0)/n;\n  let sxx=0, syy=0, sxy=0;\n  pts.forEach(p => { const dx=p.x-mx, dy=p.y-my; sxx+=dx*dx; syy+=dy*dy; sxy+=dx*dy; });\n  sxx/=n; syy/=n; sxy/=n;\n  const tr = sxx+syy, det = sxx*syy-sxy*sxy;\n  const l1 = tr/2 + Math.sqrt(Math.max(0, tr*tr/4-det));\n  const ang = (Math.abs(sxy) < 1e-20) ? (sxx>=syy ? 0 : Math.PI/2) : Math.atan2(l1-sxx, sxy);\n  const ux = {x:Math.cos(ang), y:Math.sin(ang)}, uy = {x:-Math.sin(ang), y:Math.cos(ang)};\n  let ra=0, rb=0;\n  pts.forEach(p => {\n    const dx=p.x-mx, dy=p.y-my;\n    ra = Math.max(ra, Math.abs(dx*ux.x+dy*ux.y));\n    rb = Math.max(rb, Math.abs(dx*uy.x+dy*uy.y));\n  });\n  return {cx:mx, cy:my, ra:Math.max(ra,1e-12), rb:Math.max(rb,1e-12), ang, ux, uy};\n}\nfunction ellipseDist(e, p){\n  const dx = p.x-e.cx, dy = p.y-e.cy;\n  return Math.hypot((dx*e.ux.x+dy*e.ux.y)/e.ra, (dx*e.uy.x+dy*e.uy.y)/e.rb);\n}\nfunction separationAt(fHz){\n  const eH = tolEllipse(CLASSES[0], fHz);\n  const eW = tolEllipse(CLASSES[1], fHz);\n  const dx = eW.cx-eH.cx, dy = eW.cy-eH.cy, d = Math.hypot(dx,dy);\n  if(d < 1e-15) return 0;\n  const dir = {x:dx/d, y:dy/d};\n  const reach = e => {\n    const u = dir.x*e.ux.x + dir.y*e.ux.y, v = dir.x*e.uy.x + dir.y*e.uy.y;\n    return 1/Math.sqrt((u/e.ra)*(u/e.ra) + (v/e.rb)*(v/e.rb));\n  };\n  return d/(reach(eH)+reach(eW));\n}\nfunction measPoint(fHz){\n  const a = CLASSES[0], b = CLASSES[1];\n  const t = clamp(S.matDev/100, -0.1, 1.1);\n  return znAt(fHz, S.partDia, a.sigma + (b.sigma-a.sigma)*t,\n              a.mu + (b.mu-a.mu)*t, S.fill);\n}\n\nlet seed = 20260909;\nfunction rnd(){ seed = (seed*1664525 + 1013904223) >>> 0; return seed/4294967296; }\nfunction gauss(){ return Math.sqrt(-2*Math.log(rnd()+1e-12))*Math.cos(2*Math.PI*rnd()); }\n\nfunction makeSerie(){\n  const n = S.serieN, nBad = Math.min(S.serieBad, n), out = [];\n  for(let i=0;i<n;i++){\n    const weich = i < nBad;\n    const partial = weich && rnd() < 0.35;\n    const mix = weich ? (partial ? 0.22 + rnd()*0.42 : 1) : 0;\n    const H = CLASSES[0], W = CLASSES[1];\n    const cls = weich ? W : H;\n    out.push({\n      sigma: H.sigma + (W.sigma-H.sigma)*mix + cls.sigma*gauss()*cls.tolS/500,\n      mu:    H.mu    + (W.mu   -H.mu   )*mix + cls.mu   *gauss()*cls.tolM/500,\n      etaDev: 1 + gauss()*cls.tolE/500,\n      nz: [0,1,2,3].map(function(){ return {x:gauss(), y:gauss()}; }),\n      weich, partial,\n      art: weich ? (partial ? 'Mischzustand '+W.kurz : W.name) : H.name\n    });\n  }\n  for(let i=out.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [out[i],out[j]]=[out[j],out[i]]; }\n  out.forEach((o,i)=>{ o.idx = i+1; });\n  return out;\n}\nfunction judge(o){\n  const fs = freqSet();\n  const rn = noiseR()*0.25;\n  o.pts = fs.map((f,k) => {\n    const p = znAt(f, S.partDia, o.sigma, o.mu, S.fill*o.etaDev);\n    return {x: p.x + o.nz[k].x*rn, y: p.y + o.nz[k].y*rn};\n  });\n  o.dists = fs.map((f,k) => ellipseDist(tolEllipse(CLASSES[0], f), o.pts[k]));\n  o.inWin = o.dists.map(d => d <= 1);\n  o.ok = o.inWin[S.win];\n  o.okAll = o.inWin.every(Boolean);\n  o.dist = o.dists[S.win];\n  return o;\n}\nfunction rejudge(){ serie.forEach(judge); }\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 SVG-Hilfen \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nconst esc = s => String(s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;');\nfunction txt(x,y,s,o){\n  o = o || {};\n  return `<text x=\"${x}\" y=\"${y}\" font-family=\"JetBrains Mono\" font-size=\"${o.size||10}\" `+\n    `fill=\"${o.fill||'var(--text-faint)'}\" text-anchor=\"${o.anchor||'start'}\"`+\n    `${o.rot?` transform=\"rotate(${o.rot} ${x} ${y})\"`:''}${o.op!==undefined?` opacity=\"${o.op}\"`:''}>${esc(s)}<\/text>`;\n}\nfunction fmtFreq(f){\n  if(f >= 1e6) return deC(f/1e6,2)+' MHz';\n  if(f >= 1e3) return (Math.round(f).toLocaleString('de-DE'))+' Hz';\n  return deC(f,0)+' Hz';\n}\nfunction fmtFreqShort(f){\n  if(f >= 1e6) return deC(f/1e6,2)+' MHz';\n  if(f >= 1e3) return deC(f/1e3, f<1e4?2:0)+' kHz';\n  return deC(f,0)+' Hz';\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 Vierfrequenz-Sortierdisplay \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nfunction drawSortView(){\n  const W = 900, H = 640, cellW = W/2, cellH = H/2;\n  const fs = freqSet(), done = serieIdx+1;\n  let svg = '';\n\n  fs.forEach((f, k) => {\n    const ox = (k%2)*cellW, oy = Math.floor(k/2)*cellH;\n    const px = ox+12, py = oy+36, pw = cellW-24, ph = cellH-48;\n    const active = (k === S.win);\n    const eH = tolEllipse(CLASSES[0], f);\n    const eW = tolEllipse(CLASSES[1], f);\n\n    const gather = [];\n    [eH,eW].forEach(e => {\n      for(let i=0;i<24;i++){\n        const th = 2*Math.PI*i/24;\n        gather.push({\n          x: e.cx + e.ra*Math.cos(th)*e.ux.x + e.rb*Math.sin(th)*e.uy.x,\n          y: e.cy + e.ra*Math.cos(th)*e.ux.y + e.rb*Math.sin(th)*e.uy.y});\n      }\n    });\n    if(done > 0){ for(let i=0;i<done;i++) gather.push(serie[i].pts[k]); }\n    else gather.push(measPoint(f));\n\n    const xs = gather.map(p=>p.x), ys = gather.map(p=>p.y);\n    let x0 = Math.min.apply(null,xs), x1 = Math.max.apply(null,xs);\n    let y0 = Math.min.apply(null,ys), y1 = Math.max.apply(null,ys);\n    const mx = (x1-x0)*0.22 + 1e-9, my = (y1-y0)*0.22 + 1e-9;\n    x0-=mx; x1+=mx; y0-=my; y1+=my;\n    const sc = Math.min(pw/(x1-x0), ph/(y1-y0));\n    const cxD = (x0+x1)/2, cyD = (y0+y1)/2;\n    const toX = v => px + pw/2 + (v-cxD)*sc;\n    const toY = v => py + ph/2 - (v-cyD)*sc;\n\n    svg += `<rect x=\"${ox+2}\" y=\"${oy+2}\" width=\"${cellW-4}\" height=\"${cellH-4}\" fill=\"none\" stroke=\"var(--border)\" stroke-width=\"1.3\"/>`;\n    if(active) svg += `<rect x=\"${ox+3}\" y=\"${oy+3}\" width=\"${cellW-6}\" height=\"26\" fill=\"var(--amber)\" opacity=\".9\"/>`;\n    svg += txt(ox+11, oy+22, `M256:1   f${k+1} = ${fmtFreq(f)}   v = 2`,\n      {size:16, fill: active ? '#1c1200' : 'var(--text-dim)'});\n    svg += `<clipPath id=\"clipSort${k}\"><rect x=\"${px}\" y=\"${py}\" width=\"${pw}\" height=\"${ph}\"/><\/clipPath>`;\n    svg += `<g clip-path=\"url(#clipSort${k})\">`;\n\n    const drawE = (e, col, lab) => {\n      const cx = toX(e.cx), cy = toY(e.cy);\n      return `<ellipse cx=\"${cx.toFixed(1)}\" cy=\"${cy.toFixed(1)}\" `+\n        `rx=\"${Math.max(e.ra*sc,3).toFixed(1)}\" ry=\"${Math.max(e.rb*sc,3).toFixed(1)}\" `+\n        `transform=\"rotate(${(-e.ang*180/Math.PI).toFixed(1)} ${cx.toFixed(1)} ${cy.toFixed(1)})\" `+\n        `fill=\"${col}\" fill-opacity=\".07\" stroke=\"${col}\" stroke-width=\"2.6\"/>`\n        + txt(cx, cy - Math.max(e.rb*sc,3) - 6, lab, {anchor:'middle', size:14, fill:col});\n    };\n    svg += drawE(eW, CLASSES[1].col, CLASSES[1].kurz);\n    svg += drawE(eH, CLASSES[0].col, CLASSES[0].kurz);\n\n    const mark = (p, col, big) => {\n      const x = toX(p.x), y = toY(p.y), s = big?8:5, w2 = big?3:2;\n      return `<line x1=\"${(x-s).toFixed(1)}\" y1=\"${y.toFixed(1)}\" x2=\"${(x+s).toFixed(1)}\" y2=\"${y.toFixed(1)}\" stroke=\"${col}\" stroke-width=\"${w2}\"/>`\n           + `<line x1=\"${x.toFixed(1)}\" y1=\"${(y-s).toFixed(1)}\" x2=\"${x.toFixed(1)}\" y2=\"${(y+s).toFixed(1)}\" stroke=\"${col}\" stroke-width=\"${w2}\"/>`;\n    };\n    if(done > 0){\n      for(let i=0;i<done;i++)\n        svg += mark(serie[i].pts[k], serie[i].inWin[k] ? CLASSES[0].col : CLASSES[1].col, i === done-1);\n    } else {\n      const mp = measPoint(f);\n      svg += mark(mp, ellipseDist(eH, mp) <= 1 ? CLASSES[0].col : CLASSES[1].col, true);\n    }\n    svg += `<\/g>`;\n  });\n\n  svg += `<line x1=\"${W/2}\" y1=\"0\" x2=\"${W/2}\" y2=\"${H}\" stroke=\"var(--border)\" stroke-width=\"1.6\"/>`;\n  svg += `<line x1=\"0\" y1=\"${H/2}\" x2=\"${W}\" y2=\"${H/2}\" stroke=\"var(--border)\" stroke-width=\"1.6\"/>`;\n  $('sortView').innerHTML = svg;\n  $('sortInfo').textContent =\n    `Aktives Fenster f${S.win+1} = ${fmtFreq(fs[S.win])} \u00b7 Bauteil-\u2205 ${S.partDia} mm \u00b7 \u03b7 = ${deC(S.fill,2)} \u00b7 Trennsch\u00e4rfe ${deC(separationAt(fs[S.win]),2)}`;\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 Trennsch\u00e4rfe \u00fcber der Frequenz \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nfunction drawSeparation(){\n  const W=620,H=300,l=48,r=14,t=14,b=36,w=W-l-r,h=H-t-b;\n  const f0 = 50, f1 = 3e5;\n  const toX = f => l + Math.log(f/f0)/Math.log(f1/f0)*w;\n  const vals = [];\n  for(let i=0;i<=110;i++){\n    const f = f0*Math.pow(f1/f0, i/110);\n    vals.push({f, v:separationAt(f)});\n  }\n  const vmax = Math.max(1.5, Math.max.apply(null, vals.map(p=>p.v)))*1.1;\n  const toY = v => t + h - clamp(v,0,vmax)/vmax*h;\n  let s = `<rect x=\"${l}\" y=\"${t}\" width=\"${w}\" height=\"${h}\" fill=\"none\" stroke=\"var(--border)\" stroke-width=\"1.5\"/>`;\n  for(let e=1;e<=5;e++) for(let m=1;m<10;m++){\n    const f = m*Math.pow(10,e);\n    if(f<f0||f>f1) continue;\n    const gx = toX(f);\n    s += `<line x1=\"${gx.toFixed(1)}\" y1=\"${t}\" x2=\"${gx.toFixed(1)}\" y2=\"${t+h}\" stroke=\"var(--grid)\" stroke-width=\"1\"${m>1?' opacity=\".4\"':''}/>`;\n    if(m===1) s += txt(gx, t+h+15, fmtFreqShort(f), {anchor:'middle', size:9.5});\n  }\n  for(let i=0;i<=4;i++){\n    const v = vmax*i/4, gy = toY(v);\n    s += `<line x1=\"${l}\" y1=\"${gy.toFixed(1)}\" x2=\"${l+w}\" y2=\"${gy.toFixed(1)}\" stroke=\"var(--grid)\" stroke-width=\"1\"/>`;\n    s += txt(l-6, gy+3.5, deC(v,1), {anchor:'end'});\n  }\n  s += `<line x1=\"${l}\" y1=\"${toY(1)}\" x2=\"${l+w}\" y2=\"${toY(1)}\" stroke=\"var(--red)\" stroke-width=\"1.4\" stroke-dasharray=\"5,4\" opacity=\".8\"/>`;\n  s += txt(l+w-5, toY(1)-6, 'Felder ber\u00fchren sich', {anchor:'end', size:9.5, fill:'var(--red)'});\n  let d = '';\n  vals.forEach((p,i)=>{ d += (i?'L':'M') + toX(p.f).toFixed(1)+','+toY(p.v).toFixed(1)+' '; });\n  s += `<path d=\"${d}\" fill=\"none\" stroke=\"var(--amber)\" stroke-width=\"2.2\"/>`;\n  const best = vals.reduce((a,p)=> p.v>a.v?p:a, vals[0]);\n  s += `<circle cx=\"${toX(best.f).toFixed(1)}\" cy=\"${toY(best.v).toFixed(1)}\" r=\"4.5\" fill=\"var(--green)\"/>`;\n  s += txt(toX(best.f), toY(best.v)-10, 'Optimum '+fmtFreqShort(best.f), {anchor:'middle', size:9.5, fill:'var(--green)'});\n  freqSet().forEach((f,k) => {\n    if(f<f0||f>f1) return;\n    const gx = toX(f);\n    s += `<line x1=\"${gx.toFixed(1)}\" y1=\"${t}\" x2=\"${gx.toFixed(1)}\" y2=\"${t+h}\" stroke=\"var(--text)\" stroke-width=\"${k===S.win?1.6:1}\" stroke-dasharray=\"3,3\" opacity=\"${k===S.win?0.85:0.4}\"/>`;\n    s += txt(gx, t+11, 'f'+(k+1), {anchor:'middle', size:9.5, fill:k===S.win?'var(--amber)':'var(--text-faint)'});\n  });\n  s += txt(l+w/2, H-4, 'Pr\u00fcffrequenz', {anchor:'middle', size:11, fill:'var(--text-dim)'});\n  s += txt(13, t+h/2, 'Abstand in Toleranzradien', {anchor:'middle', size:10.5, fill:'var(--text-dim)', rot:-90});\n  patchSvg($('sepChart'), s);\n  const nowSep = separationAt(freqSet()[S.win]);\n  $('sepInfo').textContent = nowSep >= 1\n    ? `Im Fenster f${S.win+1} liegen ${CLASSES[0].kurz} und ${CLASSES[1].kurz} ${deC(nowSep,2)} Toleranzradien auseinander \u2014 sicher trennbar. Bestwert ${deC(best.v,2)} bei ${fmtFreqShort(best.f)}.`\n    : `Im Fenster f${S.win+1} \u00fcberlappen die Felder (${deC(nowSep,2)} < 1). Anderes Fenster w\u00e4hlen oder f1 in Richtung ${fmtFreqShort(best.f)} verschieben.`;\n}\n\n\n/* Glatter Kurvenzug (Catmull-Rom \u2192 kubische B\u00e9zier) durch die Punkte pts[a..b] */\nfunction smoothPath(pts, a, b){\n  const n = pts.length;\n  let d = 'M' + pts[a][0].toFixed(1) + ',' + pts[a][1].toFixed(1);\n  for(let i=a; i<b; i++){\n    const p0 = pts[Math.max(i-1,0)], p1 = pts[i], p2 = pts[i+1], p3 = pts[Math.min(i+2,n-1)];\n    d += 'C' + (p1[0]+(p2[0]-p0[0])/6).toFixed(1) + ',' + (p1[1]+(p2[1]-p0[1])/6).toFixed(1)\n       + ' ' + (p2[0]-(p3[0]-p1[0])/6).toFixed(1) + ',' + (p2[1]-(p3[1]-p1[1])/6).toFixed(1)\n       + ' ' + p2[0].toFixed(1) + ',' + p2[1].toFixed(1);\n  }\n  return d;\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 Impedanzebene Ger\u00e4tesicht \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\n/* Beide Achsen haben denselben Ma\u00dfstab (Pixel je Einheit). Nur so bleiben Winkel\n   und Kreise unverzerrt \u2014 die Schwelle ist ein echter Kreis, die Abhebungs- und\n   Rissrichtung stehen im richtigen Winkel zueinander. */\nconst NICE_LIM   = [0.25,0.5,1,1.5,2,3,5,8,12,20,40];\nconst TICK_STEPS = [0.05,0.1,0.2,0.25,0.5,1,2,2.5,5,10,20];\nfunction impLimit(live){\n  if(S.impScale !== 'auto') return parseFloat(S.impScale);\n  let need = 0.25;\n  const eat = z => { need = Math.max(need, Math.abs(z.re), Math.abs(z.im)); };\n  trail.forEach(p => eat(gr(p))); eat(live);\n  need = Math.max(need, S.threshR*1.15) * 1.1;\n  let target = NICE_LIM[NICE_LIM.length-1];\n  for(const v of NICE_LIM){ if(v >= need){ target = v; break; } }\n  // W\u00e4hrend des Scans nur vergr\u00f6\u00dfern, damit das Bild nicht pumpt\n  if(S.impLim === null || target > S.impLim || (!S.scanning && target < S.impLim)) S.impLim = target;\n  return S.impLim;\n}\nfunction fmtTick(v, step){\n  const d = step >= 1 ? 0 : (Math.abs(step*10 - Math.round(step*10)) < 1e-9 ? 1 : 2);\n  return deC(v, d);\n}\nfunction drawImp(C, dir, live, lim){\n  const W=520, l=48, r=14, t=12, b=34, P=W-l-r, w=P, h=P;\n  const k = w/(2*lim);                                   // ein Ma\u00dfstab f\u00fcr X und Y\n  const toX = v => l + (v+lim)*k;\n  const toY = v => t + h - (v+lim)*k;\n  const cx0 = toX(0), cy0 = toY(0);\n  let s = `<defs><clipPath id=\"impClip\"><rect x=\"${l}\" y=\"${t}\" width=\"${w}\" height=\"${h}\"/><\/clipPath><\/defs>`\n    + `<rect x=\"${l}\" y=\"${t}\" width=\"${w}\" height=\"${h}\" fill=\"none\" stroke=\"var(--border)\" stroke-width=\"1.5\"/>`;\n\n  const step = TICK_STEPS.find(v => lim/v <= 5) || 20;\n  const nT = Math.floor(lim/step + 1e-9);\n  for(let i=-nT; i<=nT; i++){\n    const g = i*step;\n    s += `<line x1=\"${toX(g).toFixed(1)}\" y1=\"${t}\" x2=\"${toX(g).toFixed(1)}\" y2=\"${t+h}\" stroke=\"var(--grid)\" stroke-width=\"1\"/>`;\n    s += `<line x1=\"${l}\" y1=\"${toY(g).toFixed(1)}\" x2=\"${l+w}\" y2=\"${toY(g).toFixed(1)}\" stroke=\"var(--grid)\" stroke-width=\"1\"/>`;\n    if(i !== 0){\n      s += txt(toX(g), t+h+15, fmtTick(g,step), {anchor:'middle'});\n      s += txt(l-6, toY(g)+3.5, fmtTick(g,step), {anchor:'end'});\n    }\n  }\n  s += `<line x1=\"${cx0}\" y1=\"${t}\" x2=\"${cx0}\" y2=\"${t+h}\" stroke=\"var(--border)\" stroke-width=\"1.6\"/>`;\n  s += `<line x1=\"${l}\" y1=\"${cy0}\" x2=\"${l+w}\" y2=\"${cy0}\" stroke=\"var(--border)\" stroke-width=\"1.6\"/>`;\n  s += txt(l+w/2, t+h+30, 'X-Kanal', {anchor:'middle', size:11, fill:'var(--text-dim)'});\n  s += txt(13, t+h/2, 'Y-Kanal', {anchor:'middle', size:11, fill:'var(--text-dim)', rot:-90});\n\n  /* Alarmbereich leicht eingef\u00e4rbt, Schwelle als gestrichelte Kontur */\n  const thr = S.threshR;\n  if(S.threshType === 'line'){\n    const a = S.threshAngle*Math.PI/180;\n    const dx = Math.cos(a), dy = Math.sin(a);            // Normale der Geraden\n    const nx = -dy, ny = dx;                             // Richtung entlang der Geraden\n    const L = lim*6;\n    [1,-1].forEach(sg => {\n      const px = dx*thr*sg, py = dy*thr*sg;\n      const P1 = [px+nx*L, py+ny*L], P2 = [px-nx*L, py-ny*L];\n      const P3 = [P2[0]+dx*sg*L, P2[1]+dy*sg*L], P4 = [P1[0]+dx*sg*L, P1[1]+dy*sg*L];\n      s += `<polygon points=\"${[P1,P2,P3,P4].map(q=>toX(q[0]).toFixed(1)+','+toY(q[1]).toFixed(1)).join(' ')}\" fill=\"var(--red)\" fill-opacity=\".06\" clip-path=\"url(#impClip)\"/>`;\n      s += `<line x1=\"${toX(P1[0]).toFixed(1)}\" y1=\"${toY(P1[1]).toFixed(1)}\" x2=\"${toX(P2[0]).toFixed(1)}\" y2=\"${toY(P2[1]).toFixed(1)}\" `+\n           `stroke=\"var(--red)\" stroke-width=\"1.6\" stroke-dasharray=\"5,4\" opacity=\".7\" clip-path=\"url(#impClip)\"/>`;\n    });\n  } else {\n    const rr = thr*k;\n    s += `<path d=\"M${l},${t}H${l+w}V${t+h}H${l}Z M${(cx0+rr).toFixed(2)},${cy0}A${rr.toFixed(2)},${rr.toFixed(2)} 0 1 0 ${(cx0-rr).toFixed(2)},${cy0}A${rr.toFixed(2)},${rr.toFixed(2)} 0 1 0 ${(cx0+rr).toFixed(2)},${cy0}Z\" `+\n         `fill=\"var(--red)\" fill-opacity=\".06\" fill-rule=\"evenodd\" clip-path=\"url(#impClip)\"/>`;\n    s += `<circle cx=\"${cx0}\" cy=\"${cy0}\" r=\"${rr.toFixed(2)}\" fill=\"none\" stroke=\"var(--red)\" stroke-width=\"1.6\" `+\n         `stroke-dasharray=\"5,4\" opacity=\".75\" clip-path=\"url(#impClip)\"/>`;\n    if(rr > 22) s += txt(cx0 + rr*0.7071 + 5, cy0 - rr*0.7071 - 4, 'Schwelle '+deC(thr,2), {size:9, fill:'var(--red)'});\n  }\n\n  if(S.mode === 'corr') s += corrFieldsSVG(C, dir, toX, toY, k, cx0, cy0);\n  const ax = liftAxis(dir);\n  const cAx = crackAxis(C, dir);\n  const ray = (ang, col, lab, dash) => {\n    const L = w*0.46;\n    const ex = cx0+Math.cos(ang)*L, ey = cy0-Math.sin(ang)*L;\n    return `<line x1=\"${cx0}\" y1=\"${cy0}\" x2=\"${ex.toFixed(1)}\" y2=\"${ey.toFixed(1)}\" stroke=\"${col}\" stroke-width=\"1.7\"${dash?' stroke-dasharray=\"6,4\"':''} opacity=\".85\"/>`\n      + txt(ex + (Math.cos(ang)>=0?6:-6), ey + (Math.sin(ang)>0?-5:12), lab, {size:9.5, fill:col, anchor:Math.cos(ang)>=0?'start':'end'});\n  };\n  if(S.showRef){\n    s += ray(ax.a, 'var(--text-faint)', 'Abhebung', true);\n    if(cAx !== null){\n      s += ray(cAx, 'var(--green)', 'Riss', false);\n      // Die Schmetterlingsfigur ist punktsymmetrisch \u2014 Achse in beide Richtungen\n      if(S.probe === 'diff') s += ray(cAx + Math.PI, 'var(--green)', '', false);\n    }\n  }\n\n  /* Spur: unverzerrt und als glatte Kurve gezeichnet (kein Polygonzug), in Abschnitten\n     ausblendend. Au\u00dferhalb des Bereichs wird nur abgeschnitten, nicht pro Achse gekappt. */\n  if(trail.length > 1){\n    const tp = trail.map(gr).map(p => [toX(p.re), toY(p.im)]);\n    const N = tp.length, CH = Math.max(6, Math.ceil(N/30));\n    s += `<g clip-path=\"url(#impClip)\" fill=\"none\" stroke=\"var(--red)\" stroke-linejoin=\"round\">`;\n    [{lw:7,o:.07,cap:'butt'},{lw:4,o:.14,cap:'butt'},{lw:2.2,o:1,cap:'round'}].forEach(({lw,o,cap}) => {\n      for(let i=0; i<N-1; i+=CH){\n        const j = Math.min(N-1, i+CH);\n        const op = (0.05 + 0.95*((i+j)/2/(N-1)))*o;\n        if(op < 0.015) continue;\n        s += `<path d=\"${smoothPath(tp,i,j)}\" stroke-width=\"${lw}\" stroke-linecap=\"${cap}\" opacity=\"${op.toFixed(3)}\"/>`;\n      }\n    });\n    s += `<\/g>`;\n  }\n  s += `<circle cx=\"${cx0}\" cy=\"${cy0}\" r=\"4.5\" fill=\"var(--panel)\" stroke=\"var(--text-dim)\" stroke-width=\"1.6\"/>`;\n\n  /* Messpunkt; liegt er au\u00dferhalb, sitzt er (richtungstreu) am Rand */\n  const amp = Math.hypot(live.re, live.im);\n  const phi = Math.atan2(live.im, live.re)*180/Math.PI;\n  const alarm = overThreshold(live.re, live.im);\n  const mx = Math.max(Math.abs(live.re), Math.abs(live.im));\n  const over = mx > lim*0.97;\n  const f = over ? lim*0.97/mx : 1;\n  const col = alarm ? 'var(--red)' : 'var(--cyan)';\n  s += over\n    ? `<circle cx=\"${toX(live.re*f).toFixed(1)}\" cy=\"${toY(live.im*f).toFixed(1)}\" r=\"6.5\" fill=\"var(--panel)\" stroke=\"${col}\" stroke-width=\"2.4\"/>`\n    : `<circle cx=\"${toX(live.re).toFixed(1)}\" cy=\"${toY(live.im).toFixed(1)}\" r=\"5.5\" fill=\"${col}\"/>`;\n\n  /* Anzeige des Messpunkts */\n  s += `<rect x=\"${l+6}\" y=\"${t+6}\" width=\"124\" height=\"${over?46:34}\" rx=\"5\" fill=\"var(--panel)\" opacity=\".88\"/>`\n     + txt(l+12, t+20, '|Z| '+deC(amp,2)+'   \u2220 '+deC(phi,0)+'\u00b0', {size:10, fill:alarm?'var(--red)':'var(--text-dim)'})\n     + txt(l+12, t+33, 'Ma\u00dfstab 1 : 1', {size:9, fill:'var(--text-faint)'})\n     + (over ? txt(l+12, t+45, 'au\u00dferhalb des Bereichs', {size:9, fill:'var(--amber)'}) : '');\n  patchSvg($('imp'), s);\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 C-Bild als gegl\u00e4ttetes Rasterbild \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nconst offC = document.createElement('canvas');\noffC.width = NX; offC.height = NY;\nconst offCtx = offC.getContext('2d');\nconst cImg = offCtx.createImageData(NX, NY);\nfunction ampRGB(v){\n  const st = [[0,[11,18,24]],[.16,[24,60,76]],[.44,[77,233,212]],[.72,[255,201,77]],[1,[255,111,102]]];\n  v = clamp(v,0,1);\n  for(let i=0;i<st.length-1;i++){\n    const p0=st[i][0], c0=st[i][1], p1=st[i+1][0], c1=st[i+1][1];\n    if(v>=p0 && v<=p1){\n      const f=(v-p0)/((p1-p0)||1);\n      return [c0[0]+(c1[0]-c0[0])*f, c0[1]+(c1[1]-c0[1])*f, c0[2]+(c1[2]-c0[2])*f];\n    }\n  }\n  return [255,111,102];\n}\n/* Weiche Aussteuerungsgrenze: lineare Farbskala bis 0,65, dar\u00fcber sanft gegen 1 \u2013 starke Anzeigen \u00fcbersteuern nicht mehr hart (keine ausgebrannten Fl\u00e4chen) */\nfunction softKnee(v){ v = Math.max(0, v); return v <= 0.65 ? v : 0.65 + 0.35*Math.tanh((v-0.65)/0.35); }\nfunction drawCscan(){\n  if(S.mode === 'tube'){ drawTubeCross(); return; }\n  const g = Math.pow(10,(S.gain-24)/20);\n  const px = cImg.data;\n  for(let iy=0; iy<NY; iy++) for(let ix=0; ix<NX; ix++){\n    const i = iy*NX+ix;\n    const c = ampRGB(scanned[iy][ix] ? softKnee(grid[iy][ix]*g*0.72) : 0);\n    px[i*4]=c[0]; px[i*4+1]=c[1]; px[i*4+2]=c[2]; px[i*4+3]=255;\n  }\n  offCtx.putImageData(cImg, 0, 0);\n\n  const cv = $('cscan'), ctx2 = cv.getContext('2d');\n  const dpr = Math.max(1, Math.min(2, window.devicePixelRatio||1));\n  const rect = cv.getBoundingClientRect();\n  const W = Math.max(320, Math.round((rect.width||900)*dpr));\n  const H = Math.round(W * S.plateWidth/S.plateLen);\n  if(cv.width!==W || cv.height!==H){ cv.width=W; cv.height=H; }\n  ctx2.imageSmoothingEnabled = true;\n  ctx2.imageSmoothingQuality = 'high';\n  ctx2.drawImage(offC, 0, 0, W, H);\n\n  const sx = W/S.plateLen, sy = H/S.plateWidth;\n  drawScnOverlay(ctx2, sx, sy, dpr);\n  ctx2.strokeStyle = 'rgba(255,201,77,.95)';\n  ctx2.lineWidth = Math.max(1, 1.6*dpr);\n  ctx2.beginPath();\n  ctx2.arc(S.probeX*sx, S.probeY*sy, S.coilDia/2*sx, 0, Math.PI*2);\n  ctx2.stroke();\n  /* Millimeter-Skala am oberen und linken Rand */\n  ctx2.strokeStyle = 'rgba(255,255,255,.4)'; ctx2.fillStyle = 'rgba(255,255,255,.6)';\n  ctx2.lineWidth = Math.max(1, dpr); ctx2.font = (12*dpr) + 'px JetBrains Mono, monospace';\n  for(let x=10; x<S.plateLen; x+=10){\n    ctx2.beginPath(); ctx2.moveTo(x*sx, 0); ctx2.lineTo(x*sx, 5*dpr); ctx2.stroke();\n    if(x%20 === 0) ctx2.fillText(String(x), x*sx + 2*dpr, 14*dpr);\n  }\n  for(let y=10; y<S.plateWidth; y+=10){\n    ctx2.beginPath(); ctx2.moveTo(0, y*sy); ctx2.lineTo(5*dpr, y*sy); ctx2.stroke();\n    if(y%20 === 0) ctx2.fillText(String(y), 7*dpr, y*sy + 3*dpr);\n  }\n  ctx2.strokeStyle = 'rgba(255,255,255,.7)'; ctx2.fillStyle = 'rgba(255,255,255,.7)';\n  ctx2.lineWidth = 2*dpr;\n  const bx = 12*dpr, by = H - 12*dpr;\n  ctx2.beginPath(); ctx2.moveTo(bx, by); ctx2.lineTo(bx + 10*sx, by); ctx2.stroke();\n  ctx2.font = (13*dpr) + 'px JetBrains Mono, monospace';\n  ctx2.fillText('10 mm', bx, by - 6*dpr);\n}\n\n/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 Streifenschreiber \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 */\nfunction drawStrip(lim){\n  const W=620,H=260,l=10,r=10,t=12,b=12, w=W-l-r, h=H-t-b, mid=t+h/2;\n  let s = `<rect x=\"${l}\" y=\"${t}\" width=\"${w}\" height=\"${h}\" fill=\"none\" stro
